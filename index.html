":"测试开发-接口Mock与安全篇.md","content":"# 测试开发-接口Mock与安全篇\n\n> 对应清单：Mock 与依赖隔离【必须掌握（概念 + 动手一次）】+ 安全测试入门【必须掌握（基础项）】+ AI 在接口测试中的用法【必须掌握】\n> 对应自查：Q3（支付回调何时 Mock、何时必须真调、怎么同步）、Q6（水平越权用例怎么写、自动化怎么覆盖）、Q9（审查 AI 生成用例的清单）\n> 说明：水平/垂直越权的**定义和基础用例**在《测试流程与方法论篇》§4 已讲，本篇只讲**自动化怎么覆盖**；Mock 的代码层用法在《pytest框架篇》§7，本篇讲**接口级的 Mock**。\n\n---\n\n## 0. 先定位：三件事各自解决什么\n\n| 能力 | 解决什么 | 判断标准 |\n| --- | --- | --- |\n| Mock | 依赖不可控时，测试还能往下做 | 能不能造出\"第三方超时/500/重复回调\" |\n| 安全用例 | 功能之外的攻击面 | 换身份、改参数，还能不能拿到不该拿的 |\n| AI 辅助 | 用例产出效率 | 生成的初稿，你要能说出它漏了什么 |\n\n---\n\n# 第一部分：Mock 与依赖隔离\n\n## 1. 三类必须 Mock 的场景（清单已给，这里说清\"为什么\"）\n\n| 场景 | 为什么必须 | 具体例子 |\n| --- | --- | --- |\n| **不稳定 / 没有测试环境** | 真调会让你的用例失败，但错不在被测系统 | 短信网关（限流、收费、测试号码白名单）、支付回调、风控、第三方登录 |\n| **异常注入** | 正常环境造不出故障，而故障路径才是高发区 | 超时、500、重复回调、返回畸形报文、慢响应 |\n| **契约先行** | 对方还没开发完，你不想等 | 新对接的物流接口，按文档先 Mock 出用例 |\n\n**核心认知**：Mock 的目的不是\"让用例变绿\"，**是\"让不可控变成可控\"**。判断要不要 Mock，问一句：**这个依赖的失败，是不是我这次想测的东西？** 不是 → Mock；是 → 必须真调。\n\n## 2. 三层工具，按场景选（清单给的三个层次）\n\n| 层次 | 工具 | 适合 | 不适合 |\n| --- | --- | --- | --- |\n| **工具层** | Apifox / Postman 内置 Mock | 给前端联调供数、手工测试造数据 | 无法进 CI、不能编程控制 |\n| **服务层** | WireMock / moco / Flask 自建 | **自动化框架 + CI 里隔离第三方** | 需要维护服务 |\n| **代码层** | pytest-mock / unittest.mock | 单测里 mock 函数、SDK | **跨进程无效**（见下） |\n\n**最关键的一条认知**（很多人在这里犯错）：\n\n> **接口自动化里 mock 第三方，必须用\"服务层\"（起一个假服务），不能用\"代码层\"（patch 函数）。**\n> 因为你的 pytest 进程和被测服务是两个进程，你 patch 的是自己进程里的 `requests`，管不到被测服务调第三方。\n\n## 3. 服务层 Mock 动手（Flask 版，和《pytest框架篇》§7.3 同源）\n\n```python\n# mock_server/pay_gateway.py —— 模拟第三方支付网关\nimport time\n\nfrom flask import Flask, jsonify, request\n\napp = Flask(\"mock_pay\")\nSTATE = {\"mode\": \"success\", \"hits\": [], \"callbacks\": []}\n\n\n@app.post(\"/pay/api/create\")\ndef create_pay():\n    \"\"\"下单支付：返回支付单号，供被测服务调用。\"\"\"\n    body = request.get_json(silent=True) or {}\n    STATE[\"hits\"].append(body)\n    if STATE[\"mode\"] == \"timeout\":\n        time.sleep(35)                      # 触发被测服务的读超时\n        return jsonify({\"code\": 0})\n    if STATE[\"mode\"] == \"error\":\n        return jsonify({\"code\": 500, \"msg\": \"网关内部错误\"}), 500\n    return jsonify({\"code\": 0, \"trade_no\": \"MOCK-\" + str(len(STATE[\"hits\"]))})\n\n\n@app.post(\"/pay/api/callback\")\ndef callback():\n    \"\"\"支付回调：模拟第三方主动通知被测服务。\"\"\"\n    payload = request.get_json(silent=True) or {}\n    STATE[\"callbacks\"].append(payload)\n    return jsonify({\"code\": 0})\n\n\n# ── 控制面：给测试用，动态切换行为 ─────────────────\n@app.post(\"/admin/mode\")\ndef set_mode():\n    STATE[\"mode\"] = request.json[\"mode\"]\n    return {\"ok\": True, \"mode\": STATE[\"mode\"]}\n\n\n@app.get(\"/admin/calls\")\ndef calls():\n    \"\"\"看被测服务到底调了几次、传了什么（验证重试次数、幂等）。\"\"\"\n    return {\"count\": len(STATE[\"hits\"]), \"data\": STATE[\"hits\"]}\n\n\n@app.post(\"/admin/reset\")\ndef reset():\n    STATE.update({\"mode\": \"success\", \"hits\": [], \"callbacks\": []})\n    return {\"ok\": True}\n```\n\n```python\n# tests/conftest.py\nimport threading\nimport time\n\nimport pytest\n\n\n@pytest.fixture(scope=\"session\")\ndef mock_pay():\n    from mock_server.pay_gateway import app\n    threading.Thread(target=lambda: app.run(port=5058, debug=False, use_reloader=False),\n                     daemon=True).start()\n    time.sleep(1.5)\n    yield \"http://127.0.0.1:5058\"\n```\n\n**被测服务的配置指向这个 mock**（在测试环境改下游地址，或启动被测服务时通过环境变量注入）：\n\n```bash\nPAY_GATEWAY_URL=http://127.0.0.1:5058/pay python -m app.main\n```\n\n**这套东西能测的东西，是真实第三方永远给不了你的**：\n\n| 能测的 | 怎么用 |\n| --- | --- |\n| 下游超时，服务是否快速失败 | `mode=timeout` |\n| 下游 500，是否触发重试/熔断 | `mode=error` |\n| 重试了几次 | `GET /admin/calls` 看 count |\n| 回调重复，是否重复入账 | 连发 3 次 `POST /pay/api/callback` |\n| 回调乱序（先成功后失败） | 手动按序发不同状态的 callback |\n| 契约变更（少字段/多字段） | 改 mock 的返回结构 |\n\n## 4. 两条纪律（清单给的两条，展开怎么落地）\n\n### 纪律一：Mock 了什么必须可见\n\n```python\nimport pytest\n\n@pytest.mark.mocked(\"pay_gateway\", reason=\"第三方沙箱不稳定，见 JIRA-123\")\ndef test_pay_with_mock(mock_pay, api, base_url):\n    ...\n```\n\n```python\n# 在 conftest 里把这些标记收集到报告\ndef pytest_collection_modifyitems(config, items):\n    for item in items:\n        marks = [m for m in item.iter_markers(name=\"mocked\")]\n        if marks:\n            item.add_marker(pytest.mark.skipif(False, reason=\"\"))  # 占位，实际用 allure 标签\n```\n\n实际最简单的做法（不搞花活）：\n\n1. **用例名带 `mocked`**：`test_pay_mocked_timeout`。\n2. **Allure 标签**：`allure.dynamic.tag(\"MOCK\")`。\n3. **报告顶部汇总一句**：本次运行有 N 条用例走 mock。\n\n**为什么必须可见**：半年后有人看\"全绿\"的报告，以为是真实链路验证过了 —— **一个隐形的 mock 比一个失败的用例更危险。**\n\n### 纪律二：Mock 要跟契约同步\n\n| 做法 | 具体 |\n| --- | --- |\n| **从 OpenAPI 生成 stub** | WireMock 支持从 spec 生成 stub；Apifox 从文档生成 Mock。**改文档 = 改 Mock** |\n| **定期对比** | 每周跑一次\"真实沙箱 vs mock\"的响应结构对比，差异报警 |\n| **保留真调用例兜底** | 关键链路（如支付成功、退款）保留 1~2 条**真实调用**的用例，每天跑一次 |\n| **CI 门禁** | 文档变更的 PR 必须同步更新 mock 文件（可加检查脚本） |\n\n## 5. 自查 Q3 完整作答：支付回调，何时 Mock、何时必须真调\n\n### 什么时候 Mock\n\n| 情况 | 判断依据 |\n| --- | --- |\n| 第三方没有测试环境 / 沙箱不稳定 | 每次跑用例都因第三方挂而失败 |\n| 要测**自己的**异常处理（超时/重试/熔断/降级） | 这些场景真实第三方永远给不了你 |\n| 要测**重复回调**的处理（幂等） | 需要手动重放同一个 callback |\n| 高频回归（每天几十次） | 真调有成本、有配额、有延迟 |\n| 联调前期，对方接口还没上线 | 契约先行 |\n\n### 什么时候必须真调\n\n| 情况 | 为什么 |\n| --- | --- |\n| **上线前验收 / 大版本回归** | Mock 只能证明\"我的逻辑对\"，不能证明\"能对上真实对方\" |\n| **验证对接正确性**：签名、报文格式、编码、证书 | Mock 是你写的，天然符合你自己的假设，测不出\"你以为的格式\"和\"真实格式\"的差异 |\n| **资金相关链路**（支付、退款、对账） | 沙箱环境真调一次，确认全链路通 |\n| **契约发生变更后** | 对方升级了 API 版本，必须真调确认 |\n| **每日一次的兜底巡检** | 保留 1~2 条真实链路用例，防止 mock 长期脱节 |\n\n### 一句话总结（答题用）\n\n> **测\"我的处理逻辑\"用 Mock，测\"我和对方的对接\"必须真调。**\n> 支付回调这种依赖，我会用 Mock 覆盖超时、500、重复回调、乱序这些异常分支（这些只有 Mock 能造），同时保留 1~2 条真实沙箱的用例每天跑一次，用来校验契约没变。\n\n### 怎么保持 Mock 与文档同步（这是加分点）\n\n> 三个机制：\n> **① 从文档生成**：mock 的响应结构不从手写开始，从 OpenAPI 生成，改文档等于改 mock。\n> **② 契约对比**：每周跑一次\"真实沙箱响应 vs mock 响应\"的结构 diff，字段多了少了都报警。这个脚本很简单，用《数据结构与算法篇》的 `diff_keys` 就行。\n> **③ 真调用例兜底**：关键链路保留真调用例，每天定时跑。**如果真调用例和 mock 用例的结论不一致，优先信真调的那个。**\n\n## 6. Mock 的三个反模式\n\n| 反模式 | 问题 |\n| --- | --- |\n| Mock 掉被测服务本身 | 你测的是自己编的数据 |\n| Mock 返回结构和真实不一致，且没人发现 | 全绿的报告是假的 |\n| 用代码层 patch 去 mock 跨进程的第三方 | 根本没生效，用例\"通过\"是因为压根没调 |\n\n---\n\n# 第二部分：安全测试入门\n\n## 7. 五类必测（对应 OWASP 常见项）\n\n| 类型 | 测什么 | 探测用例 |\n| --- | --- | --- |\n| **越权** | 水平：看别人数据；垂直：做高权限操作 | 见 §8 |\n| **注入** | SQL 注入、命令注入 | `' OR '1'='1`、`1; DROP TABLE`、`${jndi:ldap://...}` |\n| **敏感信息** | 响应泄露密码哈希、手机号明文、堆栈、内部 IP | 检查每个响应的字段和错误信息 |\n| **重放与频率** | 无时间戳裸重放、短信/验证码频率限制 | 同一请求发 100 次；同一手机号连发 20 条短信 |\n| **传输** | 敏感接口是否强制 HTTPS | `http://` 访问是否被拒/跳转；抓包看是否明文 |\n\n**注入用例的正确期望**：不是\"能登进去\"，而是\"**参数被正确转义，返回参数错误或查不到，且数据库没被破坏**\"。\n\n```python\n@pytest.mark.parametrize(\"payload\", [\n    \"' OR '1'='1\",\n    \"'; DROP TABLE orders; --\",\n    \"1' UNION SELECT password FROM users --\",\n    \"admin'--\",\n])\ndef test_sql_injection(api, base_url, payload):\n    r = api.get(f\"{base_url}/api/orders\", params={\"order_no\": payload})\n    assert r.status_code in (400, 404, 422), f\"注入载荷返回异常状态: {r.status_code}\"\n    assert \"sql\" not in r.text.lower(), \"错误信息泄露了 SQL 细节\"\n    # 关键：注入后表还在（不是只看返回码）\n    assert db.query_one(\"SELECT COUNT(*) c FROM orders\")[\"c\"] > 0, \"表被删了！\"\n```\n\n**\"表还在\"这条断言是灵魂** —— 只断言返回码，测不出真实的注入伤害。\n\n## 8. 自查 Q6 完整作答：水平越权用例 + 自动化覆盖\n\n**定义部分简述**（详细见《测试流程与方法论篇》§4）：水平越权 = 同角色访问别人的数据；垂直越权 = 低权限做高权限的事。\n\n### 8.1 用例怎么写（三个要素）\n\n```\n前置：用户 A、用户 B 各有一条自己的资源（订单 O-A、O-B）\n操作：A 的 token 请求 B 的资源\n断言：403 或 404（按团队约定），且响应体里不能包含 B 的任何数据\n```\n\n```python\ndef test_horizontal_a_cannot_read_b_order(api_a, api_b, base_url, order_b):\n    resp = api_a.get(f\"{base_url}/api/orders/{order_b['order_no']}\")\n    assert resp.status_code in (403, 404), f\"水平越权: A 能读 B 的订单 {resp.text[:300]}\"\n    assert order_b[\"order_no\"] not in resp.text, \"响应体泄露了资源内容\"\n```\n\n**两个容易漏的点**：\n\n1. **断言响应体不含对方数据**：有些系统返回 200 + 空 data，看起来\"没越权\"，但某些字段仍带出了对方 ID。\n2. **测所有入口**：路径参数、query 参数、body 字段、批量接口、导出接口。\n\n### 8.2 自动化怎么覆盖（这是 Q6 的核心）\n\n**核心思路：把\"角色 × 接口\"做成矩阵，用参数化跑遍。**\n\n```python\n# tests/security/conftest.py\nimport pytest\n\n\n@pytest.fixture(scope=\"session\")\ndef user_a(conf, api):\n    \"\"\"账号池：A、B 两个同角色用户，各自有独立数据。\"\"\"\n    return login_as(conf, api, conf.accounts[\"user_a\"])\n\n\n@pytest.fixture(scope=\"session\")\ndef user_b(conf, api):\n    return login_as(conf, api, conf.accounts[\"user_b\"])\n\n\n@pytest.fixture(scope=\"session\")\ndef order_b(user_b, base_url):\n    \"\"\"B 的订单，供 A 去越权访问。\"\"\"\n    return user_b.post(f\"{base_url}/api/orders\", json={\"sku_id\": 1001, \"num\": 1}).json()[\"data\"]\n```\n\n```python\n# tests/security/test_permission.py\nimport pytest\n\n\n# ── 水平越权：A 用自己的 token 访问 B 的资源 ──────────────\nHORIZONTAL_CASES = [\n    # (说明, 方法, 路径模板, 期望状态码)\n    (\"读取他人订单详情\", \"GET\", \"/api/orders/{order_no}\", (403, 404)),\n    (\"取消他人订单\",     \"POST\", \"/api/orders/{order_no}/cancel\", (403, 404)),\n    (\"读取他人收货地址\", \"GET\", \"/api/address/{address_id}\", (403, 404)),\n    (\"修改他人备注\",     \"PATCH\", \"/api/orders/{order_no}\", (403, 404)),\n]\n\n@pytest.mark.security\n@pytest.mark.parametrize(\"desc, method, path_tpl, expected\", HORIZONTAL_CASES,\n                         ids=[c[0] for c in HORIZONTAL_CASES])\ndef test_horizontal(api_a, base_url, order_b, desc, method, path_tpl, expected):\n    path = path_tpl.format(order_no=order_b[\"order_no\"], address_id=order_b.get(\"address_id\", 1))\n    resp = api_a.request(method, f\"{base_url}{path}\")\n    assert resp.status_code in expected, f\"{desc} 越权成功: {resp.status_code} {resp.text[:300]}\"\n\n\n# ── 垂直越权：普通用户调管理员接口 ──────────────────────\nVERTICAL_CASES = [\n    (\"禁用用户\",     \"POST\", \"/api/admin/users/disable\"),\n    (\"查询全部订单\", \"GET\",  \"/api/admin/orders\"),\n    (\"导出数据\",     \"POST\", \"/api/admin/export\"),\n    (\"修改配置\",     \"PUT\",  \"/api/admin/config\"),\n]\n\n@pytest.mark.security\n@pytest.mark.parametrize(\"desc, method, path\", VERTICAL_CASES, ids=[c[0] for c in VERTICAL_CASES])\ndef test_vertical(api_a, base_url, desc, method, path):\n    resp = api_a.request(method, f\"{base_url}{path}\", json={\"target\": 1})\n    assert resp.status_code == 403, f\"{desc} 垂直越权成功: {resp.status_code} {resp.text[:300]}\"\n```\n\n**四个让覆盖更彻底的做法：**\n\n| 做法 | 说明 |\n| --- | --- |\n| **两个同角色账号** | 只有一个账号测不出水平越权 |\n| **每个账号造独立数据** | B 的数据必须真实存在，否则 404 可能是\"不存在\"而不是\"无权限\"（**无法区分是缺陷还是数据问题**） |\n| **覆盖所有入口** | path / query / body / 批量 / 导出，逐个参数化 |\n| **打 `security` 标签** | `pytest -m security` 可以单独跑，放进夜间任务，不阻塞每次提交 |\n\n**两个实操坑**：\n\n1. **403 和 404 分不清**：如果 B 的数据不存在，返回 404 会让用例\"通过\"，但其实是数据没造出来。**所以 fixture 里必须先断言 B 的数据创建成功**。\n2. **单点登录互踢**：A、B 账号如果共用同一账号池，登录会互相踢掉。**必须用两个独立账号，且不能并行跑同一账号**。\n\n---\n\n# 第三部分：AI 在接口测试中的用法\n\n## 9. 三种用法（清单给的三条，说清各自的风险）\n\n| 用法 | 能做什么 | 风险 |\n| --- | --- | --- |\n| 从 OpenAPI 生成初版用例 | 省掉\"照文档抄参数\"的机械工作 | 只覆盖成功路径；字段名可能编造 |\n| 生成数据模型/断言模板（Pydantic/DTO） | 快速得到结构校验代码 | 可能把可选字段标成必填，反之亦然 |\n| 审查用例是否只测成功路径 | 补漏视角 | AI 不知道你们的业务码分支和状态机 |\n\n## 10. 自查 Q9 完整作答：审查 AI 生成用例的清单\n\n**12 条，按\"最可能出问题\"排序：**\n\n| # | 审查项 | 为什么 AI 会错 | 怎么改 |\n| --- | --- | --- | --- |\n| 1 | **只有成功路径** | AI 默认写\"happy path\" | 补参数非法、业务码分支、鉴权失败 |\n| 2 | **只断言 200** | 训练语料里大量 `assert status == 200` | 改成五层断言（HTTP/业务码/字段/DB/副作用） |\n| 3 | **字段名是编的** | AI 会\"合理推测\"字段名（`orderNo` vs `order_no`） | 以抓包/实际响应为准，逐个核对 |\n| 4 | **业务码是编的** | 它不知道你们有 `40001/40002` | 从文档 responses 或代码枚举里取真实值 |\n| 5 | **测试数据不可用** | 编一个 `sku_id=12345`，实际不存在 | 用 fixture 造，或从环境里查真实 ID |\n| 6 | **没有清理步骤** | AI 不管残留数据 | 补前置清理 + 后置清理 |\n| 7 | **参数边界是通用值** | 给\"1 到 100\"就写 50，不写 0/1/100/101 | 按边界值法补上点/内点/离点 |\n| 8 | **没有幂等和并发** | 几乎不生成并发用例 | 补重复提交、并发修改、重试 |\n| 9 | **没有权限用例** | 不知道你们有角色体系 | 补水平/垂直越权 |\n| 10 | **环境/账号硬编码** | 直接写 `http://localhost:8080` | 抽到配置/fixture |\n| 11 | **断言依赖文案** | `assert \"成功\" in resp.text` | 改成断言 code 和字段 |\n| 12 | **用例之间依赖顺序** | 可能写成\"先注册再登录再用同一个变量\"的线性脚本 | 改成 fixture 隔离，能独立跑 |\n\n### 10.1 一句话标准\n\n> **AI 生成的是\"骨架\"，我补的是\"四类血肉\"：异常分支、业务断言、数据管理、权限。**\n> 具体说：AI 写的用例我第一眼先看三件事 —— **只断了 200 吗？只有正向吗？字段名对不对？** 这三个问题几乎必中。\n\n### 10.2 提示词要点（怎么让 AI 少犯错）\n\n| 要点 | 原因 |\n| --- | --- |\n| 贴**真实响应**而不是只贴文档 | 响应里的字段名、错误码才是准的 |\n| 明确说\"要覆盖异常/边界/鉴权\" | 不说它就只给正向 |\n| 给出**团队断言的写法**（贴一段示例） | 它才会按你的五层断言模板写 |\n| 明确要求\"用 pytest + fixture + 参数化\" | 否则给你 unittest 或串行脚本 |\n| 让它**先列测试点再写代码** | 测试点可以人工审，代码不用逐行看 |\n\n### 10.3 一条不可让渡的边界\n\n> **测试数据和业务断言必须自己把关。** AI 不知道你们系统里哪个字段会影响后续流程（比如\"库存为 0 时下单会走到审核分支\"），也不知道哪些断言才是业务的真相。**它写得越顺，越要警惕\"看起来对\"。**\n\n---\n\n## 11. 动手清单\n\n- [ ] 起一个 mock 第三方（Flask 20 行），让被测服务指向它，造一次超时和一次重复回调。\n- [ ] 用 `GET /admin/calls` 验证被测服务在失败时到底重试了几次。\n- [ ] 把\"角色 × 接口\"矩阵做成参数化，跑一次越权，看能查出几个 403 缺失。\n- [ ] 让 AI 根据 Swagger 生成一版用例，用 §10 的 12 条清单逐条审，记录命中率。\n","chars":5455,"codes":10,"tables":13}]},{"name":"六、UI 与 App 自动化","articles":[{"id":"webui","title":"WebUI自动化篇","desc":"Playwright 选择器/自动等待/route Mock/Trace","file":"测试开发-WebUI自动化篇.md","content":"# 测试开发-WebUI自动化篇\n\n> 对应清单：Web UI 自动化工具选型【必须掌握一个主力】+ Playwright 核心【以它为主线】\n> 对应自查：Q1（为什么 UI 自动化在金字塔顶端且最薄）、Q3（Playwright 自动等待 vs Selenium 显式等待，什么时候还得手动等）\n> 立场：2026 年新学，主力选 Playwright，但 Selenium 的 **WebDriver 原理和两种等待的区别**必须能讲 —— 面试问的就是这个。\n\n---\n\n## 0. 先定位：UI 自动化的真实处境\n\n| 现实 | 应对 |\n| --- | --- |\n| 最脆弱、最慢、维护成本最高 | 所以只放最关键的 20% 场景（冒烟 + 核心链路） |\n| 元素一改就崩 | 所以 POM + test_id 策略（见《UI自动化工程化篇》） |\n| 失败原因最难判断 | 所以要有失败现场五件套（截图/Trace/日志/HTML/网络） |\n| 但它是唯一能验证\"用户真的能用\"的手段 | 所以不能没有 |\n\n自查分级：\n\n| 内容 | 档位 | 说明 |\n| --- | --- | --- |\n| 三工具选型与判断 | 能讲清 | 面试常问\"为什么选它\" |\n| Playwright 选择器策略 | 熟练 | 决定脚本寿命 |\n| 自动等待原理 | 熟练 | Q3 核心 |\n| 网络拦截 Mock | 会用 | 测前端异常处理必用 |\n| Trace 调试 | 熟练 | 定位神器 |\n| WebDriver 原理 + 显隐等待 | 能讲清 | 面试必备（Selenium 存量） |\n\n---\n\n## 1. 工具选型：为什么新学选 Playwright\n\n### 1.1 三款对比\n\n| | Playwright | Selenium | Cypress |\n| --- | --- | --- | --- |\n| 出品 | 微软（2020） | 开源社区（2004） | Cypress.io |\n| 通信方式 | CDP / 浏览器专用协议直连 | **W3C WebDriver 协议**（HTTP 请求驱动浏览器） | 跑在浏览器内部 |\n| 等待机制 | **内置自动等待**（actionability 检查） | 需自己写显式等待 | 自动重试（命令级） |\n| 多浏览器 | Chromium/Firefox/WebKit **一套代码** | 需要各 driver | 主要 Chromium/Firefox，WebKit 弱 |\n| 多标签/多窗口 | 原生支持 | 支持但麻烦 | **不支持多标签**（架构限制） |\n| iframe/新窗口 | 简单 | 需 switch_to | 有限制 |\n| 调试 | **Trace Viewer**（时间轴回放，含网络/快照） | 靠日志和截图 | 时间旅行调试 |\n| 并行 | 内置 worker | 需 Grid | 有但收费项多 |\n| 移动端 | 只能模拟视口 | 有 Appium 生态 | 无 |\n| 生态/存量 | 新，增长快 | **巨大**，企业存量最多 | 前端团队多 |\n\n**2026 年新学的判断**：\n\n```\n新项目主线 → Playwright（等待机制、Trace、多引擎、并行都省心）\n面试与存量 → Selenium（WebDriver 原理、显隐等待、Grid，问得最多）\n前端团队已用 → Cypress（跟着团队走，别硬换）\n```\n\n**一个具体的差距例子**：点一个按钮。\n\n```python\n# Selenium：你要自己判断\"什么时候能点\"\nwait = WebDriverWait(driver, 10)\nwait.until(EC.element_to_be_clickable((By.ID, \"submit\"))).click()\n\n# Playwright：click 内置了\"等到可点击\"的检查\npage.get_by_role(\"button\", name=\"提交\").click()\n```\n\n后者看起来只是短，实质是**它把\"元素可见、稳定（不在动画中）、可用、能接收事件\"这四项检查做进了每个操作**。这就是自动等待。\n\n### 1.2 什么时候不该选 Playwright\n\n| 场景 | 原因 |\n| --- | --- |\n| 团队已有成熟 Selenium 框架 + Grid 基础设施 | 迁移成本 > 收益 |\n| 需要驱动**真实 App** | Playwright 只能模拟移动视口，不能测原生 App（用 Appium） |\n| 需要兼容很老的浏览器（IE） | Playwright 不支持 |\n| 需要分布式大规模并发（几十台机器） | Selenium Grid 生态更成熟 |\n\n---\n\n## 2. Playwright 核心\n\n### 2.1 跑起来\n\n```bash\npip install playwright pytest-playwright\nplaywright install              # 装浏览器（chromium/firefox/webkit）\n```\n\n```ini\n# pytest.ini\n[pytest]\naddopts = --browser chromium --headed --tracing retain-on-failure --output test-results\n```\n\n```python\n# tests/test_login.py\nfrom playwright.sync_api import Page, expect\n\n\ndef test_login_success(page: Page):\n    page.goto(\"https://app.test.example.com/login\")\n    page.get_by_label(\"用户名\").fill(\"qa01\")\n    page.get_by_label(\"密码\").fill(\"P@ss1234\")\n    page.get_by_role(\"button\", name=\"登录\").click()\n    expect(page.get_by_text(\"欢迎回来\")).to_be_visible()\n```\n\n`pytest-playwright` 提供的 fixture：`page` / `context` / `browser` / `playwright` / `browser_name`。\n\n### 2.2 选择器策略：这一条决定脚本能活多久\n\n**优先级（从高到低）**：\n\n| 优先 | 写法 | 为什么 |\n| --- | --- | --- |\n| 1 | `get_by_test_id(\"submit-order\")` | 专门给测试的锚点，不随样式和文案变 |\n| 2 | `get_by_role(\"button\", name=\"提交订单\")` | 语义化，接近用户和可访问性标准；文案变才会失效 |\n| 3 | `get_by_label(\"手机号\")` / `get_by_placeholder(\"请输入手机号\")` | 表单场景好用 |\n| 4 | `get_by_text(\"订单已创建\")` | 断言场景好用，做定位偏脆 |\n| 5 | CSS：`#order-form .btn-primary` | 样式一改就崩 |\n| 6 | XPath：`//div[3]/form/button[2]` | **绝对不要**，层级一改全废 |\n\n**推动团队加 `data-testid`** 是最值得做的一次性投入：\n\n```tsx\n// 前端\n<button data-testid=\"submit-order\">提交订单<\/button>\n```\n\n```python\n# 测试\npage.get_by_test_id(\"submit-order\").click()\n```\n\n对比一下三种写法的存活率：\n\n```\nget_by_test_id(\"submit-order\")      → 只有产品逻辑变了才需要改\nget_by_role(\"button\", name=\"提交订单\") → 按钮文案改了就要改\n#order-form > div:nth-child(3) > button → 后端加一个 div 就崩\n```\n\n**面试可以这样说**：选择器策略本质是在\"定位的稳定性\"和\"实现成本\"之间做取舍，我优先用 `data-testid`，因为它和样式、文案、DOM 结构都解耦，是唯一能让 UI 自动化\"改版不崩\"的手段。\n\n### 2.3 自动等待：为什么比 sleep 可靠\n\nPlaywright 在执行 `click()` / `fill()` 前，会对目标元素做**actionability 检查**，全部通过才执行：\n\n| 检查 | 含义 |\n| --- | --- |\n| Visible（可见） | 不是 `display:none`、`visibility:hidden`、尺寸为 0 |\n| Stable（稳定） | 连续两帧位置没变（不在动画中） |\n| Enabled（可用） | 不是 disabled |\n| Receives Events（能接收事件） | 没有被其他元素遮挡 |\n\n**和 `sleep(3)` 的本质区别**：\n\n| | `sleep(3)` | 自动等待 |\n| --- | --- | --- |\n| 等待依据 | 猜一个时间 | 元素的真实状态 |\n| 快的情况 | 白等 2.8 秒 | 元素一就绪就继续 |\n| 慢的情况 | 3 秒不够就失败（flaky） | 一直等到超时（默认 30s） |\n| 慢机器 | 必然失败 | 不受影响 |\n\n**这就是\"死等\"和\"条件等\"的差别**：`sleep` 是**赌**，自动等待是**问**。\n\n### 2.4 网络拦截与 Mock：测前端的异常处理\n\n```python\nimport json\n\n\ndef test_pay_error_shows_friendly_message(page: Page):\n    \"\"\"后端 500 时，前端要有友好提示，而不是白屏或报错堆栈。\"\"\"\n    # 拦截支付接口，返回 500\n    page.route(\"**/api/pay\", lambda route: route.fulfill(\n        status=500,\n        content_type=\"application/json\",\n        body=json.dumps({\"code\": 500, \"msg\": \"系统繁忙\"}),\n    ))\n\n    page.goto(\"https://app.test.example.com/checkout\")\n    page.get_by_role(\"button\", name=\"支付\").click()\n\n    expect(page.get_by_text(\"系统繁忙，请稍后重试\")).to_be_visible()\n    expect(page.get_by_text(\"500\")).to_have_count(0)      # 不能把技术细节暴露给用户\n\n\ndef test_slow_api_loading_state(page: Page):\n    \"\"\"接口慢时要有 loading，且按钮不能重复点。\"\"\"\n    def slow(route):\n        import time\n        time.sleep(3)\n        route.fulfill(status=200, body='{\"code\":0}')\n\n    page.route(\"**/api/order\", slow)\n    page.get_by_role(\"button\", name=\"提交\").click()\n    expect(page.get_by_test_id(\"loading\")).to_be_visible()\n    expect(page.get_by_role(\"button\", name=\"提交\")).to_be_disabled()\n```\n\n**这一节的价值**：这些场景（后端 500、超时、慢响应、返回畸形数据）**只有 mock 能造**，真实环境里你等不到。而前端的容错恰恰是 bug 高发区。\n\n### 2.5 调试三件套：Trace / 截图 / 录屏\n\n| 工具 | 什么时候看 | 能看到什么 |\n| --- | --- | --- |\n| **Trace Viewer** | 失败复盘首选 | **时间轴回放**：每一步的 DOM 快照、网络请求、console、截图 |\n| 截图 | 快速看界面 | 失败时的样子 |\n| 录屏（video） | 看过程（比如\"闪一下\"的问题） | 整个用例的执行过程 |\n\n```python\n# pytest 插件方式（推荐）：只保留失败的 trace\n# pytest.ini: addopts = --tracing retain-on-failure --video retain-on-failure\n\n# 手动方式：精细控制\ncontext = browser.new_context()\ncontext.tracing.start(screenshots=True, snapshots=True, sources=True)\n# ... 操作 ...\ncontext.tracing.stop(path=\"trace.zip\")\n```\n\n```bash\nplaywright show-trace trace.zip     # 打开 Trace Viewer\n```\n\n**Trace 为什么强**：它不只是录屏，**每一步都有当时的 DOM 快照**，你可以点开\"点击按钮前\"的那个快照，用 DevTools 检查元素，看到底是元素不存在、被遮挡、还是状态不对。这是查 flaky 最快的工具。\n\n### 2.6 多浏览器与移动视口\n\n```python\nfrom playwright.sync_api import sync_playwright\n\nwith sync_playwright() as p:\n    for engine in (p.chromium, p.firefox, p.webkit):\n        browser = engine.launch()\n        page = browser.new_page()\n        page.goto(\"https://app.test.example.com\")\n        browser.close()\n```\n\n```python\n# 移动视口（注意：这是\"模拟\"，不是真机）\nfrom playwright.sync_api import sync_playwright\n\nwith sync_playwright() as p:\n    iphone = p.devices[\"iPhone 13\"]                 # 内置设备参数（UA、视口、DPR、触摸）\n    browser = p.chromium.launch()\n    context = browser.new_context(**iphone)\n    page = context.new_page()\n```\n\n**要清楚边界**：`p.devices[...]` 只是改 UA、视口尺寸、触摸事件，**它跑的还是 PC 浏览器内核**。真实设备的渲染差异、性能差异、系统弹窗、摄像头权限，它都测不了 → 那部分要用 Appium + 真机（见《App自动化篇》）。\n\n---\n\n## 3. Selenium：面试要能讲的两件事\n\n### 3.1 WebDriver 原理（W3C 协议）\n\n```\n测试代码 → 通过 HTTP 发 W3C 命令 → driver（chromedriver/geckodriver） → 浏览器\n```\n\n| 要点 | 说明 |\n| --- | --- |\n| 客户端-服务端模型 | 测试代码是 client，driver 是 server（监听端口，如 chromedriver 9515） |\n| 通信协议 | **W3C WebDriver 标准**，HTTP + JSON |\n| 为什么需要 driver | 浏览器只接受调试协议（CDP），driver 是翻译层 |\n| 结论 | 所以 Selenium 天然能跨语言（Java/Python/JS 都行），因为它只是发 HTTP |\n\n**面试追问的答案**：`driver.get()` 本质是发一个 `POST /session/{id}/url` 请求，driver 收到后通过 CDP 等内部协议驱动浏览器。\n\n### 3.2 显式等待 vs 隐式等待 vs 硬等待\n\n| 类型 | 写法 | 机制 | 问题 |\n| --- | --- | --- | --- |\n| **硬等待** | `time.sleep(3)` | 死等 | 快则白等，慢则失败 |\n| **隐式等待** | `driver.implicitly_wait(10)` | 全局生效：**查找元素**时最多等 10s | 只管\"元素存在\"，不管\"可点击\"；对所有 `find_element` 都生效，容易掩盖问题 |\n| **显式等待** | `WebDriverWait(driver,10).until(EC.xxx)` | 等**某个条件**成立 | 要自己写条件，但最精确 |\n\n**关键区别（面试高频）**：\n\n```\n隐式等待  → 等\"元素出现\"，全局生效，只能等存在性\n显式等待  → 等\"任意条件\"，针对具体元素和条件，最灵活\n```\n\n**两者混用会出事**：隐式等待 + 显式等待叠加，实际等待时间可能是乘积（`implicitly_wait(10)` + `WebDriverWait(10)` 最坏情况等到 100s），所以要**选一个用，Selenium 官方推荐只用显式等待**。\n\n---\n\n## 4. 自查 Q1 完整作答：为什么 UI 自动化在金字塔顶端且最薄\n\n### 4.1 用投入产出比回答（这是题眼）\n\n| 维度 | 单元测试 | 接口测试 | UI 测试 |\n| --- | --- | --- | --- |\n| 单条用例耗时 | 毫秒 | 几十~几百毫秒 | **秒到几十秒** |\n| 1000 条用例总时长 | 几十秒 | 几分钟 | **1~3 小时** |\n| 环境依赖 | 无 | 服务 + 数据库 | 服务 + 数据库 + **浏览器 + 前端静态资源 + CDN** |\n| 失败原因种类 | 几乎只有代码逻辑 | 请求/数据/业务 | **+ 渲染、网络、动画、元素变化、浏览器版本、分辨率** |\n| 单个缺陷定位成本 | 看断言就够 | 看请求响应 | **要看 Trace/截图/日志才能判断是谁的问题** |\n| 维护成本 | 重构时跟着改，逻辑清晰 | 接口改了才改 | **页面改版就要大面积改选择器** |\n| 能覆盖的问题 | 逻辑分支 | 契约、业务、并发 | **到\"用户真的能用\"这一层（这是唯一的不可替代价值）** |\n\n**结论的逻辑链**：\n\n```\n同样一条缺陷，UI 层发现的修复成本比接口层高一个数量级（越晚发现越贵）\n↑\n但全用 UI 覆盖，用例数量会是接口层的 N 倍，执行时间变小时级，维护成本指数上升\n↑\n所以：把\"能下沉的验证\"全部下沉到接口层（业务逻辑、状态、边界、并发）\n     把\"必须端到端\"的留在 UI 层（关键链路能不能走通、关键交互是否正常、前端容错）\n↑\n结果：UI 层少而精，只放冒烟 + 核心链路\n```\n\n### 4.2 60 秒口头版\n\n> UI 自动化放顶端且最薄，是投入产出比决定的。\n> **产出侧**：它能证明\"用户真的能用\"，这是接口测试证明不了的（前端渲染、交互、容错、跨浏览器）。\n> **投入侧**：单条用例秒级、依赖浏览器和前端资源、失败原因最复杂、页面一改就要维护选择器 —— 它是最贵的一层。\n> 所以策略是**把能下沉的验证都下沉到接口层**（业务规则、状态机、边界、并发、幂等），接口层又快又能定位；UI 层只保留\"必须端到端才能验证\"的部分：核心业务链路能不能走通、关键交互（上传/弹窗/支付跳转）、前端容错（后端 500 时的提示）。\n> 判断标准很简单：**这条用例能不能用接口测？能，就不要用 UI 测。**\n\n### 4.3 一个数字对比（讲这个故事更有说服力）\n\n> 我们下单流程有 40 个业务场景（优惠券、库存、限流、幂等…）。\n> 放在接口层跑：40 条用例，约 2 分钟。\n> 放在 UI 层跑：40 条用例，约 25 分钟，且每季度因页面改版要修 5~8 条选择器。\n> 所以 UI 层只保留了 3 条：正常下单、支付跳转、下单失败提示。其余 37 条全部下沉到接口层。\n\n---\n\n## 5. 自查 Q3 完整作答：自动等待 vs 显式等待，什么时候还得手动等\n\n### 5.1 两者的区别（核心在\"等什么\"）\n\n| | Playwright 自动等待 | Selenium 显式等待 |\n| --- | --- | --- |\n| 等什么 | **元素的可操作性**（可见、稳定、可用、能接收事件） | **你写的任意条件**（存在、可见、可点击、文本变化…） |\n| 触发时机 | 每次 `click/fill/...` 自动触发 | 你显式调用 `WebDriverWait(...).until(...)` |\n| 粒度 | 内建四项检查，不可扩展 | 完全自定义（`EC.presence_of_element_located` 等） |\n| 定位不到元素时 | 自动重试到超时 | 立即抛 `NoSuchElementException`（除非用显式等待包住） |\n| 失败信息 | 告诉你卡在哪个 actionability 检查 | 告诉你超时 + 条件表达式 |\n\n**一句话**：**Playwright 把\"最常见的等待\"内建了；Selenium 把等待交给你自己写。**\n\n### 5.2 什么场景**仍然需要**手动等待（这是 Q3 的重点）\n\n自动等待只管\"元素状态\"，**管不了\"业务状态\"和\"异步链路\"**。五类：\n\n| 场景 | 为什么自动等待不够 | 怎么写 |\n| --- | --- | --- |\n| **等业务状态变化** | 元素一直\"可见\"，但内容/状态在变（\"处理中\"→\"已成功\"） | `expect(page.get_by_test_id(\"status\")).to_have_text(\"已成功\")`（Playwright 的 expect 会自动重试） |\n| **等接口响应** | 页面元素没变，但数据在请求中 | `page.wait_for_response(\"**/api/order\")` 或 `page.expect_response(...)` |\n| **等元素消失/被移除** | 自动等待只等\"出现\"，不等\"消失\" | `page.get_by_text(\"加载中\").wait_for(state=\"detached\")` |\n| **等文件下载/上传完成** | 不是 DOM 状态 | `page.expect_download()` / `set_input_files` + 等提示 |\n| **等异步任务（轮询接口）** | 后端异步处理，前端轮询 | 写 `expect.poll`（JS/TS）或自己轮询 SQL/接口，Python 里用 `page.wait_for_function` 或直接断言接口 |\n| **等动画结束** | 自动等待的 stable 检查只保证\"两帧没动\"，长动画可能误判 | 关掉动画（`page.add_style_tag` 禁 transitions）或 `wait_for_timeout`（最后手段） |\n\n**代码示例：等业务状态**\n\n```python\nfrom playwright.sync_api import Page, expect\n\n\ndef test_refund_status_changes_to_success(page: Page):\n    \"\"\"自动等待保证按钮可点，但\"退款中→已退款\"是业务状态，要自己等。\"\"\"\n    page.get_by_role(\"button\", name=\"申请退款\").click()\n\n    # ❌ 错：按钮一下就可见，点完马上断言会拿到\"退款中\"\n    # assert page.get_by_test_id(\"refund-status\").inner_text() == \"已退款\"\n\n    # ✅ 对：expect 会轮询直到超时（默认 5s），天然带重试\n    expect(page.get_by_test_id(\"refund-status\")).to_have_text(\"已退款\", timeout=30000)\n```\n\n**代码示例：等接口响应**\n\n```python\ndef test_order_created_by_api(page: Page):\n    with page.expect_response(\"**/api/orders\") as resp_info:\n        page.get_by_role(\"button\", name=\"提交订单\").click()\n    resp = resp_info.value\n    assert resp.status == 201\n    order_no = resp.json()[\"data\"][\"order_no\"]\n    expect(page.get_by_text(order_no)).to_be_visible()\n```\n\n### 5.3 什么时候可以用 `sleep`（最后的例外）\n\n只有两种情况：\n\n1. **等外部系统**（比如第三方回调、邮件到达），这时候连\"可观测的状态\"都没有，只能用轮询 + 超时。\n2. **排查问题时的临时手段**，验证完必须删掉。\n\n**纪律**：`sleep` 出现在代码里必须有注释说明原因，否则 review 直接打回。**统计一下代码里 `sleep` 的条数，就知道框架成熟度。**\n\n---\n\n## 6. 动手清单\n\n- [ ] 推动前端给 3 个核心页面加 `data-testid`，把对应用例的选择器换掉，体会稳定性的差异。\n- [ ] 用 `route` mock 一次后端 500，验证前端提示是否友好（这通常能测出 bug）。\n- [ ] 跑一次带 `--tracing retain-on-failure` 的用例，用 `playwright show-trace` 打开失败 trace。\n- [ ] 数一下现有脚本里 `sleep` 的数量，逐个换成条件等待。\n","chars":6069,"codes":18,"tables":13},{"id":"app","title":"App自动化篇","desc":"Appium/Capabilities/权限弹窗/弱网/logcat","file":"测试开发-App自动化篇.md","content":"# 测试开发-App自动化篇\n\n> 对应清单：App 自动化【必须掌握（做 App 测试方向的话）】\n> 对应自查：Q7（App 测试中权限弹窗怎么处理？弱网怎么模拟？）\n> 立场：App 自动化的难点不在写脚本，在**环境**（设备、驱动、弹窗、弱网、稳定性）。这一篇讲的全是\"脚本跑不起来\"和\"跑起来不稳\"的那部分。\n\n---\n\n## 0. 先定位：App 和 Web 自动化的四个本质差异\n\n| | Web | App |\n| --- | --- | --- |\n| 运行环境 | 一个浏览器，可无头 | **真机/模拟器**，有系统层 |\n| 干扰因素 | 页面自身的动画/异步 | **系统弹窗、权限、来电、通知、广告** |\n| 定位方式 | DOM / role / testid | 原生控件树（resource-id / accessibility id） |\n| 稳定性 | 元素等不到 | 元素等不到 + 设备断开 + App 崩溃 + 被系统杀后台 |\n| 调试 | DevTools / Trace | **adb logcat、截图、录屏、Inspector** |\n\n自查分级：\n\n| 内容 | 档位 | 说明 |\n| --- | --- | --- |\n| Capabilities 配置 | 熟练 | 起不来的第一原因 |\n| 元素定位（resource-id/accessibility id） | 熟练 | 定位质量决定寿命 |\n| 权限弹窗处理 | 熟练 | Q7 一半 |\n| 弱网模拟 | 会用 | Q7 另一半 |\n| logcat 抓日志与崩溃分析 | 熟练 | 失败定位必备 |\n| 多机型兼容 | 会用 | 云真机 |\n\n---\n\n## 1. Appium 架构与启动\n\n### 1.1 架构（理解它才知道问题出在哪一层）\n\n```\n测试代码（client） ──HTTP/W3C──▶ Appium Server ──▶ UiAutomator2 驱动（Android）/ XCUITest（iOS）──▶ 设备\n```\n\n- **Appium Server 是中间层**：把 WebDriver 协议翻译成设备能懂的动作。\n- **driver 是设备上的 agent**：Android 用 `uiautomator2`（作为 APK 装在设备上），iOS 用 `WebDriverAgent`。\n- **所以出问题分三层**：client 脚本问题 / Appium server 问题 / 设备与驱动问题。**日志要分层看**（`appium --log-level debug`）。\n\n### 1.2 环境与启动\n\n```bash\n# 检查设备\nadb devices                              # Android\nxcrun simctl list devices               # iOS 模拟器\n\n# 起 Appium\nappium --log-level info --log appium.log\n# 常用参数：--allow-insecure=adb_shell（允许 adb shell 命令）\n```\n\n```python\n# conftest.py\nimport pytest\nfrom appium import webdriver\nfrom appium.options.android import UiAutomator2Options\nfrom selenium.webdriver.common.by import By\n\nAPPIUM_URL = \"http://127.0.0.1:4723\"\n\n\n@pytest.fixture(scope=\"session\")\ndef driver():\n    options = UiAutomator2Options()\n    options.platform_name = \"Android\"\n    options.device_name = \"emulator-5554\"          # adb devices 里的名字\n    options.app_package = \"com.example.app\"\n    options.app_activity = \"com.example.app.MainActivity\"\n    options.no_reset = False                        # 每条会话重置 App 状态\n    options.set_capability(\"autoGrantPermissions\", True)     # 自动授权（见 Q7）\n    options.set_capability(\"newCommandTimeout\", 300)\n    options.set_capability(\"uiautomator2ServerLaunchTimeout\", 60000)\n\n    drv = webdriver.Remote(APPIUM_URL, options=options)\n    drv.implicitly_wait(0)                          # 不要用隐式等待，用显式\n    yield drv\n    drv.quit()\n```\n\n### 1.3 Capabilities 里最关键的几个（起不来先看这里）\n\n| 能力 | 作用 | 坑 |\n| --- | --- | --- |\n| `platformName` / `deviceName` | 目标平台和设备 | `deviceName` 写错 → 设备找不到 |\n| `appPackage` / `appActivity` | 启动哪个 App | `appActivity` 要全路径，写错直接崩 |\n| `noReset` | 是否保留 App 数据 | `True` 时登录态保留但脏数据也保留 |\n| `fullReset` | 卸载重装 | 慢，但最干净 |\n| `autoGrantPermissions` | 安装时自动授权 | **测\"拒绝权限\"场景时要关掉** |\n| `unicodeKeyboard`/`resetKeyboard` | 中文输入 | 中文输入常见问题 |\n| `newCommandTimeout` | 命令超时 | 默认 60s，长操作会断 |\n\n---\n\n## 2. 元素定位：用 Inspector 看，用 id 定位\n\n### 2.1 定位方式优先级\n\n| 优先 | Android | iOS | 说明 |\n| --- | --- | --- | --- |\n| 1 | `AppiumBy.ID`（= resource-id） | `AppiumBy.ACCESSIBILITY_ID` | 最稳，和 UI 结构解耦 |\n| 2 | `AppiumBy.ANDROID_UIAUTOMATOR`（text/content-desc） | `AppiumBy.IOS_PREDICATE` | 灵活，但依赖文案 |\n| 3 | `AppiumBy.ACCESSIBILITY_ID`（content-desc） | `AppiumBy.NAME` | 语义化 |\n| 4 | XPath | XPath | **最后选择**，慢且脆 |\n| ✗ | 坐标点击 | 坐标点击 | 不同分辨率必挂 |\n\n```python\nfrom appium.webdriver.common.appiumby import AppiumBy\n\n# ✅ 稳：resource-id\ndriver.find_element(AppiumBy.ID, \"com.example.app:id/btn_login\").click()\n\n# ✅ 稳：accessibility\ndriver.find_element(AppiumBy.ACCESSIBILITY_ID, \"登录按钮\").click()\n\n# ⚠️ 中：文案（改文案就挂，但可读性好）\ndriver.find_element(AppiumBy.ANDROID_UIAUTOMATOR,\n                    'new UiSelector().text(\"登录\")').click()\n\n# ❌ 脆：XPath 层级\ndriver.find_element(AppiumBy.XPATH,\n                    '//android.widget.FrameLayout[1]/android.widget.LinearLayout[2]/android.widget.Button[1]')\n```\n\n### 2.2 怎么拿到这些属性\n\n- **Android**：`uiautomatorviewer`（SDK 自带）或 **Appium Inspector**（`appium inspector` 或桌面版）。\n- **iOS**：Appium Inspector + Xcode 的 Accessibility Inspector。\n- 快速定位不到时，用 `adb shell uiautomator dump` 导出当前界面 XML，直接看属性。\n\n```bash\nadb shell uiautomator dump /sdcard/ui.xml\nadb pull /sdcard/ui.xml\n```\n\n**推动开发加 `resource-id`** 和推动前端加 `data-testid` 是同一个道理 —— 这是让用例\"改版不崩\"的唯一投资。\n\n### 2.3 等待：App 比 Web 更需要显式等待\n\n```python\nfrom selenium.webdriver.support.ui import WebDriverWait\nfrom selenium.webdriver.support import expected_conditions as EC\n\nwait = WebDriverWait(driver, 15)\nwait.until(EC.element_to_be_clickable((AppiumBy.ID, \"com.example.app:id/btn_login\"))).click()\n```\n\n**为什么隐含等待不适合 App**：App 启动慢（冷启动 3~8 秒）、页面切换有转场动画、列表懒加载。隐式等待全局生效且只等\"存在\"，很容易在\"元素存在但不可点\"时失败。\n\n---\n\n## 3. 常用操作（真实场景那几个）\n\n```python\nfrom appium.webdriver.common.appiumby import AppiumBy\nfrom selenium.webdriver.common.actions.action_builder import ActionBuilder\n\n# 输入\nel = driver.find_element(AppiumBy.ID, \"com.example.app:id/et_phone\")\nel.clear()\nel.send_keys(\"13800000000\")\ndriver.hide_keyboard()                    # 收起键盘（遮挡按钮时必用）\n\n# 滑动（W3C 手势，比弃用的 swipe 更稳）\ndriver.execute_script(\"mobile: swipeGesture\", {\n    \"left\": 100, \"top\": 800, \"width\": 700, \"height\": 600,\n    \"direction\": \"up\", \"percent\": 0.8,\n})\n\n# 长按\ndriver.execute_script(\"mobile: longClickGesture\", {\n    \"elementId\": el.id, \"duration\": 1500,\n})\n\n# 滚动到元素（列表场景）\nel = driver.find_element(AppiumBy.ANDROID_UIAUTOMATOR,\n                         'new UiScrollable(new UiSelector().scrollable(true))'\n                         '.scrollIntoView(new UiSelector().text(\"设置\"))')\n\n# 应用状态控制（比重启 driver 快）\ndriver.terminate_app(\"com.example.app\")\ndriver.activate_app(\"com.example.app\")\n```\n\n---\n\n## 4. 自查 Q7 完整作答：权限弹窗处理 + 弱网模拟\n\n### 4.1 权限弹窗：三种处理策略，按测试目的选\n\n**策略一：预授权（最省事，适合\"权限不是被测点\"的时候）**\n\n```python\noptions.set_capability(\"autoGrantPermissions\", True)     # Android\noptions.set_capability(\"autoAcceptAlerts\", True)          # iOS\n```\n\n- 效果：装 App 时就把所有权限授予，运行时不再弹窗。\n- **适用**：测业务功能，权限只是干扰项。\n- **不适用**：需求里明确要测\"用户拒绝权限后 App 怎么降级\"。\n\n**策略二：识别并点击系统弹窗（要测拒绝时用）**\n\nAndroid 的系统权限弹窗不在你的 App 里，在系统包 `com.android.permissioncontroller`（Android 11+）或 `com.android.packageinstaller`（老版本）：\n\n```python\nfrom appium.webdriver.common.appiumby import AppiumBy\nfrom selenium.webdriver.support.ui import WebDriverWait\nfrom selenium.webdriver.support import expected_conditions as EC\n\n\ndef handle_permission_popup(driver, allow: bool = True, timeout: int = 5):\n    \"\"\"处理 Android 系统权限弹窗。allow=True 点允许，False 点拒绝。\"\"\"\n    try:\n        btn_id = \"com.android.permissioncontroller:id/permission_allow_foreground_only_button\" if allow \\\n            else \"com.android.permissioncontroller:id/permission_deny_button\"\n        btn = WebDriverWait(driver, timeout).until(\n            EC.element_to_be_clickable((AppiumBy.ID, btn_id)))\n        btn.click()\n        return True\n    except Exception:\n        return False        # 没有弹窗（已授权或没触发），不算失败\n\n\ndef test_location_permission_denied(driver):\n    \"\"\"拒绝定位权限后，App 应降级为手动选城市，而不是白屏。\"\"\"\n    driver.find_element(AppiumBy.ID, \"com.example.app:id/btn_nearby\").click()\n    handle_permission_popup(driver, allow=False)\n\n    # 关键：断言\"降级后的表现\"，不是断言\"弹窗出现了\"\n    assert driver.find_element(AppiumBy.ID, \"com.example.app:id/tv_city_hint\").text\n \n```\n\n**iOS 的弹窗在 SpringBoard 里**：\n\n```python\nfrom appium.webdriver.common.appiumby import AppiumBy\n\ndef handle_ios_alert(driver, allow: bool = True):\n    \"\"\"iOS 系统权限弹窗：在 SpringBoard 应用里定位按钮。\"\"\"\n    springboard = driver.execute_script(\"mobile: activeAppInfo\")  # 或用 XCUITest 直接切\n    btn = \"允许\" if allow else \"不允许\"\n    try:\n        driver.find_element(AppiumBy.ACCESSIBILITY_ID, btn).click()\n        return True\n    except Exception:\n        return False\n```\n\n**策略三：修改系统设置（要测\"关闭权限\"的长期状态时）**\n\n```bash\n# Android：用 adb 直接改权限（需要 root 或 debug 包）\nadb shell pm revoke com.example.app android.permission.ACCESS_FINE_LOCATION\nadb shell pm grant  com.example.app android.permission.ACCESS_FINE_LOCATION\n```\n\n**三种策略的选择（答题要点）**：\n\n| 测试目的 | 用哪种 |\n| --- | --- |\n| 测业务，权限是干扰 | 预授权（`autoGrantPermissions`） |\n| 测\"拒绝权限后的降级\" | 识别系统弹窗并点拒绝 |\n| 测\"权限被关闭后长期表现\" | adb pm revoke/grant |\n| 测\"权限只授予一次\" | 先授予，再重启 App 看是否再弹 |\n\n**三个必踩的坑**：\n\n1. **不要用坐标点击弹窗** —— 不同分辨率、不同系统版本按钮位置不同，必挂。\n2. **弹窗出现有延迟** —— 点完按钮后弹窗可能 1~2 秒才出现，用 `WebDriverWait` 等，不要立即断言。\n3. **Android 11+ 的按钮 id 变了** —— 老的 `packageinstaller:id/permission_allow_button` 在新系统上找不到，要按系统版本分支。\n\n### 4.2 弱网模拟：Appium 不管这事，要用外部手段\n\n**Appium 本身没有弱网能力**，必须靠设备/系统/代理层。四种方案：\n\n| 方案 | 适用 | 怎么做 |\n| --- | --- | --- |\n| **Android 模拟器自带参数** | 模拟器上跑 | 启动时加 `-netdelay 2000 -netspeed gsm`，或运行时 `adb emu network delay 2000` |\n| **iOS Network Link Conditioner** | 真机/模拟器 | Xcode 的 Additional Tools 里安装，选预设（3G/Edge/100% Loss） |\n| **用 PC 开热点 + tc netem** | Android 真机 | PC 做热点，Linux 上用 `tc qdisc add dev wlan0 root netem delay 2000ms loss 5%` |\n| **代理工具限速** | 通用（HTTP 层） | Charles/Reqable 的 Throttle 预设，或 mitmproxy 插件加延迟 |\n\n**最实用的两个**：\n\n```bash\n# 1. Android 模拟器（改完立刻生效，不用重启）\nadb emu network delay 3000          # 延迟 3s\nadb emu network speed gsm           # 限速到 GSM 级别\nadb emu network delay none          # 恢复\n\n# 2. mitmproxy 插件做 HTTP 层限速（真机也能用）\n# throttle.py\nimport time\nfrom mitmproxy import http\n\ndef response(flow: http.HTTPFlow) -> None:\n    time.sleep(3.0)                 # 每个响应都延迟 3 秒\n```\n\n```bash\nmitmdump -s throttle.py\n```\n\n**弱网要测什么**（这一步比\"怎么模拟\"更重要）：\n\n| 弱网场景 | 期望 |\n| --- | --- |\n| 首屏加载慢 | 有 loading / 骨架屏，不白屏 |\n| 提交订单超时 | 提示\"网络超时，请重试\"，**不能出现\"订单失败但实际成功\"** |\n| 弱网下重复点击 | 按钮置灰/只发一次请求（查后端是否产生两单） |\n| 断网 | 明确提示\"网络不可用\"，恢复后能自动重试 |\n| 切换网络（WiFi↔4G） | 长连接是否重连、请求是否丢失 |\n\n---\n\n## 5. 日志与崩溃：失败时最先看的两样\n\n### 5.1 adb logcat\n\n```bash\n# 按进程过滤（最常用）\nadb logcat --pid=$(adb shell pidof com.example.app)\n\n# 按 tag / 级别过滤\nadb logcat -s \"MyApp:D\" \"AndroidRuntime:E\"\n\n# 清空后重新抓（复现前先清，日志才干净）\nadb logcat -c && adb logcat > run.log\n\n# 抓崩溃栈\nadb logcat -b crash\n```\n\n### 5.2 Appium 里拿 logcat\n\n```python\nlogs = driver.get_log(\"logcat\")         # Android 支持\nerrors = [l for l in logs if l[\"levelname\"] in (\"ERROR\", \"SEVERE\")]\n```\n\n### 5.3 崩溃后怎么办\n\n| 现象 | 先看 | 结论 |\n| --- | --- | --- |\n| App 直接闪退 | `adb logcat -b crash` | 找 `FATAL EXCEPTION` + 堆栈 → 提缺陷（带堆栈） |\n| App 卡在启动页 | logcat + 是否 ANR | ANR 看 `traces.txt`（`/data/anr/`） |\n| 元素找不到但界面看得到 | `uiautomator dump` 看控件树 | 可能是 WebView/Flutter/自定义 View（控件树里没有） |\n| 偶发失败但无崩溃 | 截图 + 录屏 | 多半是等待问题 |\n| 设备断开 | `adb devices` | 模拟器挂了/USB 松了，与业务无关 |\n\n**一个必知的事实**：Flutter、React Native、游戏引擎的界面，**原生控件树里可能只有一个 SurfaceView，元素全查不到**。遇到这种情况要么用 Flutter 的测试 API，要么只能截图 + 坐标（脆弱），要么推动开发加语义标注。**这是\"选型时就要评估\"的事**。\n\n---\n\n## 6. 多机型兼容与云真机\n\n| 方式 | 优点 | 缺点 |\n| --- | --- | --- |\n| 本地几台真机 | 便宜、可控 | 覆盖少、维护烦 |\n| 本地模拟器 | 快、可批量 | 测不出真实性能/厂商 ROM 差异 |\n| **云真机平台**（Testin/WeTest/BrowserStack/Sauce Labs/阿里云 EMAS） | 机型多、支持并行、有录屏日志 | 收费、网络延迟、调试不如本地顺手 |\n\n**兼容性测试的组合策略**（配合《用例设计方法篇》的正交法）：\n\n```\n必测：主流机型 3~5 台（覆盖高中低端 + 主流系统版本）\n抽样：厂商 ROM（小米/华为/OPPO 各 1）—— 权限、后台保活、推送差异都在这里\n专项：屏幕比例（刘海屏/折叠屏）、系统版本边界（最低支持版本）\n```\n\n---\n\n## 7. App 自动化的五个\"只有做过才知道\"的坑\n\n| 坑 | 现象 | 解法 |\n| --- | --- | --- |\n| **启动广告/升级弹窗** | 每次启动都弹，用例第一步就挂 | 启动后统一处理一次（`handle_startup_popups`），或用测试包关掉 |\n| **Toast 抓不到** | Android Toast 不在控件树里 | 用 `uiautomator2` 的 toast 捕获（Appium 需特定能力），或截图后 OCR（下策） |\n| **Hybrid 应用（WebView）** | 控件树里看到 `android.webkit.WebView`，里面元素找不到 | `driver.switch_to.context(driver.contexts[-1])` 切到 WebView 上下文 |\n| **冷启动 vs 热启动** | 冷启动慢 5 秒，热启动快 | 用例不假设启动耗时；首屏断言用显式等待 |\n| **被系统杀后台** | 切到其他 App 再回来，页面重置 | 不只测前台流程，也要测\"后台切回\" |\n\n```python\ndef handle_startup_popups(driver):\n    \"\"\"启动后统一关掉广告/升级/评分弹窗。找不到就跳过，不失败。\"\"\"\n    for _ in range(3):\n        closed = False\n        for locator in [\n            (AppiumBy.ID, \"com.example.app:id/iv_close_ad\"),\n            (AppiumBy.ID, \"com.example.app:id/btn_later\"),\n            (AppiumBy.XPATH, '//*[@text=\"以后再说\"]'),\n        ]:\n            try:\n                driver.find_element(*locator).click()\n                closed = True\n                break\n            except Exception:\n                continue\n        if not closed:\n            break\n```\n\n---\n\n## 8. 动手清单\n\n- [ ] 用 `appium inspector` 连接一次真机，把一个页面的所有可定位元素导出看一遍。\n- [ ] 写一个 `handle_startup_popups`，看能不能把启动弹窗全部关掉。\n- [ ] 用 `adb emu network delay 3000` 造一次弱网，看下单流程的表现。\n- [ ] 抓一次 `adb logcat -b crash`，体会崩溃栈怎么定位到代码行。\n- [ ] 数一下你的脚本里有多少 `find_element(By.XPATH, ...)`，逐个换成 resource-id。\n","chars":4646,"codes":17,"tables":10},{"id":"ui-eng","title":"UI自动化工程化篇","desc":"POM 三层/失败五件套/登录态复用/flaky 治理","file":"测试开发-UI自动化工程化篇.md","content":"# 测试开发-UI自动化工程化篇\n\n> 对应清单：工程化要点【必须掌握】+ AI 在 UI 自动化中的用法【了解即可】\n> 对应自查：Q2（POM 分层与改版时改哪里）、Q4（脚本问题 vs 业务坏了）、Q5（用例依赖别的用例的登录账号怎么解耦）、Q6（flaky 治理与重试策略）、Q8（AI 生成脚本后必须人工检查什么）\n> 立场：**UI 自动化的稳定性来自工程设计，不是来自工具**。同样是 Playwright，两个人写出来的脚本寿命能差三倍，差别全在这一篇。\n\n---\n\n## 0. 先定位：工程化解决的是\"三个月后还能不能跑\"\n\n| 不做工程化 | 做了 |\n| --- | --- |\n| 页面改版，50 个文件全要改 | 只改 Page 层一个文件 |\n| 用例 A 挂了导致 B、C 全挂 | 每条独立，互不影响 |\n| 失败只知道\"点不动\" | 有截图/Trace/网络，判断是脚本还是业务 |\n| 每周修 flaky，修不完 | flaky 率 < 1%，有人盯 |\n| 全量 3 小时，跑不完 | 分三级，提交级 15 分钟 |\n\n自查分级：\n\n| 内容 | 档位 | 说明 |\n| --- | --- | --- |\n| POM 三层分层 | 熟练 | 决定维护成本 |\n| 失败现场五件套 | 熟练 | 决定定位效率 |\n| 登录态复用 / 数据隔离 | 熟练 | 决定能否并行 |\n| flaky 治理 | 会用能讲 | 面试加分项 |\n| 用例分级 | 熟练 | 决定 CI 能不能用 |\n\n---\n\n## 1. 自查 Q2：POM 分层怎么设计，改版时只改哪里\n\n### 1.1 分三层（不要只分两层）\n\n```\nBusinessFlow（业务流）  ← \"下单\"这个动作，由多个页面步骤组成\n      ↓\n   Page（页面）        ← 一个页面的元素 + 原子操作（填、点、断言）\n      ↓\nComponent（组件）      ← 可复用的部件（顶部导航、弹窗、日期选择器）\n      ↓\n  Locator（定位器）    ← 所有选择器集中定义\n```\n\n| 层 | 职责 | 改版时会不会改 |\n| --- | --- | --- |\n| **Locator** | 只放选择器 | **改（样式/结构变了）** |\n| **Page** | 一个页面的元素引用 + 原子操作 + 页面级断言 | 改（元素增删） |\n| **Component** | 跨页面复用的部件（弹窗、头部、分页器） | 改（如果这个部件变了） |\n| **BusinessFlow** | 业务步骤编排（下单 = 加购 + 结算 + 支付） | **几乎不改**（业务流程稳定） |\n\n**关键洞察**：**页面改版改的是\"元素\"，不是\"业务\"**。所以元素相关的东西全部收敛到 Page 层，业务步骤（Flow 层）尽量稳定。\n\n### 1.2 目录结构\n\n```\ntests_ui/\n├── locators/\n│   ├── login_locators.py        # 登录页所有选择器\n│   ├── order_locators.py\n│   └── common_locators.py       # 全局（弹窗关闭、toast）\n├── pages/\n│   ├── base_page.py             # 基类：等待、点击重试、截图等通用能力\n│   ├── login_page.py            # 登录页：原子操作\n│   └── order_page.py\n├── components/\n│   ├── header.py                # 顶部导航（跨页面复用）\n│   └── modal.py                 # 弹窗组件\n├── flows/\n│   ├── login_flow.py            # 登录业务流程（可能涉及多个页面）\n│   └── order_flow.py            # 下单流程\n└── testcases/\n    ├── test_login.py            # 只调用 flow，不碰选择器\n    └── test_order.py\n```\n\n### 1.3 代码对比（这是最能说明问题的部分）\n\n**❌ 反例：全写一个文件（三个月后没人敢改）**\n\n```python\ndef test_buy():\n    page.goto(\"https://app.test.com/login\")\n    page.fill(\"#username\", \"qa01\")\n    page.fill(\"#password\", \"P@ss1234\")\n    page.click(\"button.btn-primary\")\n    page.wait_for_timeout(2000)\n    page.click(\"div.product-list > div:nth-child(2) > button\")\n    page.click(\"#cart-icon\")\n    page.click(\"//button[text()='结算']\")\n    page.click(\"#submit-order\")\n    assert page.is_visible(\".success-toast\")\n```\n\n**✅ 正例：三层分开**\n\n```python\n# locators/order_locators.py\nclass OrderLocators:\n    PRODUCT_CARD = '[data-testid=\"product-card\"]'\n    ADD_TO_CART = '[data-testid=\"add-to-cart\"]'\n    CART_ICON = '[data-testid=\"cart-icon\"]'\n    CHECKOUT = '[data-testid=\"checkout-btn\"]'\n    SUBMIT_ORDER = '[data-testid=\"submit-order\"]'\n    SUCCESS_TOAST = '[data-testid=\"success-toast\"]'\n```\n\n```python\n# pages/order_page.py\nfrom playwright.sync_api import Page, expect\nfrom locators.order_locators import OrderLocators\n\n\nclass OrderPage:\n    \"\"\"订单相关页面的原子操作。不写业务判断，只写\"怎么操作这个页面\"。\"\"\"\n\n    def __init__(self, page: Page):\n        self.page = page\n        self.loc = OrderLocators()\n\n    def add_first_product_to_cart(self):\n        self.page.get_by_test_id(\"add-to-cart\").first.click()\n\n    def go_to_checkout(self):\n        self.page.get_by_test_id(\"cart-icon\").click()\n        self.page.get_by_test_id(\"checkout-btn\").click()\n\n    def submit_order(self):\n        self.page.get_by_test_id(\"submit-order\").click()\n\n    def expect_success(self):\n        expect(self.page.get_by_test_id(\"success-toast\")).to_be_visible()\n```\n\n```python\n# flows/order_flow.py\nclass OrderFlow:\n    \"\"\"业务流程。这里说的是\"用户要做什么\"，不关心元素长什么样。\"\"\"\n\n    def __init__(self, page: Page):\n        self.order_page = OrderPage(page)\n\n    def buy_first_product(self):\n        self.order_page.add_first_product_to_cart()\n        self.order_page.go_to_checkout()\n        self.order_page.submit_order()\n        self.order_page.expect_success()\n```\n\n```python\n# testcases/test_order.py\ndef test_buy_first_product(auth_page):\n    OrderFlow(auth_page).buy_first_product()\n```\n\n### 1.4 改版时改哪里（直接回答 Q2）\n\n| 改版类型 | 改哪里 | 改几个文件 |\n| --- | --- | --- |\n| 按钮换成图标（选择器变了） | **只改 `locators/`** | 1 个 |\n| 页面加了新元素、要新操作 | `pages/` 加方法 | 1 个 |\n| 业务流程变了（结算分两步） | `flows/` | 1 个 |\n| 顶部导航改版（跨 5 个页面） | `components/header.py` | 1 个 |\n| 整个结算页重做 | `pages/` + `locators/` | 2 个 |\n\n**\"改版要改 50 个文件\"的根因**：定位和业务步骤混在一个文件里。**只要选择器全在 Page/Locator 层，改版就只改一处。**\n\n### 1.5 POM 的三个反模式\n\n| 反模式 | 问题 |\n| --- | --- |\n| Page 里写断言业务逻辑 | 页面对象变成\"测试类\"，无法复用 |\n| Page 里写死等待 | 换页面就得改等待 |\n| 一个 Page 类 800 行（把整个 App 写一个类） | 等于没分 |\n\n---\n\n## 2. 稳定等待的工程化\n\n前面（《WebUI自动化篇》Q3）讲了\"什么时候要手动等\"。这里讲**怎么把等待做成框架能力**。\n\n```python\n# pages/base_page.py\nfrom playwright.sync_api import Page, expect\n\n\nclass BasePage:\n    def __init__(self, page: Page):\n        self.page = page\n\n    def click_when_ready(self, locator, timeout: int = 15000):\n        \"\"\"封装点击：自动等可见+可用，失败时带上当前 URL 和页面标题（便于判断）。\"\"\"\n        try:\n            locator.click(timeout=timeout)\n        except Exception as e:\n            raise AssertionError(\n                f\"点击失败: url={self.page.url} title={self.page.title()!r} err={e}\"\n            ) from e\n\n    def wait_text(self, locator, text: str, timeout: int = 15000):\n        \"\"\"等文本出现 —— 比\"等元素可见\"更贴近业务。\"\"\"\n        expect(locator).to_have_text(text, timeout=timeout)\n\n    def wait_gone(self, locator, timeout: int = 15000):\n        \"\"\"等元素消失（loading、遮罩）。\"\"\"\n        locator.wait_for(state=\"detached\", timeout=timeout)\n```\n\n**工程化的三条纪律**：\n\n1. **业务层禁止 `wait_for_timeout`**（固定等待），只在排查时临时用。\n2. **等待要有超时**，且超时值集中配置（不要每个地方写 3000/5000/10000 各种值）。\n3. **等待失败的报错要带现场**（URL、标题、当前可见文本），而不是光一个 `TimeoutError`。\n\n---\n\n## 3. 自查 Q4：失败时怎么判断\"脚本问题\"还是\"业务坏了\"\n\n### 3.1 失败现场五件套（清单给的五样）\n\n| # | 现场 | 回答什么问题 |\n| --- | --- | --- |\n| 1 | **截图** | 当时页面长什么样（白屏？报错弹窗？loading？） |\n| 2 | **HTML 快照（page.content）** | 元素到底在不在 DOM 里、属性是什么 |\n| 3 | **网络请求**（路由日志 / Trace 里的 Network） | 接口发出去了吗、返回什么状态码、返回什么数据 |\n| 4 | **Console 日志** | 前端有没有 JS 报错 |\n| 5 | **Trace** | 把上面四个按时间轴串起来看（含每一步的 DOM 快照） |\n\n**自动收集（一次配好，永久受益）**：\n\n```python\n# conftest.py\nimport pytest\nfrom pathlib import Path\n\nARTIFACT_DIR = Path(\"artifacts\")\n\n\n@pytest.hookimpl(hookwrapper=True)\ndef pytest_runtest_makereport(item, call):\n    outcome = yield\n    report = outcome.get_result()\n    if report.when != \"call\" or not report.failed:\n        return\n\n    page = item.funcargs.get(\"page\") or item.funcargs.get(\"auth_page\")\n    if page is None:\n        return\n\n    out = ARTIFACT_DIR / item.nodeid.replace(\"::\", \"_\").replace(\"/\", \"_\")\n    out.mkdir(parents=True, exist_ok=True)\n\n    page.screenshot(path=str(out / \"screenshot.png\"), full_page=True)       # ① 截图\n    (out / \"page.html\").write_text(page.content(), encoding=\"utf-8\")        # ② HTML 快照\n    (out / \"console.log\").write_text(                                       # ④ console\n        \"\\n\".join(f\"{m.type}: {m.text}\" for m in page.console_messages), encoding=\"utf-8\")\n    report.sections.append((\"失败现场\", str(out)))\n```\n\n网络请求和 Trace 用 pytest-playwright 的 `--tracing retain-on-failure` 自动得到（Trace 里含完整的 Network 面板）。\n\n### 3.2 判断流程（六步，按成本从低到高）\n\n```\n① 看截图\n   白屏/报错弹窗 → 大概率业务或前端问题\n   元素明显不在 → 进②\n\n② 看 HTML 快照，搜关键元素\n   元素在，但属性/文本不对  → 前端渲染或数据问题（业务）\n   元素根本不在            → 脚本选择器错，或页面/接口没加载完（脚本）\n\n③ 看网络请求\n   请求没发出        → 脚本问题（按钮没点到）或前端逻辑（校验没通过）\n   404/500          → 后端问题（业务）\n   200 但数据不对    → 后端业务逻辑（业务）\n   200 数据对但页面没渲染 → 前端问题（业务）\n\n④ 看 console\n   有 JS 报错（如 undefined） → 前端 bug（业务）\n   有 404 资源                → 环境或发版问题\n\n⑤ 手工复现同一路径\n   手工也不行 → 确认是业务 bug，提单\n   手工可以   → 几乎确定是脚本问题\n\n⑥ 单独跑这条用例 / 换浏览器跑\n   单独跑过、一起跑挂 → 数据污染或并发干扰（脚本/环境）\n   换浏览器也挂       → 前端兼容或业务\n```\n\n### 3.3 一套判定表（值班时直接查）\n\n| 现象 | 判断 | 依据 |\n| --- | --- | --- |\n| 元素找不到，HTML 里也没有 | 脚本（选择器错/页面没到） | 换 `data-testid` 或加等待 |\n| 元素在但点不动（被遮挡） | 前端/业务（有过场动画、遮罩没关） | 看截图有没有遮罩 |\n| 点击后接口 500 | 业务（后端） | 抓返回体 |\n| 点击后接口 200，页面不更新 | 前端 bug | 看 console |\n| 断言文案不对，但功能正常 | 业务（文案改了）或断言太脆 | 优先改断言方式 |\n| 只有 CI 挂、本地过 | 环境（时区/分辨率/版本/网络） | 看 CI 的截图和 URL |\n| 偶发，重跑就过 | flaky（等待或数据） | 见 §5 |\n| 所有用例第一个都挂 | 环境（服务没起/登录失效） | 先看登录接口 |\n\n### 3.4 答题话术\n\n> 我不会先改脚本，先看现场。五件套里我先看**截图 + HTML 快照**：元素到底在不在 DOM 里。**在但不可点**就怀疑前端（遮罩、动画、样式）；**不在**就怀疑脚本（选择器错或没等加载完）。\n> 然后看**网络请求**：接口有没有发出、返回什么。接口 500 或返回数据不对，直接是业务问题；接口正常但页面没更新，是前端问题。\n> 最后一步是**手工复现**：手工也复现不了，基本就能确定是脚本问题。\n> 这个顺序的理由是：截图和快照成本最低、信息量最大，比读代码快。\n\n---\n\n## 4. 自查 Q5：用例 A 依赖用例 B 的登录账号，怎么解耦\n\n### 4.1 先明确\"为什么必须解耦\"\n\n```\ntest_login  → 登录成功，把 token 存到全局变量\ntest_buy    → 依赖 test_login 留下的 token\ntest_pay    → 依赖 test_buy 留下的订单\n\n结果：单独跑 test_pay 失败；顺序一变全挂；并行跑必挂\n```\n\n**这是 UI 自动化最常见的架构错误**：用例之间串成一个长链，任何一环断了后面全废，而且不能并行。\n\n### 4.2 四种解耦方案（按推荐度）\n\n| 方案 | 做法 | 适用 |\n| --- | --- | --- |\n| **① 复用登录态（storage_state）** | 一次登录，把 cookie+localStorage 存成文件，每条用例新建 context 时加载 | **Playwright 项目首选** |\n| **② 每条用例独立登录** | 每条自己走登录流程 | 简单但慢（每条多 3~5 秒） |\n| **③ API 造账号 + API 登录** | 用接口注册/登录，把 token/cookie 注入浏览器 | 最快，最推荐组合方案 |\n| **④ 每条用例独立账号** | 账号池，按 worker 分配 | 需要账号隔离时的补充 |\n\n### 4.3 方案 ①：storage_state（最干净的解法）\n\n```python\n# conftest.py\nimport pytest\nfrom playwright.sync_api import Browser\n\n\n@pytest.fixture(scope=\"session\")\ndef auth_state(browser: Browser, base_url: str) -> str:\n    \"\"\"全局只登录一次，把登录态存文件。后面所有用例复用。\"\"\"\n    context = browser.new_context()\n    page = context.new_page()\n    page.goto(f\"{base_url}/login\")\n    page.get_by_label(\"用户名\").fill(\"qa01\")\n    page.get_by_label(\"密码\").fill(\"P@ss1234\")\n    page.get_by_role(\"button\", name=\"登录\").click()\n    page.get_by_text(\"欢迎回来\").wait_for()\n\n    path = \".auth/state.json\"\n    context.storage_state(path=path)      # 保存 cookie + localStorage\n    context.close()\n    return path\n\n\n@pytest.fixture\ndef auth_page(browser: Browser, auth_state: str):\n    \"\"\"每条用例一个干净的 context，但带着登录态。用例之间互不影响。\"\"\"\n    context = browser.new_context(storage_state=auth_state)\n    page = context.new_page()\n    yield page\n    context.close()\n\n\n# 用例里直接用 auth_page，不需要先跑登录用例\ndef test_buy(auth_page):\n    OrderFlow(auth_page).buy_first_product()\n```\n\n**这个方案同时解决了三件事**：\n\n1. 用例之间不依赖（每条独立 context）。\n2. 可以并行（context 隔离，session 级只有一次登录）。\n3. 跑得快（不用每条都登录）。\n\n### 4.4 方案 ③：API 造号（数据也一起解决）\n\n```python\n@pytest.fixture\ndef fresh_user(api):\n    \"\"\"每条用例一个全新账号（API 造），彻底隔离。\"\"\"\n    phone = f\"139{uuid.uuid4().hex[:8]}\"\n    api.post(\"/api/register\", json={\"phone\": phone, \"pwd\": \"P@ss1234\"})\n    return {\"phone\": phone, \"pwd\": \"P@ss1234\"}\n\n\ndef test_order_with_new_user(browser, base_url, fresh_user):\n    context = browser.new_context()\n    page = context.new_page()\n    # 用新账号登录（或用 API 换 cookie 注入）\n    ...\n```\n\n### 4.5 反模式（对照检查）\n\n| 反模式 | 后果 |\n| --- | --- |\n| 用全局变量传 token | 并行时互相覆盖 |\n| 用例按文件名顺序执行（`test_01_login`、`test_02_buy`） | 单独跑必挂，顺序一变全挂 |\n| `--lf` 只跑失败用例 | 因为依赖前置用例，单独跑根本跑不起来 |\n| session fixture 里登录 + 全局 page 复用 | 用例之间状态污染（上个用例停在别的页面） |\n\n---\n\n## 5. 自查 Q6：flaky 用例治理与重试策略\n\n### 5.1 什么是 flaky，为什么危险\n\n> 同一份代码，不做任何改动，重复执行时好时坏。\n\n**危险性不在于它挂，而在于它会消耗信任**：\n\n```\n第 1 次：挂了 → 查看 → 发现是 flaky\n第 2 次：挂了 → 查看 → 又是 flaky\n第 3 次：挂了 → 不看了，直接重跑\n第 10 次：挂了 → 真 bug 也被当成 flaky\n```\n\n**所以 flaky 率是个质量指标，不是\"修不修都行\"的东西。** 行业经验：超过 1~2%，团队就会开始无视失败。\n\n### 5.2 归因（这一步决定能不能修）\n\n| 类别 | 占比（经验） | 表现 | 修法 |\n| --- | --- | --- | --- |\n| **等待不足** | 最大 | 偶发\"元素找不到/点不到\" | 换条件等待，禁 sleep |\n| **数据污染** | 大 | 偶发\"数据已存在/已被使用\" | 数据隔离 + 前置清理 |\n| **选择器不稳** | 中 | 匹配到多个元素、匹配到隐藏元素 | 加 testid、加 `.first` 前先确认唯一 |\n| **环境抖动** | 中 | 第三方慢、服务冷启动、CI 机器慢 | 环境检查 + 合理的超时 |\n| **真 bug（间歇）** | 少但重要 | 并发问题、时序问题 | **这才是要提的缺陷** |\n\n**怎么归因**：给 flaky 用例打 tag，连续记录 5 次失败时的现场（截图 + Trace），看是否同一原因。**不同原因的\"偶发\"要分开修**。\n\n### 5.3 治理流程（四步）\n\n```\n① 登记：所有 flaky 用例进清单（用例名 + 首次发现时间 + 失败率 + Owner）\n② 分类：按 §5.2 归因\n③ 修复：数据 > 等待 > 选择器（按影响面排序，能自动化的先自动化）\n④ 监控：每周统计 flaky 率，超阈值（如 1%）的模块要专项治理\n```\n\n### 5.4 重试策略：怎么开才不掩盖问题\n\n**允许重试的三类**：\n\n```\n1. 第三方依赖的已知不稳定（支付回调、短信、第三方登录）\n2. 环境抖动，有监控证实的（CI 机器负载高、服务冷启动）\n3. 已登记 flaky 且已定位到原因、正在修（带期限）\n```\n\n**绝不允许**：\n\n```\n× 全局 --reruns 3（让所有失败都重试）\n× 没有登记就重试\n× 重试成功就算通过，不留记录\n```\n\n### 5.5 留痕式重试（关键实现）\n\n```ini\n# pytest.ini —— 不全局开，靠标记\n[pytest]\naddopts = -ra --strict-markers\nmarkers =\n    flaky: 已知不稳定，允许重试（必须有 JIRA 号）\n```\n\n```python\nimport pytest\n\n@pytest.mark.flaky(reruns=2, reason=\"JIRA-1234 第三方支付沙箱不稳定\")\ndef test_pay_with_third_party(auth_page):\n    ...\n```\n\n**重试要能统计出来**（这是\"不掩盖问题\"的关键实现）：\n\n```python\n# conftest.py —— 记录哪些用例是靠重试才过的\nRETRIED = []\n\n\ndef pytest_runtest_logreport(report):\n    # pytest-rerunfailures 会在 outcome 里标记 rerun\n    if report.outcome == \"rerun\":\n        RETRIED.append(report.nodeid)\n    if report.outcome == \"passed\" and report.nodeid in RETRIED:\n        RETRIED.append(f\"PASSED_ON_RETRY:{report.nodeid}\")\n\n\ndef pytest_sessionfinish(session, exitstatus):\n    on_retry = [r for r in RETRIED if str(r).startswith(\"PASSED_ON_RETRY:\")]\n    if on_retry:\n        print(f\"\\n⚠️ 以下 {len(on_retry)} 条用例是靠重试才通过的（需登记治理）：\")\n        for r in on_retry:\n            print(\"  -\", str(r).split(\":\", 1)[1])\n```\n\n```bash\n# 或者直接用 pytest-rerunfailures 的报告能力\npytest --reruns 2 --reruns-delay 3 -ra\n# 报告里会显示 RERUN 状态\n```\n\n### 5.6 三个指标（用来证明治理有效）\n\n| 指标 | 算法 | 目标 |\n| --- | --- | --- |\n| flaky 率 | 重试后才通过的用例数 / 总用例数 | < 1% |\n| 平均修复时长 | flaky 从登记到关闭的天数 | < 7 天 |\n| 重试占比 | 有 reruns 标记的用例 / 总用例 | < 5% |\n\n### 5.7 答题话术\n\n> flaky 我是当缺陷管的，不是当\"重跑就过\"处理。\n> **先登记**（用例名、失败率、Owner），**再归因**：按经验，等待不足和数据污染占大头，环境抖动次之，真 bug 最少但最重要。\n> **重试我只对三类开**：第三方已知不稳定、有监控证实的 CI 环境抖动、已登记且定位到原因的。**绝不开全局 `--reruns`**，因为那会让所有失败都被掩盖。\n> 而且**重试必须留痕**：报告里标出\"这条是靠重试才过的\"，每周统计 flaky 率。**如果一条用例重试三次才过，它不是通过了，它是告诉你有问题。**\n> 面试可以说一句判断：**flaky 率超过 2%，这个团队就开始不信自动化了，那时再多用例也等于零。**\n\n---\n\n## 6. 用例分级：控制 CI 时长\n\n| 级别 | 内容 | 频率 | 时长目标 |\n| --- | --- | --- | --- |\n| **冒烟**（`-m smoke`） | 登录 + 核心下单 1 条 + 支付跳转 | 每次提交 | < 15 分钟 |\n| **核心回归**（`-m core`） | 主要业务流程 20~30 条 | 每天夜间 | < 1 小时 |\n| **全量** | 所有 UI 用例 + 兼容性矩阵 | 每周 | 2~4 小时 |\n\n```bash\npytest -m smoke                 # 提交级\npytest -m \"core and not slow\"   # 夜间\npytest                          # 全量（周末）\n```\n\n**分级的价值**：一个 3 小时的流水线没人等，最后就变成\"下班前手动跑一次\"或者\"干脆不跑\"。\n\n---\n\n## 7. 自查 Q8：AI 生成 UI 脚本后，人工必须检查什么\n\n**10 条，按\"最容易出错\"排序：**\n\n| # | 检查项 | AI 的典型问题 | 怎么改 |\n| --- | --- | --- | --- |\n| 1 | **选择器质量** | 爱用 `nth-child`、绝对 XPath、按文案匹配 | 换成 `get_by_test_id` / `get_by_role` |\n| 2 | **选择器唯一性** | 给的选择器匹配到多个元素（或匹配到隐藏的那个） | 用 Playwright 的 `locator.count()` 确认是 1 |\n| 3 | **断言是否存在且有意义** | 只 `assert page.url` 或断言页面标题 | 补业务断言：成功提示、数据变化、状态 |\n| 4 | **有没有等待** | 要么没有等待，要么写死 `wait_for_timeout(3000)` | 换成条件等待 / `expect` 轮询 |\n| 5 | **API 方法名和参数是否真实存在** | 幻觉：`page.get_by_role(\"button\")` 参数写错、用了不存在的链式方法 | 逐个方法对照官方文档，跑一遍才信 |\n| 6 | **前置状态假设** | 假设\"已登录\"\"购物车已有商品\"，但脚本里没准备 | 用 fixture（`auth_page`）显式声明前置 |\n| 7 | **测试数据是否硬编码** | 写死 `qa01`、写死商品名、写死订单号 | 抽到配置/fixture，用唯一数据 |\n| 8 | **用例是否独立** | 写成线性脚本，后一条依赖前一条 | 每条独立成函数，用 fixture 提供状态 |\n| 9 | **清理是否缺失** | 造的数据不删 | 补 teardown |\n| 10 | **覆盖范围是否只有正向** | 只生成 happy path | 按六维框架补异常/边界/权限 |\n\n**三条最重要的（时间不够就只看这三条）**：\n\n```\n① 选择器稳不稳（会不会一改版就崩）\n② 断言有没有真的验证业务（还是只验证\"页面打开了\"）\n③ 等待是不是 sleep（还是条件等待）\n```\n\n**一句话总结**：\n\n> AI 生成 UI 脚本，等于省了\"敲键盘\"的时间，但**质量的三件事它都不管**：选择器稳定性、断言有效性、等待方式。所以我会把它当\"初稿\"而不是\"代码\"，**先跑一遍，再用 Trace 看它卡在哪一步** —— 通常第一步就卡在它编的选择器上。\n\n---\n\n## 8. 动手清单\n\n- [ ] 把一条写在一个文件里的用例拆成 Locator / Page / Flow 三层，数一下拆完的代码行数变化。\n- [ ] 配一次失败现场五件套（截图 + HTML + console + Trace），用一次真实失败验证能不能定位。\n- [ ] 用 `storage_state` 把登录态复用起来，看全量耗时降多少。\n- [ ] 统计最近的失败，按\"等待/数据/选择器/环境/真 bug\"分类，算一下 flaky 率。\n- [ ] 让 AI 生成一条 UI 用例，用 §7 的 10 条清单逐条审，记录命中几条。\n","chars":5513,"codes":23,"tables":13}]},{"name":"七、性能测试","articles":[{"id":"perf-design","title":"性能测试设计篇","desc":"五种目标/八步方法论/QPS-TPS/P95-P99/利特尔法则","file":"测试开发-性能测试设计篇.md","content":"# 测试开发-性能测试设计篇\n\n> 对应清单：压测目标分类、压测方法论、常见工具、核心指标【全部必须掌握】\n> 对应自查：Q1（P95/P99 与为什么不用均值）、Q2（三种模型分别验证什么）、Q3（QPS 与 TPS 的区别）\n> 说明：瓶颈定位、监控、调优、报告在《性能监控与调优篇》。本篇只管**\"怎么压得对\"**。\n> 立场：性能测试的产出不是一串数字，是**\"在什么条件下，系统能扛多少，卡在哪\"**。数字没有前提就是耍流氓。\n\n---\n\n## 0. 先定位：性能测试最容易错的地方\n\n| 常见错误 | 后果 |\n| --- | --- |\n| 没定目标就开始压 | 压出 800 QPS，但没人知道这算好还是差 |\n| 只压单接口，不考虑混合比例 | 结论不可用（真实流量是读多写少） |\n| 数据量不对（测试库 1000 条，线上 1 亿） | SQL 走索引和全表扫描是两个世界 |\n| 压测机和被测服务同机 | 互相抢 CPU，结论全错 |\n| 只看平均响应时间 | 平均值掩盖长尾，用户体感是 P99 |\n| 环境没和生产等比，也不说明差异 | 结论不可迁移，等于白压 |\n\n自查分级：\n\n| 内容 | 档位 | 说明 |\n| --- | --- | --- |\n| 五种目标与对应模型 | 熟练 | 决定压测方案 |\n| 场景设计（比例、数据量） | 熟练 | 决定结论有效性 |\n| 并发数怎么算（利特尔法则） | 熟练 | 面试常问\"并发怎么定\" |\n| QPS/TPS/P95/P99 | 熟练 | 必须能讲清 |\n| 工具选型 | 熟练一个 | JMeter 或 locust |\n| 拐点识别 | 会用 | 容量结论的来源 |\n\n---\n\n## 1. 五种压测目标：模型完全不同\n\n**这是本篇最重要的认知**：目标不同，脚本、模型、指标、结论都不一样。**先问\"这次要回答什么问题\"，再动手。**\n\n### 1.1 目标 → 模型对照表\n\n| 目标 | 要回答的问题 | 模型 | 关键指标 | 结论产出 |\n| --- | --- | --- | --- | --- |\n| **容量验证** | 这个接口/链路能扛多少 QPS？ | **阶梯加压**（每级稳定 3~5 分钟） | 吞吐拐点、P99 拐点 | 当前容量 X QPS（拐点的 70~80%） |\n| **峰值模拟** | 大促/秒杀扛得住吗？ | **定时突击（spike）**：1 秒内从 0 到峰值 | 峰值期间的错误率、超时率、恢复时间 | 峰值 QPS 达标/不达标，有无雪崩 |\n| **稳定性** | 长时间跑会不会泄漏/退化？ | **恒定中高压**，持续 4~24 小时 | 内存 RSS 曲线、连接数、GC 频率、P99 漂移 | 无泄漏/有泄漏，退化程度 |\n| **限流降级验证** | 触发限流/熔断后的行为对不对？ | **越过阈值的定向压测**（阈值 × 1.5~3 倍） | 429 比例、被限的是谁、降级是否生效 | 限流准确、降级符合预期 |\n| **瓶颈定位** | 慢在哪一层？ | **定向单层压测**（只压一个接口/只打 DB） | 分层耗时、资源水位 | 瓶颈点 + 证据 |\n\n### 1.2 每种目标的具体做法\n\n**① 容量验证（最常用）**\n\n```\n并发：50 → 100 → 200 → 400 → 800（每级 3~5 分钟）\n观察：每级稳定后的 QPS、P99、错误率、CPU\n判据：QPS 不再线性增长 且 P99 陡增 → 拐点\n```\n\n**关键纪律**：**每级必须\"稳定后再升\"**。上一级还没稳就升，测的是混合态，数据没法用。\n\n**② 峰值模拟（大促/秒杀）**\n\n```\n模型：15 分钟内维持峰值（不是 1 秒），或\"0→峰值\"瞬间拉起\n关注：不是平均 QPS，是\"峰值期间错误率\"和\"恢复时间\"\n典型缺陷：队列积压后恢复不过来、连接池打满后不释放、缓存击穿\n```\n\n**这里要区分两个东西**：\n\n| | 峰值 QPS | 峰值持续时间 |\n| --- | --- | --- |\n| 秒杀 | 极高（万级） | 极短（秒级） |\n| 大促 | 高（千级） | 长（小时级） |\n\n两者的模型完全不同：秒杀看\"能不能顶住一瞬间 + 快速失败是否友好\"，大促看\"长时间高位运行是否退化\"。\n\n**③ 稳定性（长跑）**\n\n```\n模型：恒定在容量的 60~70%，持续 8~24 小时\n关注：RSS 是否单调上涨、连接数是否上涨、P99 是否随时间劣化\n判据：停压后指标能否回落（不回落 = 泄漏）\n```\n\n**④ 限流降级验证**\n\n```\n模型：把 QPS 打到限流阈值的 1.5~3 倍\n关注：429 的比例是否≈超出部分、被限的是哪些请求（是不是误伤正常用户）、\n      熔断后响应时间是否骤降、降级返回是否可接受\n```\n\n**⑤ 瓶颈定位（定向）**\n\n```\n模型：只压一个接口，或只压 DB（用 SQL 直接压）\n用途：已经知道整体慢，要确认是应用层、DB 层还是下游\n```\n\n---\n\n## 2. 压测方法论：八步\n\n### 2.1 八步与每步的产物\n\n| # | 步骤 | 做什么 | 产物 | 最容易跳过的 |\n| --- | --- | --- | --- | --- |\n| 1 | **定场景** | 压哪些接口、读写比例、数据规模 | 场景清单 + 流量模型 | 只压单接口，没有混合比例 |\n| 2 | **定模型** | 并发数、think time、时长、加压方式 | 压测计划 | 并发数靠猜 |\n| 3 | **备环境** | 环境等比、数据预热、监控就位 | 环境差异说明 | 不预热（冷启动数据全错） |\n| 4 | **执行观察** | 从低到高逐级加压，每级稳定 | 原始数据 | 直接上最高并发 |\n| 5 | **找拐点** | 吞吐不再涨、RT 陡增的点 | 容量结论 | 只看最高值，不看拐点 |\n| 6 | **定位瓶颈** | 分层对照监控 | 瓶颈 + 证据 | 只报\"慢\"，不报\"慢在哪\" |\n| 7 | **出报告** | 场景、模型、指标、证据、结论 | 报告 | 结论没有边界 |\n| 8 | **复测验证** | 优化后同模型再压 | 优化前后对比 | 优化了但没复测 |\n\n### 2.2 第 1 步：定场景（决定结论的有效性）\n\n**三个必须定的东西**：\n\n| 要素 | 例子 | 错了会怎样 |\n| --- | --- | --- |\n| **压哪些接口** | 只压 `/api/orders`（下单） vs 压首页+详情+下单+支付 | 单接口结论不能代表链路 |\n| **混合比例** | 读:写 = 8:2；首页:详情:下单 = 50:30:20 | 全压写接口 → 结论不可用 |\n| **数据规模** | 订单表 1 亿行 vs 1000 行 | SQL 执行计划完全不同 |\n\n**数据规模这一条最容易被忽略，也最致命**：\n\n```\n测试库：orders 表 5000 行 → 查询走索引，20ms\n生产库：orders 表 8000 万行 → 同样的 SQL 可能走错索引或回表，2s\n```\n\n**做法**：压测前把数据造到目标规模（用 SQL 批量造，或用生产脱敏数据）。**造数据脚本要能重复执行、能清理。**\n\n```sql\n-- 造 500 万条订单（分批插入，别一次 INSERT 500 万）\nINSERT INTO orders (order_no, user_id, status, amount, created_at)\nSELECT CONCAT('O-PERF-', n), FLOOR(1 + RAND() * 100000), 'PAID', ROUND(RAND()*1000, 2),\n       DATE_SUB(NOW(), INTERVAL FLOOR(RAND()*365) DAY)\nFROM (\n  SELECT @row := @row + 1 AS n\n  FROM information_schema.columns a, information_schema.columns b\n  LIMIT 5000000\n) t, (SELECT @row := 0) r;\n```\n\n### 2.3 第 2 步：定模型（并发数怎么算，不是猜的）\n\n**利特尔法则（Little's Law）这是\"并发怎么定\"的正确答案**：\n\n```\n并发数 N = 吞吐量 X × 平均响应时间 R\n\n例：目标 500 QPS，平均响应时间 200ms(0.2s)\nN = 500 × 0.2 = 100 并发\n```\n\n**反过来也成立**：如果 100 并发跑出 500 QPS，那平均响应时间必然是 200ms。\n\n**think time 的影响**（很多人搞不清）：\n\n```\n有思考时间（模拟真人）：\n  一个用户 10 秒里只发 1 个请求 → 1 个并发用户 ≈ 0.1 QPS\n  要达到 500 QPS，需要 5000 个\"虚拟用户\"\n\n无思考时间（纯压接口）：\n  1 个并发 ≈ 1/RT QPS（RT=200ms → 1 个并发 = 5 QPS）\n  要达到 500 QPS，需要 100 个并发\n```\n\n**面试要点**：说\"并发数\"时必须说清是**虚拟用户数（带 think time）**还是**并发请求数（无 think time）**，否则数字没有意义。\n\n| 参数 | 常用值 | 说明 |\n| --- | --- | --- |\n| think time | 1~3 秒（业务操作）/ 0（纯接口） | 按真实用户行为定 |\n| 加压方式 | 阶梯（每级 3~5 分钟） | 找拐点 |\n| 单级时长 | ≥ 3 分钟 | 太短测到的是冷启动和 JIT 预热 |\n| 总时长 | 30 分钟~8 小时 | 按目标定 |\n\n### 2.4 第 3 步：备环境（不备就是白压）\n\n| 项 | 要求 | 做不到时 |\n| --- | --- | --- |\n| 压测机与压测服务分离 | **必须** | 否则互相抢 CPU，结论作废 |\n| 应用配置与生产等比 | CPU/内存/实例数 | 记下差异，报告里写明\"缩小 N 倍\" |\n| 数据规模接近生产 | 至少百万级 | 记下差异，结论标注\"该数据规模下\" |\n| **数据预热** | 先跑 3~5 分钟低负载 | 不做会把 JIT 编译、连接池建立、缓存冷启动算进指标 |\n| 监控就位 | 四层监控全部打开 | 没有监控的压测只能出数字，出不了结论 |\n| 限流阈值确认 | **先问清限流配置** | 否则压到 200 QPS 就被限了，误以为到顶 |\n\n**最后一条特别重要**：压测前必须确认\"网关/应用有没有限流、阈值多少\"。**把限流当成性能瓶颈是最常见的误判。**\n\n---\n\n## 3. 工具选型（必须掌握一个）\n\n| 工具 | 语言/形态 | 特点 | 什么时候选 |\n| --- | --- | --- | --- |\n| **JMeter** | GUI + XML 脚本 | 企业最常见、协议支持广、插件多 | **求职通用性最高**；需要压各种协议 |\n| **k6** | JS 脚本 | 开发者体验好、CI 友好、单机性能强 | 开发型团队、要进 CI |\n| **Locust** | Python 脚本 | 建模灵活、写复杂用户行为方便 | **Python 技术栈**、要写复杂场景 |\n| **Gatling** | Scala/Java DSL | 性能好、报告漂亮 | JVM 团队 |\n\n**给测开的选择建议**：\n\n```\n面试/通用 → JMeter（问的都是它）\n自己做工具链 → Locust（和 pytest/Python 同栈，好维护）\n性能极限 → k6 / wrk（单机能压更高）\n```\n\n### 3.1 Locust 最小可用示例\n\n```python\n# locustfile.py\nfrom locust import HttpUser, task, between, tag\n\n\nclass ShopUser(HttpUser):\n    wait_time = between(1, 3)                      # think time：1~3 秒（模拟真人）\n    host = \"http://perf.test.example.com\"\n\n    def on_start(self):\n        \"\"\"每个虚拟用户启动时登录一次。\"\"\"\n        r = self.client.post(\"/api/login\", json={\"user\": \"perf01\", \"pwd\": \"P@ss1234\"})\n        self.token = r.json()[\"data\"][\"token\"]\n        self.client.headers[\"Authorization\"] = f\"Bearer {self.token}\"\n\n    @tag(\"read\")\n    @task(8)                                       # 权重 8：读多\n    def view_order(self):\n        self.client.get(\"/api/orders/O-PERF-000001\", name=\"/api/orders/[no]\")\n\n    @tag(\"write\")\n    @task(2)                                       # 权重 2：写少 → 读写比 8:2\n    def create_order(self):\n        self.client.post(\"/api/orders\", json={\"sku_id\": 1001, \"num\": 1})\n```\n\n```bash\nlocust -f locustfile.py --headless -u 100 -r 10 -t 10m\n# -u 100：100 个虚拟用户\n# -r 10：每秒启动 10 个\n# -t 10m：跑 10 分钟\n```\n\n**两个关键用法**：\n\n- **`@task(8)` / `@task(2)` 做混合比例** —— 这是\"场景\"的落地方式。\n- **`name=` 参数统一 URL 模板** —— 否则 `/orders/O-001` 和 `/orders/O-002` 会被统计成两个接口，报告爆炸。\n\n### 3.2 k6 示例（对比一下写法）\n\n```javascript\n// k6.js\nimport http from 'k6/http';\nimport { check, sleep } from 'k6';\n\nexport const options = {\n  stages: [\n    { duration: '2m', target: 50 },\n    { duration: '3m', target: 100 },\n    { duration: '3m', target: 200 },\n    { duration: '3m', target: 0 },\n  ],\n  thresholds: {\n    http_req_duration: ['p(95)<500'],\n    http_req_failed: ['rate<0.01'],\n  },\n};\n\nexport default function () {\n  const res = http.get('http://perf.test.example.com/api/orders/O-PERF-000001');\n  check(res, { 'status 200': (r) => r.status === 200 });\n  sleep(1);                       // think time\n}\n```\n\n```bash\nk6 run k6.js\n```\n\n---\n\n## 4. 核心指标：四个必须能讲清\n\n### 4.1 吞吐量：QPS vs TPS\n\n| 指标 | 定义 | 例子 |\n| --- | --- | --- |\n| **QPS** | 每秒**请求数**（HTTP 层面） | 500 次/秒的 HTTP 请求 |\n| **TPS** | 每秒**事务数**（业务层面） | 100 笔/秒的下单业务 |\n\n**一个事务可以包含多个请求**，所以：\n\n```\nTPS × 每事务请求数 = QPS\n100 TPS × 4 请求/事务 = 400 QPS\n```\n\n**自查 Q3 的标准答案**：下单事务包含 4 个请求（查库存、建订单、扣库存、发消息），TPS 100 时 **QPS ≈ 400**。\n\n**为什么要分**：\n\n| 场景 | 该用哪个 |\n| --- | --- |\n| 讨论接口层面的压力 | QPS |\n| 讨论业务产能（一天多少单） | TPS |\n| 看网关/负载均衡的连接压力 | QPS（更准） |\n| 汇报给业务方 | TPS（业务听得懂） |\n\n**坑**：很多工具把 \"请求数/秒\" 直接叫 TPS（比如 JMeter 的 Throughput、Locust 的 RPS），**所以看报告时必须先确认它的定义**，否则数字会差好几倍。\n\n### 4.2 响应时间：P95 / P99（自查 Q1）\n\n**分位数定义**：\n\n| 指标 | 含义 | 怎么读 |\n| --- | --- | --- |\n| P50（中位数） | 一半请求比它快 | 典型用户体感 |\n| P95 | 95% 的请求比它快，5% 更慢 | 大多数用户的最差体验 |\n| P99 | 99% 的请求比它快，1% 更慢 | 慢用户/长尾体验 |\n| P99.9 | 千分之一最慢 | 极端长尾（大促必看） |\n\n**为什么不能用平均值（这是 Q1 的核心）**：\n\n```\n1000 个请求：\n990 个耗时 50ms\n10 个耗时 10 秒（卡死）\n\n平均值 = (990×0.05 + 10×10) / 1000 = 0.149s ≈ 150ms   ← 看起来还行！\nP95 = 50ms（很好）\nP99 = 50~10000ms 之间（取决于分布，实际这里会直接跳到 10 秒）\n```\n\n**平均值把 10 个灾难请求平摊给了 990 个正常请求**，结果看起来\"150ms，还不错\"。但那 10 个用户可能直接走人了。\n\n**更关键的原因（三条）**：\n\n1. **平均值假设分布对称，但响应时间是长尾分布**（大部分快，少数极慢），均值没有代表性。\n2. **平均值会掩盖\"部分用户很慢\"**。多实例部署时，某个实例有问题 → 30% 请求慢，平均值只涨一点，P99 会爆。\n3. **业务目标本身就是分位数的**：\"95% 的用户在 1 秒内看到结果\" —— 这直接就是 P95 的定义。\n\n**回答时补一句**：所以性能目标一般写\"**P95 < 500ms，P99 < 1s，错误率 < 0.1%**\"，而不是\"平均响应时间 < 300ms\"。\n\n### 4.3 错误率：必须分开统计\n\n```\nHTTP 错误（5xx / 4xx）\n业务错误（code != 0）\n超时\n连接失败\n被限流（429）\n```\n\n**为什么要分**：它们的含义完全不同 ——\n\n| 类型 | 说明 | 处理 |\n| --- | --- | --- |\n| 5xx | 服务端异常（真 bug） | 必查 |\n| 429 | 限流生效（不是 bug） | 说明压力超阈值，调模型 |\n| 超时 | 服务处理不过来 | 与 RT 一起看 |\n| 业务错误 | 数据/规则问题（如库存不足） | 压测数据准备的问题 |\n\n**一个常见误判**：压测报了 3% 错误率，看下来全是\"库存不足\"——你的造数据不够，不是性能问题。\n\n### 4.4 资源与依赖指标\n\n| 层 | 指标 |\n| --- | --- |\n| 应用 | CPU、内存、线程数、连接数、GC 次数/耗时、队列长度 |\n| 数据库 | QPS、慢查询数、连接数、锁等待、InnoDB 缓冲池命中率 |\n| 缓存 | 命中率、内存使用、连接数、慢命令 |\n| 中间件 | MQ 积压、下游接口耗时 |\n| 网络 | 带宽、TCP 连接数、TIME_WAIT |\n\n---\n\n## 5. 自查清单逐条作答（Q1–Q3）\n\n### Q1. P95 和 P99 代表什么？为什么性能目标定在分位数而不是均值？\n\n| 指标 | 含义 |\n| --- | --- |\n| P95 | 95% 的请求在这个时间内完成；**有 5% 的用户比它慢** |\n| P99 | 99% 的请求在这个时间内完成；**有 1% 的用户比它慢**（长尾） |\n\n**为什么不用均值（三条理由）**：\n\n1. **长尾分布**：响应时间不是正态分布，是\"大部分快 + 少数极慢\"。均值被极端值拉高或被大量正常值稀释，两种情况都失真。\n2. **掩盖问题**：1000 个请求里 10 个卡了 10 秒，平均值只有 150ms，看起来很好；但那 10 个用户已经走了。**P99 会直接暴露这 10 个。**\n3. **业务目标本身就是分位数**：\"95% 用户 1 秒内完成\"就是 P95 的定义。\n\n**加分点**：我会同时看 P50/P95/P99 —— **P50 看典型体验，P95 看大多数人的最差体验，P99 看长尾和稳定性**。如果 P50 很好但 P99 很高，说明有\"偶发的慢请求\"，通常是 GC、锁等待、连接池排队、缓存未命中等原因，这类问题在平均值里完全看不见。\n\n### Q2. 阶梯加压、恒定负载、峰值突击分别验证什么？\n\n| 模型 | 曲线 | 验证什么 | 结论产物 |\n| --- | --- | --- | --- |\n| **阶梯加压** | 每级增加并发，稳定后升 | **容量拐点**：吞吐何时不再涨、RT 何时陡增 | 当前容量 = 拐点的 70~80% |\n| **恒定负载** | 固定并发跑数小时 | **稳定性**：内存/连接/RT 是否随时间劣化 | 有/无泄漏，退化程度 |\n| **峰值突击** | 瞬间拉到峰值 | **抗突发能力**：能否顶住、是否雪崩、恢复多快 | 峰值达标性 + 恢复时间 |\n\n**再补一句区分**（显得懂行）：\n\n> 阶梯加压回答\"能扛多少\"，恒定负载回答\"能扛多久\"，峰值突击回答\"突然来这么多会怎样\"。三者不能互相替代：\n> 一个系统可能容量很高但跑 8 小时就内存泄漏；也可能容量一般但抗突发很好（有排队和限流）。\n> 还有一种模型是**定向压测**——只压一个接口或只压 DB，用来定位瓶颈，不是用来出容量结论的。\n\n### Q3. QPS 和 TPS 的区别？下单事务包含 4 个请求，TPS 100 时 QPS 大约多少？\n\n**区别**：\n\n> QPS 是**请求**层面的每秒数量（HTTP 请求），TPS 是**事务**层面的每秒数量（一个完整业务动作）。\n> 一个事务通常包含多个请求，所以 **QPS = TPS × 每事务请求数**。\n\n**计算**：\n\n> 下单事务包含 4 个请求，TPS 100 → **QPS ≈ 400**（前提是这 4 个请求都打在被统计的链路上）。\n\n**要补的三点**（这是区分水平的地方）：\n\n1. **如果这 4 个请求里有缓存命中或异步**，实际打到后端的请求数会更少。\n2. **看报告先确认工具的口径**：JMeter 的 Throughput、Locust 的 RPS 都是\"请求/秒\"，标着 TPS 但实际是 QPS，**数字会差几倍**。\n3. **汇报时用哪个看对象**：对业务方说 TPS（一天能下多少单），对技术方说 QPS（网关和服务的压力），对压测工具说 RPS。\n\n---\n\n## 6. 动手清单\n\n- [ ] 用利特尔法则算一次：目标 QPS 和实测 RT，反推需要的并发数，再对比你实际用的并发。\n- [ ] 把一条只压单接口的脚本改成 8:2 混合场景，看结论变化。\n- [ ] 压测前先查一次限流配置，确认你压的 QPS 没被限流截断。\n- [ ] 造一次大数据量（百万级），对比同样 SQL 在 1000 行和百万行下的耗时。\n","chars":5824,"codes":17,"tables":16},{"id":"perf-monitor","title":"性能监控与调优篇","desc":"四层监控/瓶颈证据/慢 SQL 优化/内存泄漏","file":"测试开发-性能监控与调优篇.md","content":"# 测试开发-性能监控与调优篇\n\n> 对应清单：监控与瓶颈定位【必须掌握】+ 稳定性与混沌工程【了解即可】+ 性能测试报告【必须掌握】\n> 对应自查：Q4（吞吐上不去但 CPU 闲）、Q5（服务瓶颈 vs 压测机瓶颈）、Q6（慢 SQL 的优化方向）、Q7（报告六个部分）、Q8（8 小时内存缓慢上涨）\n> 说明：压测目标、模型、指标定义、QPS/TPS/P95/P99 在《性能测试设计篇》。本篇只管**\"看出问题、定位到层、写清楚\"**。\n\n---\n\n## 0. 先定位：为什么\"没有监控的压测没价值\"\n\n| 只有数字 | 有监控 |\n| --- | --- |\n| \"压到 300 QPS，P99 2s\" | \"压到 300 QPS，P99 2s，**原因是 DB 连接池等待 800ms**\" |\n| 无法判断还能不能优化 | 知道优化哪里、能优化多少 |\n| 结论不可复用 | 结论带条件和证据，能指导扩容/改架构 |\n\n**一句话**：压测数字回答\"多少\"，监控回答\"为什么\"。**只有前者的报告不能叫性能报告，只能叫压测日志。**\n\n自查分级：\n\n| 内容 | 档位 | 说明 |\n| --- | --- | --- |\n| 四层监控模型 | 熟练 | 定位的骨架 |\n| 响应慢排查顺序 | 熟练 | 决定你查多快 |\n| 区分压测机/服务瓶颈 | 熟练 | 最容易搞错 |\n| 慢 SQL 优化方向 | 会用 | 不止加索引 |\n| 内存上涨的确认方法 | 会用 | 稳定性必用 |\n| 报告六部分 | 熟练 | 交付物 |\n\n---\n\n## 1. 四层监控模型（定位的骨架）\n\n```\n① 压测机 ──▶ ② 网关/负载均衡 ──▶ ③ 应用服务 ──▶ ④ 依赖（DB/缓存/MQ/下游）\n```\n\n| 层 | 看什么 | 工具 |\n| --- | --- | --- |\n| ① 压测机 | CPU、网络、TIME_WAIT、端口、工具自身报错 | `top`、`vmstat`、`ss -s`、工具日志 |\n| ② 网关 | 连接数、429 计数、upstream 耗时、错误分布 | Nginx access/error log、网关监控 |\n| ③ 应用 | 线程池活跃数、GC、CPU、接口耗时分布 | `top -H`、`jstack`/`py-spy`、APM、JVM 监控 |\n| ④ 依赖 | 慢 SQL、连接池等待、Redis 命中率、MQ 积压 | 慢查询日志、连接池监控、Redis `INFO`、MQ 控制台 |\n\n**为什么要分层**：因为**瓶颈一定在某一层，而且表现为\"上一层等下一层\"**。请求在应用层排队，往往是因为它等 DB；DB 慢，往往是因为锁或没走索引。\n\n---\n\n## 2. 响应慢的排查顺序（清单给的顺序，展开成动作）\n\n```\n第 0 步：先确认不是压测脚本自己的问题（客户端瓶颈）      ← 最容易跳过\n第 1 步：应用线程是否耗尽 / 是否都在等同一个东西\n第 2 步：GC 是否频繁 / 是否有长 STW\n第 3 步：数据库慢 SQL / 锁等待 / 连接池等待\n第 4 步：外部依赖（下游接口、Redis、MQ）\n第 5 步：网络（带宽、连接数、TIME_WAIT）\n```\n\n### 2.1 第 1 步：看线程在干什么（最有效的一招）\n\n**Java**：\n\n```bash\n# 抓 3 次线程栈，间隔 5 秒，对比看线程卡在哪\njstack -l <pid> > stack1.txt\nsleep 5 && jstack -l <pid> > stack2.txt\nsleep 5 && jstack -l <pid> > stack3.txt\n\n# 统计线程状态分布\ngrep -A1 \"java.lang.Thread.State\" stack1.txt | grep \"State\" | sort | uniq -c\n\n# 找 BLOCKED 的线程（在等锁）\ngrep -B2 \"BLOCKED\" stack1.txt | head -40\n\n# 在线分析（推荐）：arthas\narthas-boot.jar\n# 进去后：\nthread -n 5            # CPU 最高的 5 个线程\nthread -b              # 直接找阻塞其他线程的锁\n```\n\n**Python**：\n\n```bash\npip install py-spy\npy-spy dump --pid <pid>          # 所有线程当前栈\npy-spy top --pid <pid>           # 实时看哪个函数占 CPU\npy-spy record -o profile.svg --pid <pid> --duration 30    # 火焰图\n```\n\n**怎么读**：\n\n| 现象 | 含义 |\n| --- | --- |\n| 大量线程 `BLOCKED` 在同一把锁 | 锁竞争（应用层串行化） |\n| 大量线程 `WAITING` 在 `pool.getConnection` / `socketRead` | 等连接池 / 等 DB / 等下游 |\n| 线程池满了但线程都在 `RUNNABLE` 算东西 | CPU 密集（序列化、正则、加密） |\n| 线程数很少，但请求排队 | **线程池配置太小**（不是慢，是并发不够） |\n\n### 2.2 第 2 步：GC\n\n```bash\n# 开 GC 日志（Java 8）\n-XX:+PrintGCDetails -XX:+PrintGCDateStamps -Xloggc:gc.log\n\n# 看频率和停顿\ngrep -c \"Full GC\" gc.log\n# 或在线看\njstat -gcutil <pid> 1000\n```\n\n判断：**Full GC 频率高（比如每分钟几次）或单次 STW > 1s，就是瓶颈候选**。表现为 P99 突然冒尖、且和 GC 时间点吻合。\n\n### 2.3 第 3 步：数据库（下一节展开）\n\n### 2.4 第 4、5 步：依赖和网络\n\n| 现象 | 查法 |\n| --- | --- |\n| 下游慢 | 链路追踪（SkyWalking/Jaeger/OpenTelemetry）看 span 耗时 |\n| Redis 慢 | `redis-cli --latency`、`SLOWLOG GET` |\n| MQ 积压 | 消费组 LAG |\n| 网络带宽满 | `iftop` / `nload` / 监控的网卡流量 |\n| 连接数打满 | `ss -s`、`ss -tan | wc -l` |\n\n---\n\n## 3. 自查 Q4：吞吐量上不去但 CPU 很闲，排查顺序\n\n**这个现象的本质：请求在\"等\"，而不是在\"算\"。** CPU 闲 = 没在计算 = 时间花在等待上。\n\n### 3.1 五类\"等\"\n\n| 等什么 | 典型证据 |\n| --- | --- |\n| 等锁 | 线程栈大量 `BLOCKED`；DB 锁等待 |\n| 等 IO | 磁盘 `iostat` 的 `%util` 高、`wa` 高 |\n| 等连接池 | 线程栈卡在 `getConnection`；连接池 `active` 到上限 |\n| 等下游/DB | 线程栈卡在 `socketRead`；下游 span 耗时长 |\n| 等\"并发不够\" | 线程数没到上限但请求排队（线程池太小） |\n\n### 3.2 排查顺序（可直接照做）\n\n```\n① 先排除压测机（见 Q5）—— 别在服务端白查一小时\n② 看线程栈（jstack 抓 3 次 / py-spy dump）\n     大量 BLOCKED          → 锁竞争\n     大量 WAITING socketRead → 等 DB/下游\n     线程池满 + 都在 RUNNABLE → 不对，CPU 该高才对，说明是 IO 等待\n③ 数线程数\n     活跃线程数 == 最大线程数 且队列有积压 → 线程池太小（并发上限）\n④ 查连接池\n     连接池 active 达到 max，获取等待时间 > 0 → 连接池太小或连接没释放\n⑤ 查 DB\n     慢查询数、锁等待、Threads_running\n⑥ 查 GC\n     Full GC 频繁 → 停顿导致吞吐下降（但通常 CPU 会高，因为 GC 线程占 CPU）\n⑦ 查限流/队列\n     429 计数、网关是否在排队\n⑧ 查下游依赖\n     链路追踪看哪个 span 最慢\n⑨ 查网络\n     带宽、TIME_WAIT、丢包（netstat -s 的 retrans）\n```\n\n### 3.3 一个高频真实原因：**线程池/连接池配小了**\n\n这是\"CPU 闲但吞吐上不去\"最常见的原因，而且很多人会忽略：\n\n```\nQPS 到 200 就上不去，CPU 15%，DB 也闲\n→ 线程栈：80 个线程全在等连接（连接池 max=20）\n→ 结论：不是性能问题，是连接池配置太小\n```\n\n**验证方法**：把连接池/线程池调大，再压一次。**如果 QPS 明显上升，就确认了。**\n\n**这也是性能测试的一个陷阱**：你测的是\"当前配置下的容量\"，不是\"这套代码的极限\"。**报告里必须写清配置**（见 §7 结论边界）。\n\n---\n\n## 4. 自查 Q5：怎么判断是服务瓶颈还是压测机瓶颈\n\n### 4.1 六个判断信号\n\n| 信号 | 指向 |\n| --- | --- |\n| 压测机 CPU 接近 100% / 单核打满 | **压测机瓶颈** |\n| 压测机网络带宽打满（`iftop` 看） | 压测机瓶颈 |\n| 压测机 `TIME_WAIT` 暴涨、端口耗尽 | 压测机（短连接太多） |\n| 压测工具日志报错（`Too many open files`、`Connection reset`） | 压测机 |\n| **服务端 CPU/内存/线程池都很低，但 QPS 上不去** | 大概率压测机（或链路中间件） |\n| **客户端观测 RT ≫ 服务端记录的处理时间** | 压测机或网络 |\n\n**最硬的一条证据**：**增加一台压测机后 QPS 上升 → 之前的瓶颈在压测机。**\n\n### 4.2 五个验证动作（按成本从低到高）\n\n```bash\n# ① 看压测机资源（30 秒）\ntop -H -p <locust_pid>\nvmstat 1 5\nss -s\niftop -i eth0                      # 带宽\n\n# ② 看端口和连接\nss -tan state time-wait | wc -l\nulimit -n                          # 文件描述符上限\n\n# ③ 对比\"客户端 RT\" vs \"服务端 RT\"\n# 服务端监控里的接口耗时如果是 100ms，而客户端看到 300ms\n# → 差的 200ms 在网络/客户端，不在服务\n```\n\n```python\n# ④ 减少脚本自身开销（很多压测脚本本身就是瓶颈）\n# 常见问题：每次请求都打日志、每次都重新登录、每次都解析大 JSON、断言过重\n# 处理：日志降到 WARN、token 复用、断言只留关键项\n```\n\n```bash\n# ⑤ 分布式压测（最权威）\n# Locust\nlocust --master\nlocust --worker --master-host=<master_ip>     # 多台机器各起一个 worker\n\n# JMeter\njmeter -n -t plan.jmx -R <ip1>,<ip2>          # 远程多机\n```\n\n### 4.3 答题话术\n\n> 我先怀疑压测机，因为这里查起来最快，而且最容易被忽略。\n> **看三个东西**：压测机的 CPU 和网络带宽、`TIME_WAIT` 和端口数、工具日志有没有报错。\n> 再做**一个交叉验证**：对比客户端观测的响应时间和服务端监控里记录的处理时间。如果客户端 300ms、服务端 100ms，那 200ms 在网络或客户端，不在服务。\n> **最硬的证据是分布式压测**：加一台压测机，QPS 上去了，就确认之前是客户端瓶颈。\n> 另外还要检查脚本本身：日志是不是打太多、有没有每条都重新登录、断言有没有做很重的 JSON 解析 —— 这些都吃压测机的 CPU。\n\n---\n\n## 5. 常见瓶颈类型与证据对照表\n\n| 瓶颈 | 现象 | 证据 | 优化方向 |\n| --- | --- | --- | --- |\n| **CPU 密集** | CPU 100%，QPS 上不去 | `top -H` 找到热点线程，火焰图 | 算法优化、减少序列化、加缓存、加机器 |\n| **锁竞争** | 线程大量 BLOCKED | 线程栈指向同一把锁 | 缩小锁范围、无锁结构、分段锁 |\n| **线程池满** | 队列积压，RT 线性上升 | 活跃线程 == max，队列长度增长 | 调大池子 or 优化单请求耗时 |\n| **连接池满** | 获取连接等待 | 池 active 到上限，等待时间 > 0 | 调大、查是否有连接泄漏 |\n| **DB 慢 SQL** | DB CPU 高/慢查询多 | 慢查询日志、`EXPLAIN` | 见 Q6 |\n| **DB 锁等待** | 偶发长尾 | `SHOW ENGINE INNODB STATUS` 的锁等待 | 缩短事务、改执行顺序 |\n| **Redis 慢** | P99 长尾 | `SLOWLOG`、命中率低 | 大 key 拆分、批量命令 |\n| **下游慢** | 应用 RT 高但自身 CPU 低 | 链路追踪 span | 超时+降级、异步化 |\n| **GC** | P99 周期性尖刺 | GC 日志时间点对齐 | 调堆大小、减少大对象 |\n| **网络** | 重传/带宽满 | `netstat -s`、`iftop` | 压缩、加带宽、减少大报文 |\n| **压测机** | 见 Q5 | 见 Q5 | 分布式、减脚本开销 |\n\n---\n\n## 6. 自查 Q6：慢 SQL 导致 P99 高，除了加索引还有什么优化方向\n\n**分五类，按\"改动成本从低到高\"排列**：\n\n### 6.1 第一类：SQL 本身（不改架构）\n\n| 方向 | 具体做法 | 例子 |\n| --- | --- | --- |\n| **先确认真的没走索引** | `EXPLAIN` 看 `key` | 可能索引有但没用上 |\n| **覆盖索引** | 让查询字段全在索引里，避免回表 | `INDEX(user_id, status, created_at)` 覆盖 `SELECT status, created_at` |\n| **索引顺序调整** | 把区分度高/等值条件放前面 | `(status, user_id)` → `(user_id, status)` |\n| **消除函数和隐式转换** | `DATE(created_at)` → 范围条件；`varchar` 别传数字 | 见《MySQL篇》§5.2 |\n| **避免 `SELECT *`** | 只取需要的列 | 减少 IO 和回表 |\n| **深分页改写** | `LIMIT 100000,20` → 游标分页 `WHERE id > ?` | 见《MySQL篇》§1.1 |\n| **拆 N+1** | 循环里查 DB → 改批量 `WHERE id IN (...)` | 接口 20 条数据发 21 次 SQL |\n| **大事务拆小** | 减少锁持有时间 | 批量更新分批提交 |\n| **减少排序** | `ORDER BY` 走索引，避免 `filesort` | 索引包含排序列 |\n\n### 6.2 第二类：数据量和访问路径\n\n| 方向 | 做法 |\n| --- | --- |\n| **缓存** | 热点数据进 Redis（读多写少） |\n| **读写分离** | 报表/列表查询走从库（注意主从延迟） |\n| **预聚合/统计表** | 报表类查询改成定时算好存表，查的时候直接读 |\n| **异步化** | 不在主链路里做的（导出、通知、积分）改成 MQ 异步 |\n| **历史数据归档** | 冷数据挪到历史表，热表变小 |\n\n### 6.3 第三类：存储结构\n\n| 方向 | 适用 |\n| --- | --- |\n| **字段类型对齐** | 避免 join 时 int 与 varchar 比较（隐式转换丢索引） |\n| **分区表** | 按时间分区，查询自动裁剪 |\n| **分库分表** | 单表过亿、写入也扛不住时（**最后手段，成本最高**） |\n| **列存/OLAP 引擎** | 报表分析类（ClickHouse/Doris） |\n\n### 6.4 第四类：连接与参数\n\n| 方向 | 说明 |\n| --- | --- |\n| 连接池参数 | 池太小 → 排队；池太大 → DB 端线程切换开销 |\n| InnoDB buffer pool | 热点数据能全放内存最好（一般设物理内存 60~70%） |\n| 慢查询阈值调低 | 先把问题暴露出来（1s → 200ms） |\n\n### 6.5 第五类：读写以外\n\n| 方向 | 说明 |\n| --- | --- |\n| SQL 审计与规范 | 上线前拦截没走索引的 SQL（可以做成 CR 检查项） |\n| 监控告警 | 慢查询数、锁等待时长 |\n\n### 6.6 答题话术（要有层次）\n\n> 加索引是最直接的一步，但**第一步应该是看 EXPLAIN 确认到底是不是索引问题** —— 很多\"慢 SQL\"其实是有索引但没用上（函数、隐式转换、最左前缀）。\n> 确认索引没问题之后，我按\"改动成本\"排：\n> **① SQL 层**：覆盖索引避免回表、改掉函数和隐式转换、去掉 `SELECT *`、深分页改游标、把 N+1 改成批量查询。\n> **② 访问路径层**：加缓存、读写分离、报表类改预聚合、非核心逻辑异步化。\n> **③ 结构层**：字段类型对齐、分区表，最后才是分库分表。\n> **④ 参数层**：连接池大小、buffer pool。\n> 还有一个容易被忽略的：**大事务拆小**，把锁持有时间降下来，长尾能明显改善。\n> 判断优先级的方法很简单：**看这个 SQL 在 P99 的慢请求里占多少**，占比最高的那个值得先改。\n\n---\n\n## 7. 自查 Q7：性能报告必备的六个部分\n\n| # | 部分 | 必须写清 | 缺了会怎样 |\n| --- | --- | --- | --- |\n| 1 | **业务场景** | 压哪些接口、混合比例、数据规模 | 不知道压的是什么，结论无意义 |\n| 2 | **模型参数** | 并发数、think time、加压方式、时长、**环境配置（与生产差异）** | 无法复现，无法判断可迁移性 |\n| 3 | **指标结果** | QPS/TPS、P50/P95/P99、错误率（分类）、资源水位、依赖指标 | 只有数字没法判断好坏 |\n| 4 | **瓶颈与证据** | 卡在哪一层、证据是什么（线程栈/慢 SQL/监控截图） | 报告变成\"压测日志\"，没有价值 |\n| 5 | **优化前后对比** | 改了什么、指标变化多少 | 无法证明优化的价值 |\n| 6 | **结论边界** | 在什么配置、什么数据规模、什么业务比例下成立 | **最容易漏，也最致命** |\n\n### 7.1 一个可以直接用的报告结构\n\n```markdown\n# 订单链路性能测试报告（2026-10-29）\n\n## 1. 结论摘要\n- 当前配置（4C8G × 2 实例）下，订单创建接口容量为 **320 QPS**\n  （P99 < 1s，错误率 0.02%），拐点出现在 400 QPS。\n- 瓶颈：**MySQL 连接池等待**（max=20，压到 400 时获取连接平均等待 620ms）。\n- 优化后（连接池调至 50）复测：容量提升到 **510 QPS**，P99 从 2.1s 降到 480ms。\n\n## 2. 测试场景\n- 接口：POST /api/orders（下单，事务含 4 个请求：查库存/建订单/扣库存/发消息）\n- 混合比例：读:写 = 8:2（读接口为查订单详情、查订单列表）\n- 数据规模：orders 表 500 万行，users 100 万行，stock 10 万行\n- 环境：与生产等比（4C8G × 2），数据量为生产的 1/10（见 §6 边界）\n\n## 3. 压测模型\n- 工具：Locust 2.x\n- 并发：50 → 100 → 200 → 400 → 800，每级稳定 5 分钟\n- think time：1~3 秒\n- 压测机：4C8G 独立机器（与测试环境分离），压测机 CPU 峰值 42%（非瓶颈）\n- 时长：阶梯共 25 分钟；稳定性另跑 8 小时（见 §5）\n\n## 4. 指标结果（400 QPS 级）\n| 指标 | 数值 |\n| --- | --- |\n| QPS | 402 |\n| TPS（下单事务） | 100 |\n| P50 / P95 / P99 | 120ms / 680ms / 2140ms |\n| 错误率 | 0.05%（均为超时） |\n| 应用 CPU | 38% |\n| DB CPU | 35%，活跃连接 20/20 |\n| 线程栈 | 80 个线程中 62 个卡在 `getConnection` |\n\n## 5. 瓶颈定位与证据\n- 现象：400 QPS 时 CPU 仅 38%，但 P99 陡增\n- 证据 1：6 次 jstack 抓取，62/80 线程状态为 WAITING 在 HikariPool.getConnection\n- 证据 2：连接池 active=20（等于 max），获取连接平均等待 620ms\n- 结论：**不是 CPU 瓶颈，是连接池容量不足导致请求排队**\n- 反证：DB 端 Threads_running 仅 3，说明 DB 本身不忙\n\n## 6. 优化与复测\n| 项 | 优化前 | 优化后 |\n| --- | --- | --- |\n| 连接池 max | 20 | 50 |\n| 容量（P99<1s） | 320 QPS | 510 QPS |\n| P99 @400 QPS | 2140ms | 480ms |\n| 应用 CPU @400 QPS | 38% | 45% |\n\n## 7. 结论边界\n- 以上结论基于：4C8G × 2 实例、orders 表 500 万行、读写 8:2、think time 1~3s。\n- **未覆盖**：数据量达 1 亿时的表现（压测数据为生产 1/10）；大促峰值突击模型；\n  多实例扩容后的线性度。\n- 建议：大促前补一次数据量与生产等比的压测；补一次 spike 模型验证。\n```\n\n### 7.2 三个写作要点\n\n1. **结论放最前面**（管理层只看第一段）。\n2. **每个数字都要带条件**（\"320 QPS @ P99<1s @ 4C8G×2\"）。\n3. **\"结论边界\"必须写** —— 这是专业度的分界线。没有边界的结论会被误用到不该用的地方。\n\n---\n\n## 8. 自查 Q8：稳定性测试跑 8 小时，内存缓慢上涨，可能是什么问题？怎么确认\n\n### 8.1 先分清\"上涨\"的两种性质\n\n| 性质 | 特征 | 是否问题 |\n| --- | --- | --- |\n| **正常增长** | 涨到某个值后**平台期稳定**，GC/重启后回落 | 不是问题（缓存预热、连接池建立） |\n| **泄漏** | **持续单调上涨**，GC 后基线越来越高，最终 OOM | **是问题** |\n\n**关键判据**：看 **GC 后的回落基线**是否一次比一次高。\n\n```\n健康的锯齿形：\n  200MB → 300MB → (GC) 210MB → 310MB → (GC) 215MB   ← 基线稳定在 ~210\n泄漏的锯齿形：\n  200MB → 300MB → (GC) 250MB → 350MB → (GC) 300MB   ← 基线在抬升\n```\n\n### 8.2 六个可能原因\n\n| # | 原因 | 特征 |\n| --- | --- | --- |\n| 1 | **真泄漏：对象被引用未释放** | 堆里某类对象数量持续增长（集合只加不减、监听器没注销、ThreadLocal 不清理） |\n| 2 | **本地缓存无上限** | 缓存大小和\"处理过的唯一 key 数\"正相关（不是业务量） |\n| 3 | **连接/句柄泄漏** | 堆不涨但 fd 数、连接数持续上涨 → 最终 `Too many open files` |\n| 4 | **队列/缓冲区积压** | 生产快于消费，队列长度单调增长 |\n| 5 | **大对象/堆外内存** | 堆内正常但 RSS 上涨（Netty DirectBuffer、mmap 文件） |\n| 6 | **日志/字符串拼接** | 大量字符串进入缓冲、日志缓冲区积压 |\n\n### 8.3 确认方法（五步，从快到慢）\n\n```bash\n# ① 看整体曲线：RSS 是否单调上涨、GC 后基线是否抬高\n#    Java：jstat -gcutil <pid> 1000 60     → 看 Old 区是否持续增长\n#    Python：psutil 记 RSS；objgraph 看对象数\n\n# ② 强制 GC 后看是否回落（区分\"缓存\"和\"泄漏\"）\njcmd <pid> GC.run             # Java\ngdb / py-spy / gc.collect()   # Python\n# 回落 = 是缓存或临时对象；不回落 = 泄漏\n\n# ③ 停压后观察 30 分钟\n#    停压后仍缓慢上涨 → 后台线程/定时任务泄漏\n#    停压后回落 → 泄漏与请求量相关\n\n# ④ 两个时间点做堆 dump，对比对象增长\njmap -dump:live,format=b,file=heap1.hprof <pid>\n# ... 跑 2 小时 ...\njmap -dump:live,format=b,file=heap2.hprof <pid>\n# 用 MAT / VisualVM 对比两个 dump 的 \"Histogram\"，看哪个类实例数暴涨\n\n# ⑤ 定位到代码\n#    Java：MAT 的 dominator tree → 找到持有者\n#    Python：tracemalloc 两个快照对比 / objgraph.show_backrefs 找谁持有\n```\n\n**Python 版（3 行定位）**：\n\n```python\nimport tracemalloc\n\ntracemalloc.start(25)\nsnap1 = tracemalloc.take_snapshot()\n# ... 跑 2 小时 ...\nsnap2 = tracemalloc.take_snapshot()\n\nfor stat in snap2.compare_to(snap1, \"traceback\")[:10]:\n    print(stat)          # 直接打出增长最多的调用栈\n```\n\n### 8.4 答题话术\n\n> 先分清是\"正常增长\"还是\"泄漏\"。**判据是 GC 后的回落基线**：如果每次 GC 后都回到同一个水平，只是峰值在涨，那是缓存预热，不是泄漏；如果基线一次比一次高，就是泄漏。\n> 然后**强制 GC 后观察**：能回落说明是缓存或临时对象；不回落说明有引用没释放。\n> 再**停压观察**：停压后还涨 → 后台线程或定时任务的问题；停压后回落 → 和请求量相关。\n> 定位手段是**两个时间点的堆 dump 对比**（MAT 看 Histogram 里哪个类实例数暴涨，再看 dominator tree 找持有者）。Python 用 `tracemalloc` 两个快照对比，直接打出增长的调用栈。\n> 常见根因，按出现频率：**本地缓存无上限**（Map 只 put 不 evict）、集合累积（每次请求往全局 list 里加）、ThreadLocal 没 remove、监听器没注销、连接/句柄泄漏（这个堆不涨，要看 fd 数）。\n\n---\n\n## 9. 稳定性与混沌（了解即可）\n\n### 9.1 稳定性测试的观察项\n\n| 观察项 | 健康标准 |\n| --- | --- |\n| 内存 RSS | 有平台期，GC 后基线稳定 |\n| 连接数 / fd 数 | 不持续上涨 |\n| P99 漂移 | 8 小时内劣化 < 20% |\n| 错误率 | 不随时间上升 |\n| GC 频率 | 不随时间显著增加 |\n| 队列/积压 | 不单调增长 |\n\n### 9.2 混沌工程（知道名字和用途）\n\n| 工具 | 用途 |\n| --- | --- |\n| **ChaosBlade** | 阿里开源，命令行注入故障（CPU 满、网络延迟、磁盘满、进程 kill、JVM 异常） |\n| **Chaos Mesh** | Kubernetes 原生的混沌平台，用 CRD 定义故障 |\n\n**混沌和压测的区别**：\n\n```\n压测：给系统施加大流量，看它在压力下的表现\n混沌：给系统注入故障（节点挂了、网络断了、磁盘满了），看它能不能自愈/降级\n```\n\n**测开在这里的落点**：验证\"降级/熔断/重试\"这些机制**真的按设计工作**（呼应《系统设计意识篇》）。压测出容量，混沌验韧性，两者互补。\n\n---\n\n## 10. 动手清单\n\n- [ ] 下一次压测前，先用 `top`/`ss -s` 确认压测机不是瓶颈（记录数字）。\n- [ ] 抓三次线程栈，统计线程状态分布，看请求卡在哪。\n- [ ] 把\"客户端 RT\"和\"服务端 RT\"对比一次，看差多少。\n- [ ] 拿一条慢 SQL 跑 EXPLAIN，按 Q6 的五类方向列一遍可行优化。\n- [ ] 写一份性能报告，重点补齐\"结论边界\"这一节。\n","chars":6577,"codes":15,"tables":18}]},{"name":"八、质量工程与效能","articles":[{"id":"pipeline","title":"质量流水线与门禁篇","desc":"四级流水线/失败通知/左移右移落地","file":"测试开发-质量流水线与门禁篇.md","content":"# 测试开发-质量流水线与门禁篇\n\n> 对应清单：CI/CD 集成【必须掌握】全部 + 测试左移右移落地【必须掌握】全部\n> 对应自查：Q1（四级流水线各跑什么、为什么分层）、Q2（失败通知该包含什么）、Q7（每个线上 bug 至少沉淀一条自动化用例，为什么高性价比）\n> 说明：流水线的**基础配置**（GitHub Actions 怎么写、artifact 怎么传、失败怎么定位）在《CI-CD篇》已讲。本篇只讲**分层设计与门禁机制**，以及左移/右移的具体落地动作。\n\n---\n\n## 0. 先定位：CI/CD 集成的本质是\"分层门禁\"\n\n大部分人理解 CI = \"提交后自动跑测试\"。这只对了一半。\n\n真正的价值是：**用不同速度、不同覆盖度的检查，在不同时机挡住不同类型的错误**。\n\n```\n改一行代码 → 10 秒内被 lint 拦住（拼写错误、未定义变量）\n         → 3 分钟内被单测拦住（逻辑错了）\n         → 10 分钟内被冒烟拦住（接口挂了）\n         → 每晚被全量拦住（边缘场景坏了）\n         → 发布后 30 秒内被拨测拦住（部署错了）\n```\n\n**分层的目的不是\"多跑几遍\"，是让每个错误在最便宜的阶段被发现。** 这就是左移在经济上的落地。\n\n自查分级：\n\n| 内容 | 档位 | 说明 |\n| --- | --- | --- |\n| 四级分层的分工 | 熟练 | Q1 核心 |\n| 失败通知的要素 | 熟练 | 决定团队会不会用 CI |\n| 工具四能力（触发/矩阵/缓存/产物/密钥） | 熟练 | 至少深入一个 |\n| 左移的三个动作 | 会用 | checklist/契约/冒烟前置 |\n| 右移的三个动作 | 会用 | 拨测/告警关联/bug 回流 |\n\n---\n\n## 1. 自查 Q1：四级流水线各跑什么，为什么这么分层\n\n### 1.1 四级对照表（背这张表）\n\n| 级别 | 触发时机 | 跑什么 | 时长目标 | 失败后果 | 谁看 |\n| --- | --- | --- | --- | --- | --- |\n| **提交级** | 每次 push | lint、单测、静态安全扫描（SAST） | **< 5 分钟** | **阻塞合并** | 提交者 |\n| **合并级** | PR 合并前 | 接口自动化冒烟集、契约检查 | 10~20 分钟 | **阻塞合并** | 提交者 + reviewer |\n| **每日级** | 定时（凌晨） | 全量接口回归 + UI 冒烟 + 报告归档 | 1~3 小时 | 不阻塞，次日出日报 | 测试负责人 |\n| **发布级** | 部署完成后 | 部署后冒烟（核心链路）+ 拨测 | < 10 分钟 | **阻塞发布/触发回滚** | 值班/发布人 |\n\n### 1.2 为什么这么分层（三个理由）\n\n**理由一：反馈速度决定会不会用**\n\n```\n提交级 40 分钟 → 开发不会等，直接合并 → 门禁失效\n提交级 3 分钟  → 开发会等结果 → 真的挡住了\n```\n\n**这是分层的核心动机**：不是\"覆盖更多\"，而是\"在能承受的等待时间内给出结论\"。**超过 15 分钟的提交级检查，实际使用率通常低于 30%。**\n\n**理由二：失败成本随阶段递增**\n\n| 阶段 | 发现问题的代价 |\n| --- | --- |\n| 提交级（lint/单测） | 改一行，几十秒 |\n| 合并级（接口冒烟） | 本地复现，10 分钟 |\n| 每日级 | 次日才发现，可能已经合了 5 个 PR |\n| 发布后 | 回滚、发公告、写复盘 |\n\n**理由三：资源与成本**\n\n全量接口回归 1 小时 + UI 2 小时，如果放到提交级：\n- 每次 push 占 3 小时 CI 资源，一个小团队（每天 30 次 push）就是 90 小时；\n- 而且 90% 的提交不涉及那些边缘场景，属于浪费。\n\n**所以分层的本质是\"用不同的成本，覆盖不同的风险面\"。**\n\n### 1.3 每一级的具体内容（可以直接照抄）\n\n**提交级（< 5 分钟）**\n\n```yaml\n- name: lint\n  run: ruff check . && ruff format --check .\n- name: 单测\n  run: pytest tests/unit -x --timeout=60\n- name: 静态安全扫描\n  run: semgrep --config=auto --error .        # 或 CodeQL / bandit\n- name: 硬编码检查\n  run: grep -rn \"P
