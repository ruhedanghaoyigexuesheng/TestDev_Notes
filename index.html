. .venv/bin/activate && pytest -m smoke -v --tb=short' }\n            post {\n                always { junit 'reports/junit.xml' }          // 让 Jenkins 展示用例统计\n            }\n        }\n        stage('全量') {\n            when { branch 'main' }\n            steps { sh '. .venv/bin/activate && pytest -v --html=reports/report.html' }\n            post {\n                always { archiveArtifacts artifacts: 'reports/**', allowEmptyArchive: true }\n            }\n        }\n    }\n    post {\n        failure {\n            dingtalk accessToken: env.DINGTALK_TOKEN,   // 插件或 sh curl webhook\n                     title: \"构建失败: ${env.JOB_NAME} #${env.BUILD_NUMBER}\",\n                     text: \"详见: ${env.BUILD_URL}\"\n        }\n    }\n}\n```\n\n**对应关系**（会 GitHub Actions 就基本会 Jenkins）：\n\n| GitHub Actions | Jenkins |\n| --- | --- |\n| `on:` | `triggers {}` |\n| `jobs` / `steps` | `stages` / `steps` |\n| `services`（容器依赖） | 起 docker 容器或 `agent` 里装 |\n| `actions/upload-artifact` | `archiveArtifacts` |\n| `actions/cache` | 缓存配置或 workspace 复用 |\n| `secrets` | Jenkins Credentials（`withCredentials`） |\n| `if: always()` | `post { always { ... } }` |\n\n---\n\n## 5. 自查 Q9 完整作答\n\n### Q9. 描述一条 GitHub Actions 流水线：什么时候触发、跑什么、产物在哪、失败了怎么通知\n\n**按你要的四点回答：**\n\n**① 触发**\n\n> 三到四个触发点，各有分工：\n> - `push` 到 `main`/`develop`：合并后自动回归。\n> - `pull_request` 到 `main`：**这是门禁**，PR 提上来就跑，红了不许合。\n> - `schedule`（cron）：每天凌晨 2 点跑全量 + UI，因为提交级只跑冒烟。注意 cron 是 **UTC**，`0 18 * * *` 才是北京时间 02:00。\n> - `workflow_dispatch`：手动触发，通常带环境参数（test/staging），发版前用。\n> 另外加 `concurrency` + `cancel-in-progress`，同一分支有新的提交就取消旧的，避免结果混乱和额度浪费。\n\n**② 跑什么**\n\n> 分三层，按耗时递增：\n> - **准备**：checkout → setup-python（开 `cache: pip`）→ 装依赖 → 用 `services` 起一个干净的 MySQL 并初始化库表。**依赖环境用容器起，保证每次从零开始。**\n> - **冒烟**（每次触发）：`pytest -m smoke`，要求 5 分钟内出结果，不然就阻塞开发了。\n> - **全量**（`if: github.ref == 'refs/heads/main' || schedule`）：只在合并到 main 或夜间跑。\n> 关键配置是 `--tb=short` 让日志直接到断言行，`--durations=10` 暴露慢用例。\n\n**③ 产物在哪**\n\n> 两层：\n> - **artifact**（`actions/upload-artifact`）：HTML 报告、`artifacts/` 里的失败现场 JSON、`logs/`，保留 14 天。**必须加 `if: always()`**，否则失败时报告不上传，等于白跑。\n> - **PR 页面的检查状态**：PR 上会显示 pass/fail，这是给 reviewer 看的第一眼信息。\n> 如果接 Allure，就再起一个服务或传到对象存储，从 artefact 解压后打开。\n\n**④ 失败怎么通知**\n\n> 三层：\n> - **平台内**：PR 上标红 + 邮件/DM 给提交者（GitHub 自带，不用配）。\n> - **IM 群**：用 webhook（企业微信/钉钉/Slack），在 `post { failure { ... } }` 或单独的 job 里发，消息里带**失败用例名 + 报告链接 + 构建号**。只发\"构建失败\"没有价值，必须让人一眼能定位。\n> - **门禁**：分支保护规则里把该 check 设为必需，失败就禁止合并 —— **这才是 CI 真正起作用的地方，不是通知，是拦截。**\n\n**再补一句加分项：**\n\n> 我会特别关注两件事：**流水线耗时**和 **flaky 率**。前者决定开发会不会绕过它（超过 15 分钟就有人开始要求\"跳过测试\"），后者决定大家还信不信它（一周三次误报之后就没人看了）。所以提交级只跑冒烟，全量放夜间，并且给 flaky 用例登记、限期修复，而不是靠 `--reruns` 掩盖。\n\n---\n\n## 6. 动手清单\n\n- [ ] 在一个仓库里建 `.github/workflows/api-tests.yml`，用 §2.2 的模板跑通一次（哪怕是 3 条用例）。\n- [ ] 故意让一条用例失败，看失败日志长什么样，练习用 `--tb=short` 后的定位过程。\n- [ ] 加上 `if: always()` 上传报告，下载一次 artifact 看看里面有什么。\n- [ ] 配一个 IM webhook，让失败时真的发一条消息到群里。\n","chars":3999,"codes":11,"tables":6}]},{"name":"四、测试方法与质量工程","articles":[{"id":"process","title":"测试流程与方法论篇","desc":"流程八环节/测试金字塔/七种类型/越权","file":"测试开发-测试流程与方法论篇.md","content":"# 测试开发-测试流程与方法论篇\n\n> 对应清单：测试流程【必须掌握】、测试分类【必须掌握】、测试类型【必须掌握】\n> 对应自查：Q5（水平越权 vs 垂直越权，各一个用例）\n> 立场：流程不是走过场，是**\"每个环节想清楚输入和输出，避免把问题漏到下一个环节\"**。这篇里每个环节都标注了\"卡点\"——真正被跳过的从来不是文档，是卡点。\n\n---\n\n## 0. 先定位：流程、分类、类型三者的关系\n\n```\n流程  = 时间轴：一件事从需求到复盘，按顺序经过哪些环节\n分类  = 层次轴：同一时间点，测试在哪一层做（单元/集成/系统/验收）\n类型  = 关注点：同一层里，测的是什么属性（功能/性能/安全/兼容…）\n```\n\n容易混的地方：**\"接口测试\"是分类（层次）还是类型？** 它是分类里的\"集成测试层\"，但很多时候被当成类型用。回答时要说明口径。\n\n自查分级：\n\n| 内容 | 档位 | 说明 |\n| --- | --- | --- |\n| 八环节的输入/输出/产物 | 熟练 | 面试必问，也决定你能否当项目负责人 |\n| 测试金字塔 | 熟练 | 能讲清\"为什么\"，不只是画图 |\n| 七种测试类型各一个例子 | 熟练 | 要有自己的真实例子 |\n| 越权（水平/垂直） | 熟练 | 安全测试最常考的点 |\n\n---\n\n## 1. 测试流程八环节：每步的输入、输出、产物、卡点\n\n### 1.1 总览表（背这张表就够回答\"流程\"）\n\n| # | 环节 | 输入 | 输出（决定下一步能不能开始） | 常见产物 | 卡点（最容易跳过的地方） |\n| --- | --- | --- | --- | --- | --- |\n| 1 | 需求分析 | PRD、原型、技术方案 | **需求疑问清单 + 可测性评估** | 需求评审记录、测试范围说明 | 只\"听懂了\"，没提\"这个需求怎么验\" |\n| 2 | 测试计划 | 需求范围、排期、资源 | 范围、策略、资源、进度、风险 | 测试计划文档 | 没写\"不测什么\"，导致后期范围失控 |\n| 3 | 用例设计 | PRD + 接口文档 + 设计 | 可执行的用例集 | 用例库、思维导图、测试数据准备清单 | 只覆盖正向流程，异常和组合没设计 |\n| 4 | 用例执行 | 用例 + 可用环境 + 数据 | 执行记录 + 缺陷单 | 执行报告、日报 | 环境不可用就\"等\"，不主动暴露阻塞 |\n| 5 | 缺陷跟踪 | 缺陷单 | 修复版本 + 影响范围 | 缺陷单、缺陷趋势 | 只提单不跟进，缺陷挂在\"待确认\"一周 |\n| 6 | 回归测试 | 修复列表 + 影响范围分析 | 回归结果 | 回归报告 | 只回归\"改的那几条\"，没做影响面分析 |\n| 7 | 上线验证 | 发布单、上线清单 | 线上验证结论（可回滚/不可） | 上线验证单、冒烟结果 | 只看首页能打开，不验核心链路 |\n| 8 | 复盘 | 缺陷数据、线上问题 | 改进项 + 责任人 + 期限 | 复盘记录 | 复盘只有\"下次注意\"，没有可执行改进 |\n\n### 1.2 逐环节展开（含测开的实际动作）\n\n**① 需求分析**\n\n不只是\"读懂 PRD\"，要做三件事：\n\n1. **拆歧义**：一句\"支持批量导入\"就有五个歧义 —— 导入多少条？失败是整体回滚还是部分成功？模板哪里下载？重复数据怎么处理？失败的行怎么反馈？**每条歧义都是一个隐藏的缺陷。**\n2. **可测性评估**：这个需求上线后，我能不能验证它？需要什么日志/接口/埋点？**如果验不了，现在就要提出来**（这就是\"左移\"最具体的动作）。\n3. **范围边界**：明确\"这次不测什么\"，写进测试计划，否则后期会被追问\"为什么这个没测\"。\n\n**输出**：需求疑问清单（每条要带\"我的建议\"而不是单纯提问）。\n\n**② 测试计划**\n\n测试计划不是形式文档，核心就五块：\n\n```\n范围（测什么/不测什么）+ 策略（哪些层、哪些类型、怎么测）+ 资源（人/环境/数据/工具）\n+ 进度（关键里程碑）+ 风险（可能阻塞的事 + 应对）\n```\n\n**风险这块最容易被写空**。真实的写法：\n\n| 风险 | 影响 | 应对 |\n| --- | --- | --- |\n| 测试环境到 T-3 才能部署 | 接口测试时间压缩一半 | 提前用 mock 环境跑通脚本；申请预发环境 |\n| 支付依赖第三方沙箱不稳定 | 支付链路用例可能反复失败 | mock 第三方 + 只保留 1 条真实链路用例 |\n| 需求变更频繁 | 用例返工 | 每周对齐一次变更，用例分层（冒烟先冻结） |\n\n**③ 用例设计**：见《用例设计方法篇》。这里只说一个工程判断：**用例写到\"别人能照着执行\"的程度**，不是写给自己的备忘。\n\n**④ 用例执行**\n\n执行不是\"点一遍\"，要做三件事：\n\n- **按优先级跑**：P0 先跑完，能尽早暴露阻塞性缺陷。\n- **记录证据**：失败截图/日志/请求响应，别只写\"失败\"。\n- **主动暴露阻塞**：环境挂了立刻在群里同步 + 给出预期恢复时间，而不是等一上午。\n\n**⑤ 缺陷跟踪**：见《缺陷与质量工程篇》。\n\n**⑥ 回归测试**\n\n回归的范围不是\"改了哪几行就测哪几行\"，而是**影响面分析**：\n\n```\n改了支付金额计算 → 影响：下单、退款、对账、优惠券核销、发票\n改了用户表加字段 → 影响：所有读写用户的接口、数据同步任务、报表\n```\n\n**回归用例的选取**：冒烟集（必跑）+ 受影响模块的 P1 用例 + 上次缺陷对应的用例。\n\n**⑦ 上线验证**\n\n上线验证要回答一个问题：**\"现在能回滚吗？\"** 所以顺序是：\n\n```\n先验核心链路（下单→支付→查询）能通\n再验新功能\n最后验监控告警有没有正常数据\n任何一步不通 → 立刻判断是回滚还是修\n```\n\n**⑧ 复盘**\n\n复盘的价值在于**把个案变成机制**。写法：\n\n| 问题 | 现象 | 根因（不是\"疏忽\"） | 改进（可执行、有 Owner、有期限） |\n| --- | --- | --- | --- |\n| 漏测了并发重复提交 | 线上出现两笔订单 | 用例里没有并发场景，且测试环境串行跑 | 在用例模板里加\"并发/重复提交\"必填项；Q4 前补并发脚本（张三，11/15） |\n\n**\"根因不是疏忽\"** 是复盘的纪律：写\"疏忽\"等于没写，因为不可改进。\n\n---\n\n## 2. 测试分类\n\n### 2.1 按阶段：单元 → 集成 → 系统 → 验收\n\n| 阶段 | 测什么 | 谁做 | 环境 | 发现问题的成本 |\n| --- | --- | --- | --- | --- |\n| 单元测试 | 单个函数/类 | 开发（测开提供框架） | 本地 | 最低 |\n| 集成测试 | 模块之间、服务之间（接口） | 测开为主 | 集成环境 | 中 |\n| 系统测试 | 整个系统的功能/性能/安全 | 测试 | 类生产环境 | 高 |\n| 验收测试 | 是否符合业务预期（UAT） | 业务方 + 测试 | 预发/生产灰度 | 最高 |\n\n**关键认知**：**越往后发现缺陷，修复成本越高**（业界常用的量级是 1:10:100）。这就是左移的经济学基础。\n\n### 2.2 按目的：回归 / 冒烟 / 探索性\n\n| 类型 | 目的 | 特点 | 什么时候做 |\n| --- | --- | --- | --- |\n| 冒烟测试 | 确认\"基本可用\"，能不能继续测 | 少量、覆盖主链路、快（15 分钟内） | 每个新版本部署后、上线后 |\n| 回归测试 | 确认\"改动没破坏原有功能\" | 覆盖受影响范围 + 核心链路 | 每次修复后、发版前 |\n| 探索性测试 | 发现**用例没想到**的问题 | 边测边设计，依赖经验和直觉 | 时间允许时的补充，或新功能首测 |\n\n**冒烟和回归的区别**（常被混）：冒烟是\"能不能开始测\"，回归是\"改坏了没有\"。冒烟失败就阻塞，回归失败就修。\n\n**探索性测试不是\"随便点\"**：有章程（测什么区域）、有时间盒（60 分钟）、有记录（发现了什么）。没记录的探索不叫探索，叫试用。\n\n### 2.3 测试金字塔：为什么单元最厚、UI 最薄\n\n```\n        /\\        UI（端到端）      ← 最薄：慢、脆、定位难\n       /  \\\n      /----\\      接口/集成         ← 主力：快、稳、能定位\n     /      \\\n    /--------\\    单元测试          ← 最厚：毫秒级、精准定位\n   /__________\\\n```\n\n**四维理由（面试要能说出至少三条）：**\n\n| 维度 | 单元测试 | UI 测试 |\n| --- | --- | --- |\n| **执行速度** | 毫秒级，几千条几分钟 | 秒级，几百条几十分钟 |\n| **稳定性** | 无外部依赖，几乎不会 flaky | 依赖浏览器/网络/渲染，flaky 是常态 |\n| **定位精度** | 直接指向函数和行 | 只告诉你\"页面上这个按钮点不动\"，可能是一百个原因 |\n| **维护成本** | 重构代码时跟着改，逻辑清晰 | 页面一改选择器就崩，维护成本最高 |\n| **覆盖效率** | 一个分支一条用例 | 一条 UI 用例只能覆盖一条路径 |\n\n**反模式（这两个比金字塔本身更值得讲）：**\n\n| 反模式 | 长什么样 | 后果 |\n| --- | --- | --- |\n| **冰淇淋筒** | UI 层最多，单元几乎没有 | 回归要 8 小时，天天 flaky，没人信结果 |\n| **沙漏** | 单元多、UI 多、中间接口层几乎没有 | 接口契约问题全部漏到 UI 层才暴露，定位极慢 |\n\n**测开在金字塔里的定位**：**把中间那层做厚**（接口/集成）。因为单元是开发的活，UI 少而精，中间层既快又能覆盖业务逻辑，是测开产出最高的地方。\n\n---\n\n## 3. 测试类型：七类，每类一个能讲出来的例子\n\n| 类型 | 验什么 | 怎么做 | 常见坑 | 例子（讲的时候要具体到场景） |\n| --- | --- | --- | --- | --- |\n| **功能** | 业务规则对不对 | 用例设计方法（等价类/边界/场景） | 只测正向，漏状态和异常 | 优惠券\"满 100 减 10 仅限周末\"：测 99.99、100、周末跨天的 23:59 |\n| **接口** | 服务之间契约和数据 | 参数校验、异常码、幂等、并发 | 只测 200，不测错误码体系 | 下单接口并发 10 次只应产生 1 单 |\n| **性能** | 响应时间、吞吐、资源 | 压测（locust/jmeter）、监控 | 压测机和被测机同机、没排除限流 | 首页接口 P99 从 200ms 涨到 2s，查后发现 N+1 查询 |\n| **安全** | 越权、注入、敏感信息 | 越权用例、参数篡改、抓包改包 | 只测功能权限，不测数据隔离 | 改 URL 里的 userId 能看别人订单（水平越权，见 Q5） |\n| **兼容性** | 多端多版本多网络 | 设备矩阵 + 正交法筛组合 | 全组合穷举，跑不完 | Chrome/Safari/微信内置浏览器 + 弱网 2G 下登录 |\n| **易用性** | 用户能不能顺畅完成 | 走查 + 真实用户试用 | 靠感觉说\"不好用\"，不给依据 | 错误提示\"系统繁忙\"不告诉用户怎么办 |\n| **稳定性** | 长时间运行不退化 | 7×24 长跑、故障注入 | 只跑功能，不看资源曲线 | 跑 8 小时后 RSS 从 200M 涨到 1.2G 然后 OOM |\n\n**怎么讲\"我经历过的例子\"**（这是面试真正在听的）：\n\n> 不要讲\"我做过性能测试\"，要讲**一个具体的数字和结论**：\n> \"首页接口压测时 P99 到 800ms，超过 300ms 的基线。我看了下 EXPLAIN 发现是 N+1 查询（列表 20 条数据发了 21 次 SQL），让开发改成批量查询后降到 180ms。\"\n\n**每种类型的\"一句话判断标准\"**，比定义好记：\n\n```\n功能：业务规则在边界值上是对的吗\n接口：契约、错误码、幂等、并发都对吗\n性能：在目标并发下的 P99 和资源水位可接受吗\n安全：换个身份/改个参数，还能不能访问到不该访问的\n兼容：目标设备和网络组合下，功能都正常吗\n易用：用户第一次用，能不能自己走通\n稳定：连续跑 7 天，指标会退化吗\n```\n\n---\n\n## 4. 自查 Q5 完整作答：水平越权 vs 垂直越权\n\n### 4.1 区别（一句话 + 一张表）\n\n> **水平越权：同级别用户之间，能访问别人的数据。**（A 用户看到 B 用户的订单）\n> **垂直越权：低权限用户做了高权限的事。**（普通用户调用了管理员接口）\n\n| | 水平越权 | 垂直越权 |\n| --- | --- | --- |\n| 攻击者身份 | 合法用户，权限等级相同 | 合法用户，权限等级较低 |\n| 攻击目标 | **别人的数据**（同角色） | **更高的功能权限** |\n| 根本原因 | 接口只校验\"登录了\"，没校验\"数据属不属于你\" | 接口只在前端藏了入口，后端没校验角色 |\n| 典型表现 | 改 `userId`/`orderId`/`id` 就能看到别人的 | 直接调管理员接口能成功 |\n\n### 4.2 水平越权用例\n\n**场景**：订单详情接口 `GET /api/orders/{order_id}`。\n\n```\n前置：账号 A（user_id=1001）有订单 O-A；账号 B（user_id=1002）有订单 O-B\n\n用 A 的 token 请求 O-A  → 200，返回 A 的订单  ✅\n用 A 的 token 请求 O-B  → 期望 403/404，实际若 200 且返回 B 的订单 → 【水平越权缺陷】\n```\n\n```python\ndef test_horizontal_privilege_escalation(api_a, api_b, base_url):\n    \"\"\"A 用 B 的订单号查询，必须被拒绝。\"\"\"\n    order_b = api_b.post(f\"{base_url}/api/orders\", json={\"sku_id\": 1, \"num\": 1}).json()[\"data\"]\n    resp = api_a.get(f\"{base_url}/api/orders/{order_b['order_no']}\")\n\n    # 正确实现：403（无权限）或 404（防枚举，不暴露资源是否存在）\n    assert resp.status_code in (403, 404), f\"水平越权：A 能查到 B 的订单 {resp.text[:200]}\"\n```\n\n**变体（同一漏洞的不同入口，测的时候要都覆盖）**：\n\n| 入口 | 改什么 |\n| --- | --- |\n| 路径参数 | `/api/orders/{id}` 改 id |\n| 查询参数 | `/api/orders?userId=1002` 改 userId |\n| 请求体 | `{\"user_id\": 1002}` 改 body 里的字段 |\n| 隐藏字段 | 前端不显示但接口收的字段（如 `merchant_id`） |\n| 批量接口 | `/api/orders/batch?ids=O-B` 里混入别人的 id |\n\n**只测一个入口是不够的** —— 很多系统的列表接口做了过滤，详情接口忘了。\n\n### 4.3 垂直越权用例\n\n**场景**：管理员接口 `POST /api/admin/users/{id}/disable`（禁用用户）。\n\n```\n前置：普通用户 token、管理员 token\n\n管理员调  → 200  ✅\n普通用户调 → 期望 403，实际若 200 → 【垂直越权缺陷】\n```\n\n```python\ndef test_vertical_privilege_escalation(api_user, api_admin, base_url):\n    \"\"\"普通用户调用管理员接口，必须 403。\"\"\"\n    payload = {\"target_user_id\": 2002}\n    ok = api_admin.post(f\"{base_url}/api/admin/users/disable\", json=payload)\n    assert ok.status_code == 200, \"管理员自己也调不通，先确认接口\"\n\n    resp = api_user.post(f\"{base_url}/api/admin/users/disable\", json={\"target_user_id\": 2003})\n    assert resp.status_code == 403, f\"垂直越权：普通用户能禁用账号 {resp.text[:200]}\"\n```\n\n**变体（垂直越权的常见伪装）**：\n\n| 伪装 | 测法 |\n| --- | --- |\n| 前端隐藏了菜单，但接口没鉴权 | 直接抓包调接口，别点页面 |\n| 靠 `role` 参数判断 | 请求体里带 `{\"role\": \"admin\"}` 看是否被信任 |\n| 内部接口暴露在公网 | 找 `/internal/`、`/admin/`、`/manage/` 前缀的路径直接试 |\n| 改了 token 里的权限字段 | JWT payload 改 `role` 后签名校验应失败（测试 JWT 签名） |\n\n### 4.4 答题时容易被追问的三点\n\n| 追问 | 怎么答 |\n| --- | --- |\n| 为什么有时候返回 404 而不是 403 | 防止资源枚举：返回 403 等于告诉攻击者\"这个 ID 存在，只是你没权限\"。**安全要求高的系统用 404，业务系统用 403，关键是团队约定一致** |\n| 怎么保证覆盖全 | 拿接口清单 × 用户角色做笛卡尔积，生成\"角色 × 接口\"矩阵，逐个填结果。这个矩阵本身就是测试方案的一部分 |\n| 越权测试能不能自动化 | 能。维护两套账号（普通/管理员），用参数化跑\"角色 × 接口\"矩阵，断言返回码。**这是测开能做出高价值的地方** |\n\n---\n\n## 5. 动手清单\n\n- [ ] 把我们项目的\"接口清单 × 角色\"做成矩阵，跑一遍越权，看有没有漏的。\n- [ ] 挑一个需求，写一份真实的\"需求疑问清单\"，每条带建议（不要只提问）。\n- [ ] 算一下我们测试金字塔的分布（单元/接口/UI 各多少条），看是不是冰淇淋筒。\n- [ ] 写一次复盘：找一个已修复的线上缺陷，追问到\"可执行的改进项\"，而不是\"下次注意\"。\n","chars":5118,"codes":10,"tables":13},{"id":"casedesign","title":"用例设计方法篇","desc":"八种设计方法/六维框架/文件上传 38 点/状态机","file":"测试开发-用例设计方法篇.md","content":"# 测试开发-用例设计方法篇\n\n> 对应清单：用例设计方法【必须掌握】全部（八种方法）+ 场景题答题框架【必须掌握】（六维）\n> 对应自查：Q1（六维框架展开文件上传，30+ 点）、Q2（边界值 1-100）、Q3（判定表优惠券）、Q4（订单状态机）、Q8（AI 登录页找 5 个遗漏）\n> 立场：这一章的核心不是\"知道有八种方法\"，而是**看到需求能立刻判断\"这块该用哪个方法\"**。每种方法下面都标了\"适用信号\"，那才是能用出来的标志。\n\n---\n\n## 0. 先定位：八种方法的选择地图\n\n看到需求时，先判断它属于哪种形态，再选方法：\n\n| 需求形态 | 用哪个方法 | 适用信号 |\n| --- | --- | --- |\n| 一个输入框，规定了范围和类型 | **等价类 + 边界值** | \"允许 1-100 的整数\"\"最多 50 个字\" |\n| 多个条件组合决定一个结果 | **判定表** | \"满 100 减 10、新用户再减 5、仅限周末\" |\n| 有先后顺序、有状态 | **状态迁移** | 订单、审批流、工单状态 |\n| 多因素多水平（设备×系统×网络） | **正交实验法** | 兼容性矩阵、配置组合 |\n| 有业务流程和分支 | **场景法** | 下单、退款、注册 |\n| 复杂逻辑组合（多层因果） | 因果图（了解，实际多用判定表） | 条件之间互相影响 |\n| 什么都想到了，还想补漏 | **错误推测法** | 经验驱动的查缺 |\n| 开放式命题（测电梯、测水杯） | **六维框架** | 面试场景题、AI 生成用例的审查 |\n\n**最重要的认知**：**真实用例是方法混用的**。一个\"下单\"需求，就是场景法搭骨架 + 边界值补参数 + 状态迁移管状态 + 判定表管优惠规则。\n\n自查分级：\n\n| 方法 | 档位 | 说明 |\n| --- | --- | --- |\n| 等价类 + 边界值 | 熟练 | 每天用 |\n| 判定表 | 熟练 | 规则类需求的必杀器 |\n| 状态迁移 | 熟练 | 订单/审批必用 |\n| 场景法 | 熟练 | 搭骨架 |\n| 错误推测法 | 会用 | 靠积累 |\n| 正交实验法 | 会用 | 兼容性降维 |\n| 因果图 | 知道就行 | 实际很少单独用 |\n| 六维框架 | 熟练 | 场景题 + 审查用例的对照表 |\n\n---\n\n## 1. 等价类划分：先分类，再每类取一个\n\n**适用信号**：输入有\"有效\"和\"无效\"的明确分界。\n\n**做法**：把输入域划成若干类，每类里**取一个代表值**，就能代表整类。\n\n| 类型 | 含义 | 例子（注册用户名 4-16 位字母数字） |\n| --- | --- | --- |\n| 有效等价类 | 合法输入 | 4 位、8 位、16 位、纯字母、字母数字混合 |\n| 无效等价类 | 非法输入 | 3 位、17 位、空、纯数字（若要求含字母）、带特殊字符、带空格、中文 |\n\n**关键技巧：一个用例只覆盖一个无效等价类。** 因为如果同时违反两条规则，你无法判断是哪条校验起的作用。\n\n```\n✅ 用例：用户名 = \"abc\"（3 位，只测长度不足一条规则）\n❌ 用例：用户名 = \"a\"（1 位 + 纯字母，一次违反两条）\n```\n\n**常见错误**：只划分了\"长度\"这一个维度，漏了\"字符集\"和\"唯一性\"。**等价类要按每个约束分别划分。**\n\n---\n\n## 2. 边界值分析：Bug 最爱待的地方\n\n**适用信号**：输入有上下限（数字范围、字符串长度、日期范围、金额）。\n\n### 2.1 三个概念（必须能说出定义）\n\n| 概念 | 定义 | 例子（范围 1-100） |\n| --- | --- | --- |\n| **上点** | 边界上的点，**必测且是有效值** | `1`、`100` |\n| **内点** | 边界之间的任意正常值 | `2`、`50`、`99`（通常取 1~2 个） |\n| **离点** | 紧邻边界的点，**通常是无效值** | `0`、`101` |\n\n**为什么离点是 0 和 101 而不是 -1 和 102**：因为缺陷通常发生在\"差一位\"（`>=` 写成 `>`、`<` 写成 `<=`）。离点就是用来抓这类 off-by-one 的。\n\n**如果代码是开区间**（如 `1 < x < 100`），那上点=1、100 是无效，离点=2、99。**所以先要确认需求是闭区间还是开区间** —— 这本身就是个必问的澄清点。\n\n### 2.2 自查 Q2 完整作答：输入框允许 1-100 的整数\n\n**先拆约束**：一是\"整数\"（类型），二是\"1-100\"（范围）。两个维度分别做等价类和边界值。\n\n| 类别 | 取值 | 理由 | 期望 |\n| --- | --- | --- | --- |\n| 上点（有效） | **1** | 下边界，最容易因 `>` 写成 `>=` 出错 | 通过 |\n| 上点（有效） | **100** | 上边界，对称的另一个高危点 | 通过 |\n| 内点（有效） | **2** | 紧邻下边界的正常值，确认下边界没写成 `>=2` | 通过 |\n| 内点（有效） | **50** | 区间中部，验证正常路径 | 通过 |\n| 内点（有效） | **99** | 紧邻上边界的正常值，确认上边界没写成 `<=99` | 通过 |\n| 离点（无效） | **0** | 下边界外一个，抓 `>=1` 漏判 | 拒绝，提示范围 |\n| 离点（无效） | **101** | 上边界外一个，抓 `<=100` 漏判 | 拒绝，提示范围 |\n| 更远（无效） | **-1**、**1000** | 确认不是只判了 `!=0` 或 `!=101` 这种写死的判断 | 拒绝 |\n| 类型（无效） | **1.5**、**99.9** | 非整数，抓\"后端用了 float 或没做整数校验\" | 拒绝 |\n| 类型（无效） | **\"1\"**（字符串）、**\" 1\"**（带空格） | 前端传了字符串，抓\"后端没做类型转换/trim\" | 拒绝或自动 trim（取决于约定） |\n| 类型（无效） | **1.0** | 浮点表示的整数，抓\"直接把 1.0 转 int 就过了\" | 一般接受，但要确认 |\n| 特殊（无效） | **空**、**null**、**空格串** | 必测 | 拒绝，提示\"必填\" |\n| 特殊（无效） | **全角数字 \"１\"**、**中文数字 \"一\"** | 真实用户会输入，抓前端没限制字符集 | 拒绝 |\n| 特殊（无效） | **\"1e2\"**（科学计数法）、**\"0x10\"** | 抓\"用 int() 或 parseFloat 宽松解析\" | 拒绝 |\n| 超长（无效） | **\"1\" + 200 个 0** | 抓没做长度限制，可能导致数据库报错 | 拒绝，不能 500 |\n| 边界幂等 | **1** 和 **100** 各提交两次 | 边界值上的重复提交（金额=1 时最容易触发逻辑异常） | 只生效一次 |\n\n**说明三件事，答案就完整了**：\n\n1. **为什么内点取 3 个**：`1`、`100` 是边界，但\"边界内紧邻的两个值\"（2 和 99）能抓 `>=2`/`<=99` 这类写法。很多 bug 不是边界本身，而是\"边界判断多移了一位\"。\n2. **期望要写清\"拒绝\"的具体形态**：是前端拦截、还是后端返回 400 + 错误信息。**只说\"应该不通过\"不叫期望结果。**\n3. **1.0 这种要说清**：如果接口约定是整数，`1.0` 在 JSON 里其实会被解析成 `1`，所以它到底算不算合法取决于协议层。**这种模糊点要写进需求澄清，不要自己拍。**\n\n---\n\n## 3. 判定表：多条件组合的必杀器\n\n**适用信号**：多个条件组合决定结果，且条件之间**不是简单相加**。\n\n### 3.1 自查 Q3 完整作答：满 100 减 10、新用户再减 5、仅限周末\n\n**第一步：先澄清规则（这一步比画表更重要）**\n\n判定表真正的价值是**逼出需求漏洞**。这四条规则至少引出六个问题：\n\n| 澄清点 | 为什么必须问 |\n| --- | --- |\n| \"满 100\" 指订单金额还是商品金额？含运费吗？ | 含运费会导致\"凑运费满减\"，是漏洞 |\n| \"满 100\" 按优惠前算还是优惠后算？ | 叠加时可能循环判断 |\n| \"新用户再减 5\" 是**叠加**还是**二选一**？ | 直接决定有没有 15 元这一档 |\n| 减完不能小于 0（订单 100 减 15 没问题，但如果减 20 呢） | 负数金额是资金风险 |\n| \"周末\" 按哪个时区、以哪个时间为准（下单时间还是支付时间）？ | 周五 23:59 下单、周六 00:01 支付 |\n| 能否与其他优惠叠加？退单后券是否退回？ | 影响核销逻辑 |\n\n**第二步：列条件桩和动作桩**\n\n```\n条件桩：\n  C1：订单金额 >= 100\n  C2：用户是新用户\n  C3：当前是周末\n\n动作桩：\n  A1：减 10\n  A2：再减 5（叠加）\n  A3：不可用（提示\"该券仅限周末使用/未满门槛\"）\n```\n\n**第三步：全组合 8 条规则（2³）**\n\n| 规则 | C1 满100 | C2 新用户 | C3 周末 | A1 减10 | A2 减5 | 最终优惠 |\n| --- | --- | --- | --- | --- | --- | --- |\n| R1 | Y | Y | Y | ✅ | ✅ | **减 15** |\n| R2 | Y | Y | N | ❌ | ❌ | 不可用 |\n| R3 | Y | N | Y | ✅ | ❌ | **减 10** |\n| R4 | Y | N | N | ❌ | ❌ | 不可用 |\n| R5 | N | Y | Y | ❌ | ❌ | 不可用（未满门槛） |\n| R6 | N | Y | N | ❌ | ❌ | 不可用 |\n| R7 | N | N | Y | ❌ | ❌ | 不可用 |\n| R8 | N | N | N | ❌ | ❌ | 不可用 |\n\n**第四步：化简（合并可合并的规则）**\n\n观察：C1=N 时无论 C2/C3 都是\"不可用\"，可以合并为一条。\n\n| 化简后 | 条件 | 动作 |\n| --- | --- | --- |\n| 规则 1 | 金额 < 100（任意用户、任意日期） | 不可用（未满门槛） |\n| 规则 2 | 金额 >= 100 且 非周末 | 不可用（非周末） |\n| 规则 3 | 金额 >= 100 且 周末 且 老用户 | 减 10 |\n| 规则 4 | 金额 >= 100 且 周末 且 新用户 | 减 15 |\n\n**从 8 条化简到 4 条，用例从 8 条降到 4 条，覆盖不变** —— 这就是判定表的价值。\n\n**第五步：把规则转成用例（含边界）**\n\n| 用例 | 金额 | 用户 | 日期 | 期望 |\n| --- | --- | --- | --- | --- |\n| 1 | 99.99 | 新用户 | 周六 | 不可用，提示\"未满 100\" |\n| 2 | 100.00 | 新用户 | 周六 | 减 15，实付 85.00 |\n| 3 | 100.00 | 老用户 | 周六 | 减 10，实付 90.00 |\n| 4 | 100.00 | 新用户 | 周三 | 不可用，提示\"仅限周末\" |\n| 5 | 500.00 | 新用户 | 周日 | 减 15 |\n| 6 | 99.99 | 新用户 | 周三 | 不可用（两个条件都不满足，只提示哪一条？） |\n| 7 | 100.00 | 新用户 | **周六 23:59:59** | 减 15（周末边界） |\n| 8 | 100.00 | 新用户 | **周一 00:00:01** | 不可用（周末边界） |\n\n**用例 6 和 7、8 是判定表容易漏掉的**：多个条件同时不满足时提示哪个、跨天的那一秒算哪天。\n\n---\n\n## 4. 因果图：了解即可\n\n**是什么**：用图表示\"原因（输入条件）\"和\"结果（输出动作）\"的逻辑关系（与、或、非），再转成判定表。\n\n**为什么了解就行**：它是判定表的**前置画法**，但对于测试执行者，判定表已经足够；因果图主要在条件之间有复杂嵌套（数十个条件）时用来梳理。实际工作中，遇到复杂条件组合，**先画判定表，画不下去再画因果图**。\n\n面试被问到时这样说：\n\n> 因果图是把输入条件和输出结果之间的逻辑关系画出来，再转成判定表。实际用的时候我一般直接画判定表，因为最终落地都是判定表；只有当条件之间有嵌套依赖、判定表列到几十列的时候，才回头用因果图先理清结构。\n\n---\n\n## 5. 状态迁移：有状态的东西必用\n\n**适用信号**：对象有明确状态，且只能按规则流转（订单、审核、工单、支付）。\n\n**做法**：列出状态 + 事件 + 合法迁移，然后**每条迁移测三件事：正向、反向（非法迁移必须被拒）、幂等（重复事件）**。\n\n### 5.1 自查 Q4 完整作答：电商订单状态机\n\n```\n                    ┌──────────────┐\n        创建 ───────▶│   待支付      │\n                    └──────┬───────┘\n              支付成功 ┌───┴────┬── 取消/超时关单\n                      ▼        ▼\n                ┌──────────┐  ┌──────────┐\n                │  已支付   │  │  已取消   │\n                └────┬─────┘  └──────────┘\n          发货 ┌─────┴──────┬──── 申请退款\n               ▼            ▼\n         ┌──────────┐  ┌──────────┐\n         │  已发货   │  │  退款中   │\n         └────┬─────┘  └────┬─────┘\n     确认收货 │   申请退款    │退款成功   │退款驳回\n              ▼      ▼       ▼          ▼\n         ┌──────────┐   ┌──────────┐ ┌──────────┐\n         │  已完成   │   │  已退款   │ │ 回已支付  │\n         └──────────┘   └──────────┘ └──────────┘\n```\n\n| # | 当前状态 | 事件 | 目标状态 | 要验证什么 |\n| --- | --- | --- | --- | --- |\n| 1 | 待支付 | 支付成功回调 | 已支付 | 状态变了、支付流水记录、库存已扣、券已核销、**幂等**（重复回调只生效一次） |\n| 2 | 待支付 | 用户取消 | 已取消 | 库存回滚、券退回、优惠券占用释放 |\n| 3 | 待支付 | 超时关单（定时任务） | 已取消 | **超时时间准确**（30 分钟边界）、关单后能否再支付（必须不能） |\n| 4 | 已支付 | 发货 | 已发货 | 物流单号生成、发货时间、用户可查 |\n| 5 | 已发货 | 确认收货 | 已完成 | 确认时间、积分到账、评价入口开放 |\n| 6 | 已发货 | 超时自动确认 | 已完成 | 定时任务的时间边界（如 7 天） |\n| 7 | 已支付/已发货 | 申请退款 | 退款中 | 退款金额计算、库存处理规则、审批流 |\n| 8 | 退款中 | 退款成功 | 已退款 | 资金流水、库存回滚、券处理 |\n| 9 | 退款中 | 退款驳回 | 回已支付 | 状态回滚正确、用户可再次申请 |\n\n### 5.2 每条迁移必须测的四类（这是\"标出验证点\"的实际含义）\n\n| 类型 | 具体做法 |\n| --- | --- |\n| **正向** | 正常触发，状态流转正确，**关联数据一致**（库存/券/积分/流水/消息） |\n| **反向（非法迁移）** | 直接调接口试图跳状态：已支付 → 取消（应拒，要走退款）、已取消 → 支付（应拒）、已完成 → 发货（应拒） |\n| **幂等** | 同一事件重复触发：支付回调发 3 次、取消点 3 次 → 状态只变一次，库存只扣/退一次 |\n| **并发** | 两个事件同时到达：支付回调与超时关单同时发生 → **只能有一个成功**（这是最容易出 bug 的地方：用户支付成功但订单被关了） |\n\n**并发那条单独强调**：它是真实事故的高发区。\n\n```\n用户在第 30 分钟支付成功\n同时，定时任务扫描到\"超过 30 分钟未支付\"执行关单\n结果：订单被关闭，但钱已经扣了\n```\n\n测法：把超时时间调短（比如 30 秒），在临界点同时触发支付和关单，看结果。\n\n**非法迁移的清单法**：7 个状态 × 8 个事件 = 56 种组合，合法约 9 种，**剩下 47 种都应该被拒绝**。不需要全测，但要测那些\"看起来合理\"的非法迁移（已支付→取消、已完成→退款、已退款→发货）。\n\n---\n\n## 6. 正交实验法：多因素组合的降维\n\n**适用信号**：多因素多水平，全组合跑不完（兼容性、配置项）。\n\n**做法**：用正交表选出\"覆盖面最广的最少组合\"。\n\n例：浏览器（Chrome/Safari/Firefox）× 系统（Win/Mac/iOS/Android）× 网络（WiFi/4G/弱网）\n\n- 全组合：3 × 4 × 3 = 36 条\n- 正交表 L9：9 条就能覆盖\"任意两因素的所有组合至少出现一次\"\n\n**实际工作里更常用的简化做法**（不用背正交表）：\n\n1. **优先测主流组合**（Chrome+Win、Safari+iOS）—— 覆盖 80% 用户。\n2. **每增加一个因素，只测它的\"极值\"**：新系统版本只在主流浏览器上测。\n3. **pairwise 工具**（如 `pairwise` 库、PICT）直接生成组合，比手工靠谱。\n\n```python\n# 用 python 的 pairwise 生成组合（比手写正交表快）\nfrom itertools import product   # 全组合\nfactors = {\"browser\": [\"chrome\", \"safari\", \"firefox\"],\n           \"os\": [\"win\", \"mac\", \"ios\", \"android\"],\n           \"net\": [\"wifi\", \"4g\", \"weak\"]}\nall_combos = list(product(*factors.values()))   # 36 条，跑不完时用 pairwise 降维\n```\n\n**常见错误**：以为正交能\"覆盖所有组合\"。它只保证**两两组合覆盖**，三因素交互的问题测不出来。所以**核心路径还是要做全组合，边缘组合用正交。**\n\n---\n\n## 7. 错误推测法：经验驱动的补漏\n\n**不是瞎猜，是有来源的猜。** 五个稳定的来源：\n\n| 来源 | 具体怎么用 |\n| --- | --- |\n| 历史缺陷库 | 这个模块过去半年出过什么 bug，同类再测一遍 |\n| 常见缺陷模式 | 并发、重试、空值、超时、权限、编码、时区 |\n| 开发的技术债 | 这个模块最近重构过、加过 if 判断、赶过工 |\n| 用户投诉 | 客服工单里高频的问题 |\n| 上线场景 | 发版、切流、扩容、配置变更时会出什么问题 |\n\n**实例**：测一个\"导出 Excel\"功能，错误推测会想到：\n\n```\n导出 0 条数据 → 空文件还是报错？\n导出 10 万条 → 内存/超时？\n导出时文件里有 emoji → 乱码？\n导出过程中用户再次点击 → 生成两份？\n文件名重复 → 覆盖还是重命名？\n```\n\n这些都不在任何需求文档里，全靠经验。\n\n---\n\n## 8. 场景法：搭骨架的方法\n\n**做法**：主线（Happy Path）+ 支线（异常/中断/回退）。\n\n以\"下单支付\"为例：\n\n```\n主线：选商品 → 加购物车 → 下单 → 支付 → 订单完成\n\n支线（在每一步上做\"中断、回退、重复\"）：\n  选商品：商品下架、库存不足、价格变动\n  加购物车：重复加、超过上限、购物车过期\n  下单：地址无效、优惠券失效、超时未支付\n  支付：支付失败、支付超时、重复支付、支付成功但回调丢失\n  完成：发货延迟、退款申请\n```\n\n**支线的设计公式**：**主线的每一步 × { 中断、回退、重复、并发、超时 }** 通常就能生成完整的负向用例集。\n\n---\n\n## 9. 六维场景框架：开放题的通用解法\n\n清单里给的六维，是**审查\"测得够不够\"的对照表**，也是应付\"测电梯/测水杯\"这类题的模板。\n\n| 维度 | 要问的问题 | 展开方向 |\n| --- | --- | --- |\n| ① 功能流程 | 正常路径通吗？每一步中断/回退/重复会怎样？ | 主线 + 支线（场景法） |\n| ② 数据边界 | 空、超长、特殊字符、重复、非法格式、0/负数、单位换算 | 等价类 + 边界值 |\n| ③ 权限和安全 | 未登录、越权（水平/垂直）、敏感信息、频率限制、注入 | 矩阵：角色 × 接口 |\n| ④ 兼容性 | 浏览器、系统版本、网络状态、屏幕尺寸 | 正交降维 |\n| ⑤ 性能和稳定 | 高并发、重复提交、长时间运行、资源泄漏 | 压测 + 长跑 |\n| ⑥ 可观测性 | 日志、埋点、告警、错误码是否可定位 | 出了问题能不能查 |\n\n**这六维的顺序也有讲究**：从①到⑥，是\"用户直接感知 → 系统内部\"，面试时按这个顺序讲，逻辑最清晰。\n\n---\n\n## 10. 自查 Q1：用它展开「文件上传」，至少 30 个测试点\n\n按六维展开，共 38 个点。\n\n### ① 功能流程（8 点）\n\n| # | 测试点 | 关注 |\n| --- | --- | --- |\n| 1 | 上传 1KB 正常文件 → 成功，能预览/下载 | 主链路 |\n| 2 | 上传后立即下载，内容与原文件**完全一致**（比对 md5） | 传输完整性 |\n| 3 | 上传中点\"取消\" → 状态回到未上传，服务端不残留临时文件 | 中断 |\n| 4 | 上传到 80% 时断网 → 重连后能否续传/重试 | 中断 + 恢复 |\n| 5 | 同一文件重复上传 → 是覆盖、报错还是生成副本（**需求要确认**） | 重复 |\n| 6 | 批量上传 10 个文件（部分成功部分失败）→ 失败的是否明确列出 | 批量 |\n| 7 | 拖拽上传 / 从剪贴板粘贴图片上传 | 入口差异 |\n| 8 | 上传后删除 → 文件是否真删（服务端 + CDN 缓存） | 生命周期 |\n\n### ② 数据边界（11 点）\n\n| # | 测试点 | 关注 |\n| --- | --- | --- |\n| 9 | 0 字节空文件 | 边界 |\n| 10 | 刚好等于上限（如 10MB） | 上点 |\n| 11 | 上限 +1 字节（10MB+1B） | 离点，抓 `<=` 写成 `<` |\n| 12 | 远超上限（100MB） | 无效类 |\n| 13 | 文件名含中文、空格、emoji | 编码 |\n| 14 | 文件名超长（255 / 256 字符） | 文件系统边界 |\n| 15 | 文件名含路径穿越：`../../etc/passwd` | 安全，见③ |\n| 16 | 双扩展名 `a.php.jpg`、`a.jpg.exe` | 类型校验绕过 |\n| 17 | 改扩展名伪装类型（exe 改名 jpg） | 要校验**文件头**不只是扩展名 |\n| 18 | 无扩展名文件 | 边界 |\n| 19 | 特殊内容：超大分辨率图片、加密 PDF、损坏的 zip | 解析健壮性 |\n\n### ③ 权限和安全（8 点）\n\n| # | 测试点 | 关注 |\n| --- | --- | --- |\n| 20 | 未登录状态调用上传接口 | 鉴权 |\n| 21 | 越权：A 上传到 B 的空间（改 `ownerId`） | 水平越权 |\n| 22 | 上传后改 `fileId` 访问别人的文件 | 水平越权（访问侧） |\n| 23 | 上传 SVG 内含 `<script>`，预览时是否执行 | XSS |\n| 24 | 上传 HTML 文件能否被直接访问执行 | 存储型 XSS |\n| 25 | 文件下载 URL 是否可遍历/可猜测 | 未授权访问 |\n| 26 | 上传接口是否有频率限制（连续传 100 次） | 资源耗尽 |\n| 27 | 病毒/木马样本是否被拦截 | 依赖安全扫描（如 clamav） |\n\n### ④ 兼容性（5 点）\n\n| # | 测试点 | 关注 |\n| --- | --- | --- |\n| 28 | Chrome / Safari / Firefox / 微信内置浏览器 | 主流覆盖 |\n| 29 | PC / iOS / Android | 端差异 |\n| 30 | 弱网（2G/3G）上传大文件 → 超时提示是否友好 | 网络 |\n| 31 | 断网 → 恢复的提示和重试 | 网络 |\n| 32 | 不同系统的中文文件名编码（Windows GBK vs Mac UTF-8） | 编码 |\n\n### ⑤ 性能和稳定性（4 点）\n\n| # | 测试点 | 关注 |\n| --- | --- | --- |\n| 33 | 并发 100 个上传 → 成功率、耗时、错误率 | 并发 |\n| 34 | 大文件是否分片上传，内存占用是否随文件大小线性增长 | 资源 |\n| 35 | 分片上传断点续传：中断后续传不重复传已完成的片 | 工程能力 |\n| 36 | 连续上传 1000 次后服务端磁盘/临时目录是否清理 | 泄漏 |\n\n### ⑥ 可观测性（2 点）\n\n| # | 测试点 | 关注 |\n| --- | --- | --- |\n| 37 | 失败时的错误码是否可区分原因（超限/类型不符/网络/服务端） | 可定位 |\n| 38 | 日志里是否有 fileId、大小、耗时、失败原因；有无埋点 | 可追溯 |\n\n**讲这题时的加分动作**：先说框架（六维），再说\"我先按①主链路快速验证能不能用，再补②③的高危点（边界和越权），最后按④⑤做兼容和压测\"。**顺序体现的是风险意识，比点数量重要。**\n\n---\n\n## 11. 自查 Q8：AI 生成的登录页测试点，找 5 个遗漏\n\n先看一个典型的 AI 输出（很常见）：\n\n> 1. 用户名密码正确能登录\n> 2. 用户名错误提示\n> 3. 密码错误提示\n> 4. 用户名密码为空提示\n> 5. 用户名超长/特殊字符\n> 6. 密码长度不符合规则\n> 7. 记住我功能\n> 8. 忘记密码链接\n> 9. 密码显示/隐藏切换\n> 10. 回车键提交\n\n**它覆盖的是\"页面上能看见的东西\"，漏掉的都是\"看不见的\"。** 五个最有价值的遗漏：\n\n| # | 遗漏点 | 为什么重要 | 怎么测 |\n| --- | --- | --- | --- |\n| 1 | **账号枚举**：用户名不存在 vs 密码错误的提示是否相同 | AI 只写了\"提示用户名错误/密码错误\"，而这两条**恰恰是漏洞**——攻击者可以用它批量判断哪些账号存在 | 用不存在的用户和存在但密码错的用户分别登录，比对响应体、状态码、**响应耗时**（耗时有差异也能枚举） |\n| 2 | **token / 会话生命周期**：过期、续期、注销后失效、修改密码后其他端踢下线、并发登录互踢 | AI 只测了\"能登录\"，没测\"登录之后\" | token 过期后请求应返 401；注销后旧 token 立即失效；A 端改密码，B 端 token 应失效；同账号两端登录看是否互踢 |\n| 3 | **重复提交 / 并发**：双击登录、连点三次 | AI 完全没有并发视角。真实 bug：连点产生多个会话、多个登录日志、甚至重复发短信 | 用脚本同时发 10 个相同登录请求，断言只产生 1 个有效会话、扣 1 次失败次数 |\n| 4 | **安全攻击面**：SQL 注入、XSS、暴力破解频率限制、验证码绕过（直接调接口跳过验证码）、HTTPS | AI 只测了\"特殊字符\"这种表面输入，没测攻击载荷 | 用户名填 `' or '1'='1`；连错 10 次看是否锁定/限流；抓包删掉验证码字段直接提交；看密码是否在 query 里 |\n| 5 | **弱网与异常链路**：断网、超时、慢响应（按钮能否重复点）、服务端 500 时的提示 | AI 假设了\"网络永远正常\"。真实场景：弱网下用户连点，超时后实际已登录导致重复登录 | 用弱网工具（Chrome throttling / toxiproxy）加延迟，看 loading 状态和按钮是否禁用；注入 500 看前端提示是否泄露堆栈 |\n\n**如果继续找，还有这些**（体现深度）：\n\n- 可观测性：登录失败日志是否记录了原因和 IP，**有没有把密码打进日志**。\n- 兼容性：浏览器密码管理器的自动填充是否触发校验 bug、中文输入法下输入英文用户名、CapsLock 提示。\n- 易用性：Tab 键顺序、错误提示是否定位到具体字段、不能登录时是否给了下一步（比如\"账号被锁，请联系管理员\"）。\n- 埋点：登录成功/失败/耗时是否上报，用于监控成功率。\n\n**这题真正考的**：能不能识别\"AI 输出 = 正向功能点\"，然后补上**异常、并发、安全、可观测**四类。这也是清单里说的\"审查 AI 生成用例时的对照表\"。\n\n---\n\n## 12. 动手清单\n\n- [ ] 拿最近一个需求，按八种方法对照一遍，看有没有\"该用判定表却没画\"的地方。\n- [ ] 给你们的订单/工单画一次状态机，把 7 状态 × 事件 的合法/非法迁移列全。\n- [ ] 用六维框架重写一次旧用例，看看每个维度补出了多少条新用例。\n- [ ] 找一条 AI 生成的用例或者新人写的用例，用六维做一次审查，标出遗漏。\n","chars":9119,"codes":7,"tables":20},{"id":"defect","title":"缺陷与质量工程篇","desc":"缺陷单七要素/Severity vs Priority/左移右移","file":"测试开发-缺陷与质量工程篇.md","content":"# 测试开发-缺陷与质量工程篇\n\n> 对应清单：缺陷管理【必须掌握】全部 + 测试左移与右移【必须掌握（概念）】全部\n> 对应自查：Q6（左移和右移各一个可落地的事）、Q7（缺陷单必须包含的七个要素）\n> 立场：缺陷单是测试的\"作品\"，写不好等于问题没被发现；左移右移是质保的\"位置\"，理解了就知道该往哪使劲。\n\n---\n\n## 0. 先定位：从\"发现问题\"到\"质量工程\"\n\n| 层次 | 做什么 | 判断标准 |\n| --- | --- | --- |\n| 缺陷管理 | 把发现的问题**说清楚、跟到关闭** | 开发能不能只靠缺陷单复现并修复 |\n| 左移 | 在**问题发生前**就把它挡掉 | 需求/设计阶段发现的歧义和风险数 |\n| 右移 | 上线后**第一时间**发现漏测 | 漏测问题从发生到被发现的时间 |\n\n三段串起来就是一句话：**缺陷单让问题被修掉，左移让问题不产生，右移让漏网的问题跑不掉。**\n\n自查分级：\n\n| 内容 | 档位 | 说明 |\n| --- | --- | --- |\n| 缺陷单七要素 | 熟练 | 每天写 |\n| 严重程度 vs 优先级 | 熟练 | 最容易被混，也最容易被追问 |\n| 缺陷生命周期与分支 | 熟练 | 知道每个状态为什么存在 |\n| 左移的具体动作 | 能用出来 | 不能只背概念 |\n| 右移的具体动作 | 能用出来 | 同上 |\n\n---\n\n## 1. 缺陷单：七个要素（自查 Q7）\n\n### 1.1 七要素清单\n\n| # | 要素 | 作用 | 判断写得好不好 |\n| --- | --- | --- | --- |\n| 1 | **标题** | 一句话说清\"什么场景下发生了什么\" | 只看标题就知道问题，不需要点开 |\n| 2 | **复现步骤** | 让开发照着走一遍能复现 | 步骤可执行，含前置数据 |\n| 3 | **实际结果 vs 期望结果** | 说清\"错在哪\" | 期望有出处（需求/接口文档/常识） |\n| 4 | **环境信息** | 缩小范围 | 版本号、环境、账号、数据集 |\n| 5 | **日志和截图** | 证据 | 有请求响应/堆栈/关键日志，不是只有截图 |\n| 6 | **严重程度（Severity）** | 技术影响多大 | 按影响面判定，不按\"难不难修\" |\n| 7 | **优先级（Priority）** | 多急着修 | 按业务影响和时机判定 |\n\n### 1.2 标题：一句话公式\n\n```\n【场景】+【操作】+【错误现象】\n```\n\n| 差 | 好 | 差在哪 |\n| --- | --- | --- |\n| 下单有问题 | 下单页选择优惠券后，订单金额未扣减优惠（应减 10 实为原价） | 前者无法判断，后者一眼看出影响 |\n| 接口报错 | 创建订单接口并发 10 次时，返回 500（Duplicate entry 'uk_order_no'） | 前者只说\"错\"，后者带条件、现象、关键错误信息 |\n| 登录失败 | 管理员账号登录后，访问订单列表返回 403（普通用户可正常访问） | 前者分不清是登录问题还是权限问题 |\n\n**标题里带上关键错误码或报错信息**，能让开发在没点开之前就开始想原因。\n\n### 1.3 复现步骤：要能\"照着做\"\n\n```\n❌ 差：\n  1. 下单\n  2. 支付\n  3. 报错\n\n✅ 好：\n  前置：测试账号 qa01（已绑定手机号），商品 SKU 1001 库存 1\n  1. App 端加购 SKU 1001，数量 1\n  2. 进入结算页，选择优惠券\"满 100 减 10\"\n  3. 点击\"提交订单\"\n  实际：页面提示\"系统繁忙\"，订单列表无新订单\n  期望：创建订单成功，金额 90 元\n  备注：去掉优惠券后正常；连续提交 3 次均失败\n```\n\n三个关键点：\n\n1. **前置条件**：账号状态、数据状态（库存、余额），这是\"我这边复现不了\"的头号原因。\n2. **具体数据**：SKU 号、金额、优惠券名，不要写\"选一个商品\"。\n3. **\"备注\"里的对比信息**：去掉某条件就好了 —— 这条信息直接把范围缩小一半，含金量极高。\n\n### 1.4 实际 vs 期望：期望要有出处\n\n```\n实际：返回 200 + {\"code\": 0, \"data\": null}\n期望：返回 200 + {\"code\": 0, \"data\": {\"order_id\": \"...\"}}\n依据：《订单服务接口文档 v2.3》§3.1 规定成功时 data 必返 order_id\n```\n\n写\"期望\"时永远带上**依据**（需求文档章节、接口文档、同类接口的行为、行业常识）。否则开发一句\"设计如此\"就给你挡回来了。\n\n### 1.5 环境信息：能写多细写多细\n\n```\n- 环境：测试环境 test（host: api.test.example.com）\n- 版本：order-service v2.3.1（2026-10-28 发布的构建 #4521）\n- 端：App iOS 17.2 / Chrome 130\n- 账号：qa01（user_id=1001，普通用户）\n- 数据：SKU 1001，库存 1；优惠券模板 88\n- 时间：2026-10-29 10:15 左右\n```\n\n**\"版本号 + 时间\"这两项最容易被漏**，但它们是开发定位\"是不是我这次改的\"的唯一线索。\n\n### 1.6 日志和截图：证据比描述有力\n\n| 该给什么 | 为什么 |\n| --- | --- |\n| 请求（method/url/header/body） | 证明参数传对了 |\n| 响应（状态码/body） | 证明返回了什么 |\n| 服务端错误日志/堆栈 | 直接指向代码行 |\n| traceId | 让开发能捞全链路 |\n| 截图/录屏 | 前端问题、交互问题必须给 |\n| 数据库查询结果 | 证明数据没落库或落错了 |\n\n**优先给\"请求 + 响应 + 错误日志\"这三样**，比截图有用得多。截图只证明\"界面长这样\"，不证明\"服务端发生了什么\"。\n\n### 1.7 严重程度 vs 优先级：这是两个维度\n\n这是缺陷管理里最容易混、也最常被面试追问的地方。\n\n| 维度 | 看什么 | 谁定 |\n| --- | --- | --- |\n| **严重程度 Severity** | **技术影响**：功能是否可用、数据是否损坏、影响面多大 | 测试（技术判断） |\n| **优先级 Priority** | **业务紧急度**：什么时候必须修好 | 产品/项目经理（业务判断） |\n\n**四象限（两个维度不同的最好证明）：**\n\n| | 优先级高 | 优先级低 |\n| --- | --- | --- |\n| **严重程度高** | 下单必崩、资损、数据错乱 → **立即修** | 极端场景才崩溃（如金额 99999999 时溢出）→ 排期修，但记在案 |\n| **严重程度低** | 首页品牌名错别字、价格显示错位 → **立即修**（虽然不严重，但影响大） | UI 细节、文案优化 → 有空修 |\n\n**两个经典判断**：\n\n- \"首页 logo 显示成竞品\" → Severity 低（不影响功能），Priority **最高**（品牌事故）。\n- \"导出 10 万条数据时内存溢出\" → Severity 高（崩溃），Priority 可以中（用户很少导这么多）。\n\n**测试只负责 Severity，不要越权定 Priority** —— 但要把\"业务影响\"写进缺陷描述，让产品能做判断。\n\n### 1.8 一个完整的缺陷单示例\n\n```markdown\n标题：结算页选择\"满100减10\"优惠券后，订单金额仍为原价（应减10）\n\n环境：\n- 测试环境 test，order-service v2.3.1（构建 #4521）\n- 前端 App iOS 17.2\n- 账号 qa01（user_id=1001，新用户）\n- 时间 2026-10-29 10:15\n\n前置条件：\n- 商品 SKU 1001，单价 100.00，库存 1\n- 账号 qa01 持有一张\"满 100 减 10\"优惠券（模板 88），状态可用\n\n复现步骤：\n1. 加购 SKU 1001 ×1\n2. 结算页勾选优惠券\"满 100 减 10\"\n3. 点击提交订单\n\n实际结果：\n订单创建成功，实付金额 100.00（未扣减 10 元），\n接口返回 {\"code\":0,\"data\":{\"order_id\":\"O-20261029-001\",\"pay_amount\":100.00}}\n日志：`couponService.calcDiscount` 返回 0，discount_amount=0\n\n期望结果：\n实付金额 90.00，接口 pay_amount=90.00\n依据：优惠券需求文档 v1.2 §2.1「满足门槛后直接减 10 元」\n\n补充信息（有助于定位）：\n- 直接走接口下单（绕过前端）同样不扣减 → 不是前端问题\n- 换成\"满 200 减 30\"的券正常 → 与该券模板配置有关\n- 今日为周三，该券规则含\"仅限周末\"→ 怀疑周末校验逻辑错误拦截\n\n严重程度：高（金额错误，用户可感知，涉及资金）\n优先级：高（建议今日修复）\n\n附件：\n- request_response.json（失败现场）\n- order-service 日志片段（traceId: 8f2c...）\n- 结算页截图\n```\n\n**这个缺陷单的价值**：开发拿到后基本不用问任何问题 —— 复现路径清楚、期望有依据、补充信息已经把范围缩小到\"某个券模板的周末校验\"。\n\n---\n\n## 2. 缺陷生命周期\n\n### 2.1 主流程\n\n```\n新建(New) → 已确认(Confirmed) → 已修复(Fixed) → 已验证(Verified) → 已关闭(Closed)\n```\n\n| 状态 | 谁动 | 判断标准 |\n| --- | --- | --- |\n| 新建 | 测试 | 提交即进入 |\n| 已确认 | 开发/测试 | 开发确认能复现，**接受为缺陷** |\n| 已修复 | 开发 | 代码已改，**提交到了某个构建** |\n| 已验证 | 测试 | 在对应构建上验证通过 |\n| 已关闭 | 测试 | 回归通过，可关闭 |\n\n### 2.2 分支（每个分支都是一次判断）\n\n| 分支 | 含义 | 责任在谁 | 怎么处理 |\n| --- | --- | --- | --- |\n| **拒绝 Rejected** | 不是缺陷 | 开发提出，测试确认 | 三种情况：设计如此、需求没要求、环境问题。**要给出理由和依据** |\n| **无法复现** | 按步骤复现不出来 | 开发 | 测试要补充日志/录屏，或找相同条件的机器再试。**不能直接关** |\n| **重复 Duplicate** | 已有同类缺陷 | 谁发现 | 关联到主缺陷，关闭本条 |\n| **延期 Deferred** | 确认是缺陷但这次不修 | 产品决策 | 必须记录原因和目标版本，**不能\"悄悄延期\"** |\n| **重开 Reopened** | 修复后验证仍存在 | 测试 | 附上新的失败证据，标注\"第 N 次重开\" |\n\n**\"拒绝\"和\"延期\"是最容易产生争议的两个**，处理原则：\n\n- 拒绝时必须写清**依据**（文档章节、行业标准、产品确认记录），不能只写\"设计如此\"。\n- 延期必须**产品签字 + 记目标版本**，否则等于丢了。\n- **测试不接受\"这是我这边环境问题\"这种模糊拒绝**，要具体到\"哪个环境、什么配置\"。\n\n### 2.3 四个值得关注的指标\n\n| 指标 | 算法 | 用来判断什么 |\n| --- | --- | --- |\n| 缺陷密度 | 缺陷数 / 需求点 或 / 千行代码 | 哪个模块质量差、要不要加测 |\n| **缺陷逃逸率** | 线上缺陷 /（线上 + 测试发现） | 测试有效性。**这是最能反映质量的指标** |\n| 重开率 | 重开的缺陷 / 已修复缺陷 | 修复质量、开发是否只改表面 |\n| 平均修复时长 | 从确认到修复的时间 | 协作效率、是否被长期积压 |\n\n**逃逸率高的时候看什么**：是需求没理解透（用例漏了）、还是环境差异（测不出）、还是时间不够（没测完）。这三种的改进方向完全不同。\n\n---\n\n## 3. 测试左移（Shift-Left）\n\n### 3.1 一句话\n\n> **把质量活动提前到\"问题还没写成代码\"的阶段。**\n\n经济学基础：缺陷发现越早，修复成本越低（1:10:100 的量级）。但更重要的理由是：**很多问题在编码之后根本没法测**——需求本身有歧义、接口没返回必要字段、日志不带 traceId，这些等到测试阶段就已经晚了。\n\n### 3.2 四个落点（对应研发流程的四个阶段）\n\n| 阶段 | 测开能做的事 | 产出物 |\n| --- | --- | --- |\n| **需求评审** | 带\"可测性清单\"去评审，识别歧义和不可验证点 | 需求疑问清单、可测性评估 |\n| **技术方案评审** | 确认日志、接口、埋点能否支撑验证 | 可观测性需求（traceId、错误码、关键日志） |\n| **编码阶段** | 推动单测覆盖、静态检查、CI 门禁 | 单测覆盖率门槛、lint 规则、PR 检查项 |\n| **提测前** | 让开发自测冒烟（提供自测清单或脚本） | 自测冒烟用例集 |\n\n### 3.3 需求评审的可测性清单（可以直接拿去用）\n\n评审时逐条问，问出问题就是左移的价值：\n\n```\n1. 这个需求的成功/失败状态，接口返回里能区分吗？（有没有明确的 code/status）\n2. 失败原因够不够细？（\"操作失败\" vs \"库存不足\"）\n3. 涉及的状态变更，我能不能通过接口或数据库查到？\n4. 有没有后台配置项？配置改了能不能立刻生效、能不能回滚？\n5. 涉及异步的，我怎么确认处理完了？（有没有查询接口/状态字段）\n6. 权限怎么设计？不同角色看到的数据范围是什么？\n7. 有没有埋点？关键行为的成功率我能从监控看到吗？\n8. 上线后如果出错，靠什么第一时间发现？\n9. 这个需求会影响到哪些已有功能？（影响面）\n10. 有没有兼容性要求（老版本客户端、存量数据）？\n```\n\n**第 1、2、3、5 条最常问出问题**。真实例子：\n\n> 需求说\"提交后异步处理，处理完通知用户\"。我问：处理失败怎么办？状态怎么查？通知丢了用户怎么知道？\n> 结果产品补了\"我的申请\"列表页 + 失败状态 + 重试按钮 —— **这三项如果没在评审时问出来，测试阶段就只能测\"提交成功\"，失败路径完全不可测。**\n\n### 3.4 \"质量需求定义者\"是什么意思\n\n传统上测试是\"验收别人做完的东西\"；左移之后，测试（测开）在需求阶段就定义**\"这个功能要满足什么非功能要求才能算合格\"**：\n\n```\n功能需求（产品提）：用户能提交退款申请\n质量需求（测开提）：提交接口必须在 500ms 内返回、失败有明确错误码、\n                   重复提交只生成一条申请、退款状态可查询、\n                   操作日志可追溯、异常时告警\n```\n\n**这是测开在左移里最不可替代的角色**：产品不会想到幂等和可观测性，开发不会主动加错误码体系，只有测试会。\n\n---\n\n## 4. 测试右移（Shift-Right）\n\n### 4.1 一句话\n\n> **上线不是终点。发布之后继续保障质量，并且让\"漏测的问题\"能被快速发现。**\n\n核心问题不是\"怎么测得更全\"（永远测不全），而是：**漏掉的那个问题，多久能被发现？**\n\n### 4.2 五个落点\n\n| 落点 | 做什么 | 测开的角色 |\n| --- | --- | --- |\n| **线上监控** | 核心接口的成功率、P99、错误码分布、业务指标 | 定义\"什么指标异常代表出问题\" |\n| **告警** | 阈值、收敛、值班 | **验证告警真的能触发**（没演练过的告警等于没有） |\n| **灰度验证** | 1% → 10% → 50% → 100%，每步看指标 | 设计每步的验证清单和回滚判断标准 |\n| **混沌演练** | 主动注入故障（下游超时、实例挂掉） | 验证降级/熔断是否按设计工作 |\n| **用户反馈闭环** | 客服工单、应用市场评论、用户投诉 → 转成缺陷 | 把\"用户报的问题\"变成\"可复现的用例\" |\n\n### 4.3 灰度验证的检查清单（这是右移里最实操的一块）\n\n每一步灰度，都要回答同一个问题：**\"现在停，能不能退回去？\"**\n\n```\n1. 错误率：新版本的 5xx 率是否高于旧版本基线（对比同期）\n2. 延迟：P99 是否劣化超过 20%\n3. 业务指标：下单成功率、支付成功率、关键转化是否异常\n4. 资源：CPU/内存/连接数是否异常上涨\n5. 日志：有没有新增的错误类型\n6. 用户侧：客服工单有没有出现新类型投诉\n```\n\n**测开在这里的价值是\"定义基线\"**：没有基线，看任何数字都不知道是好是坏。\n\n### 4.4 右移里最容易被忽略的一件事\n\n**验证\"告警能触发\"**。很多团队配了告警，但从没验证过，结果真出事时发现：\n- 阈值配错了（永远不触发）\n- 通知发到了离职员工的邮箱\n- 告警风暴把通知淹没了\n\n**测开的动作**：每个季度做一次\"告警演练\" —— 人为造一次错误，确认告警在规定时间内到达正确的人。成本极低，收益在事故当天体现。\n\n---\n\n## 5. 自查 Q6 完整作答：左移右移各一个可落地的事\n\n**要求是\"可以在当前项目落地\"，所以不能讲概念，要讲产出物、时间、谁来做。**\n\n### 5.1 左移：在需求评审里引入「可测性检查清单」\n\n**做什么**：\n\n> 我会整理一份 10 条的可测性检查清单（见 §3.3），在下一次需求评审时带进去逐条过，把\"测不了\"的问题当场提出来。\n\n**产出物**：\n\n1. 一份《需求可测性检查清单》（10 条，团队共享）。\n2. 每次评审后更新《需求疑问清单》，每条带\"我的建议 + 影响\"。\n3. 在需求文档里补充\"可观测性要求\"章节（错误码、日志、traceId、埋点）。\n\n**具体例子（这样讲才有说服力）**：\n\n> 上个需求是\"申请退款\"，需求只写了\"提交后异步处理\"。我按清单第 3、5 条问：退款状态怎么查？失败怎么办？\n> 结果补了\"退款单状态字段 + 我的申请列表 + 失败重试\"。**如果没问，测试阶段只能验证\"提交成功\"，失败路径完全测不了，线上出问题也没法排查。**\n\n**怎么衡量有效**：\n\n- 需求评审提出的问题数（从 0 条到每次 3~5 条）。\n- 提测后因\"需求歧义\"导致的返工次数下降。\n\n**为什么这个最容易落地**：不需要任何工具和权限，只需要一份清单和一次评审会，下次需求就能用。\n\n### 5.2 右移：给核心链路配 3 条告警，并做一次「告警演练」\n\n**做什么**：\n\n> 给下单支付链路的三个关键指标配告警：**接口错误率**（5 分钟内 5xx 率 > 1%）、**P99 延迟**（超过基线 2 倍）、**业务量异常**（下单成功率跌破日常区间）。然后**人为制造一次异常，验证告警真的能收到**。\n\n**产出物**：\n\n1. 3 条告警规则 + 接收人 + 值班表。\n2. 一次演练记录：造了什么错、多久触发、发给了谁、内容是否可行动。\n3. 一份《核心链路监控基线》：把当前的成功率、P99 记下来，作为以后对比的基准。\n\n**具体例子**：\n\n> 我把下游支付网关 mock 成持续返回 500，观察：\n> - 应用错误率告警 2 分钟内触发 ✅\n> - 但业务量告警没触发（阈值定太高）→ 调整\n> - 告警内容只有\"错误率异常\"，没有接口名和 traceId → 改成带上下文的模板\n> 这次演练改掉了两个问题，**如果不演练，这两个问题会在真出事的时候一起暴露。**\n\n**怎么衡量有效**：\n\n- 漏测问题的**发现时间**（从\"用户投诉\"缩短到\"告警触发\"）。\n- 告警的**有效率**（每次触发都值得处理，而不是被忽略）。\n\n**为什么这个可落地**：监控平台一般都有，不用新采购；成本是配三条规则 + 一小时的演练。\n\n### 5.3 两个都要说清\"测开的角色\"\n\n> 左移里我是**质量需求的定义者**——产品不会提幂等和可观测性，开发不会主动加错误码，只有测试会。\n> 右移里我是**监控基线的定义者和告警的验证者**——配告警不难，难的是定什么阈值、以及确认它真的会响。\n\n---\n\n## 6. 自查 Q7 完整作答：缺陷单的七个要素\n\n> 七个要素：**标题、复现步骤、实际结果、期望结果、环境信息、日志/截图、严重程度与优先级**。\n\n| # | 要素 | 写法要点 |\n| --- | --- | --- |\n| 1 | 标题 | 公式：场景 + 操作 + 错误现象。带上关键错误码/报错信息 |\n| 2 | 复现步骤 | 带前置条件（账号/数据状态）+ 具体数据（ID/金额），附\"对比信息\"（去掉某条件就正常） |\n| 3 | 实际结果 | 具体到返回值/界面表现/数据库状态，不是\"报错了\" |\n| 4 | 期望结果 | 必须带**依据**（需求文档章节、接口文档、同类接口行为） |\n| 5 | 环境信息 | 环境、版本号、端、账号、数据集、时间 |\n| 6 | 日志/截图 | 优先给请求 + 响应 + 错误堆栈 + traceId；截图是补充不是主力 |\n| 7 | 严重程度 / 优先级 | Severity 看技术影响（测试定），Priority 看业务紧急度（产品定），两个维度要分开 |\n\n**再补一句区分（这是加分点）**：\n\n> 严重程度和优先级不是一个东西。首页 logo 显示成竞品：严重程度低（不影响功能），但优先级最高（品牌事故）；导出 10 万条数据时 OOM：严重程度高，但优先级可以排期（用户很少这么用）。所以测试负责定 Severity 并在描述里写清业务影响，Priority 由产品定。\n\n---\n\n## 7. 动手清单\n\n- [ ] 从历史缺陷里挑 3 条\"写得不好\"的，按七要素重写一遍，对比信息量差异。\n- [ ] 把 §3.3 的可测性清单带进下一次需求评审，记录提了几个问题。\n- [ ] 给核心链路配 3 条告警，然后**人为触发一次**，确认能收到。\n- [ ] 算一次你们的缺陷逃逸率，找出线上漏测的问题，看是需求/环境/时间哪一类原因。\n","chars":6301,"codes":9,"tables":13}]},{"name":"五、接口测试与自动化","articles":[{"id":"api-basic","title":"接口基础与抓包篇","desc":"OpenAPI 读法/抓包/签名与时间戳/Token","file":"测试开发-接口基础与抓包篇.md","content":"# 测试开发-接口基础与抓包篇\n\n> 对应清单：接口基础【必须掌握】+ 接口调试工具【必须掌握一个】\n> 对应自查：Q5（签名接口——参数排序 + MD5，封装怎么设计）\n> 立场：接口测试的第一步不是写用例，是**能准确知道\"真实的请求长什么样\"**。文档会骗你、抓包不会。\n\n---\n\n## 0. 先定位：三件事决定你接口测试的下限\n\n| 能力 | 决定了什么 | 缺了会怎样 |\n| --- | --- | --- |\n| 读懂接口文档 | 用例设计的输入是否完整 | 只测文档写的字段，漏了隐藏参数和错误码分支 |\n| 抓包 | 能否拿到**真实请求**作为对照 | 文档和实际不一致时，你按文档测，开发按实现怼 |\n| 处理签名/加密 | 能否自动化调通受保护接口 | 手工能通、脚本不通，卡在签名上 |\n\n自查分级：\n\n| 内容 | 档位 | 说明 |\n| --- | --- | --- |\n| OpenAPI/Swagger 结构 | 熟练 | 能直接从文档提炼测试点 |\n| 抓包（HTTPS/App） | 熟练 | 至少一个工具能抓 App |\n| 签名与时间戳 | 会用能讲清 | 常见坑都在这 |\n| Token 获取与传递 | 熟练 | 每天 |\n| Postman/Apifox 集合与脚本 | 熟练 | 至少一个能用顺 |\n\n---\n\n## 1. 会读接口文档：从 OpenAPI 直接提炼测试点\n\n### 1.1 OpenAPI 的结构骨架\n\n```yaml\nopenapi: 3.0.1\ninfo:\n  title: 订单服务\n  version: 2.3.1\nservers:\n  - url: https://api.test.example.com\nsecurity:\n  - bearerAuth: []              # 全局鉴权：默认所有接口都要 token\n\npaths:\n  /api/orders:\n    post:\n      summary: 创建订单\n      parameters:\n        - name: X-Request-Id          # in: header\n          in: header\n          required: true\n          schema: { type: string, maxLength: 64 }\n        - name: dry-run              # in: query\n          in: query\n          required: false\n          schema: { type: boolean, default: false }\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/CreateOrderReq'\n      responses:\n        '201': { description: 创建成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResp' } } } }\n        '400': { description: 参数错误 }\n        '401': { description: 未登录 }\n        '409': { description: 重复提交 }\n        '429': { description: 被限流 }\n\n  /api/orders/{order_no}:\n    get:\n      parameters:\n        - name: order_no\n          in: path\n          required: true\n          schema: { type: string, pattern: '^O-\\d{12}$' }\n\ncomponents:\n  schemas:\n    CreateOrderReq:\n      type: object\n      required: [sku_id, num]\n      properties:\n        sku_id:   { type: integer, minimum: 1 }\n        num:      { type: integer, minimum: 1, maximum: 99 }\n        coupon_id:{ type: string, nullable: true }\n        remark:   { type: string, maxLength: 200 }\n      additionalProperties: false        # 多余字段应被拒绝\n    ApiResp:\n      type: object\n      properties:\n        code: { type: integer, enum: [0, 40001, 40002] }\n        msg:  { type: string }\n        data: { type: object, nullable: true }\n  securitySchemes:\n    bearerAuth:\n      type: http\n      scheme: bearer\n      bearerFormat: JWT\n```\n\n### 1.2 读文档的顺序（五分钟能提炼出整套用例）\n\n```\n1. servers          → 有哪几个环境，测试环境是哪个\n2. security         → 全局要不要鉴权，个别接口有没有覆盖\n3. paths            → 接口清单（这就是你的用例目录结构）\n4. parameters       → 每个接口的参数在哪（query/path/header/body）、必填、约束\n5. schemas          → 字段类型、范围、枚举、nullable、additionalProperties\n6. responses        → 每种状态码对应什么（**错误码分支就是负向用例清单**）\n```\n\n**从上面那段 YAML 能直接提炼的测试点（举 8 条）**：\n\n| 来源 | 测试点 |\n| --- | --- |\n| `X-Request-Id required` | 不传 → 400；超 64 字符 → 400；传了但重复的两条请求 → 是否幂等 |\n| `dry-run` query | true 时是否真的不落库；非法值 `dry-run=abc` |\n| `sku_id minimum: 1` | 0、-1 被拒；1 通过 |\n| `num maximum: 99` | 99 通过，100 被拒 |\n| `additionalProperties: false` | 多传一个字段是否被拒（很多实现会默默忽略） |\n| `code enum [0,40001,40002]` | 枚举外的码说明有未文档化分支 → 要问清 |\n| `responses 409` | 重复提交的返回形态，配合幂等键验证 |\n| `pattern '^O-\\d{12}$'` | 路径参数格式非法时返回 400 还是 404 |\n\n### 1.3 接口文档的五个常见缺陷（读的时候要能发现）\n\n| 缺陷 | 后果 | 你要做的 |\n| --- | --- | --- |\n| **没写错误码枚举** | 不知道有多少个失败分支 | 拿 `responses` 和实际返回对照，补全清单 |\n| **required 标错** | 你以为可选，实际必填 | 用抓包或实际调用验证 |\n| **没写约束**（长度、范围、枚举） | 漏测边界 | 边界值自己推导，写进用例并在评审确认 |\n| **响应没有 schema** | 无法自动化断言结构 | 用实际响应生成 schema（AI 能做，但要人审） |\n| **没有版本/变更记录** | 接口改了不知道 | 每次联调对比一次响应结构（契约测试） |\n\n**真实动作**：拿到文档后，先用抓包或实际调用跑一遍主流程，**把文档和实际响应差异列出来**，这是\"读文档\"和\"验证文档\"的区别。\n\n---\n\n## 2. 抓包：拿到真实请求的唯一手段\n\n### 2.1 工具选型（清单给的四款 + 补充）\n\n| 工具 | 特点 | 什么时候选它 |\n| --- | --- | --- |\n| **Charles** | 老牌，界面友好，断点/重写/弱网模拟齐全 | 团队都熟、要 GUI |\n| **Reqable** | 抓包 + 调试一体（类似 Charles + Postman），中文、免费版够用 | **移动端测试多的人首选** |\n| **Fiddler** | Windows 老牌，脚本能力强（FiddlerScript） | 只做 Windows 端的团队 |\n| **mitmproxy** | 命令行/可编程（Python 插件） | **要做自动化、批量改包、CI 里用** |\n| **Chrome DevTools** | 无需配置，能看到 Web 请求 | 只测 Web，最快的入口 |\n\n**结论**：日常手工用 Charles 或 Reqable；**要写脚本、要批量处理、要在 CI 里做流量回放，用 mitmproxy**（它是 Python 的，和测开技术栈天然契合）。\n\n### 2.2 抓 HTTPS 的原理（必须能讲）\n\n```\n客户端 ──(以为在连服务器)──▶ 抓包工具 ──(真连)──▶ 服务器\n             ▲                    │\n             └── 抓包工具的根证书 ──┘\n```\n\n抓包工具是**中间人（MITM）**：它给客户端出示自己签发的证书，客户端如果信任了这个根证书，就会和它建立 TLS，然后再由它去连服务器。所以：\n\n- **必须装根证书并信任**，否则客户端报证书错误（或者干脆看不到明文）。\n- **App 比浏览器难抓**，因为 ① Android 7+ 默认不信任用户证书 ② 有些 App 做了 SSL Pinning ③ 有些 App 检测代理。\n\n### 2.3 抓 App 的三个坎（这是实操里真正卡人的地方）\n\n| 坎 | 现象 | 解法 |\n| --- | --- | --- |\n| Android 7+ 不信任用户证书 | 装了证书还是抓不到（报 `CERTIFICATE_VERIFY_FAILED`） | 用 **debug 包**（AndroidManifest 里配 `networkSecurityConfig` 允许用户证书），或 root 后把证书装进系统区 |\n| SSL Pinning | 抓到的是 `ClientHello` 后直接断开 | 用测试包（开发关掉 pinning），或 Frida hook（专业渗透手段，测开一般不自己做） |\n| 检测代理 | 一连代理就报\"网络异常\" | 用透明代理（iptables 转发），或直接让开发给测试包关闭检测 |\n\n**现实做法**：**让开发出一个测试包**（允许用户证书 + 关闭 pinning），这是最省事、也最合规的路径。自己想办法绕过 pinning 属于渗透范畴，不是接口测试的必需技能。\n\n### 2.4 手机抓包步骤（以 Charles/Reqable 为例）\n\n```\n1. 手机和电脑连同一个 WiFi\n2. 手机 WiFi 设置里配 HTTP 代理：电脑 IP + 抓包工具端口（Charles 默认 8888）\n3. 手机浏览器访问 chls.pro/ssl（Charles）或工具的证书地址，下载并安装证书\n4. iOS 还要去「设置 → 通用 → 关于本机 → 证书信任设置」手动打开开关 ← 最容易漏\n5. 抓包工具里确认能看到请求；看不到就先检查代理和证书\n```\n\n### 2.5 mitmproxy：能用脚本处理流量（测开该会的那一档）\n\n```bash\n# 启动（默认 8080 端口）\nmitmdump -p 8080\n\n# 保存流量，事后分析\nmitmdump -p 8080 -w flows.mitm\n\n# 重放保存的流量（回归、压测都用得上）\nmitmdump -nc \"http.Client()\" --server-replay flows.mitm\n\n# 屏幕实时看（类似 top）\nmitmproxy -p 8080\n```\n\n```python\n# 插件：给所有请求自动加上测试标识头，并打印慢请求\n# 保存为 add_header.py，用 mitmdump -s add_header.py 启动\nimport time\nfrom mitmproxy import http\n\n\ndef request(flow: http.HTTPFlow) -> None:\n    flow.request.headers[\"X-QA-Env\"] = \"autotest\"\n    flow.metadata[\"start\"] = time.time()\n\n\ndef response(flow: http.HTTPFlow) -> None:\n    cost = time.time() - flow.metadata.get(\"start\", time.time())\n    if cost > 1:\n        print(f\"[SLOW] {cost:.2f}s {flow.request.method} {flow.request.url}\")\n```\n\n**这个插件的实际价值**：批量给请求打标记（方便在服务端日志里筛出测试流量）、统计慢接口、改包做异常注入（把响应状态码改成 500，测前端容错）。\n\n### 2.6 抓包能帮你做的四件事\n\n1. **还原没文档的接口**：老系统、第三方 SDK 的接口，抓一次就有完整参数。\n2. **发现隐藏参数**：文档没写的 `X-Sign`、`device_id`、`channel`，这些往往是签名和风控的关键。\n3. **复现线上问题**：把用户环境的请求原样重放。\n4. **对比多端差异**：App 和 Web 调同一个接口，参数可能不同（多出 `platform`），这是\"我只在 App 上复现\"的原因。\n\n---\n\n## 3. 加密与签名接口：处理思路\n\n### 3.1 签名是怎么生成的（最常见的三种形态）\n\n**形态 A：参数排序 + 拼接 + 密钥 + MD5（自查 Q5 就是这种）**\n\n```python\nimport hashlib\n\ndef gen_sign(params: dict, secret: str) -> str:\n    \"\"\"最常见的签名算法：\n    1. 去掉空值和 sign 字段\n    2. key 按字典序升序排列\n    3. 拼成 k1=v1&k2=v2 形式\n    4. 末尾拼上 secret\n    5. MD5（大写）\n    \"\"\"\n    items = [(k, str(v)) for k, v in params.items() if k != \"sign\" and v not in (None, \"\")]\n    items.sort(key=lambda x: x[0])\n    raw = \"&\".join(f\"{k}={v}\" for k, v in items) + secret\n    return hashlib.md5(raw.encode(\"utf-8\")).hexdigest().upper()\n```\n\n**形态 B：HMAC-SHA256**（更安全，支付类常见）\n\n```python\nimport hmac\nimport hashlib\n\ndef gen_hmac(params: dict, secret: str) -> str:\n    items = sorted((k, str(v)) for k, v in params.items() if k != \"sign\" and v not in (None, \"\"))\n    raw = \"&\".join(f\"{k}={v}\" for k, v in items)\n    return hmac.new(secret.encode(), raw.encode(), hashlib.sha256).hexdigest()\n```\n\n**形态 C：RSA 私钥签名**（第三方对接常见，尤其支付）\n\n```python\nfrom Crypto.Signature import pkcs1_15\nfrom Crypto.Hash import SHA256\nfrom Crypto.PublicKey import RSA\nimport base64\n\ndef rsa_sign(raw: str, private_key_pem: str) -> str:\n    key = RSA.import_key(private_key_pem)\n    h = SHA256.new(raw.encode())\n    return base64.b64encode(pkcs1_15.new(key).sign(h)).decode()\n```\n\n**测试要关注的是\"变体\"，不是算法本身**：\n\n| 变体点 | 测试要点 |\n| --- | --- |\n| 参与签名的字段范围 | 是所有参数，还是白名单？`sign`、`file`、空值是否排除 |\n| 排序规则 | 字典序 / 大小写敏感 / 按值排序 |\n| 空值处理 | 空字符串参与还是剔除？（**这是最容易对不上的地方**） |\n| 拼接格式 | `k=v&` 还是 `k=v`；末尾有没有 `&`；key 和 value 之间有没有 `=` |\n| 密钥 | 从哪拿（配置/环境变量）、有几套（每个渠道一套） |\n| 编码/大小写 | MD5 大写还是小写；URL 编码是否参与 |\n\n### 3.2 时间戳与防重放\n\n```\nparams = {..., timestamp: 1720000000, nonce: \"8f2c1a\", sign: \"...\"}\n```\n\n服务端校验三件事：\n\n| 校验 | 失败表现 | 测试用例 |\n| --- | --- | --- |\n| `abs(now - timestamp) <= 300` | 报\"签名已过期\" | 传 10 分钟前的时间戳 → 必须被拒 |\n| nonce 未使用过 | 报\"重复请求\" | 同一 nonce 重放两次 → 第二次必须被拒 |\n| sign 正确 | 报\"签名错误\" | 改任一参数不改 sign → 被拒 |\n\n**真实的坑：服务器时钟不同步**。测试机时间比服务器快 10 分钟，签名一直失败，报\"timestamp 过期\"，但代码看着没问题。**排查方式**：对比 `date` 和服务器返回的 `Date` 头。\n\n### 3.3 Token 的获取与传递\n\n```\n登录接口 → 返回 token（或 access_token + refresh_token）\n后续请求 Header: Authorization: Bearer <token>\ntoken 过期（401）→ 用 refresh_token 换新的，或用账号密码重新登录\n```\n\n| 测试点 | 怎么测 |\n| --- | --- |\n| token 缺失 | 不带 Header → 401 |\n| token 格式错 | `Authorization: abcd`（没有 Bearer）→ 401 |\n| token 过期 | 用过期 token → 401 + 明确的错误码 |\n| token 被篡改 | 改中间几位 → 401（签名校验） |\n| token 被踢 | 同账号另一设备登录 → 旧 token 是否失效 |\n| token 有效期 | 看 `expires_in`，等待/伪造过期验证 |\n\n---\n\n## 4. 接口调试工具：Postman / Apifox / Reqable / Insomnia\n\n### 4.1 选型（清单给的判断很准，补充\"什么时候不该用\"）\n\n| 工具 | 别用它的时候 |\n| --- | --- |\n| Postman | 团队要做 API 文档管理（它偏调试，文档能力弱） |\n| Apifox | 只需要临时调一个接口（略重） |\n| Reqable | 只做纯接口自动化（它的自动化能力弱于 Postman/Apifox） |\n| Insomnia | 需要复杂脚本/CI（生态弱） |\n\n### 4.2 Postman 的五个必须会\n\n```javascript\n// 1. 环境变量（{{base_url}}）与集合变量（{{token}}）分层\n// 2. 前置脚本：生成签名/时间戳\nconst crypto = require('crypto-js');\nconst ts = Math.floor(Date.now() / 1000).toString();\npm.environment.set(\"timestamp\", ts);\npm.environment.set(\"sign\", crypto.MD5(`ts=${ts}&key=secret`).toString());\n\n// 3. 后置脚本：提取 token 给后续请求用\nconst json = pm.response.json();\npm.environment.set(\"token\", json.data.token);\n\n// 4. 断言\npm.test(\"业务码为 0\", () => pm.expect(pm.response.json().code).to.eql(0));\npm.test(\"响应时间 < 500ms\", () => pm.expect(pm.response.responseTime).to.be.below(500));\n\n// 5. Collection Runner / Newman（CI 里跑集合）\n```\n\n```bash\n# Newman：把 Postman 集合跑在 CI 里\nnpm install -g newman\nnewman run collection.json -e test.postman_environment.json --reporters cli,html\n```\n\n### 4.3 Apifox 的差异化能力\n\n- **Mock 服务**：定义好接口后自动生成 Mock（给前端联调和手工测试供数）。\n- **自动化测试**：把接口编排成场景，带断言和环境。\n- **API 变更对比**：文档和实际请求对比。\n\n**它的价值**：一个工具覆盖\"设计 → Mock → 调试 → 自动化\"，减少团队在工具间同步数据。\n\n---\n\n## 5. 自查 Q5 完整作答：签名接口（参数排序 + MD5）的封装设计\n\n### 5.1 设计要点（先讲结构，再给代码）\n\n```\n1. 签名器独立成类（Signer），不写在请求方法里 —— 算法会变，封装要能换\n2. 请求统一入口（client._request）里自动加签名 —— 用例不关心签名，一处生效\n3. 可变参数自动生成（timestamp / nonce），但支持注入固定值以复现问题\n4. 参与签名的字段规则集中配置（排除空值、排除 sign/file、按 key 排序）\n5. 出错能诊断：把\"待签串\"打进日志（脱敏），签名对不上时能一眼看出差异\n6. 加时间戳偏移校验：本地时间与服务器不一致时给出明确报错\n```\n\n### 5.2 代码（可直接用）\n\n```python\n# framework/signer.py\nimport hashlib\nimport logging\nimport time\nimport uuid\n\nlogger = logging.getLogger(__name__)\n\n\nclass Signer:\n    \"\"\"参数排序 + 拼接 + 密钥 的签名器。算法要点集中在 build_raw 里，便于适配不同第三方。\"\"\"\n\n    def __init__(self, secret: str,\n                 exclude: tuple[str, ...] = (\"sign\", \"file\"),\n                 drop_empty: bool = True,\n                 upper: bool = True):\n        self.secret = secret\n        self.exclude = set(exclude)\n        self.drop_empty = drop_empty\n        self.upper = upper\n\n    def build_raw(self, params: dict) -> str:\n        \"\"\"生成待签字符串。签名对不上时，把这段打印出来和开发的对，一眼就能定位差异。\"\"\"\n        items = []\n        for k in sorted(params):\n            if k in self.exclude:\n                continue\n            v = params[k]\n            if self.drop_empty and (v is None or v == \"\"):\n                continue\n            items.append(f\"{k}={v}\")\n        return \"&\".join(items) + self.secret\n\n    def sign(self, params: dict) -> str:\n        raw = self.build_raw(params)\n        digest = hashlib.md5(raw.encode(\"utf-8\")).hexdigest()\n        return digest.upper() if self.upper else digest\n\n\nclass SignedClient:\n    \"\"\"带签名的 HTTP 客户端：用例侧只传业务参数，签名自动完成。\"\"\"\n\n    def __init__(self, base_url: str, signer: Signer,\n                 fixed_timestamp: int | None = None,\n                 nonce_factory=None):\n        self.base_url = base_url\n        self.signer = signer\n        # 支持注入固定值：复现\"时间戳过期\"\"nonce 重放\"两类 bug 时必须能控制\n        self.fixed_timestamp = fixed_timestamp\n        self.nonce_factory = nonce_factory or (lambda: uuid.uuid4().hex[:16])\n        self.session = requests.Session()\n\n    def _common_params(self) -> dict:\n        return {\n            \"timestamp\": self.fixed_timestamp or int(time.time()),\n            \"nonce\": self.nonce_factory(),\n        }\n\n    def request(self, method: str, path: str, params: dict | None = None, **kwargs):\n        body = dict(params or {})\n        body.update(self._common_params())\n        body[\"sign\"] = self.signer.sign(body)          # 签名永远是最后一步\n\n        logger.info(\"SIGN raw=%s sign=%s\", self.signer.build_raw(body), body[\"sign\"])\n        return self.session.request(method, f\"{self.base_url}{path}\", json=body, **kwargs)\n```\n\n### 5.3 五个必须覆盖的签名测试点\n\n```python\ndef test_sign_invalid_when_param_tampered(cli):\n    \"\"\"改参数不改签名 → 必须被拒。\"\"\"\n    body = {\"sku_id\": 1001, \"num\": 1, \"timestamp\": int(time.time()), \"nonce\": \"n1\"}\n    body[\"sign\"] = cli.signer.sign(body)\n    body[\"num\"] = 2                                   # 篡改\n    r = requests.post(f\"{cli.base_url}/api/order\", json=body)\n    assert r.json()[\"code\"] != 0, \"签名没校验参数变更\"\n\n\ndef test_sign_expired_timestamp(cli):\n    \"\"\"10 分钟前的时间戳 → 必须被拒（防重放）。\"\"\"\n    cli.fixed_timestamp = int(time.time()) - 600\n    r = cli.request(\"POST\", \"/api/order\", {\"sku_id\": 1001, \"num\": 1})\n    assert \"过期\" in r.text or r.json()[\"code\"] != 0\n\n\ndef test_sign_nonce_replay(cli):\n    \"\"\"同一 nonce 重放两次 → 第二次必须被拒。\"\"\"\n    cli.nonce_factory = lambda: \"fixed-nonce-001\"\n    r1 = cli.request(\"POST\", \"/api/order\", {\"sku_id\": 1001, \"num\": 2})\n    r2 = cli.request(\"POST\", \"/api/order\", {\"sku_id\": 1001, \"num\": 2})\n    assert r1.json()[\"code\"] == 0 and r2.json()[\"code\"] != 0, \"nonce 未防重放\"\n\n\ndef test_sign_empty_value_handling(cli):\n    \"\"\"空值字段是否参与签名 —— 与服务端约定一致（这是最常见的不一致点）。\"\"\"\n    cli.request(\"POST\", \"/api/order\", {\"sku_id\": 1001, \"num\": 1, \"remark\": \"\"})\n\n\ndef test_server_clock_drift(cli):\n    \"\"\"本地时间与服务器偏差过大时，要能立刻看出是时钟问题而不是签名算法问题。\"\"\"\n    server_date = requests.get(f\"{cli.base_url}/api/ping\").headers.get(\"Date\")\n    # 与本地时间对比，偏差超过 300s 直接 fail 并提示，避免在签名上瞎查\n```\n\n### 5.4 面试时补一句\"为什么这么设计\"\n\n> 签名不写在用例里，是因为**算法会变**（每个渠道一套、偶尔升级），写成一处后换算法只改一个类。\n> 时间戳和 nonce 做成可注入，是因为**要能造出\"过期\"和\"重放\"这两个场景**，这是安全测试的基础。\n> 打印待签串，是因为签名失败时最耗时的是\"我和开发用的待签串是不是同一个\"，打出来一对就完了。\n\n---\n\n## 6. 动手清单\n\n- [ ] 拿一个签名接口，把\"待签串\"打印出来，和开发对一次，确认字段范围/空值/排序规则。\n- [ ] 用 mitmproxy 写一个插件，给所有请求加一个测试标识头，看服务端日志能不能筛出来。\n- [ ] 用同一个订单号连发两次请求，验证 nonce/timestamp 的防重放是否生效。\n- [ ] 用 Postman 写一个前置脚本自动生成签名，再转成 Newman 在命令行跑一次。\n","chars":4335,"codes":16,"tables":10},{"id":"api-design","title":"接口测试设计与断言篇","desc":"单接口清单/链路测试/五层断言/用例幂等","file":"测试开发-接口测试设计与断言篇.md","content":"# 测试开发-接口测试设计与断言篇\n\n> 对应清单：接口测试设计【必须掌握】全部 + 断言设计【必须掌握——本章灵魂】\n> 对应自查：Q2（创建订单的 5 层断言）、Q4（用例幂等，连跑两遍结果一致吗）\n> 立场：接口测试的价值全在断言上。**只断言 `status_code == 200` 的用例，本质是在测\"服务进程还活着\"。**\n\n---\n\n## 0. 先定位：接口测试的四个层次\n\n| 层次 | 测什么 | 例子 | 价值 |\n| --- | --- | --- | --- |\n| 单接口 | 一个接口的参数、业务码、鉴权 | `POST /api/orders` 传非法 num 返回 400 | 发现参数校验漏洞 |\n| 场景链路 | 多接口串成业务流 | 注册 → 登录 → 下单 → 支付 → 查询 → 取消 | 发现状态传递、数据一致性问题 |\n| 异常容错 | 超时、重试、幂等、并发 | 同一订单号并发提交 10 次 | 发现并发缺陷（**最高价值**） |\n| 数据驱动 | 同一场景多组数据 | 边界值 1/99/100、反例 | 提升覆盖率，减少重复代码 |\n\n自查分级：\n\n| 内容 | 档位 | 说明 |\n| --- | --- | --- |\n| 单接口用例清单 | 熟练 | 有模板就能套 |\n| 链路测试与数据传递 | 熟练 | 每天 |\n| 幂等 / 并发 | 熟练 | 缺陷高发区 |\n| 五层断言 | **熟练** | 本篇核心 |\n| 用例自身的幂等 | 熟练 | 决定自动化可不可信 |\n\n---\n\n## 1. 单接口测试：一张清单打天下\n\n### 1.1 三类必测（对应清单要求）\n\n**① 参数校验**\n\n| 类型 | 用例 | 期望 |\n| --- | --- | --- |\n| 必填缺失 | 删掉 `sku_id` | 400 + 明确提示\"sku_id 必填\" |\n| 类型错误 | `sku_id: \"abc\"`、`num: \"1\"`（字符串） | 400（或按约定自动转换） |\n| 类型混淆 | `num: 1.5`、`num: true`（bool 在 Python 是 int 子类） | 400 |\n| 长度超限 | `remark` 200 / 201 字符 | 200 通过 / 400 |\n| 数值边界 | `num` 为 0、1、99、100、-1 | 0/100/-1 拒绝，1/99 通过 |\n| 枚举非法 | `status: \"UNKNOWN\"` | 400 |\n| 格式非法 | `order_no: \"abc\"`（应匹配 `^O-\\d{12}$`） | 400 或 404 |\n| 多余字段 | 多传 `{\"hack\": 1}` | 按约定（`additionalProperties:false` 应拒绝） |\n| 空值语义 | `remark: null` vs `\"\"` vs 不传 | 三者行为可能不同，逐个测 |\n| 数组边界 | 传空数组、超长数组、含 null 元素 | 明确拒绝或明确处理 |\n\n**② 业务码分支**\n\n```python\n# 一个接口的成功/失败分支要全部覆盖，不是只测成功\n# 下单接口的典型分支：\n# 0    成功\n# 40001 库存不足\n# 40002 商品已下架\n# 40003 超出限购\n# 40004 优惠券不可用\n# 40005 重复提交\n# 50001 系统繁忙\n```\n\n**怎么发现有哪些分支**：接口文档的 `responses`（正向）+ 数据库里业务异常枚举 + 问开发 + 抓包看线上真实返回。\n\n**③ 鉴权失效**\n\n| 用例 | 期望 |\n| --- | --- |\n| 不带 token | 401 |\n| token 格式错误（无 Bearer） | 401 |\n| token 过期 | 401 |\n| token 被篡改 | 401 |\n| token 属于被禁用用户 | 401 / 403 |\n| 无权限角色 | 403 |\n\n### 1.2 单接口用例清单模板（可直接当 checklist）\n\n```\n□ 正常成功（最小参数）\n□ 正常成功（全字段）\n□ 每个必填字段缺失（N 条）\n□ 每个字段的类型错误（N 条）\n□ 每个字段的边界（min-1, min, max, max+1）\n□ 每个字段的长度（0, 1, max, max+1, 超长）\n□ 枚举字段取非法值\n□ 多余字段 / 未知字段\n□ 无 token / 错 token / 过期 token\n□ 无权限角色\n□ 每个业务码分支各一条\n□ 幂等键重复（若是写接口）\n□ 并发提交（若是写接口）\n□ 响应结构断言（字段是否存在、类型是否正确）\n```\n\n**这张清单的价值**：新接口照单勾一遍，10 分钟出 20 条用例，不会漏大类。\n\n---\n\n## 2. 场景（链路）测试：把接口串成业务流\n\n### 2.1 链路设计的两个要素\n\n**① 数据在接口间传递**\n\n```\n注册 → 拿到 user_id\n登录 → 拿到 token（后续所有请求要用）\n下单 → 拿到 order_no\n支付 → 拿到 pay_no\n查询 → 用 order_no 查状态\n取消 → 用 order_no 取消（仅待支付可取消）\n```\n\n**② 每一步都要验\"状态 + 数据一致性\"**\n\n| 步骤 | 不只验返回 | 还要验 |\n| --- | --- | --- |\n| 注册 | 返回 201 | 用户表有新记录、密码是加密的、默认角色正确 |\n| 登录 | 返回 token | token 可用、会话写入、登录日志 |\n| 下单 | 返回 order_no | 订单表 + 库存扣减 + 优惠券锁定 |\n| 支付 | 返回成功 | 支付单、订单状态、库存正式扣减、积分 |\n| 查询 | 返回状态 | 与数据库一致、与支付单一致 |\n| 取消 | 返回成功 | 状态回滚、库存退还、券释放 |\n\n### 2.2 pytest 版链路测试（含数据传递）\n\n```python\ndef test_full_order_flow(api, base_url, db):\n    \"\"\"注册 → 登录 → 下单 → 支付 → 查询 → 取消。\"\"\"\n    phone = f\"139{int(time.time()) % 100000000:08d}\"     # 唯一手机号，保证可重复执行\n\n    # 1. 注册\n    r = api.post(f\"{base_url}/api/register\", json={\"phone\": phone, \"pwd\": \"P@ss1234\"})\n    assert r.json()[\"code\"] == 0, r.text\n    user_id = db.query_one(\"SELECT id FROM users WHERE phone=%s\", (phone,))[\"id\"]\n\n    # 2. 登录（用新账号，拿到自己的 token）\n    token = api.post(f\"{base_url}/api/login\", json={\"user\": phone, \"pwd\": \"P@ss1234\"}).json()[\"data\"][\"token\"]\n    session = requests.Session()\n    session.headers[\"Authorization\"] = f\"Bearer {token}\"\n\n    # 3. 下单\n    order = session.post(f\"{base_url}/api/orders\", json={\"sku_id\": 1001, \"num\": 1}).json()[\"data\"]\n    order_no = order[\"order_no\"]\n    assert db.query_one(\"SELECT status FROM orders WHERE order_no=%s\", (order_no,))[\"status\"] == \"PENDING_PAY\"\n\n    # 4. 支付（模拟支付回调）\n    pay = session.post(f\"{base_url}/api/orders/{order_no}/pay\", json={\"channel\": \"alipay\"})\n    assert pay.json()[\"code\"] == 0\n\n    # 5. 查询：状态已流转 + 支付单存在\n    detail = session.get(f\"{base_url}/api/orders/{order_no}\").json()[\"data\"]\n    assert detail[\"status\"] == \"PAID\"\n    assert db.query_one(\"SELECT COUNT(*) c FROM payments WHERE order_no=%s\", (order_no,))[\"c\"] == 1\n\n    # 6. 取消（已支付不能取消，要走退款）—— 这里故意测非法流转\n    cancel = session.post(f\"{base_url}/api/orders/{order_no}/cancel\")\n    assert cancel.json()[\"code\"] != 0, \"已支付订单被直接取消，应该走退款流程\"\n    assert db.query_one(\"SELECT status FROM orders WHERE order_no=%s\", (order_no,))[\"status\"] == \"PAID\"\n```\n\n**两个设计要点**：\n\n1. **手机号用时间戳生成** → 用例可以重复跑（这就是\"用例幂等\"的一部分，见 §5）。\n2. **每步都查库** → 链路测试最容易漏的是\"接口都返回成功，但中间某步没落库\"。\n\n### 2.3 链路测试的三个反模式\n\n| 反模式 | 后果 |\n| --- | --- |\n| 链路太长（10+ 接口一条用例） | 中间任何一步失败，后面全断，定位困难，回滚也麻烦 |\n| 链路依赖固定测试数据 | 跑第二遍就失败（用户已存在、库存已扣光） |\n| 只验每步的返回码，不验最终状态 | \"都成功了但数据是错的\" |\n\n**正确做法**：链路拆成 2~4 个接口一段（下单→支付；支付→发货；发货→完成），用 fixture 造好前置状态。\n\n---\n\n## 3. 异常与容错：四个必测场景\n\n| 场景 | 怎么造 | 期望 |\n| --- | --- | --- |\n| **超时** | mock 下游 sleep 超过客户端超时 | 明确错误码，不挂死；服务端最终状态要查 |\n| **重试** | mock 第一次 503、第二次 200 | 最终成功且只产生一条数据 |\n| **幂等** | 同一 `request_id` 提交多次 | 只生效一次，返回同一结果 |\n| **并发修改** | 两个请求同时改同一资源 | 只有一个成功（乐观锁），或串行生效（悲观锁），不能丢更新 |\n\n### 3.1 并发修改的两个典型缺陷\n\n```python\ndef test_concurrent_update_lost_update(api, base_url, db):\n    \"\"\"并发改同一订单的备注，不能丢更新。\"\"\"\n    order_no = create_order(api, base_url)\n    with ThreadPoolExecutor(max_workers=2) as pool:\n        list(pool.map(lambda i: api.patch(\n            f\"{base_url}/api/orders/{order_no}\",\n            json={\"remark\": f\"备注{i}\"}), [1, 2]))\n    # 期望：最终是其中一个值（不是两个值拼在一起、也不是 null）\n    remark = db.query_one(\"SELECT remark FROM orders WHERE order_no=%s\", (order_no,))[\"remark\"]\n    assert remark in (\"备注1\", \"备注2\"), f\"丢更新或脏写: {remark}\"\n```\n\n```python\ndef test_concurrent_stock_no_oversell(api, base_url, db):\n    \"\"\"库存 1，并发 10 个下单，只能成功 1 个。\"\"\"\n    stock_before = db.query_one(\"SELECT qty FROM stock WHERE sku_id=1002\")[\"qty\"]\n    assert stock_before == 1\n    with ThreadPoolExecutor(max_workers=10) as pool:\n        codes = list(pool.map(lambda _: api.post(f\"{base_url}/api/orders\",\n                                                 json={\"sku_id\": 1002, \"num\": 1}).status_code, range(10)))\n    assert codes.count(200) == 1, f\"超卖: {codes}\"\n    assert db.query_one(\"SELECT qty FROM stock WHERE sku_id=1002\")[\"qty\"] == 0\n```\n\n---\n\n## 4. 数据驱动：同一场景跑多组数据\n\n```python\nimport pytest\n\n# 内联：逻辑型用例（要一眼看到期望）\n@pytest.mark.parametrize(\"num, expected_code\", [\n    (1, 0),      # 正常\n    (0, 40001),  # 数量为 0\n    (99, 0),     # 上边界内\n    (100, 40001),# 超上边界\n], ids=[\"正常\", \"数量0\", \"边界99\", \"超界100\"])\ndef test_create_order_num(api, base_url, num, expected_code):\n    r = api.post(f\"{base_url}/api/orders\", json={\"sku_id\": 1001, \"num\": num})\n    assert r.json()[\"code\"] == expected_code, r.text\n\n\n# 文件：数据型用例（会持续新增，给测试同学维护）\nimport csv\nfrom pathlib import Path\n\ndef load_cases():\n    p = Path(__file__).parent / \"data\" / \"order_cases.csv\"\n    with open(p, encoding=\"utf-8-sig\", newline=\"\") as f:\n        return list(csv.DictReader(f))\n\n@pytest.mark.parametrize(\"case\", load_cases(), ids=lambda c: c[\"case_name\"])\ndef test_create_order_from_file(api, base_url, case):\n    r = api.post(f\"{base_url}/api/orders\", json={\"sku_id\": int(case[\"sku_id\"]), \"num\": int(case[\"num\"])})\n    assert r.json()[\"code\"] == int(case[\"expected_code\"]), r.text\n```\n\n**判断标准**（和《pytest框架篇》一致）：数据会增长就外置（CSV/YAML），逻辑在变化就内联。\n\n---\n\n## 5. 断言设计：本章灵魂\n\n### 5.1 先分清两件事\n\n```\nHTTP 200        → 服务活着，请求被正确处理了\n业务码 code=0   → 业务成功\n数据状态正确    → 业务真的达成的预期效果\n```\n\n**三个都可能不一致**：\n\n| 情况 | 说明 |\n| --- | --- |\n| HTTP 200 + code≠0 | 最常见的约定：业务失败也返 200，靠 code 区分 |\n| HTTP 200 + code=0 + 数据错 | **最危险**：接口\"看着成功\"，实际数据脏了 |\n| HTTP 500 | 服务端异常，通常是 bug 或参数导致 |\n\n**所以断言必须分层，一层都不能少。**\n\n### 5.2 五层断言模型\n\n| 层 | 断言什么 | 例子 |\n| --- | --- | --- |\n| L1 HTTP 状态 | 传输层是否正常 | `status_code == 201` |\n| L2 业务码 | 业务判断是否正确 | `code == 0` |\n| L3 响应字段 | 结构、类型、格式、取值 | `order_no` 匹配 `^O-\\d{12}$`、`amount == 90.00` |\n| L4 数据库状态 | 数据是否真的落对了 | orders 表状态、stock 表数量 |\n| L5 副作用 | 消息、缓存、审计、下游 | MQ 发了发券消息、Redis 缓存已更新、审计日志有记录 |\n\n**加分点：L5 才是\"业务真的做完了\"的证据。** 很多缺陷就藏在\"主表对了，但消息没发\"或\"消息发了两次\"里。\n\n### 5.3 自查 Q2 完整作答：创建订单的 5 层断言\n\n```python\ndef test_create_order_five_layers(api, base_url, db, mq):\n    \"\"\"创建订单的五层断言。\"\"\"\n    payload = {\"sku_id\": 1001, \"num\": 2, \"request_id\": f\"req-{uuid.uuid4().hex}\"}\n\n    # ── L1 HTTP 状态 ──────────────────────────────\n    resp = api.post(f\"{base_url}/api/orders\", json=payload)\n    assert resp.status_code == 201, f\"HTTP 状态异常: {resp.status_code} {resp.text[:300]}\"\n\n    body = resp.json()\n\n    # ── L2 业务码 ─────────────────────────────────\n    assert body[\"code\"] == 0, f\"业务码异常: {body}\"\n\n    # ── L3 响应字段（结构 + 类型 + 格式 + 取值）──────\n    data = body[\"data\"]\n    assert isinstance(data[\"order_no\"], str), \"order_no 类型错误\"\n    assert re.match(r\"^O-\\d{12}$\", data[\"order_no\"]), f\"order_no 格式错误: {data['order_no']}\"\n    assert data[\"status\"] == \"PENDING_PAY\", f\"初始状态错误: {data['status']}\"\n    assert float(data[\"amount\"]) == 198.00, f\"金额错误: {data['amount']}\"   # 99 * 2\n    assert data.get(\"created_at\"), \"缺少创建时间\"\n\n    # ── L4 数据库状态 ────────────────────────────\n    order = db.query_one(\"SELECT * FROM orders WHERE order_no=%s\", (data[\"order_no\"],))\n    assert order is not None, \"订单未落库\"\n    assert order[\"status\"] == \"PENDING_PAY\"\n    assert order[\"user_id\"] == int(payload.get(\"user_id\", order[\"user_id\"]))\n    assert float(order[\"amount\"]) == 198.00\n\n    stock = db.query_one(\"SELECT qty FROM stock WHERE sku_id=1001\")\n    assert stock[\"qty\"] == 97, f\"库存扣减错误: {stock['qty']}（期望 97）\"\n\n    # ── L5 副作用（消息 / 缓存 / 审计）─────────────\n    # 订单创建后应发出\"订单已创建\"事件，下游据此发券/发通知\n    events = mq.wait_for(topic=\"order.created\", match={\"order_no\": data[\"order_no\"]}, timeout=10)\n    assert len(events) == 1, f\"应发出 1 条订单创建消息，实际 {len(events)} 条\"\n    assert events[0][\"payload\"][\"num\"] == 2\n\n    # 缓存（如果列表接口有缓存，创建后应失效或更新）\n    assert not cache_exists(f\"order:{data['order_no']}\") or \\\n           cache_get(f\"order:{data['order_no']}\")[\"status\"] == \"PENDING_PAY\"\n\n    # 审计日志\n    audit = db.query_one(\"SELECT COUNT(*) c FROM audit_log WHERE biz_no=%s\", (data[\"order_no\"],))\n    assert audit[\"c\"] == 1, \"缺少审计日志\"\n```\n\n**为什么这五层都要有（讲的时候的核心论点）：**\n\n| 层 | 没有它会漏什么 |\n| --- | --- |\n| L1 | 接口 500 了但异常被吞成 200（框架层 bug） |\n| L2 | 200 + code=40001（库存不足），你的用例其实在验失败路径 |\n| L3 | 字段名改了（`order_no` → `orderNo`）、类型从 string 变 int、金额小数精度丢了 |\n| L4 | 接口返回成功但事务回滚了 / 只写了主表没写明细 |\n| L5 | 主流程对了但\"发券消息\"没发或发两次 —— **线上最常被投诉的就是这类** |\n\n### 5.4 删除接口：真删还是软删，这是必问的\n\n```python\ndef test_delete_order_semantics(api, base_url, db):\n    \"\"\"删除接口必须确认是物理删除还是逻辑删除 —— 断言写法完全不同。\"\"\"\n    order_no = create_order(api, base_url)\n    assert api.delete(f\"{base_url}/api/orders/{order_no}\").json()[\"code\"] == 0\n\n    row = db.query_one(\"SELECT * FROM orders WHERE order_no=%s\", (order_no,))\n\n    # 情况 A：物理删除 → 查不到\n    assert row is None, \"期望物理删除但记录还在\"\n\n    # 情况 B：逻辑删除 → 记录还在，但 is_deleted=1\n    # assert row is not None and row[\"is_deleted\"] == 1\n\n    # 无论哪种，都要再测三件事：\n    # 1. 再次查询 → 404（对外不可见）\n    assert api.get(f\"{base_url}/api/orders/{order_no}\").status_code == 404\n    # 2. 关联数据怎么处理（明细表、支付单、优惠券）\n    assert db.query_one(\"SELECT COUNT(*) c FROM order_items WHERE order_no=%s\", (order_no,))[\"c\"] == 0\n    # 3. 重复删除 → 幂等还是 404？按约定断言\n```\n\n**\"真删 vs 软删\"属于必须跟产品确认的点**：涉及数据审计要求的业务（金融、医疗）通常必须软删，硬删可能是合规问题。\n\n### 5.5 断言反模式（对照检查自己的用例）\n\n| 反模式 | 问题 |\n| --- | --- |\n| 只断言 `status_code == 200` | 什么都没验证 |\n| `assert resp.status_code in (200, 400, 404)` | 断言太宽，等于没断言 |\n| 断言自己 mock 出来的数据 | 自证（mock 返回 200，你断言 200） |\n| 只断言 `code == 0`，不断言数据 | \"成功了但数据错\"漏网 |\n| 用 `in` 断言字符串 | `assert \"成功\" in resp.text`，文案一改就误报 |\n| 断言整个响应体完全相等 | 时间戳/ID 每次不同，必然失败 |\n| 断言顺序敏感（列表） | 排序不稳定导致 flaky |\n\n---\n\n## 6. 自查 Q4 完整作答：用例幂等，连跑两遍结果一致吗\n\n### 6.1 先分清两个\"幂等\"\n\n| | 业务幂等 | **用例幂等**（Q4 问的） |\n| --- | --- | --- |\n| 对象 | 被测接口 | 测试代码本身 |\n| 含义 | 同一请求执行多次，业务效果只生效一次 | 同一用例执行多次，**结果一致**（都通过或都失败，且失败原因相同） |\n| 谁负责 | 开发 | **测试** |\n\n**用例不幂等的表现**：\n\n```\n第一遍跑：10 passed\n第二遍跑：3 passed, 7 failed（\"用户已存在\"\"库存不足\"\"订单数不是 100\"）\n```\n\n**这就是测试用例不可信的开始** —— 你无法判断第二遍的失败是新 bug 还是脏数据。\n\n### 6.2 用例幂等的五个做法\n\n| 做法 | 具体手段 |\n| --- | --- |\n| **数据唯一化** | 手机号/订单号/用户名带唯一后缀（时间戳、uuid、worker id） |\n| **前置清理** | 用例开始前删除可能存在的同标识数据（`DELETE WHERE phone=xxx`） |\n| **后置清理** | 用例结束（fixture 的 teardown）删除造的数据，失败也执行 |\n| **不依赖绝对数值** | 断言\"增加了 1\"而不是\"等于 100\"；断言\"存在\"而不是\"总数是 N\" |\n| **不依赖执行顺序** | 每条用例自己能独立跑通，不依赖上一条留下的状态 |\n\n### 6.3 完整示例\n\n```python\nimport uuid\n\nimport pytest\n\n\n@pytest.fixture\ndef unique_user(api, base_url, db):\n    \"\"\"每次生成唯一用户，测完删除。保证用例可重复执行。\"\"\"\n    suffix = uuid.uuid4().hex[:8]\n    phone = f\"139{suffix[:8]}\"\n    user = {\"phone\": phone, \"pwd\": \"P@ss1234\"}\n\n    api.post(f\"{base_url}/api/register\", json=user)          # 前置：建\n    yield user\n    db.execute(\"DELETE FROM users WHERE phone=%s\", (phone,))  # 后置：清（失败也执行）\n\n\ndef test_order_count_increases_by_one(api, base_url, db, unique_user):\n    \"\"\"断言\"增量\"而不是\"绝对值\" —— 这是用例幂等的关键写法。\"\"\"\n    before = db.query_one(\"SELECT COUNT(*) c FROM orders WHERE user_phone=%s\",\n                          (unique_user[\"phone\"],))[\"c\"]\n\n    token = api.post(f\"{base_url}/api/login\",\n                     json={\"user\": unique_user[\"phone\"], \"pwd\": unique_user[\"pwd\"]}).json()[\"data\"][\"token\"]\n    r = requests.post(f\"{base_url}/api/orders\",\n                      json={\"sku_id\": 1001, \"num\": 1},\n                      headers={\"Authorization\": f\"Bearer {token}\"})\n    assert r.json()[\"code\"] == 0\n\n    after = db.query_one(\"SELECT COUNT(*) c FROM orders WHERE user_phone=%s\",\n                         (unique_user[\"phone\"],))[\"c\"]\n    assert after == before + 1, f\"订单数应 +1，实际 {before} → {after}\"\n```\n\n### 6.4 怎么验证\"我的用例是幂等的\"\n\n```bash\n# 方法 1：本地连跑两遍（最直接）\npytest tests/test_order.py -v\npytest tests/test_order.py -v\n\n# 方法 2：用 --count 插件连跑 N 次\npip install pytest-repeat\npytest tests/test_order.py --count=3\n\n# 方法 3：打乱顺序跑（pytest-randomly），验证不依赖执行顺序\npip install pytest-randomly\npytest tests/ -p randomly\n\n# 方法 4：并行跑（-n 4），验证不互相干扰\npytest tests/ -n 4\n```\n\n**通过标准**：\n\n```\n连跑 3 次 → 结果完全一致（都 pass 或都 fail 在同一处）\n打乱顺序 → 仍然全 pass\n并行 4 worker → 仍然全 pass（或有明确标记为串行的用例）\n```\n\n**做不到并行的那部分**要显式标记（`@pytest.mark.serial`），不能假装它支持并行。\n\n### 6.5 完整话术\n\n> 用例幂等是指**同一用例重复执行、乱序执行、并行执行，结果都一致**。它和业务幂等不是一回事 —— 业务幂等是开发保证接口重复调用只生效一次，用例幂等是我保证我的测试代码不污染环境、不依赖残留数据。\n> 我的做法是四条：\n> **数据唯一化**（手机号/单号带 uuid 后缀）、**前后置清理**（fixture 的 yield 后面删数据，失败也执行）、**断言增量不绝对化**（断言\"订单数 +1\"而不是\"等于 100\"）、**不依赖执行顺序**（每条用例能独立跑）。\n> 验证方式是连跑 3 次 + `pytest-randomly` 打乱顺序 + `-n 4` 并行跑，三种都通过才算真的幂等。做不到并行的（比如操作同一账号余额）会显式标记为串行，而不是假装没问题。\n\n---\n\n## 7. 动手清单\n\n- [ ] 给一个写接口补上 L4（查库）和 L5（查消息/缓存）断言，看能不能立刻发现问题。\n- [ ] 把一条\"assertEquals(200)\"式的用例改成五层断言，对比信息量。\n- [ ] 挑 3 条老用例，连跑两遍，看有没有第二遍就挂的（这是用例幂等问题，不是 bug）。\n- [ ] 用 `pytest-randomly` 打乱顺序跑一次全量，看有多少用例依赖执行顺序。\n","chars":4364,"codes":14,"tables":13},{"id":"api-framework","title":"接口自动化框架篇","desc":"六组件与目录树/配置分层/Allure/CI 失败定位","file":"测试开发-接口自动化框架篇.md","content":"# 测试开发-接口自动化框架篇\n\n> 对应清单：自动化框架设计【必须掌握】（六大件）\n> 对应自查：Q1（六组件的目录分工）、Q7（Allure 失败用例合格标准）、Q8（CI 失败三大类原因的快速区分）\n> 立场：框架不是\"目录多\"，是**六个东西各就各位、换环境不改代码、失败能自证**。这一篇给的是能直接建起来的骨架。\n\n---\n\n## 0. 先定位：为什么要\"框架\"而不是\"一堆脚本\"\n\n| 情况 | 脚本堆 | 框架 |\n| --- | --- | --- |\n| 换环境 | 全局搜索替换域名 | 改一个配置（或环境变量） |\n| 接口加签名 | 每个脚本加一遍签名逻辑 | 请求封装里加一次 |\n| 断言标准变更 | 逐个文件改 | 改断言封装 |\n| 失败排查 | 重跑碰运气 | 报告里就有请求响应日志 |\n| 新人接手 | 读 3000 行脚本 | 看目录就知道去哪找 |\n\n**判断标准**：**如果换一个环境（域名+账号）需要改超过 1 个文件，你的\"框架\"就还不成立。**\n\n自查分级：\n\n| 内容 | 档位 | 说明 |\n| --- | --- | --- |\n| 六组件分工 | 熟练 | 面试必问 |\n| 目录结构 | 熟练 | 能画出来 |\n| 配置分层（文件+env+CLI） | 熟练 | 换环境不改代码 |\n| 请求封装（一处生效） | 熟练 | 签名/重试/日志 |\n| 数据造数与清理 | 熟练 | 决定用例能不能重复跑 |\n| Allure 报告质量 | 熟练 | 失败能不能自证 |\n| CI 失败定位 | 熟练 | 值班必用 |\n\n---\n\n## 1. 自查 Q1：六组件 + 各自目录放什么\n\n### 1.1 组件与职责\n\n| # | 组件 | 职责 | 对应目录 | 缺了会怎样 |\n| --- | --- | --- | --- | --- |\n| 1 | **环境配置** | 域名、账号、Token 的来源与覆盖 | `config/` | 换环境必须改代码 |\n| 2 | **请求封装** | 统一 Header/鉴权/超时/重试/签名/日志 | `framework/client.py` | 每个用例重复写，改一处漏十处 |\n| 3 | **数据管理** | 造数据、清理、参数化数据源 | `data/` + `framework/data_factory.py` | 用例不可重复执行、互相污染 |\n| 4 | **断言体系** | 分层断言封装（HTTP/业务码/字段/DB/MQ） | `framework/assertions.py` | 断言标准不统一，有人只断 200 |\n| 5 | **报告输出** | Allure/HTML，失败带现场 | `reports/` + hook | 失败只能重跑 |\n| 6 | **CI 集成** | 触发、执行、归档、通知 | `.github/workflows/` 或 `Jenkinsfile` | 靠人手动跑，等于没有 |\n\n### 1.2 完整目录结构（可以直接照着建）\n\n```\nqa-api-tests/\n├── config/\n│   ├── env.yaml                 # 各环境公共配置（域名、超时、用户角色名）\n│   └── env.local.yaml           # 本地覆盖（密码、个人账号）—— gitignore\n├── framework/\n│   ├── config.py                # 配置加载 + 优先级（CLI > env > 文件）\n│   ├── client.py                # 请求封装：唯一出口，管鉴权/超时/重试/日志\n│   ├── signer.py                # 签名算法（独立成类，便于替换）\n│   ├── assertions.py            # 分层断言：assert_http/assert_code/assert_db\n│   ├── db.py                    # 数据库客户端（连接池、查询、清理）\n│   ├── mq.py                    # 消息队列辅助（等消息、查消费）\n│   ├── data_factory.py          # 造数工厂：make_user/make_order\n│   ├── logger.py                # 日志配置（按天切、脱敏）\n│   └── artifacts.py             # 失败现场落盘（请求/响应 JSON）\n├── data/\n│   ├── cases/                   # 参数化数据：order_cases.csv、pay_cases.yaml\n│   ├── fixtures/                # 静态前置数据：init.sql、用户列表\n│   └── schemas/                 # 响应结构 schema（契约测试用）\n├── tests/\n│   ├── conftest.py              # 全局 fixture：config/api/db/账号池\n│   ├── api/                     # 单接口用例（按模块分文件）\n│   │   ├── conftest.py\n│   │   ├── test_order.py\n│   │   └── test_pay.py\n│   ├── flow/                    # 链路用例\n│   │   └── test_order_flow.py\n│   └── security/                # 安全用例（越权/注入/重放）\n│       └── test_permission.py\n├── scripts/\n│   ├── seed_data.py             # 批量造数（环境初始化）\n│   └── clean_data.py            # 清理（按前缀删）\n├── reports/                     # 报告输出 —— gitignore\n├── logs/                        # 日志 —— gitignore\n├── artifacts/                   # 失败附件 —— gitignore\n├── .github/workflows/api-tests.yml\n├── pytest.ini\n├── requirements.txt\n└── README.md                    # 怎么跑、怎么加用例、环境怎么配\n```\n\n### 1.3 三个\"为什么这样分\"的理由（面试会追问）\n\n| 设计 | 为什么 |\n| --- | --- |\n| `framework/` 和 `tests/` 分开 | 用例只写业务，工具只写能力。**改工具不用动用例** |\n| `tests/` 按 `api` / `flow` / `security` 分 | 三类用例的**运行频率和依赖环境不同**：api 每次提交跑、flow 合并后跑、security 每周跑 |\n| `data/` 独立 | 数据会持续新增，且希望非开发能维护（CSV 比 Python 友好） |\n\n---\n\n## 2. 环境配置：分层与优先级\n\n```python\n# framework/config.py\nimport os\nfrom dataclasses import dataclass\nfrom pathlib import Path\n\nimport yaml\n\nCONFIG_FILE = Path(__file__).resolve().parent.parent / \"config\" / \"env.yaml\"\n\n\n@dataclass(frozen=True)\nclass Config:\n    env: str\n    base_url: str\n    db_dsn: str\n    timeout: tuple[float, float]\n    accounts: dict          # {\"admin\": \"qa_admin\", \"user\": \"qa_user\"}\n\n\ndef load_config(env: str | None = None) -> Config:\n    \"\"\"优先级：CLI > 环境变量 > env.yaml(对应环境) > env.yaml(default)。\"\"\"\n    env = env or os.getenv(\"AUTOTEST_ENV\") or \"test\"\n    raw = yaml.safe_load(CONFIG_FILE.read_text(encoding=\"utf-8\")) or {}\n    cfg = {**(raw.get(\"default\") or {}), **(raw.get(env) or {})}\n\n    return Config(\n        env=env,\n        base_url=os.getenv(\"AUTOTEST_BASE_URL\", cfg[\"base_url\"]),\n        db_dsn=os.getenv(\"AUTOTEST_DB\", cfg[\"db_dsn\"]),\n        timeout=tuple(cfg.get(\"timeout\", (3, 10))),\n        accounts=cfg[\"accounts\"],\n    )\n```\n\n```python\n# tests/conftest.py 里暴露成 fixture\nimport pytest\nfrom framework.config import load_config\n\n\ndef pytest_addoption(parser):\n    parser.addoption(\"--env\", default=None, help=\"test/dev/staging\")\n\n\n@pytest.fixture(scope=\"session\")\ndef conf(pytestconfig):\n    return load_config(pytestconfig.getoption(\"--env\"))\n```\n\n**三条纪律**：\n\n1. 密码/密钥只从环境变量或 Secrets 来，**不进仓库**。\n2. 一份代码跑所有环境：`pytest --env=staging`，或 CI 里设 `AUTOTEST_ENV=staging`。\n3. 只读环境保护：`if conf.env in READONLY: 拒绝写接口调用`。\n\n---\n\n## 3. 请求封装：所有请求的唯一出口\n\n```python\n# framework/client.py\nimport logging\nimport time\n\nimport requests\n\nlogger = logging.getLogger(__name__)\n\n\nclass ApiClient:\n    \"\"\"所有请求的唯一出口。要加什么东西（签名、重试、埋点），只改这里。\"\"\"\n\n    def __init__(self, conf, token: str | None = None, signer=None):\n        self.conf = conf\n        self.signer = signer\n        self.session = requests.Session()\n        self.session.headers.update({\n            \"User-Agent\": \"qa-autotest/1.0\",\n            \"Accept\": \"application/json\",\n        })\n        if token:\n            self.session.headers[\"Authorization\"] = f\"Bearer {token}\"\n        self.last_response = None          # 给失败落盘 hook 用\n\n    def request(self, method: str, path: str, sign: bool = False, **kwargs) -> requests.Response:\n        url = f\"{self.conf.base_url}{path}\"\n        kwargs.setdefault(\"timeout\", self.conf.timeout)\n\n        if sign and self.signer:\n            body = kwargs.get(\"json\") or {}\n            body[\"sign\"] = self.signer.sign(body)\n            kwargs[\"json\"] = body\n\n        start = time.perf_counter()\n        try:\n            resp = self.session.request(method, url, **kwargs)\n        except requests.exceptions.Timeout:\n            logger.error(\"TIMEOUT %s %s timeout=%s\", method, url, kwargs[\"timeout\"])\n            raise\n        finally:\n            logger.info(\"%s %s cost=%.3fs\", method, url, time.perf_counter() - start)\n\n        self.last_response = resp\n        logger.info(\"RESP %s %s body=%s\", resp.status_code, url, resp.text[:500])\n        return resp\n\n    def get(self, path, **kw):    return self.request(\"GET\", path, **kw)\n    def post(self, path, **kw):   return self.request(\"POST\", path, **kw)\n    def put(self, path, **kw):    return self.request(\"PUT\", path, **kw)\n    def patch(self, path, **kw):  return self.request(\"PATCH\", path, **kw)\n    def delete(self, path, **kw): return self.request(\"DELETE\", path, **kw)\n```\n\n**这个封装解决了清单里说的\"一处修改全局生效\"**：\n\n| 需求 | 改哪里 |\n| --- | --- |\n| 加签名 | `request()` 里加一段 |\n| 加重试 | `request()` 里包一层 |\n| 加 traceId 注入 | `__init__` 的 headers |\n| 加统一日志 | `request()` 里 |\n| 加失败落盘 | `self.last_response`（hook 读它） |\n\n---\n\n## 4. 数据管理：造数、清理、参数化\n\n### 4.1 造数工厂\n\n```python\n# framework/data_factory.py\nimport time\nimport uuid\n\n\ndef make_phone() -> str:\n    \"\"\"唯一手机号：用例可重复执行的基础。\"\"\"\n    return f\"139{int(time.time() * 1000) % 100000000:08d}\"\n\n\ndef make_request_id() -> str:\n    return f\"req-{uuid.uuid4().hex}\"\n\n\ndef make_order(api, base_url, sku_id=1001, num=1) -> dict:\n    \"\"\"走接口造一个订单（符合业务规则）。\"\"\"\n    r = api.post(f\"{base_url}/api/orders\",\n                 json={\"sku_id\": sku_id, \"num\": num, \"request_id\": make_request_id()})\n    r.raise_for_status()\n    return r.json()[\"data\"]\n```\n\n**造数方式的选择**（和 MySQL 篇一致）：\n\n```\n需要业务规则正确 → 走接口造（下单、支付）\n需要特定状态    → 直接写库（造一个\"已发货 7 天\"的订单，接口造不出来）\n大批量          → SQL 批量插 + 前缀标识\n```\n\n### 4.2 清理：前置 + 后置，两层都要\n\n```python\n# tests/api/conftest.py\nimport pytest\n\n\n@pytest.fixture\ndef created_orders(api, base_url, db):\n    \"\"\"记录本条用例造的数据，teardown 时清理（失败也执行）。\"\"\"\n    created = []\n    yield created\n    for order_no in created:\n        try:\n            db.execute(\"DELETE FROM order_items WHERE order_no=%s\", (order_no,))\n            db.execute(\"DELETE FROM orders WHERE order_no=%s\", (order_no,))\n        except Exception as e:\n            logger.warning(\"清理订单失败 %s: %s\", order_no, e)   # 清理失败不能让用例变 error\n\n\n@pytest.fixture(autouse=True)\ndef clean_test_data(db):\n    \"\"\"前置清理：按测试前缀清掉历史残留（跑之前先擦干净）。\"\"\"\n    db.execute(\"DELETE FROM orders WHERE order_no LIKE 'QA-%'\")\n    yield\n```\n\n**为什么前置清理也要有**：上一次跑到一半被 Ctrl+C 中断，残留数据会让下一次莫名其妙失败。**前置清理是\"防上次\"，后置清理是\"防这次\"。**\n\n### 4.3 参数化数据\n\n```\ndata/cases/order_cases.csv      # 场景数据（测试同学维护）\ndata/cases/pay_cases.yaml       # 支付渠道矩阵\ntests/api/test_order.py         # 逻辑 + 断言\n```\n\n---\n\n## 5. 断言体系：统一口径\n\n```python\n# framework/assertions.py\ndef assert_http(resp, expected=200):\n    assert resp.status_code == expected, \\\n        f\"HTTP {resp.status_code} != {expected}\\n{resp.text[:500]}\"\n    return resp\n\n\ndef assert_business_ok(resp):\n    body = resp.json()\n    assert body.get(\"code\") == 0, f\"业务失败: {body}\"\n    return body[\"data\"]\n\n\ndef assert_field(data, field, expected=None, pattern=None):\n    assert field in data, f\"缺少字段 {field}: {data}\"\n    if expected is not None:\n        assert data[field] == expected, f\"{field}: {data[field]} != {expected}\"\n    if pattern is not None:\n        assert re.match(pattern, str(data[field])), f\"{field} 格式不符: {data[field]}\"\n    return data[field]\n```\n\n**统一口径的价值**：所有用例的失败信息格式一致、都带响应体，新人不用学新的断言写法。**这比\"断言写得优雅\"重要得多。**\n\n（五层断言的完整写法见《接口测试设计与断言篇》§5.3。）\n\n---\n\n## 6. 自查 Q7：Allure 报告里失败用例的合格标准\n\n### 6.1 合格 vs 不合格\n\n| 信息 | 不合格 | 合格 |\n| --- | --- | --- |\n| 用例身份 | `test_01 FAILED` | `创建订单-num=100-超上界`，含参数化 id |\n| 步骤 | 只有一行断言失败 | `allure.step` 列出：登录 → 下单 → 查库 → 断言 |\n| 请求 | 无 | method、url、headers（脱敏）、body |\n| 响应 | 无 | 状态码、body、耗时 |\n| 差异 | `AssertionError` | `期望 40001，实际 0，响应体：{...}` |\n| 日志 | 无 | 关键步骤日志、traceId |\n| 环境 | 无 | 环境名、版本号、执行时间 |\n| 附件 | 无 | 失败现场 JSON、截图（UI） |\n| 历史 | 无 | 是否首次失败、是否 flaky、上次何时通过 |\n\n### 6.2 落地：三步让报告\"自证\"\n\n**① 用 `allure.step` 把请求响应挂到步骤上**\n\n```python\nimport allure\n\n\ndef test_create_order(api, base_url, db):\n    with allure.step(\"创建订单 num=100\"):\n        resp = api.post(f\"{base_url}/api/orders\", json={\"sku_id\": 1001, \"num\": 100})\n        allure.attach(resp.request.url, \"请求URL\", allure.attachment_type.TEXT)\n        allure.attach(str(resp.request.body), \"请求Body\", allure.attachment_type.JSON)\n        allure.attach(f\"{resp.status_code}\\n{resp.text}\", \"响应\", allure.attachment_type.JSON)\n\n    with allure.step(\"断言业务码为 40001（超出限购）\"):\n        assert resp.json()[\"code\"] == 40001, f\"实际: {resp.text[:500]}\"\n```\n\n**② hook 自动落盘（失败时把完整现场存成附件）**\n\n```python\n# tests/conftest.py\nimport allure\nimport pytest\n\n\n@pytest.hookimpl(hookwrapper=True)\ndef pytest_runtest_makereport(item, call):\n    outcome = yield\n    report = outcome.get_result()\n    if report.when != \"call\" or not report.failed:\n        return\n    api = item.funcargs.get(\"api\")\n    if api is not None and api.last_response is not None:\n        from framework.artifacts import dump_failure\n        path = dump_failure(api.last_response, item.nodeid.replace(\"::\", \"_\").replace(\"/\", \"_\"), ARTIFACT_DIR)\n        allure.attach.file(str(path), name=\"失败现场\", attachment_type=allure.attachment_type.JSON)\n```\n\n**③ 报告里带上环境信息**\n\n```python\n# tests/conftest.py\ndef pytest_sessionstart(session):\n    conf = load_config()\n    allure.dynamic.label(\"env\", conf.env)      # 报告里能按环境筛\n\n\n# 或用命令行：pytest --alluredir=reports/allure --env=test\n# 再在 CI 里 pytest --alluredir=... 之后生成 report\n```\n\n```bash\n# 生成并打开报告\npytest --alluredir=reports/allure-result\nallure serve reports/allure-result\n```\n\n### 6.3 一句话标准\n\n> **一个失败的用例，报告里应该能回答四个问题**：发了什么请求、收到什么响应、期望什么、环境是什么。**如果同事看报告还得来问你要请求体，这份报告就不合格。**\n\n---\n\n## 7. 自查 Q8：CI 失败的三大类原因，怎么快速区分\n\n### 7.1 三类原因的定义\n\n| 类别 | 典型表现 | 根因 |\n| --- | --- | --- |\n| **环境** | 大面积失败（不是一两条）、`Connection refused`、超时、DNS 解析失败、401 全挂 | 服务没起、域名变了、CI 网络不通、依赖容器没就绪、Secrets 没配 |\n| **数据** | 零星失败、`订单不存在`、`用户已存在`、`库存不足`、断言值和预期差 1 | 脏数据、用例不幂等、造数没成功、上一轮没清理 |\n| **代码** | 集中在某几个接口/某次提交后开始、`AssertionError` 明确、堆栈指向业务 | 真的改了行为（bug 或需求变更）+ 用例没跟上 |\n\n### 7.2 三步快速区分（决策树）\n\n```\n第 1 步：看失败范围\n   全部/大部分失败  → 环境（先看服务活没活）\n   少数几条失败     → 进第 2 步\n\n第 2 步：看错误类型\n   ConnectionError / Timeout / 401 全挂 → 环境\n   KeyError / 数据不存在 / 重复          → 数据\n   AssertionError（值不对）              → 代码或数据（进第 3 步）\n\n第 3 步：看是不是本次改动引起\n   git log 看本次提交是否碰了这块\n   本地 checkout 同 commit 能复现 → 代码（真问题）\n   本地不能复现                   → 环境或数据\n```\n\n### 7.3 快速判定表（值班时直接查）\n\n| 现象 | 概率最高的原因 | 第一个动作 |\n| --- | --- | --- |\n| 所有用例都挂在 setup（登录失败） | 环境（服务挂了/token 配置） | `curl` 一下登录接口 |\n| 所有用例 401 | 环境（Secrets/token 失效） | 检查 `AUTOTEST_PWD` 是否有值 |\n| 只有\"下单\"相关用例挂，错误是\"库存不足\" | 数据（库存被前一轮扣光） | SELECT 库存；重置 |\n| 某条用例偶发失败，重跑就过 | 数据（并发/顺序依赖） | 单独跑 3 次；查是否并行冲突 |\n| 只有某个接口的所有用例挂 | 代码（该接口改了） | 看该接口最近的 commit |\n| 断言值差 1（如 99 vs 100） | 数据（残留数据）或代码（逻辑改了） | 先清数据重跑，再判断 |\n| 超时（用例跑不完） | 环境（服务慢）或代码（N+1） | 看服务端监控/慢查询 |\n| 报告里请求都正常，只有断言挂 | 代码（预期变了） | 对照需求/接口文档确认 |\n\n### 7.4 三个提高区分速度的习惯\n\n1. **失败信息里带响应体**：`assert code == 0, f\"实际: {body}\"` —— 90% 的\"是数据还是代码\"之争，看一眼响应体就结束了。\n2. **报告按环境打标签**：报告里标注 `env=test`，避免\"是不是跑错了环境\"这种低级怀疑。\n3. **记录 flaky 名单**：哪些用例历史上有偶发失败，失败时优先怀疑它。**维护一个 flaky 清单，比任何工具都实用。**\n\n---\n\n## 8. 自查 Q1 的完整话术（六组件版）\n\n> 接口自动化框架我分六块，每块一个目录、一个职责：\n> **环境配置**放 `config/`，一个 `env.yaml` 分环境 + 环境变量覆盖密码，做到换环境只改配置；\n> **请求封装**放 `framework/client.py`，所有请求走一个出口，签发/重试/超时/日志都在这一处；\n> **数据管理**放 `data/`（用例数据）+ `framework/data_factory.py`（造数工厂）+ conftest 里的清理 fixture；\n> **断言体系**放 `framework/assertions.py`，统一成 HTTP/业务码/字段/DB/副作用五层；\n> **报告输出**放 `reports/`，用 Allure，失败靠 hook 自动把请求响应落盘成附件；\n> **CI 集成**放 `.github/workflows/` 或 `Jenkinsfile`，按分支和定时触发，报告作为 artifact 归档。\n> 再加一个 `tests/` 按 api/flow/security 三层分，因为它们的运行频率和依赖不一样。\n\n---\n\n## 9. 动手清单\n\n- [ ] 数一下你现在的自动化项目，换一个环境要改几个文件（超过 1 个就该重构配置）。\n- [ ] 给失败用例加一次 request/response 附件，看报告能不能自证。\n- [ ] 跑一次全量，把失败按\"环境/数据/代码\"分类，看自己判断的准确率。\n- [ ] 把一条用例连跑 3 次，第二、三次挂的话就是数据管理问题。\n","chars":3958,"codes":14,"tables":8},{"id":"api-mock","title":"接口Mock与安全篇","desc":"Mock 三层工具/越权自动化/AI 用例审查","file
