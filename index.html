<style>
/* ===================== 主题变量 ===================== */
:root{
  --bg:#f4f2ed;
  --bg-grad-1:#eef3ee;
  --bg-grad-2:#f6f1ea;
  --panel:#fffdf9;
  --panel-2:#faf8f3;
  --ink:#211f1b;
  --ink-2:#55504a;
  --ink-3:#8a837a;
  --line:#e4ded3;
  --line-2:#efeae1;
  --brand:#2f6f4e;
  --brand-2:#3d8a63;
  --brand-soft:#e7f1ea;
  --accent:#c2603d;
  --accent-soft:#f8ece6;
  --code-bg:#1d211f;
  --code-head:#262b28;
  --code-line:#333935;
  --shadow-sm:0 1px 2px rgba(40,35,25,.05);
  --shadow:0 6px 24px rgba(40,35,25,.08);
  --shadow-lg:0 20px 60px rgba(40,35,25,.12);
  --radius:14px;
  --topbar-bg:rgba(255,253,249,.86);
  --row-hover:rgba(231,241,234,.55);
  --mono:ui-monospace,"Cascadia Code","SF Mono",SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}
html[data-theme="dark"]{
  --bg:#15171a;
  --bg-grad-1:#1a1f22;
  --bg-grad-2:#191b20;
  --panel:#1c1f23;
  --panel-2:#212529;
  --ink:#e9e6e0;
  --ink-2:#b6b0a6;
  --ink-3:#8d867c;
  --line:#2b2f34;
  --line-2:#24282c;
  --brand:#5fae83;
  --brand-2:#74c496;
  --brand-soft:#1e2b25;
  --accent:#e0835c;
  --accent-soft:#2e2320;
  --code-bg:#141716;
  --code-head:#1c201e;
  --code-line:#2a2f2c;
  --shadow:0 6px 24px rgba(0,0,0,.35);
  --shadow-lg:0 20px 60px rgba(0,0,0,.5);
  --topbar-bg:rgba(28,31,35,.88);
  --row-hover:rgba(30,43,37,.65);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--sans);color:var(--ink);
  background:
    radial-gradient(1200px 600px at 12% -8%, var(--bg-grad-1), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, var(--bg-grad-2), transparent 55%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
  font-size:15px;line-height:1.78;
}
::selection{background:var(--brand-soft);color:var(--brand)}

/* ===================== 顶栏 ===================== */
.topbar{
  position:sticky;top:0;z-index:40;height:60px;display:flex;align-items:center;gap:14px;
  padding:0 20px;backdrop-filter:blur(14px);
  background:var(--topbar-bg);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand .logo{
  width:29px;height:29px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:linear-gradient(140deg,#4ea47a,#2a6a4a);
  box-shadow:0 2px 8px rgba(47,111,78,.34), inset 0 1px 0 rgba(255,255,255,.16);
}
.brand .logo svg{display:block;width:21px;height:21px}
.brand small{font-weight:500;color:var(--ink-3);font-size:12px;margin-left:2px}
.spacer{flex:1}
.search-wrap{position:relative;width:min(420px,42vw)}
.search-wrap input{
  width:100%;height:36px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--ink);padding:0 34px 0 34px;font-size:13.5px;font-family:var(--sans);
  outline:none;transition:.18s;
}
.search-wrap input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.search-wrap .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:13px}
.search-wrap kbd{
  position:absolute;right:9px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:10.5px;color:var(--ink-3);border:1px solid var(--line);
  border-radius:5px;padding:1px 5px;background:var(--panel)
}
.icon-btn{
  border:1px solid var(--line);background:var(--panel);color:var(--ink-2);cursor:pointer;
  height:34px;min-width:34px;border-radius:9px;display:grid;place-items:center;font-size:14px;
  transition:.18s;font-family:var(--sans);
}
.icon-btn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
#menuBtn{display:none}

/* ===================== 三栏布局 ===================== */
.shell{display:grid;grid-template-columns:296px minmax(0,1fr) 232px;gap:0;align-items:start}
.sidebar{
  position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;overscroll-behavior:contain;
  padding:18px 10px 60px 16px;border-right:1px solid var(--line);
}
.sidebar::-webkit-scrollbar,.main::-webkit-scrollbar,.toc-inner::-webkit-scrollbar{width:8px}
.sidebar::-webkit-scrollbar-thumb,.main::-webkit-scrollbar-thumb,.toc-inner::-webkit-scrollbar-thumb{
  background:var(--line);border-radius:8px
}
.side-title{
  font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--ink-3);
  text-transform:uppercase;padding:0 8px;margin:6px 0 10px
}
.nav-group{margin-bottom:4px}
.nav-group > .g-head{
  display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;
  padding:7px 9px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink-2);
  transition:.15s;
}
.nav-group > .g-head:hover{background:var(--panel-2);color:var(--ink)}
.g-head .chev{font-size:9px;color:var(--ink-3);transition:transform .2s;display:inline-block}
.nav-group.collapsed .chev{transform:rotate(-90deg)}
.nav-group.collapsed .g-body{display:none}
.g-head .cnt{
  margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);
  background:var(--panel-2);border:1px solid var(--line-2);border-radius:20px;padding:0 6px
}
.g-body{padding:2px 0 6px 4px;border-left:1px dashed var(--line);margin-left:14px}
.nav-item{
  display:block;padding:6px 10px;margin:1px 0 1px 6px;border-radius:8px;
  color:var(--ink-2);text-decoration:none;font-size:13px;line-height:1.45;transition:.15s;
  position:relative;
}
.nav-item:hover{background:var(--panel-2);color:var(--ink)}
.nav-item.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav-item.active::before{
  content:"";position:absolute;left:-6px;top:50%;transform:translateY(-50%);
  width:3px;height:16px;border-radius:3px;background:var(--brand)
}
.nav-item .tag{
  font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-right:5px;
}

/* ===================== 主区 ===================== */
.main{
  min-height:calc(100vh - 60px);padding:0 0 80px;
  max-width:min(1180px,100%);
}
.progress{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--brand),var(--accent));width:0;z-index:60;transition:width .1s}
.doc-head{padding:34px 46px 18px}
.crumb{font-size:12px;color:var(--ink-3);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.crumb b{color:var(--brand);font-weight:600}
.doc-title{font-size:29px;line-height:1.32;margin:0 0 10px;font-weight:800;letter-spacing:-.3px}
.doc-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--ink-3)}
.doc-meta .pill{
  border:1px solid var(--line);border-radius:20px;padding:2px 10px;background:var(--panel)
}
.doc-body{padding:6px 46px 0}

/* ===================== 正文排版 ===================== */
.doc-body h1{
  font-size:27px;margin:30px 0 14px;padding-left:13px;position:relative;line-height:1.4;
}
.doc-body h1::before{content:"";position:absolute;left:0;top:.18em;bottom:.18em;width:4px;border-radius:4px;background:var(--brand)}
.doc-body h2{
  font-size:21px;margin:38px 0 14px;padding-left:13px;position:relative;line-height:1.45;
  scroll-margin-top:78px;
}
.doc-body h2::before{content:"";position:absolute;left:0;top:.2em;bottom:.2em;width:4px;border-radius:4px;background:var(--brand)}
.doc-body h3{
  font-size:17px;margin:26px 0 10px;scroll-margin-top:78px;color:var(--ink);
}
.doc-body h4{font-size:15.5px;margin:20px 0 8px;color:var(--ink-2);scroll-margin-top:78px}
.doc-body .anchor{
  opacity:0;margin-left:8px;color:var(--ink-3);text-decoration:none;font-weight:400;font-size:.8em;
  transition:.15s
}
.doc-body h2:hover .anchor,.doc-body h3:hover .anchor,.doc-body h1:hover .anchor{opacity:1}
.doc-body p{margin:12px 0}
.doc-body a{color:var(--brand);text-decoration:none;border-bottom:1px solid var(--brand-soft)}
.doc-body a:hover{border-bottom-color:var(--brand)}
.doc-body strong{font-weight:700;color:var(--ink)}
.doc-body hr{border:none;border-top:1px solid var(--line);margin:30px 0}
.doc-body blockquote{
  margin:16px 0;padding:12px 18px;border-radius:0 10px 10px 0;
  border-left:3px solid var(--brand);background:var(--brand-soft);color:var(--ink-2);
}
html[data-theme="dark"] .doc-body blockquote{background:var(--brand-soft)}
.doc-body blockquote p{margin:6px 0}
.doc-body blockquote p:first-child{margin-top:0}
.doc-body blockquote p:last-child{margin-bottom:0}
.doc-body ul,.doc-body ol{margin:12px 0;padding-left:24px}
.doc-body li{margin:5px 0}
.doc-body li > ul,.doc-body li > ol{margin:5px 0}
.doc-body input[type="checkbox"]{margin-right:6px;accent-color:var(--brand)}
.doc-body code.ic{
  font-family:var(--mono);font-size:.88em;background:var(--accent-soft);color:var(--accent);
  padding:1.5px 6px;border-radius:5px;border:1px solid rgba(194,96,61,.22);
  white-space:nowrap;
}

/* 表格 */
.table-wrap{margin:18px 0;overflow-x:auto;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-sm);background:var(--panel)}
.doc-body table{border-collapse:collapse;width:100%;font-size:13.5px}
.doc-body thead th{
  background:var(--panel-2);text-align:left;font-weight:700;color:var(--ink);
  padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;
}
.doc-body td{padding:9px 14px;border-bottom:1px solid var(--line-2);vertical-align:top;color:var(--ink-2)}
.doc-body tbody tr:last-child td{border-bottom:none}
.doc-body tbody tr:hover td{background:var(--row-hover);color:var(--ink)}

/* ===================== 代码块（参考截图风格） ===================== */
.code-wrap{
  margin:20px 0;border-radius:12px;overflow:hidden;background:var(--code-bg);
  box-shadow:0 12px 32px rgba(20,22,20,.22), 0 0 0 1px rgba(255,255,255,.04) inset;
}
.code-head{
  display:flex;align-items:center;gap:10px;padding:9px 13px;background:var(--code-head);
  border-bottom:1px solid var(--code-line);
}
.code-head .dots{display:inline-flex;gap:6px}
.code-head .dots i{width:11px;height:11px;border-radius:50%;display:inline-block}
.code-head .d1{background:#ec6a5e}.code-head .d2{background:#f4bf4f}.code-head .d3{background:#61c554}
.code-head .lang{
  font-family:var(--mono);font-size:11.5px;color:#8f9a92;letter-spacing:.06em;text-transform:lowercase;
}
.code-head .copy-btn{
  margin-left:auto;font-family:var(--sans);font-size:11.5px;color:#9aa79f;cursor:pointer;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  border-radius:6px;padding:3px 10px;transition:.16s;
}
.code-head .copy-btn:hover{color:#e8efe9;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18)}
.code-head .copy-btn.done{color:#8ee0a8;border-color:rgba(142,224,168,.4)}
.code-body{
  margin:0;padding:16px 18px;overflow-x:auto;font-family:var(--mono);
  font-size:12.8px;line-height:1.72;color:#d6ddd8;tab-size:4;
}
.code-body code{font-family:inherit;white-space:pre}
.tok-k{color:#8fd3a8;font-weight:600}      /* 关键字：柔绿 */
.tok-s{color:#e6c07b}                      /* 字符串：暖黄 */
.tok-c{color:#6e7a72;font-style:italic}    /* 注释：灰绿 */
.tok-n{color:#9fc4e8}                      /* 数字：浅蓝 */
.code-body::-webkit-scrollbar{height:8px}
.code-body::-webkit-scrollbar-thumb{background:#3a413c;border-radius:8px}
.code-body::-webkit-scrollbar-track{background:transparent}

/* ===================== 右侧文章目录 ===================== */
.toc{position:sticky;top:60px;height:calc(100vh - 60px);padding:26px 14px 40px 6px}
.toc-inner{height:100%;overflow-y:auto;border-left:1px solid var(--line);padding-left:14px}
.toc-title{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase;margin:0 0 12px}
.toc a{
  display:block;font-size:12.5px;line-height:1.5;color:var(--ink-3);text-decoration:none;
  padding:4px 8px;border-radius:6px;margin-bottom:1px;transition:.15s;
  border-left:2px solid transparent;margin-left:-15px;padding-left:13px;
}
.toc a.lv3{padding-left:24px;font-size:12px}
.toc a:hover{color:var(--ink);background:var(--panel-2)}
.toc a.active{color:var(--brand);border-left-color:var(--brand);background:var(--brand-soft);font-weight:600}

/* ===================== 分页 / 底部 ===================== */
.pager{display:flex;gap:12px;padding:36px 46px 0;flex-wrap:wrap}
.pager a{
  flex:1;min-width:220px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  text-decoration:none;color:var(--ink-2);background:var(--panel);transition:.18s;box-shadow:var(--shadow-sm)
}
.pager a:hover{border-color:var(--brand);box-shadow:var(--shadow);transform:translateY(-1px)}
.pager .dir{font-size:11px;color:var(--ink-3);margin-bottom:3px}
.pager .t{font-weight:600;color:var(--ink);font-size:14px}
.pager .next{text-align:right}
.doc-foot{padding:30px 46px 0;color:var(--ink-3);font-size:12px;border-top:1px solid var(--line-2);margin-top:30px}

/* ===================== 搜索面板 ===================== */
.search-panel{
  position:fixed;inset:60px 0 0 0;z-index:35;display:none;justify-content:center;
  padding:14px 20px 0;background:rgba(28,25,20,.20);backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
}
html[data-theme="dark"] .search-panel{background:rgba(0,0,0,.5)}
.search-panel.on{display:flex}
.search-results{
  width:min(760px,100%);max-height:62vh;overflow-y:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:8px;
}
.sr-item{display:block;padding:10px 12px;border-radius:9px;text-decoration:none;transition:.14s}
.sr-item:hover,.sr-item.sel{background:var(--brand-soft)}
.sr-item .t{font-weight:600;color:var(--ink);font-size:13.5px;margin-bottom:2px}
.sr-item .g{font-size:11px;color:var(--ink-3);margin-bottom:4px}
.sr-item .s{font-size:12.5px;color:var(--ink-2);line-height:1.55}
.sr-item mark{background:rgba(194,96,61,.28);color:inherit;border-radius:3px;padding:0 1px}
.sr-empty{padding:26px;text-align:center;color:var(--ink-3);font-size:13px}
.sr-hint{padding:8px 12px;color:var(--ink-3);font-size:11.5px;border-top:1px solid var(--line-2);margin-top:6px}

/* ===================== 首页 ===================== */
.hero{padding:52px 46px 10px}
.hero h1{font-size:36px;margin:0 0 12px;letter-spacing:-.6px;line-height:1.3}
.hero h1 .grad{
  background:linear-gradient(120deg,var(--brand),var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero p{color:var(--ink-2);max-width:640px;margin:0 0 22px;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;padding:0 46px;margin:8px 0 26px}
.stat{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow-sm)
}
.stat .n{font-size:24px;font-weight:800;color:var(--brand);font-family:var(--mono);letter-spacing:-.5px}
.stat .l{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.home-group{margin:0}
.home-group-title{
  display:flex;align-items:center;gap:9px;padding:0 46px;margin:28px 0 12px;
  font-size:13.5px;font-weight:700;color:var(--ink-2);letter-spacing:.02em;
}
.home-group-title::before{
  content:"";width:3px;height:14px;border-radius:2px;background:var(--brand);flex:none
}
.home-group-title .cnt{
  font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--ink-3);
  background:var(--panel-2);border:1px solid var(--line-2);border-radius:20px;padding:1px 8px
}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding:0 46px 20px}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
  text-decoration:none;color:inherit;transition:.2s;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
}
.card:hover{border-color:var(--brand);box-shadow:var(--shadow);transform:translateY(-2px)}
.card::after{

const KB = {"groups":[{"name":"开始","articles":[{"id":"readme","title":"使用说明与索引","desc":"三遍复习法、自查清单映射表、命名与拆分规则","file":"README.md","content":"# 测试开发知识汇总\n\n用来系统复习测试开发岗的计算机基础 + 工程能力，目标是**能在工作里直接用、在面试里讲清楚**。\n每篇的原则：不写概念定义，写\"这件事在测开工作中出现在哪、怎么验证、哪里会踩坑\"。\n\n> 📖 **不想逐篇点开 md？** 直接双击根目录的 **`测试开发知识库.html`**：\n> 左侧分组目录、顶部全文搜索、右侧本篇大纲、代码块带高亮和一键复制，单文件离线可用。\n>\n> 🌐 **想分享给别人看？** 见仓库里的 `DEPLOY.md`——推到 GitHub 后自动部署成在线站点，\n> 以后只要 push Markdown 就会自动更新，不用买服务器。\n\n---\n\n## 目录\n\n### 一、计算机基础\n\n| 篇目 | 覆盖清单 | 对应自查 |\n| --- | --- | --- |\n| [测试开发-计算机网络篇](测试开发-计算机网络篇.md) | HTTP/HTTPS、TCP/UDP、DNS、会话机制、状态码、URL 到渲染、HTTP 演进、WebSocket、CDN/网关 | 基础 Q1–Q4 |\n| [测试开发-操作系统篇](测试开发-操作系统篇.md) | 进程/线程、IPC、上下文切换、死锁、内存管理、I/O 模型、调度、文件系统、信号 | 基础 Q5–Q6 |\n| [测试开发-数据结构与算法篇](测试开发-数据结构与算法篇.md) | 数组/链表/栈/队列/哈希/树/堆、排序、二分、双指针、DFS/BFS、DP、复杂度 | 基础 Q7 |\n| [测试开发-系统设计意识篇](测试开发-系统设计意识篇.md) | 缓存、限流、超时、重试、熔断、降级、幂等、日志监控告警 | 基础 Q8 |\n\n### 二、语言与框架（Python）\n\n| 篇目 | 覆盖清单 | 对应自查 |\n| --- | --- | --- |\n| [测试开发-Python语言核心篇](测试开发-Python语言核心篇.md) | 语法与异常、OOP、集合选型、文件读写、依赖管理、requests、并发三模型 | 语言 Q1 |\n| [测试开发-pytest框架篇](测试开发-pytest框架篇.md) | fixture、参数化、mark、conftest 与 hook、插件生态、unittest 存量、Mock | 语言 Q2–Q4 |\n| [测试开发-工程习惯篇](测试开发-工程习惯篇.md) | 日志、配置分离、给测试代码写测试、lint 与提交规范、自建被测服务 | 语言 Q5–Q6 |\n\n### 三、数据、中间件与工程运维\n\n| 篇目 | 覆盖清单 | 对应自查 |\n| --- | --- | --- |\n| [测试开发-MySQL篇](测试开发-MySQL篇.md) | SQL（查询/聚合/JOIN/分页）、表结构约束、事务与隔离级别、用 SQL 造数与断言、EXPLAIN/慢 SQL/索引失效 | 运维 Q1–Q2 |\n| [测试开发-Redis与缓存篇](测试开发-Redis与缓存篇.md) | 五种结构选型、三大缓存问题观测、RDB/AOF、redis-cli 查数造数、验证码与会员状态篡改、一致性用例 | 运维 Q3 |\n| [测试开发-中间件篇](测试开发-中间件篇.md) | MQ（异步/解耦/削峰、三产品差异、到达/重复/乱序/积压）、Nginx（反向代理、配置坑、502/504） | 运维 Q7–Q8 |\n| [测试开发-Linux命令篇](测试开发-Linux命令篇.md) | 查日志（grep/tail/awk/sed）、看状态（ps/top/df/du/free）、网络排查（curl/ss/ping）、权限 | 运维 Q4 |\n| [测试开发-Git篇](测试开发-Git篇.md) | 分支/合并/冲突、reset 与 revert、reflog、log/diff/blame、协作流程、.gitignore 与密钥泄露 | 运维 Q5 |\n| [测试开发-Docker与K8s篇](测试开发-Docker与K8s篇.md) | 镜像/容器、端口/挂载/环境变量、Dockerfile、compose、一次性干净库、Pod/Deployment/Service、kubectl 四板斧 | 运维 Q6 |\n| [测试开发-CI-CD篇 n| 9 | Dify 分块/TopK 在哪配，条件分支怎么测 | AI应用质量运营篇 | §1（参数位置表 + 五个维度 + 六条用例） |\n\n---\n\n## 怎么用这套材料\n\n**第一遍（建框架，11~12 天）**：只看每篇开头的\"自查分级表\"和每节小标题，知道有哪些东西、哪些是熟练档。不要逐字读。\n\n**第二遍（补短板，按档位）**：从\"会用但说不清\"那一档开始读，每个知识点读完立刻回答一句\"这东西在我现在的项目里用在哪\"。答不上来的，就是真的缺。\n\n**第三遍（动手，最关键）**：每篇末尾都有「动手清单」，32 篇一共 142 条，全部做完比读三遍有效得多。这些都设计成**在你自己的系统上能立刻执行**的动作，不是练习题。\n\n**面试前（巩固表达）**：只看每篇的「自查清单逐条作答」小节和代码注释。答案都按\"先结论、再场景、再坑\"组织，可以直接照着说。\n\n---\n\n## 三个贯穿全篇的判断标准\n\n这三个标准比背知识点重要，因为工作和面试真正考察的是它们：\n\n1. **能不能说清\"这个知识点在故障现场的哪个位置\"**。比如 TIME_WAIT，能说出\"在压测机上说明我连接没复用，在服务端上说明是服务端主动关闭\"，就比背 2MSL 强。\n2. **能不能说出\"测试这一步要验什么、怎么造出这个场景\"**。缓存雪崩谁都会说，能说出\"批量写 key 看 TTL 是否集中，或直接重启 Redis 观察降级\"，才是测开。\n3. **能不能分清\"该提 bug\"和\"该确认设计\"**。很多\"不符合规范\"的现象其实是设计取舍（比如业务失败也返回 200），先确认约定再定性，是专业度的分水岭。\n","chars":8479,"codes":0,"tables":20}]},{"name":"一、计算机基础","articles":[{"id":"net","title":"计算机网络篇","desc":"HTTP/TCP/DNS/会话机制/状态码/URL 到渲染","file":"测试开发-计算机网络篇.md","content":"# 测试开发-计算机网络篇\n\n> 对应清单：计算机网络【必须掌握】全部 + 【了解即可】全部\n> 对应自查：Q1（URL 到渲染）、Q2（401/403）、Q3（Cookie/Session/Token）、Q4（三次握手 / TIME_WAIT）\n> 全篇约定：示例环境是 `api.test.example.com`，技术栈 Python 3.10 + requests + pytest。文中所有\"坑\"都是测试环境里真会出现的现象，不是课本里的理论风险。\n\n---\n\n## 0. 先定位：网络知识在测开岗位上到底用在哪\n\n学网络不是为了背，是为了在这四类时刻不掉链子：\n\n| 场景 | 需要的能力 | 用不到会怎样 |\n| --- | --- | --- |\n| 接口自动化调不通 | 看报文、看 Header、看状态码 | 只会 `print(resp.text)`，然后把锅甩给后端 |\n| 环境问题定位 | 分清是 DNS、网关、后端还是证书 | 一个 502 排查一整天，最后发现是网关路由配错了 |\n| 性能测试 | TCP 连接复用、TIME_WAIT、HTTP/2 | 压测机自己把端口耗尽了，结论是\"后端扛不住 500 QPS\" |\n| 安全/健壮性用例 | Cookie 属性、JWT、mTLS、畸形报文 | 测不出越权、测不出伪造 token |\n\n本篇的自查分级（复习时按这个顺序过）：\n\n| 知识点 | 掌握档位 | 落点 |\n| --- | --- | --- |\n| 状态码 / Header 排错 | 熟练 | 每天都在用 |\n| 会话机制 + 登录态维护 | 熟练 | 接口自动化的地基 |\n| HTTPS 证书问题 | 会用能讲清 | 环境问题高频 |\n| TCP 握手 / TIME_WAIT | 会用能讲清 | 压测必踩 |\n| DNS 解析链路 | 会用 | 切环境、切流 |\n| HTTP/2、WebSocket、CDN | 能说清差异 | 面试 + 特定项目 |\n| 报文结构（裸 socket） | 知道怎么造 | 健壮性/安全用例 |\n\n---\n\n## 1. HTTP / HTTPS\n\n### 1.1 报文结构：先能\"看见\"它\n\n请求长这样（抓包/打印出来的真实形态）：\n\n```\nPOST /api/v1/orders HTTP/1.1\nHost: api.test.example.com\nContent-Type: application/json\nContent-Length: 27\nAuthorization: Bearer eyJhbGciOiJIUzI1NiJ9...\n\n{\"sku_id\": 1001, \"num\": 2}\n```\n\n响应：\n\n```\nHTTP/1.1 201 Created\nContent-Type: application/json\nSet-Cookie: sid=abc123; Path=/; HttpOnly; Secure; SameSite=Lax\nContent-Length: 45\n\n{\"order_id\": \"20261028001\", \"status\": \"PAID\"}\n```\n\n结构就三块：**起始行 → Header → 空行 → Body**。测开要记住两点：\n\n1. **空行是分隔符，不是可选的**。少一个 `\\r\\n`，服务端会一直等 body，直到超时。手写 socket 造报文时最容易漏。\n2. **`Content-Length` 和 `Transfer-Encoding: chunked` 二选一**。两个都给、或者 Length 和实际 body 长度对不上，服务端行为就不确定了（有的框架读到一半就返回，有的直接挂住）。\n\n**实战：用裸 socket 造畸形报文，测服务端的健壮性。** 这类用例是接口测试里最容易被忽略、但后端最怕的一类。\n\n```python\nimport socket\n\nimport pytest\n\ndef raw_request(host: str, port: int, payload: bytes, timeout: float = 5) -> bytes:\n    \"\"\"发原始 HTTP 报文，拿到原始响应。用来测网关/框架对畸形请求的防御。\"\"\"\n    with socket.create_connection((host, port), timeout=timeout) as s:\n        s.sendall(payload)\n        chunks = []\n        while True:\n            data = s.recv(4096)\n            if not data:\n                break\n            chunks.append(data)\n        return b\"\".join(chunks)\n\n# 用例 1：body 里有 JSON，但故意不写 Content-Length 也不写 chunked\n# 期望：服务端在合理时间内明确返回 400 / 411，而不是挂住\nbad_request = (\n    b\"POST /api/login HTTP/1.1\\r\\n\"\n    b\"Host: api.test.example.com\\r\\n\"\n    b\"Content-Type: application/json\\r\\n\"\n    b\"\\r\\n\"\n    b'{\"user\":\"u1\",\"pwd\":\"p\"}'\n)\n\ndef test_missing_content_length():\n    try:\n        resp = raw_request(\"api.test.example.com\", 80, bad_request, timeout=3)\n        assert b\"400\" in resp.split(b\"\\r\\n\")[0] or b\"411\" in resp.split(b\"\\r\\n\")[0]\n    except socket.timeout:\n        pytest.fail(\"服务端未在 3s 内响应，缺少 Content-Length 时挂住了连接（可能被判定为慢请求攻击面）\")\n```\n\n同类能顺手加进用例集的畸形请求：\n\n| 畸形点 | 期望行为 | 真实漏洞形态 |\n| --- | --- | --- |\n| `Content-Length: 99999999` 但 body 只有 10 字节 | 立即拒绝 | 服务端分配大 buffer，内存暴涨 |\n| Header 里塞 100KB 的 `X-Big` | 网关返回 431 / 400 | 网关透传后打爆后端 |\n| 重复的 `Content-Length`（一个 10 一个 20） | 400 | 请求走私（smuggling） |\n| `Transfer-Encoding: chunked` + `Content-Length` 同时存在 | 400 | 经典 HTTP 请求走私 |\n| URL 里带 `%00`、`../` | 400 / 404 | 路径穿越 |\n\n> 这块不是\"安全测试同学的活\"，是接口测试里\"异常输入\"分区的标准动作。写在用例设计里的位置：异常场景 → 协议层异常。\n\n### 1.2 请求方法：不是背定义，是判断\"重试安不安全\"\n\n| 方法 | 幂等 | 安全性（不改数据） | 测试时的实际意义 |\n| --- | --- | --- | --- |\n| GET | 是 | 是 | 可以随便重试；但**不能**用 GET 做下单/删除（否则浏览器预取、爬虫会触发） |\n| POST | **否** | 否 | 重试前必须确认服务端幂等（靠 requestId / 唯一索引） |\n| PUT | 是 | 否 | 全量替换，重试安全；测\"并发 PUT 同一资源\"的最后写赢 |\n| PATCH | 通常否 | 否 | 局部更新，测并发时字段互相覆盖 |\n| DELETE | 是 | 否 | 重试安全，但要测\"重复删除\"返回 200 还是 404，两套设计都常见，断言前先问清楚 |\n| HEAD | 是 | 是 | 常用于健康检查、判断资源是否存在、看 fileSize |\n| OPTIONS | 是 | 是 | CORS 预检。**测跨域时必看**，服务端没返回正确的 `Access-Control-Allow-*`，前端直接报跨域 |\n\n一条实用的判断链，接口超时要不要自动重试：\n\n```\nGET/PUT/DELETE  → 可以直接重试（但要限次数 + 退避）\nPOST/PATCH      → 先看服务端有没有幂等设计（requestId/唯一索引/token）\n                  没有 → 绝不重试，否则产生重复订单，这是线上事故的经典形态\n```\n\n### 1.3 Header：接口调试 80% 的问题在这\n\n真实踩坑清单：\n\n| Header | 踩法 | 现象 | 怎么快速确认 |\n| --- | --- | --- | --- |\n| `Content-Type` | `requests.post(url, data={\"a\": 1})` 会编码成 `application/x-www-form-urlencoded` | 服务端只收 JSON → 400 / 415，或者字段全 null | 打印 `resp.request.headers`，别看文档看实际 |\n| `Accept` | 服务端做内容协商，`Accept: */*` 返回 XML | 断言 `resp.json()` 直接抛异常 | 加 `Accept: application/json` |\n| `User-Agent` | 网关/风控按 UA 拉黑 `python-requests/2.x` | 测试环境 requests 403，Postman 正常 | 换 UA 试一次，能通就是风控 |\n| `Authorization` | 少个 `Bearer `，或多写空格 | 401 | 打印实际 header |\n| `Host` | 直接打 IP `http://10.0.0.5/api` | 网关按 Host 路由匹配不上 → 404 / 502 | `curl -H \"Host: api.test.example.com\" http://10.0.0.5/api` |\n| `X-Request-Id` | 不带 | 服务端日志串不起来，排查靠时间戳瞎猜 | 测试框架统一注入 uuid |\n| `Referer` / `Origin` | 部分接口做来源校验 | 403 或 CORS 失败 | 直接 curl 复现 |\n| `Accept-Encoding` | 请求 gzip，但断言时忘了解压 | 断言失败，看到乱码 | requests 会自动解压，但裸 socket 不会 |\n\n**\"打印实际发出的报文\"这个动作，应该写进你的调试习惯里：**\n\n```python\ndef dump(resp: requests.Response) -> None:\n    req = resp.request\n    print(f\"> {req.method} {req.url}\")\n    for k, v in req.headers.items():\n        print(f\"> {k}: {v}\")\n    if req.body:\n        body = req.body if isinstance(req.body, str) else req.body.decode(\"utf-8\", \"replace\")\n        print(f\">\\n> {body[:2000]}\")\n    print(f\"<\\n< {resp.status_code} {resp.reason}\")\n    print(f\"< {resp.text[:2000]}\")\n```\n\n很多\"文档说参数 a 是必填，我传了还是报缺\"的问题，看一眼实际报文就结束了。\n\n### 1.4 Cookie：属性都是测试点\n\n`Set-Cookie` 的每个属性对应一个能提的 bug：\n\n| 属性 | 含义 | 对应测试用例（选中你就是个合格的安全意识） |\n| --- | --- | --- |\n| `Domain=.example.com` | 子域共享 | 越权：`a.example.com` 拿到的 session，在 `b.example.com` 是否应该生效？客服站和用户站共享 cookie 是经典越权起点 |\n| `Path=/admin` | 路径限制 | 用 `/api` 下的请求是否带上了 `/admin` 的 cookie |\n| `HttpOnly` | JS 读不到 | 不带的话，XSS 一打就能偷 session |\n| `Secure` | 只走 HTTPS | 测试环境常是 HTTP，带了 Secure 就**根本发不出**，表现为\"登录成功但下个接口 401\"，非常隐蔽 |\n| `SameSite=Lax/Strict/None` | CSRF 防护 | `None` 必须同时有 `Secure`，否则现代浏览器直接丢弃 |\n| `Expires / Max-Age` | 有效期 | 不设 → 会话 cookie，关浏览器即失效；测\"长时间挂机后是否需要重登\" |\n| 无 `SameSite` 且无 `Secure` | — | 直接可以提安全工单 |\n\n**一个真实遇到过的组合故障**：测试环境上了 HTTPS，但 `Set-Cookie` 里是 `Secure; SameSite=None`，而后端校验 CSRF 用的是某个只在前端 localStorage 里存的 token，结果 Postman 能通、浏览器不通 —— 因为 Postman 不执行 cookie 策略。**结论：浏览器行为必须用浏览器验，接口工具验不出 Cookie 策略问题。**\n\n### 1.5 状态码：每条都对应一个排查动作\n\n| 码 | 含义 | 测开视角的判断 |\n| --- | --- | --- |\n| 200 | OK | 注意\"业务失败也返回 200 + `{\"code\": 500}\"`\"的约定，**断言必须断言业务码，不能只看 HTTP 码** |\n| 201 | Created | 创建类接口的规范返回，断言 body 里要带新资源 id |\n| 204 | No Content | 无 body。`resp.json()` 会炸，断言前先判空 |\n| 301 | 永久重定向 | **浏览器和客户端会缓存**，改回来很难（缓存打不干净）。测灰度切换时这是个大坑 |\n| 302 / 307 | 临时重定向 | 302 会把 POST 改成 GET（历史上），307/308 保留方法和 body。测\"重定向后 body 丢没丢\" |\n| 400 | 参数错误 | 最常见。看响应体里的错误字段，别只看码 |\n| 401 | **未认证**：没带凭证 / token 过期 / 签名错 | 客户端应跳登录页 |\n| 403 | **已认证但无权限** | 客户端应提示\"无权限\"，**不应**跳登录页（跳了就是 bug：用户会以为密码错了） |\n| 404 | 资源不存在 | 注意 403 伪装成 404 防枚举的设计（安全要求），此时断言要看业务是否真存在 |\n| 405 | 方法不允许 | 用 GET 打 POST 接口时出现，测 RESTful 规范 |\n| 409 | 冲突 | 幂等/并发场景：重复创建、版本冲突 |\n| 413 | body 太大 | 网关 `client_max_body_size` 限制，上传大文件必测 |\n| 429 | 被限流 | 配合 `Retry-After` 断言 |\n| 500 | 服务端内部错误 | **一定伴随堆栈日志**，找后端要 trace |\n| 502 | 网关拿到上游响应失败 | 后端挂了 / 端口错 / 路由错。**不是后端返回的**，是网关返回的 |\n| 503 | 服务不可用 | 实例全挂 / 发版中 / 过载 / 被限流 |\n| 504 | 网关等上游超时 | 后端慢（DB 慢、下游慢、死锁挂住）。**排查方向是后端耗时，不是网关** |\n\n排查口诀：\n\n```\n4xx → 看请求（参数、凭证、路径、方法），问题在客户端/测试脚本\n5xx → 看后端和链路，502/503 先看后端活没活，504 先看后端慢在哪\n```\n\n### 1.6 HTTPS：握手、证书，以及测试环境 90% 的证书事故\n\n握手（能讲清这个粒度就够面试用）：\n\n```\nClient                                        Server\n  |  ClientHello（支持的版本/套件、随机数、SNI）  |\n  |-------------------------------------------->|\n  |  ServerHello、Certificate、ServerKeyExchange |\n  |<--------------------------------------------|\n  |  验证证书链 → 生成 pre-master → 发 Finished  |\n  |-------------------------------------------->|\n  |                        Finished             |\n  |<--------------------------------------------|\n  ============ 之后全部对称加密 ============\n```\n\nTLS 1.2 是 2-RTT，TLS 1.3 压到 1-RTT，会话复用/0-RTT 可以更快。**测试要知道的**：握手开销在\"首次连接\"，所以压测要区分长连接和短连接，否则压出来的 QPS 全是握手成本。\n\n证书解决三件事：**身份真实**（域名绑定在证书 SAN 里）、**密钥交换安全**（公钥）、**不可抵赖**（CA 签名）。证书链是 leaf → intermediate → root，客户端信任 root。\n\n测试环境真实事故清单：\n\n| 现象 | 原因 | 定位方式 |\n| --- | --- | --- |\n| 昨天好的接口今天全部 SSL 报错 | 证书过期 | `openssl s_client -connect host:443 -servername host` 看 `notAfter` |\n| 浏览器能开，Java/Python 客户端报证书错误 | 证书链不完整，只配了 leaf 没配 intermediate。浏览器会自动下载补全，很多 HTTP 客户端不会 | `openssl s_client -showcerts`，看返回几段证书 |\n| 一个 IP 上多个域名，有的报证书不匹配 | 没配 SNI，或证书 SAN 里缺域名 | 加 `-servername` 再测一次 |\n| 内部服务互调必须双向认证 | mTLS，客户端要给证书 | 见下面代码 |\n| 抓包看不到明文 | HTTPS 默认加密，需要 MITM 代理 + 装根证书 | mitmproxy / Charles |\n\n**mTLS 调用示例**（内部服务、部分支付渠道都用这个）：\n\n```python\nresp = requests.post(\n    \"https://internal.test.example.com/api/notify\",\n    json={\"order_id\": \"20261028001\"},\n    cert=(\"client.crt\", \"client.key\"),   # 客户端证书\n    verify=\"ca.pem\",                      # 服务端 CA，别用 False\n    timeout=(3, 10),\n)\n```\n\n**必须提的风险点**：`verify=False` 会关掉证书校验，等于放弃身份验证，中间人可以随便劫持。测试脚本里为了图快这么写很常见，但要清楚：**凡是在测试脚本里出现 `verify=False`，都要加一条注释说明为什么、并在 CI 里加规则禁止进主干**。可以用环境变量控制：\n\n```python\nimport os\nVERIFY = os.getenv(\"TLS_VERIFY\", \"true\").lower() != \"false\"  # 默认开启校验\n```\n\n**抓包怎么装证书**：mitmproxy 启动后访问 `http://mitm.it` 装根证书；Android 7+ 之后 App 默认不信任用户证书，需要 App 配 `networkSecurityConfig` 或测试包用 debug 变体；iOS 装完还要在\"证书信任设置\"里手动信任。这两条不搞清楚，移动端抓包会以为\"这个 App 防抓包\"。\n\n---\n\n## 2. TCP / UDP\n\n### 2.1 三次握手：为什么必须三次\n\n```\nClient                     Server\n  |  SYN(seq=x)              |\n  |------------------------->|   Server: 收到，确认客户端发送能力 OK\n  |  SYN+ACK(seq=y, ack=x+1) |\n  |<-------------------------|   Client: 确认服务端收发都 OK\n  |  ACK(ack=y+1)            |\n  |------------------------->|   Server: 确认客户端接收能力 OK\n```\n\n两次不够的原因，面试要能说出**两个**：\n\n1. **服务端无法确认客户端的接收能力**。第二次握手后，服务端只知道\"自己能发、能收\"，不知道客户端能不能收到。\n2. **无法防止历史连接的 SYN**。网络里滞留的旧 SYN 到达服务端，两次握手的话服务端直接建连，然后一直等数据，白白占资源；三次的话客户端会用 RST 打掉它。\n\n**测试视角**：这不是纯理论。SYN 队列溢出（`netstat -s | grep -i listen` 里的 `SYNs to LISTEN sockets dropped`）会表现为\"连接超时但后端 CPU 不高\"，压测上量时很典型。\n\n### 2.2 TIME_WAIT：太多说明什么（这是自查 Q4 的核心）\n\nTIME_WAIT 出现在**主动关闭方**，持续 2MSL（Linux 默认 60s）。存在的两个理由：保证最后一个 ACK 能重传到达、让本次连接的旧报文在网络中消散。\n\n**看到大量 TIME_WAIT 要怎么分析：**\n\n| 位置 | 原因 | 处理 |\n| --- | --- | --- |\n| 压测机（客户端侧） | 短连接太多，没复用连接池。一个 TCP 连接占一个本地端口，2MSL 内不能复用 → 端口耗尽 | 用连接池（`requests.Session` + `HTTPAdapter`），或调 `tcp_tw_reuse=1`、扩大 `ip_local_port_range` |\n| 被测服务（服务端侧） | **服务端主动关闭连接**。通常是框架或 nginx 的 `keepalive_timeout` 比客户端短，也可能是业务代码写完响应就 close | 看是不是 `ss -tan state time-wait sport = :443` 一堆。长连接配置要对齐 |\n| 两边都多 + 请求量本身大 | 正常现象，只要不耗尽端口就不用管 | — |\n\n**端口耗尽的报错长这样**，看到就知道是自己压太狠了：\n\n```\nOSError: [Errno 99] Cannot assign requested address\n```\n\n验证命令：\n\n```bash\nss -s                                   # 总体统计\nss -tan state time-wait | wc -l         # TIME_WAIT 数量\nss -tan state time-wait sport = :443 | head   # 按端口过滤\nss -s | grep -i \"time-wait\"\n```\n\n**压测实战结论**（这个结论比概念有用）：用 requests 直接循环 `requests.get()`，每次新建连接，TPS 上不去而且 TIME_WAIT 爆涨；换成 `Session` + `HTTPAdapter(pool_connections, pool_maxsize)` 后 TPS 提升数倍，这是\"连接复用\"的收益，不是后端变快了。压测前必须确认客户端连接池大小，否则你测的是握手能力。\n\n```python\nimport requests\n\nsession = requests.Session()\nadapter = requests.adapters.HTTPAdapter(\n    pool_connections=10,   # 主机连接池数量\n    pool_maxsize=100,      # 单主机最大连接数 → 决定并发上限\n    max_retries=0,         # 重试交给业务判断，别在 adapter 里隐式重试\n)\nsession.mount(\"https://\", adapter)\nsession.mount(\"http://\", adapter)\n```\n\n`pool_maxsize` 不调到并发数以上，多线程压测时线程会阻塞在\"等连接池空位\"，表现为\"并发上不去\"。\n\n### 2.3 四次挥手\n\n为什么是四次：TCP 是全双工，两个方向要各关一次。接收到 FIN 只表示对方没数据发了，本端还可以继续发（半关闭状态）。服务端常把 ACK 和 FIN 合并成一次，所以抓包有时看到三次。\n\n排查\"连接没关干净\"时看 `CLOSE_WAIT`：**大量 CLOSE_WAIT 说明应用层没调 close()**，是代码 bug（连接泄漏），不是网络问题。这个结论在排查\"服务越跑越慢、句柄数上涨\"时非常好用：\n\n```bash\nss -tan state close-wait | wc -l    # 持续上涨 → 代码里有连接没释放\nlsof -p <pid> | wc -l               # 看进程 fd 数\n```\n\n### 2.4 TCP vs UDP：选型判断\n\n| 维度 | TCP | UDP |\n| --- | --- | --- |\n| 可靠性 | 重传、有序、去重 | 不保证 |\n| 连接 | 有（握手/挥手） | 无 |\n| 头部开销 | 20 字节起 | 8 字节 |\n| 适用 | HTTP、DB、RPC、文件传输、MQ | DNS、QUIC（HTTP/3）、音视频、日志上报、监控打点、游戏 |\n\n测试里必须注意的 UDP 特性：\n\n- **DNS 默认走 UDP 53**。响应超过 512 字节会用 TCP 或 EDNS0 扩展；如果防火墙只放行了 UDP，DNSSEC 的大响应会解析失败，表现为\"某些域名解析不了\"。\n- **UDP 无连接，所以没有\"连接失败\"**，只有发出去收不到响应，超时要自己设。\n- 日志/打点用 UDP 是为了不阻塞业务，**丢包是设计允许的**，所以断言应该是\"抽样能看到\"而不是\"每条都在\"。\n\n---\n\n## 3. DNS：解析链路和它的三个测试坑\n\n客户端解析顺序（大致）：\n\n```\n1. 浏览器自身 DNS 缓存（chrome://net-internals/#dns 可清）\n2. 操作系统 hosts 文件\n3. 操作系统 DNS 缓存（systemd-resolved / nscd）\n4. 本地 DNS 服务器（运营商/内网 DNS）→ 递归查询\n5. 根域 → 顶级域(.com) → 权威 DNS → 返回 A/CNAME\n```\n\n第 4 步之后才是\"递归\"：客户端只管问一次，剩下的由本地 DNS 服务器代劳。\n\n**测开工作里的三个高频场景：**\n\n**① 用 hosts 把流量切到测试环境**\n\n```bash\n# 验证到底解析到哪台机器（比 nslookup 更贴近应用实际行为，会读 hosts）\ngetent hosts api.test.example.com\n\n# 看完整解析过程\ndig +trace api.test.example.com\ndig api.test.example.com @10.0.0.2    # 指定 DNS 服务器\n\ncurl -v https://api.test.example.com/api/ping 2>&1 | grep \"Trying\"\n```\n\n验证脚本里请求打到哪台机器，最快的办法是让被测服务在响应头里回一个 `X-Served-By: 10.0.0.5`，**别靠猜**。\n\n**② TTL 太长导致\"切了域名但流量还在老机器\"**\n\n这是发版/切流的标准事故。TTL 3600 意味着最多一小时内客户端还打老 IP。测试要点：切流后要验证**新老两台都被访问到或者都不被访问到**，取决于预期；如果预期全切但还有流量打老机器，就是 DNS 缓存没等 TTL。测试环境可以提前把 TTL 调到 60。\n\n**③ DNS 轮询 + 无状态会话 → 随机 401**\n\n多实例部署 + DNS 返回多个 A 记录 + Session 存在单机内存 → 登录请求打到 A 机，下一个请求打到 B 机，B 机不认这个 session，返回 401。**现象是\"偶发 401，重试又好了\"**，非常难查。\n\n判断方法：登录响应头里带 `X-Served-By`，对比失败请求的 `X-Served-By` 是否不同。这直接引出第 4 节的会话机制选型问题。\n\n---\n\n## 4. 会话机制：Cookie / Session / Token / JWT\n\n### 4.1 对比表（面试就照这个讲）\n\n| | 存哪 | 服务端有状态吗 | 跨域/跨端 | 注销 | 典型场景 |\n| --- | --- | --- | --- | --- | --- |\n| Cookie | 浏览器，随请求自动发 | 无所谓 | 受同源策略限制，麻烦 | 删 cookie | 传统 Web 站点 |\n| Session | 服务端（内存/Redis），客户端只存 sessionId | **有状态** | 需要共享存储才能跨实例 | 服务端删 | 后台管理系统、需要强制下线 |\n| Token | 客户端（Header/localStorage），服务端存或校验 | 可有可无 | 好，天然跨端 | 删本地 / 服务端黑名单 | App、前后端分离、OpenAPI |\n| JWT | 客户端，自包含 payload | **无状态**（校验签名即可） | 好 | 只能靠过期 / 黑名单 | 微服务间、SSO |\n\n一句话区分：**Cookie 是载体，Session 是服务端状态，Token 是凭证形式，JWT 是 Token 的一种自包含实现。**\n\nJWT 结构：`header.payload.signature`，三段 base64url。**payload 是明文可读的**（只是 base64，不是加密），所以绝对不能放手机号、密码、余额这类信息。\n\nJWT 的测试点（安全类必测）：\n\n| 用例 | 预期 |\n| --- | --- |\n| 篡改 payload（把 `role: user` 改成 `admin`） | 401，签名校验失败 |\n| 把 `alg` 改成 `none` | 401（很多老库有 alg=none 漏洞） |\n| HS256 与 RS256 混淆攻击（用公钥当 HMAC 密钥） | 401 |\n| 已过期 token | 401，且错误信息应引导重新登录而非\"无权限\" |\n| 注销后再用旧 token | 401（需要服务端黑名单，只有过期时间的话做不到） |\n| token 里带权限，权限变更后旧 token 是否仍然有旧权限 | 明确设计取舍：无状态 JWT 天然有\"权限滞后\"问题，测试要验证滞后窗口可接受或被强制刷新 |\n\n### 4.2 接口自动化里怎么维护登录态（自查 Q3 落地）\n\n**方案 A：Session 自动管 Cookie（最省事，适合 Web 后台）**\n\n```python\n@pytest.fixture(scope=\"session\")\ndef api():\n    s = requests.Session()\n    r = s.post(f\"{BASE}/api/login\", json={\"user\": \"qa01\", \"pwd\": \"P@ssw0rd\"})\n    r.raise_for_status()\n    yield s\n    s.close()\n```\n\n`requests.Session` 会自动保存 `Set-Cookie` 并在后续请求带上，同时复用 TCP 连接。\n\n**方案 B：Token + 自动刷新（前后端分离项目的主流）**\n\n关键是**过期处理不能靠\"把 token 存到文件里手工更新\"**，那会在 CI 里 100% 挂。\n\n```python\nimport time\nimport threading\nimport requests\n\nclass AuthClient:\n    def __init__(self, base: str, user: str, pwd: str):\n        self.base, self.user, self.pwd = base, user, pwd\n        self._token = None\n        self._expire_at = 0.0\n        self._lock = threading.Lock()   # 并发下只登录一次\n        self.s = requests.Session()\n\n    def _login(self):\n        r = self.s.post(f\"{self.base}/api/login\", json={\"user\": self.user, \"pwd\": self.pwd})\n        r.raise_for_status()\n        data = r.json()\n        self._token = data[\"token\"]\n        # 提前 60s 视为过期，避免\"刚好卡在边界上\"\n        self._expire_at = time.time() + data.get(\"expires_in\", 3600) - 60\n\n    def token(self) -> str:\n        with self._lock:\n            if self._token is None or time.time() >= self._expire_at:\n                self._login()\n            return self._token\n\n    def request(self, method: str, path: str, **kw):\n        headers = kw.pop(\"headers\", {})\n        headers[\"Authorization\"] = f\"Bearer {self.token()}\"\n        resp = self.s.request(method, f\"{self.base}{path}\", headers=headers, timeout=(3, 10), **kw)\n        if resp.status_code == 401:          # 服务端提前失效（重启、被踢）\n            self._login()\n            headers[\"Authorization\"] = f\"Bearer {self.token()}\"\n            resp = self.s.request(method, f\"{self.base}{path}\", headers=headers, timeout=(3, 10), **kw)\n        return resp\n```\n\n三个容易忽略的点：\n\n1. **401 重试只能做一次**，且**不能用于非幂等接口**（下单接口 401 重试变两次下单的 bug 我见过）。\n2. **多角色要多份登录态**。越权测试（用普通用户 token 打管理员接口）需要同时持有两个身份的 token，用 `pytest.fixture(params=[...])` 做参数化。\n3. **单点登录（SSO）项目里，并行用例会互相踢下线**。表现是随机 401。解法：账号池，每个 worker 一个账号（`pytest-xdist` 加 `--dist loadscope` 后按 worker id 取账号）。\n\n**方案 C：扫码登录/验证码登录的绕过**\n\n不要真去模拟扫码。正规做法：让后端提供**测试专用登录接口**（仅测试环境开启、带白名单 IP 校验），或用\"固定验证码\"的测试配置。如果都没有，就在 CI 文档里写清\"该用例不纳入自动化\"。硬编码图形验证码 OCR 是最脆的自动化，维护成本远高于收益。\n\n**并发坑**：`threading.local()` 存 Session 时要注意，`requests.Session` 不是线程安全的，高并发下要每线程一个 Session，或者用连接池加固：\n\n```python\nimport threading\n_local = threading.local()\n\ndef get_session() -> requests.Session:\n    if not hasattr(_local, \"s\"):\n        _local.s = requests.Session()\n        _local.s.headers.update({\"Authorization\": f\"Bearer {TOKEN}\"})\n    return _local.s\n```\n\n---\n\n## 5. 自查 Q1：浏览器输入 URL 到页面展示（附每步出错场景）\n\n这是本清单里最值得练熟一题，因为它能把网络知识全串起来。讲的时候要**带排查动作**，不是背流程。\n\n| # | 阶段 | 发生了什么 | 可能出错的场景 | 怎么确认 |\n| --- | --- | --- | --- | --- |\n| 1 | URL 解析 | 拆协议/域名/端口/路径/查询参数，浏览器做 HSTS 检查、拼默认端口 | 拼错 scheme（https 写成 http，被 301 到 https 时 header 丢了）；HSTS 强制 https 但测试环境无证书 → 直接打不开 | 地址栏按 F12 → Network，看实际请求的 URL |\n| 2 | 查缓存 | 浏览器缓存、DNS 缓存、Service Worker | Service Worker 缓存了旧 JS，改代码不生效（\"为什么我本地改了没变\") | DevTools → Application → Service Workers 勾选 Bypass |\n| 3 | DNS 解析 | 见第 3 节，本地 DNS 递归查询，得到 IP | 解析失败（`ERR_NAME_NOT_RESOLVED`）、解析到错误 IP（hosts 没生效/内网 DNS 没配）、轮询到无实例的机器 | `dig` / `nslookup` / `getent hosts`；`ping 域名` 看 IP |\n| 4 | TCP 连接 | 三次握手，拿到 socket | 连接超时（防火墙/安全组没开端口）、`ERR_CONNECTION_REFUSED`（服务没起/端口错）、`ERR_CONNECTION_RESET`（被中间设备重置，常见于公司网关/TLS 审计设备） | `telnet host 443` / `nc -vz host 443`；`curl -v` 看 `Trying 10.0.0.5:443` |\n| 5 | TLS 握手 | 校验证书、协商套件、交换密钥 | 证书过期/域名不匹配/自签名（`NET::ERR_CERT_AUTHORITY_INVALID`）、TLS 版本被禁（老系统只支持 TLS1.0，新浏览器拒）、SNI 不对 | `openssl s_client -connect host:443 -servername host` |\n| 6 | 发 HTTP 请求 | 拼请求行/Header/Cookie/Body，带上本地缓存相关头 | 请求体太大被网关截（413）、Header 太长（431）、Cookie 过多导致 Header 超限（偶发 400，很坑）、CORS 预检 OPTIONS 失败 | Network 面板看 Request Headers 实际内容；`curl` 复现 |\n| 7 | 服务端处理 | 网关鉴权/限流 → 应用 → 缓存/DB/下游 | 401/403（鉴权）、429（限流）、502/503/504（后端）、500（代码异常）、慢（DB 无索引/N+1/锁等待） | `curl -w \"%{time_total} %{http_code}\"`；抓包看 TTFB |\n| 8 | 返回响应 | 状态码 + Header + Body，可能带缓存头 | `Cache-Control: no-store` 缺失 → 隐私数据被缓存；`Content-Encoding: gzip` 但代理改坏了 → 乱码 | Network 面板的 Response Headers |\n| 9 | 解析与渲染 | HTML 解析 → DOM → CSSOM → 布局 → 绘制；期间加载 JS/CSS/图片 | 静态资源 404（发版后 hash 变了但 HTML 缓存了旧版 → 白屏）、JS 报错阻塞渲染（首屏空白）、CORS 导致字体/图片加载失败 | Console 报错、Network 里红色资源、Performance 面板 |\n\n**回答这题的加分项**：把\"出错场景 + 排查动作\"讲出来，而不是只讲流程；再补一句\"实际工作中我会先看 Network 面板确定失败在哪一层：没请求 → 前端/DNS；请求 pending → TCP/TLS；请求 4xx/5xx → 后端；请求 200 但页面白 → 前端渲染\"。\n\n**一个真实的白屏案例**，可以背下来当故事讲：发版后用户白屏，Network 里 `index.html` 是 200 但里面引用的 `app.3f2a.js` 404 —— 因为 HTML 被 CDN 缓存了旧版本，而旧 hash 的 JS 已经被新版本部署删掉。修复方式：HTML 不缓存（`Cache-Control: no-cache`）+ 静态资源长缓存 + 保留上一个版本的资源。**这是\"缓存一致性\"最典型的线上故障，比任何八股都实在。**\n\n---\n\n## 6. 【了解即可】三件事\n\n### 6.1 HTTP/1.1 → HTTP/2 → HTTP/3\n\n| 版本 | 传输层 | 核心变化 | 解决的痛点 | 对测试的影响 |\n| --- | --- | --- | --- | --- |\n| 1.1 | TCP | keep-alive 长连接 | 每请求建连 | 浏览器对同域并发 6 个连接，**压测阈值按\"连接数\"和\"QPS\"要分开算** |\n| 2 | TCP | 二进制分帧、多路复用、HPACK 头压缩、服务端推送（已废弃） | HTTP 层队头阻塞 | 一个 TCP 连接跑几百个 stream；抓包要按 stream 拆；**并发上限不再是连接数**；没有 reason phrase，断言别依赖它 |\n| 3 | **UDP + QUIC** | 0-RTT、连接迁移（换网不断）、无 TCP 层队头阻塞 | TCP 层队头阻塞、弱网 | 抓包需要 Wireshark 导出密钥日志；部分公司防火墙直接封 UDP 443，内网环境打不开 |\n\n测试时\"要不要压 HTTP/2\"要问清楚：**jmeter 默认 HTTP/1.1**，locust/httpx 可以配 h2。压出来 QPS 差一倍别急着说后端优化了，先确认协议。\n\n### 6.2 WebSocket 与长连接\n\n握手是基于 HTTP 的 `Upgrade: websocket`，之后全双工，服务端可以主动推。\n\n测试点（这块常被漏测）：\n\n| 测试点 | 怎么测 |\n| --- | --- |\n| 连接鉴权 | 握手请求里带 token，测无 token / 错 token 是否被拒（`401` 或握手后立即 close） |\n| 心跳 | 静默一段超过心跳间隔，看是否被服务端断开；客户端是否自动重连 |\n| 断线重连 | 杀网络（`toxiproxy` / 拔网线 / 断代理），恢复后是否补齐消息、是否重复消费 |\n| 消息顺序 | 高频发 N 条，断言接收顺序与发送一致 |\n| 消息大小 | 超过 max frame size 时的行为（截断 / 断开 / 报错） |\n| 并发连接 | 单机 1w 连接时内存、CPU、fd 数；fd 上限 `ulimit -n` |\n| 服务端重启 | 客户端是否表现为\"假在线\"（TCP 还没感知断开，消息发出去石沉大海） |\n\n```python\nimport json\nimport websocket  # websocket-client\n\ndef test_ws_push():\n    ws = websocket.create_connection(\n        \"wss://im.test.example.com/ws?token=\" + TOKEN,\n        timeout=5,\n        header={\"Origin\": \"https://app.test.example.com\"},\n    )\n    try:\n        ws.send(json.dumps({\"type\": \"subscribe\", \"channel\": \"order\"}))\n        msg = json.loads(ws.recv())\n        assert msg[\"type\"] == \"subscribed\"\n    finally:\n        ws.close()\n```\n\n长连接 vs 轮询 vs SSE 一句话区分：轮询是客户端定时问（实现简单、实时性差、请求量大）；长轮询是服务端 hold 住请求直到有数据（省请求但占连接）；SSE 是服务端单向推文本（简单，适合通知/进度条）；WebSocket 是全双工（适合 IM、协同编辑）。\n\n### 6.3 CDN / 代理 / 网关\n\n| 组件 | 作用 | 测试时最该验的 |\n| --- | --- | --- |\n| CDN | 静态资源就近分发、挡流量 | 缓存 key 是否含版本号、发版后旧资源是否还在、回源失败时的兜底、**同一 URL 不同用户拿到同一份缓存（数据串了就是大事故）** |\n| 正向代理 | 客户端侧代理，抓包/翻墙 | 测试脚本走代理：`proxies={\"https\": \"http://127.0.0.1:8080\"}` |\n| 反向代理（nginx） | 负载均衡、TLS 卸载、静态服务 | `X-Forwarded-For` 是否透传、大 body 限制、超时配置、`keepalive` 配置 |\n| 网关 | 统一鉴权、路由、限流、灰度、协议转换 | 未登录是否被拦在网关、限流阈值、路由规则、**跨域预检 OPTIONS 是否被网关放行** |\n\n网关相关的两个经典事故：\n\n1. **网关超时 < 后端超时**：网关 3s 超时返回 504，后端 10s 才处理完并成功。用户看到失败，实际订单已创建 → 重复下单。**测\"超时\"必须同时验证服务端最终状态，不能只看响应。**\n2. **跨域预检被网关拦**：`OPTIONS` 请求没带 token，网关直接 401，浏览器报 CORS 失败。表现是\"Postman 正常、前端不通\"。\n\n---\n\n## 7. 自查清单逐条作答（Q1–Q4）\n\n### Q1. 浏览器输入 URL 到页面展示，完整讲一遍，标出每一步可能出错的场景\n\n见第 5 节完整表格。**30 秒口头版**：\n\n> 解析 URL 和缓存 → DNS 解析拿 IP → TCP 三次握手 → TLS 握手校验证书 → 发 HTTP 请求（网关鉴权/限流 → 应用 → 缓存/DB）→ 返回响应 → 解析 HTML 建 DOM/CSSOM、加载子资源、布局绘制。\n> 每层都能出错：DNS 解析错 IP 或 hosts 不生效；TCP 层连接超时/端口不通；TLS 层证书过期或链不完整；HTTP 层 4xx 看请求、5xx 看后端；渲染层是静态资源 404 或 JS 报错。\n> 实际排查我先看 F12 Network 定位失败在哪一层，再看 Console 有没有前端报错。\n\n### Q2. 401 和 403 的区别？测登录接口时分别意味着什么\n\n| | 401 Unauthorized | 403 Forbidden |\n| --- | --- | --- |\n| 语义 | **身份没验证通过**：没带凭证、凭证无效、已过期 | **身份已验证，但没权限** |\n| 客户端正确反应 | 跳登录页 / 刷新 token | 提示\"无权限\"，**不能**跳登录页 |\n| 测登录接口时 | 密码错、账号不存在（安全要求下统一提示）、token 过期、签名错误 → **都应该是 401** | 登录本身成功了，但\"这个账号不能登这个系统/这个端\"（比如离职员工账号、无该角色权限）→ 403 |\n\n测试时要专门验的边界：\n\n1. **密码错误返回 401 还是 400？** 规范是 401。返回 400 不算致命，但要统一，不能\"密码错 400、token 错 401\"。\n2. **账号不存在 vs 密码错误是否返回相同响应？** 安全要求是相同（防账号枚举）。如果返回不同的错误信息，就是一个可提的安全问题。\n3. **未登录访问受保护接口**：应该是 401，不能是 403（403 会让前端不跳登录，用户卡死在空白页）。\n4. **登录成功后跨端访问**：普通用户 token 打管理端接口，应该 403。**这是越权测试的核心用例**，要覆盖\"横向越权\"（同角色访问别人资源，返回 403 还是 404 取决于是否防枚举）和\"纵向越权\"（低权限访问高权限）。\n5. **断言怎么写**：`assert resp.status_code in (401, 403)` 是典型的坏断言 —— 该分清的必须分清，否则越权测试等于没测。\n\n### Q3. Cookie、Session、Token 的区别？接口自动化怎么维护登录态\n\n区别见 4.1 表格。维护登录态的四种实际情况：\n\n| 项目形态 | 推荐方案 | 关键坑 |\n| --- | --- | --- |\n| 传统 Web，靠 Cookie/Session | `requests.Session` 自动接管 | 测试环境 https+Secure cookie 不落；跨实例 session 不共享导致偶发 401 |\n| 前后端分离，Bearer Token | 封装 `AuthClient`，401 自动刷新一次 | 刷新要加锁防并发重复登录；非幂等接口不能盲目重试 |\n| 多角色/越权测试 | 账号池 + fixture 参数化，同时持有多个 token | 单点登录互踢 |\n| 有验证码/扫码 | 测试环境专用登录接口或固定验证码 | 别做 OCR，维护成本比收益高 |\n\n再补一个工程化细节：**token 不要硬编码在代码里**，用环境变量或配置中心注入，CI 里按环境切换；同时给 `scope` 分好层，登录一次（`scope=\"session\"`）不要每个用例都登，否则会撞登录频率限制，还会拖慢整体执行时间。\n\n### Q4. 三次握手为什么是三次？TIME_WAIT 太多说明什么问题\n\n**为什么三次**：双向确认彼此的收发能力 + 防止历史滞留的 SYN 建立无效连接。两次的话服务端无法确认客户端接收能力，也无法识别旧 SYN。\n\n**TIME_WAIT 太多**，按位置分三种结论（这是答题的层次感）：\n\n1. **在压测客户端**：短连接太多、没复用连接池 → 本地端口耗尽（`Cannot assign requested address`）。解法是 Session + 连接池、`tcp_tw_reuse`、扩大端口范围。**注意这个现象会让你误判后端性能。**\n2. **在被测服务端**：服务端主动关闭连接（keepalive 超时短于客户端、或代码里写完就 close）。要看 `keepalive_timeout` 配置对齐。\n3. **两边都多但端口没耗尽**：正常，2MSL 的设计就是为了这个，不用干预。\n\n顺手能加分的对比：**CLOSE_WAIT 多才是真 bug**（应用没 close，连接泄漏），和 TIME_WAIT（内核正常回收中）性质完全不同。\n\n---\n\n## 8. 这一篇的复习动作清单\n\n只做这三件事，比读十遍强：\n\n- [ ] 用 `curl -v` + `openssl s_client` 完整跟一次自己系统的 HTTPS 请求，把证书链、SNI、状态码全看一遍。\n- [ ] 写一个 `raw_request` 的畸形报文用例（缺 Content-Length / 重复 CL），跑一次看服务端真实反应。\n- [ ] 在压测机上分别用 `requests.get()` 循环和 `Session` 连接池跑同样的请求数，对比 TPS 和 `ss -s` 的 TIME_WAIT 数量，形成自己的数据。\n","chars":13994,"codes":20,"tables":18},{"id":"os","title":"操作系统篇","desc":"进程线程/IPC/死锁/内存管理/I/O 模型","file":"测试开发-操作系统篇.md","content":"# 测试开发-操作系统篇\n\n> 对应清单：操作系统【必须掌握】全部 + 【了解即可】全部\n> 对应自查：Q5（进程/线程 + 测试并行）、Q6（死锁 + 测试场景里的死锁）\n> 全篇约定：示例在 Linux 测试机 / Docker 容器里跑，Python 3.10 + pytest。文中命令都可以直接粘。\n\n---\n\n## 0. 先定位：测开为什么绕不开操作系统\n\n不是因为面试问，而是因为下面这些事只有 OS 知识能解释：\n\n| 现象 | 需要懂的东西 |\n| --- | --- |\n| `pytest -n 8` 比 `-n 4` 更慢，还随机失败 | 进程/线程模型、资源竞争、上下文切换 |\n| 用例跑了 8 小时挂掉，机器 OOM | 虚拟内存、cgroup 限制、内存泄漏 |\n| 并发数加到 200，TPS 反降、load 很高 | 上下文切换、I/O 模型 |\n| 两条用例永久卡住，日志停在\"等待资源\" | 死锁四条件 |\n| 日志文件把磁盘写满，所有用例失败 | 文件系统、inode |\n| Ctrl+C 之后有僵尸进程残留 | 信号机制 |\n\n自查分级：\n\n| 知识点 | 档位 | 落点 |\n| --- | --- | --- |\n| 进程/线程区别 + 并行选型 | 熟练 | 每天都在选 |\n| 死锁四条件 | 熟练 | 用例互锁、DB 死锁 |\n| 虚拟内存 / 堆栈 / OOM | 会用 | 稳定性测试 |\n| I/O 模型 | 能讲清 | 压测工具选型 |\n| 上下文切换 | 能讲清 + 会看指标 | 性能调优 |\n| 调度 / 文件系统 / 信号 | 知道 | 排障 |\n\n---\n\n## 1. 进程 vs 线程\n\n### 1.1 区别（讲三句就够，但每句都要能落到测试上）\n\n| | 进程 | 线程 |\n| --- | --- | --- |\n| 地址空间 | **独立**，互不可见 | **共享**（同一进程内的堆、全局变量、fd） |\n| 创建/切换成本 | 高（要复制页表、fd 表） | 低（只切栈和寄存器） |\n| 通信 | 必须走 IPC（管道、队列、共享内存、socket） | 直接读写共享变量（要加锁） |\n| 崩溃影响 | 只死自己 | 一个线程崩，整个进程挂 |\n| 数量级 | 几十到几百 | 几千（再多切换开销就吃掉收益） |\n\n**对测试的意义，一句话**：进程隔离性好所以并行更安全、但重；线程轻所以并行成本低、但共享状态会把用例搞成偶发失败。\n\n### 1.2 测试并行执行时，为什么要盯进程/线程数\n\n这是自查 Q5 的核心。分三个层面说：\n\n**层面一：并行框架的模型决定了哪些东西能共享**\n\n| 框架 / 方式 | 并行单位 | 直接后果 |\n| --- | --- | --- |\n| `pytest-xdist` `-n 4` | **进程**（4 个 worker 进程，execnet 通信） | 每个 worker 独立 import、独立 `scope=\"session\"` fixture → **一个 worker 里的全局状态/登录态不会传给别的 worker**，必须靠文件/环境变量/远端共享 |\n| `pytest-parallel` / 自研线程池 | **线程** | 共享内存，全局 `driver`、全局 `session` 会打架 |\n| Selenium Grid / Appium | 进程 + 远端节点 | 浏览器/设备是独占资源，必须一设备一进程 |\n\n**层面二：并行数不是越大越好，真正的瓶颈是共享资源**\n\n跑 1000 条接口用例时，`-n` 从 4 调到 32，先变快，然后变慢，还开始随机失败。原因通常是这几个，按出现频率排序：\n\n1. **数据库连接数**：每个 worker 一个连接池，`-n 32` 就是 32 倍连接。测试库 `max_connections=100` 直接爆，报 `Too many connections`。\n2. **测试数据互踩**：两条用例都改\"测试账号 A 的余额\"，并行后断言互相干扰 → 偶发失败，串行跑必过。这是最典型的\"并行化后 flaky\"。\n3. **登录态冲突**：同一账号并发登录触发单点登录互踢 → 随机 401。\n4. **上下文切换开销**：worker 数远超 CPU 核数后，机器时间大量花在切换上（见第 2 节）。\n5. **被压测/被测服务本身扛不住**：你要测的是功能，结果把测试环境打挂了，还以为是代码 bug。\n\n**经验值**：接口用例的并行数上限由\"独立测试账号数 / 独立数据空间\"决定，不由 CPU 决定。CPU 决定的是\"跑得快不快\"。一般 `-n` = min(核数, 可用账号数, 数据库可承受连接数)。\n\n**层面三：代码级怎么选线程还是进程**\n\n```python\nimport time\nfrom concurrent.futures import ThreadPoolExecutor, ProcessPoolExecutor\n\ndef io_task(_=None):\n    \"\"\"IO 密集：等网络、等磁盘、等 DB。\"\"\"\n    time.sleep(0.05)\n    return \"ok\"\n\ndef cpu_task(n=2_000_000):\n    \"\"\"CPU 密集：签名计算、大 JSON 解析、图片比对。\"\"\"\n    total = 0\n    for i in range(n):\n        total += i * i\n    return total\n\nN = 8\nif __name__ == \"__main__\":   # Windows 上进程池必须放在 main guard 里\n    for label, fn, pool_cls in [\n        (\"IO 线程\", io_task, ThreadPoolExecutor),\n        (\"IO 进程\", io_task, ProcessPoolExecutor),\n        (\"CPU 线程\", cpu_task, ThreadPoolExecutor),\n        (\"CPU 进程\", cpu_task, ProcessPoolExecutor),\n    ]:\n        start = time.perf_counter()\n        with pool_cls(max_workers=N) as pool:\n            list(pool.map(fn, range(N)))\n        print(f\"{label}: {time.perf_counter() - start:.2f}s\")\n```\n\n在 4 核机器上跑出来大致是这样（数字不重要，**规律**重要）：\n\n| 任务类型 | 线程池 | 进程池 | 原因 |\n| --- | --- | --- | --- |\n| IO 密集 | 快 | 更慢（进程创建开销） | GIL 在 IO 阻塞时释放 |\n| CPU 密集 | 和串行差不多 | 快接近 N 倍 | GIL 让多线程无法真并行 |\n\n结论直接用于工作：\n\n- **接口自动化/压测**（IO 密集）→ 线程或协程，够用且便宜。\n- **大报文签名、图片 diff、纯计算断言**（CPU 密集）→ 进程池，或用 numpy/多线程释放 GIL 的库。\n- **Selenium/Appium** → 必须进程级，一个 driver 不能跨进程，也不能跨线程共享（WebDriver 不是线程安全的）。\n\n### 1.3 进程间通信（IPC）\n\n| 方式 | 场景 | 测试框架里的真实用法 |\n| --- | --- | --- |\n| 管道 pipe | 父子进程简单传数据 | pytest-xdist 的 worker 与 master 通信（execnet） |\n| 命名管道 / FIFO | 无亲缘关系的进程 | 少量 |\n| 消息队列 | 解耦、异步 | 测试任务分发；MQ 本身也是被测对象 |\n| 共享内存 | 大数据量、低延迟 | 多进程 big data 对比、图片比对结果共享 |\n| 信号量 | 控制并发访问 | 限制同时操作某资源的进程数 |\n| Socket / HTTP | 跨机器 | **Selenium Grid（hub-node）、测试平台的任务下发全是这个** |\n\n实际最常用的是 **socket/HTTP**：测试平台的\"执行机\"就是一个 HTTP 服务，master 通过 HTTP 下发用例，天然跨机器、跨语言。\n\n写一个最小可用的\"跨进程共享设备锁\"，这是 IPC 解锁的真实用途：\n\n```python\nimport fcntl   # Linux\nfrom contextlib import contextmanager\n\n@contextmanager\ndef exclusive_device(path=\"/tmp/devices/iphone-12.lock\", timeout=0):\n    \"\"\"用文件锁做跨进程的独占资源锁：多 worker 抢同一台真机时，抢不到就跳过用例。\"\"\"\n    f = open(path, \"w\")\n    try:\n        fcntl.flock(f, fcntl.LOCK_EX | fcntl.LOCK_NB)\n    except BlockingIOError:\n        f.close()\n        raise RuntimeError(f\"设备被占用: {path}\")\n    try:\n        yield\n    finally:\n        fcntl.flock(f, fcntl.LOCK_UN)\n        f.close()\n```\n\n---\n\n## 2. 上下文切换\n\n### 2.1 是什么，为什么贵\n\nCPU 同一时刻一个核只跑一个线程。切换时要**保存当前线程的寄存器、PC、栈指针，加载下一个的**，而且 CPU 的 L1/L2 cache、TLB 会因为换了地址空间而失效，新线程的前几次内存访问全是 cache miss。所以切换本身只是微秒级，真正贵的是**切换后的 cache 冷启动**。\n\n### 2.2 什么情况下频繁切换会吃掉性能\n\n- 线程数远超核数，且每个线程都在**抢锁**（锁竞争会把线程挂起，唤醒又要切回来）。\n- 大量**短命线程**：线程创建/销毁本身就是开销。\n- **I/O 密集但用阻塞模型**，每个请求一个线程，线程数几千。\n\n### 2.3 怎么观测（这是能落地的部分）\n\n```bash\nvmstat 1 5\n# procs -----------memory---------- ---swap-- -----io---- -system-- ------cpu-----\n#  r  b   swpd   free   buff  cache   si   so    bi    bo   in   cs  us sy id wa st\n#  3  0      0 800000  10000 500000    0    0     2    10  500 12000  20 30 50  0  0\n```\n\n看三列：\n\n| 指标 | 含义 | 判断 |\n| --- | --- | --- |\n| `r` | 运行队列长度 | 持续 > CPU 核数 → 有排队 |\n| `cs` | 每秒上下文切换次数 | 上万说明切换很频繁 |\n| `sy` | 内核态 CPU 占比 | 高（>30%）且 `us` 不高 → 大量时间在系统调用/切换上，不是业务在算 |\n\n配合 `pidstat -w -p <pid> 1` 看单个进程的 `cswch/s`（自愿切换，通常是等 IO/锁）和 `nvcswch/s`（非自愿，通常是时间片用完被抢占）。**自愿切换多说明在等锁或等 IO；非自愿多说明线程太多在抢 CPU。**\n\n### 2.4 落到压测上的结论\n\n压测时并发线程从 50 → 200 → 500，TPS 先升后平再降，而 `cs` 一路飙升、`sy` 占比上升 —— 这就是\"拐点\"。**性能测试要报的是拐点前的最大 QPS，不是把机器压爆的数字。** 这个结论在报告里写出来，比贴一堆截图专业得多。\n\n---\n\n## 3. 死锁（自查 Q6）\n\n### 3.1 四个必要条件（背下来，但要能讲出怎么破坏）\n\n| 条件 | 含义 | 怎么破坏 |\n| --- | --- | --- |\n| 互斥 | 资源同一时刻只能一个持有 | 尽量用无锁结构/不可变数据；规避不了就靠其他三条 |\n| 占有并等待 | 拿着 A 等 B | 一次性申请全部资源；或拿不到就释放已持有的 |\n| 不可剥夺 | 别人不能抢走 | 加超时（超时释放并重试）、支持抢占 |\n| 循环等待 | A 等 B，B 等 A | **统一资源获取顺序**（最实用的一条） |\n\n死锁的四种处理策略：预防（破坏条件）、避免（银行家算法，实际很少用）、检测+恢复（超时/看门狗，DB 就是这么干的）、忽略（大多数 OS 的选择，靠重启）。\n\n### 3.2 测试场景里的四种\"死锁\"（这是 Q6 要的）\n\n**① 两条用例互相等对方的测试数据**\n\n```\n用例 A：先锁账号 user01，再改订单 order01\n用例 B：先锁订单 order01，再改账号 user01\n并行执行 → A 持 user01 等 order01，B 持 order01 等 user01 → 永久卡住\n```\n\n现象：用例不报错，就一直挂着，等到 pytest 超时或整个 CI 卡死。日志最后一行是\"等待资源\"。\n\n**② 两条用例抢同一台独占设备**\n\n```python\n# UI 自动化：两条用例都要用 iPhone-12，用锁保护\ndef test_login(device_lock):\n    with device_lock:       # 用例 A 拿到\n        ...\n\ndef test_pay(device_lock):\n    with device_lock:\n        ...\n```\n\n如果 A 在持有设备锁期间又去等\"数据库连接锁\"（池子被 B 占满），而 B 在持有 DB 连接的情况下等设备锁 —— 这就是典型的跨资源循环等待。**更隐蔽的版本是连接池被打满**：所有 worker 都拿着设备锁等 DB 连接，而 DB 连接被别的 worker 拿着等设备锁，整个 CI 静止。\n\n**③ 数据库行锁死锁（真实且高频）**\n\n两条用例并发改同一批数据，加锁顺序相反：\n\n```sql\n-- 事务 1\nUPDATE account SET balance = balance - 100 WHERE id = 1;\nUPDATE account SET balance = balance + 100 WHERE id = 2;\n\n-- 事务 2（反序）\nUPDATE account SET balance = balance + 100 WHERE id = 2;\nUPDATE account SET balance = balance - 100 WHERE id = 1;\n```\n\nMySQL 直接报 `Deadlock found when trying to get lock; try restarting transaction`。**如果你在跑转账类用例时看到这个报错，先怀疑你的用例并发方式，而不是先提后端 bug**。\n\n**④ 代码里锁的嵌套顺序不一致**\n\n```python\n# 线程 1\nwith lock_a:\n    with lock_b:\n        do_something()\n\n# 线程 2（反序）\nwith lock_b:\n    with lock_a:\n        do_something()\n```\n\n同一份测试框架代码里两处这么写，并发跑准卡死。\n\n### 3.3 怎么避免（这是能直接改进测试框架的）\n\n| 措施 | 具体做法 |\n| --- | --- |\n| **统一加锁顺序** | 约定全局资源 ID 顺序：永远先账号后订单。所有代码统一遵守，最有效 |\n| **数据隔离** | 每个 worker 用自己的数据空间（`user_{worker_id}_01`、`order_{uuid}`），根本不共享，就没有锁 |\n| **资源池化 + 排队** | 设备/账号做成池，`with pool.acquire(timeout=30)` 拿不到就跳过并标 `skip`，而不是死等 |\n| **加超时** | 所有锁都带 timeout，超时抛异常让用例失败并留下现场，而不是挂死。**CI 里\"挂死\"比\"失败\"危害大得多** |\n| **用例粒度缩小** | 别在一个用例里锁一堆资源，用完立刻释放 |\n| **数据库层** | 事务尽量短、按主键顺序更新、必要时降低隔离级别或用 `SELECT ... FOR UPDATE NOWAIT`（MySQL 8） |\n\n```python\n# 用例永不挂死的写法：资源获取带超时 + 失败即跳过\nimport threading\n\n_lock = threading.Lock()\n\ndef test_transfer_with_timeout():\n    if not _lock.acquire(timeout=10):\n        pytest.skip(\"账号被其他用例占用，跳过（避免并行时挂死）\")\n    try:\n        ...\n    finally:\n        _lock.release()\n```\n\n**排查死锁的现场手段**：\n\n```bash\npy-spy dump --pid <pid>              # 看所有线程卡在哪一行 Python 代码，最快\njstack <pid>                          # Java 服务\nSELECT * FROM information_schema.innodb_trx;          # MySQL 当前事务\nSHOW ENGINE INNODB STATUS\\G           # 里面的 LATEST DETECTED DEADLOCK 段落直接告诉你两个事务的 SQL\n```\n\n`py-spy dump` 是排查\"用例卡住\"的第一工具，比加日志快得多，而且不用改代码、不影响运行。\n\n---\n\n## 4. 内存管理\n\n### 4.1 三个概念，各对应一个测试现象\n\n| 概念 | 一句话 | 测试现象 |\n| --- | --- | --- |\n| 虚拟内存 | 每个进程以为自己独占连续大内存，实际由页表映射到物理页/磁盘 | 进程看着用了 4G 但物理只占 500M（大量未实际分配）；`free` 显示 available 才是真实可用 |\n| 页表 | 虚拟地址 → 物理地址的映射表，TLB 缓存最近映射 | 大量随机访问大数组时 TLB miss，性能下降（不太会在测试里遇到，但能解释\"同样算法不同数据规模快慢不同\"） |\n| 堆 / 栈 | 栈：函数调用、局部变量，大小固定（Linux 默认 8MB/线程）；堆：动态分配，大小受物理内存限制 | 递归太深 → `RecursionError` / 栈溢出（segfault）；堆 → OOM |\n\n### 4.2 稳定性测试里怎么发现内存泄漏（这是真实工作）\n\n跑 8 小时稳定性测试，接口响应越来越慢最后 OOM，第一反应要去看 RSS 曲线是不是**单调爬升不回落**。\n\n```python\nimport time\nimport psutil\n\ndef monitor_rss(pid: int, interval: float = 30, log_path: str = \"rss.csv\"):\n    \"\"\"挂在稳定性测试旁边跑，每 30s 记一次 RSS，画图看是不是单调上涨。\"\"\"\n    p = psutil.Process(pid)\n    with open(log_path, \"a\", encoding=\"utf-8\") as f:\n        f.write(\"ts,rss_mb\\n\")\n        while True:\n            try:\n                rss = p.memory_info().rss / 1024 / 1024\n            except psutil.NoSuchProcess:\n                f.write(f\"{int(time.time())},dead\\n\")\n                return\n            f.write(f\"{int(time.time())},{rss:.1f}\\n\")\n            f.flush()\n            time.sleep(interval)\n```\n\n判断标准：**压测停止后 RSS 不回落**，或者\"相等的业务量下 RSS 一轮比一轮高\"，才是泄漏。单看某个时刻高不是泄漏（Python 的内存不还给 OS 是常态）。\n\nPython 内存泄漏的四个真实来源：\n\n1. **全局 list/dict 累积结果**：每次都 `results.append(...)`，从不清理。测试脚本跑长任务最容易犯。\n2. **闭包/回调持有大对象**：`lambda: big_data` 挂在全局注册表上。\n3. **循环引用 + `__del__`**：有 `__del__` 的循环引用对象 gc 收不掉（Python 3.4+ 改善了，但仍要注意）。\n4. **第三方库的缓存无上限**：`functools.lru_cache` 不设 `maxsize`、连接池不回收。\n\n定位工具（按上手速度排）：\n\n```python\nimport tracemalloc\n\ntracemalloc.start(25)                       # 保留 25 帧调用栈\nsnap1 = tracemalloc.take_snapshot()\n# ... 跑 1000 次业务操作 ...\nsnap2 = tracemalloc.take_snapshot()\n\nfor stat in snap2.compare_to(snap1, \"traceback\")[:10]:\n    print(stat)\n```\n\n`objgraph.show_most_common_types()` 看哪类对象数量异常增长，再用 `objgraph.show_backrefs` 找谁持有它。**注意：这些工具只在你自己的测试代码/测试服务上用，别挂到生产进程上（有性能开销）。**\n\n### 4.3 容器里的 OOM（现在基本都是容器）\n\n```bash\n# 看容器被 OOMKilled 的痕迹\nkubectl describe pod <pod> | grep -A3 \"Last State\"\n# Last State: Terminated  Reason: OOMKilled  Exit Code: 137\n\n# 看 cgroup 限制和当前使用\ncat /sys/fs/cgroup/memory.max          # cgroup v2\ncat /sys/fs/cgroup/memory.current\ndocker stats --no-stream\n```\n\n`Exit Code: 137` = 128 + 9（SIGKILL），被内核杀了。这个数字要记住，看到 137 就知道不是代码异常，是内存超限。**测试环境把 Java 堆设成和容器限制一样大，是最常见的配置错误**（JVM 还有元空间、线程栈、堆外内存，设满必被杀）。\n\n---\n\n## 5. I/O 模型\n\n### 5.1 一张表记住演进\n\n| 模型 | 做法 | 缺点 | 测试侧的对应物 |\n| --- | --- | --- | --- |\n| 阻塞 I/O | 读不到就睡，等数据 | 一连接一线程，线程数爆炸 | `requests.get()` 同步调用、`time.sleep` 风格的压测脚本 |\n| 非阻塞 I/O | 立刻返回 EAGAIN，自己轮询 | 空转烧 CPU | 很少直接用 |\n| I/O 多路复用 | 一个线程用 `select/poll/epoll` 同时等多个 fd | 编程复杂 | **nginx、Redis、wrk、gevent、asyncio 全是这个** |\n| 信号驱动 | 内核通知 | 用得少 | — |\n| 异步 I/O (AIO) | 内核完成后回调 | Linux 上生态一般 | io_uring（新东西） |\n\n**select / poll / epoll 的区别（面试高频，答这三句）**：\n\n- `select`：fd 集合用位图，**上限 1024**，每次调用都要把整个集合从用户态拷到内核态，返回后要遍历找就绪的 → O(n)。\n- `poll`：用链表，没有 1024 限制，但同样要全量拷贝 + 遍历。\n- `epoll`：内核里维护红黑树 + 就绪链表，`epoll_wait` 只返回就绪的 fd → O(1)，只在注册时拷贝一次。**所以高并发服务都用 epoll。**\n\n### 5.2 落到压测工具选型\n\n| 工具 | 并发模型 | 适用 |\n| --- | --- | --- |\n| jmeter | 线程/连接池 | 功能全面、上手快；单机几千线程就到顶 |\n| locust | gevent 协程 | Python 生态、脚本灵活；单机可上万 |\n| wrk / k6 | epoll / 协程 | 极限 QPS 压测 |\n| 自己写 `requests` + 线程池 | 阻塞 + 线程 | 小规模、造业务数据最合适，别拿它压高并发 |\n\n**自己写一个异步压测小脚本**，理解\"一个线程扛住高并发\"是怎么回事：\n\n```python\nimport asyncio\nimport time\nimport aiohttp\n\nURL = \"https://api.test.example.com/api/ping\"\nN = 1000\n\nasync def one(session: aiohttp.ClientSession):\n    async with session.get(URL) as resp:\n        return resp.status\n\nasync def main():\n    sem = asyncio.Semaphore(200)      # 控制并发，别一把全怼上去\n    async with aiohttp.ClientSession() as session:\n        async def guarded():\n            async with sem:\n                return await one(session)\n        start = time.perf_counter()\n        results = await asyncio.gather(*[guarded() for _ in range(N)])\n        cost = time.perf_counter() - start\n    ok = sum(1 for s in results if s == 200)\n    print(f\"{N} 请求 {cost:.2f}s, 成功率 {ok / N:.1%}, QPS≈{N / cost:.0f}\")\n\nasyncio.run(main())\n```\n\n要点：`Semaphore` 控制并发度（对应\"虚拟用户数\"），`gather` 并发发起，单线程就能跑几千并发。这就是为什么 locust 比 jmeter 省资源。\n\n---\n\n## 6. 【了解即可】三件事\n\n### 6.1 CPU 调度\n\nLinux 默认 CFS（完全公平调度），按权重分配 CPU 时间。测试里能用到的是：\n\n```bash\nnice -n 10 ./run_tests.sh          # 降低测试进程优先级，别跟被测服务抢 CPU\ntaskset -c 0,1 ./run_tests.sh       # 绑核，减少调度抖动（做基准测试时有用）\ntop -H -p <pid>                     # 看进程内各线程 CPU 占用\n```\n\n**压测必须注意**：压测工具和被测服务跑在同一台机器上，就是在互相抢 CPU，结论不成立。压测机和被测机分离是最低要求，更好的是绑核。\n\n### 6.2 文件系统\n\n三个真实事故：\n\n| 事故 | 现象 | 命令 |\n| --- | --- | --- |\n| 磁盘写满 | 所有用例突然失败，报 `No space left on device` | `df -h` |\n| **inode 耗尽** | `df -h` 显示还有空间，但就是写不进去 | `df -i`（小文件/百万个日志碎片） |\n| 日志把磁盘吃光 | 测试跑一整周后挂掉 | 按天切割 + 定期清理 + 日志级别控制 |\n\n测试框架标配：日志按天/按用例切割（`RotatingFileHandler`、`TimedRotatingFileHandler`），跑完自动归档，保留 7 天。见下面的 `log_cleanup` 思路。\n\n```python\nimport logging\nfrom logging.handlers import TimedRotatingFileHandler\n\nhandler = TimedRotatingFileHandler(\n    \"logs/autotest.log\", when=\"midnight\", backupCount=7, encoding=\"utf-8\"\n)\n```\n\n### 6.3 信号\n\n| 信号 | 能捕获 | 场景 |\n| --- | --- | --- |\n| SIGINT (2) | 能 | Ctrl+C，Python 里变成 `KeyboardInterrupt`，pytest 靠它中断。**别在 finally 里写无限循环，否则 Ctrl+C 没反应** |\n| SIGTERM (15) | 能 | 容器停止、`kill` 默认信号。用来做优雅退出：关连接、落盘报告 |\n| SIGKILL (9) | **不能** | 强杀。**所以看到 137 就知道是被强杀，没机会清理** |\n| SIGHUP (1) | 能 | 终端断开；nginx 用它 reload 配置 |\n| SIGCHLD (17) | 能 | 子进程退出通知。不处理且父进程不 wait → **僵尸进程** |\n\n僵尸进程（`Z` 状态）检查与结论：\n\n```bash\nps -aux | grep -w Z        # 有 Z 就有僵尸\nps -el | grep Z\n```\n\n父进程不 `wait()` 子进程，子进程的退出状态没人收，进程表项留着。**测试机上如果有上百个 Z 进程，就是某个测试框架起子进程没回收**，迟早把 pid 用完。Python 用 `subprocess.run()` 会自动 wait，用 `Popen` 就要显式 `wait()`/`poll()`。\n\n---\n\n## 7. 自查清单逐条作答（Q5–Q6）\n\n### Q5. 进程和线程的区别？测试并行执行时为什么要关注进程/线程数\n\n**区别**：进程有独立地址空间、崩溃隔离、切换贵、必须 IPC 通信；线程共享进程内的堆和 fd、崩溃会拖垮整个进程、切换便宜、共享变量要加锁。\n\n**关注进程/线程数的四个理由**（按重要性）：\n\n1. **决定共享状态能不能通**：`pytest-xdist` 的 `-n` 是进程，worker 之间不共享内存 → 全局登录态、全局 token、全局有序序列都会失效，会写出\"串行必过、并行偶发失败\"的用例。\n2. **决定共享资源的消耗倍数**：每个进程一份连接池、一份内存、一份浏览器。`-n` 翻倍，DB 连接、文件句柄、内存全翻倍。测试库的 `max_connections` 常常就是并行数的真正天花板。\n3. **决定开销**：进程创建/切换比线程贵，worker 数远超核数时，切换开销会吃掉并行收益（第 2 节）。一般 `-n` 控制在核数 ~ 2 倍核数。\n4. **决定隔离性与安全性**：Selenium/Appium 的 driver 非线程安全且不能跨进程，只能用进程级并行；CPU 密集任务用多进程才能真并行（GIL）。\n\n**一句话总结**：并行数不是\"调大就快\"的旋钮，它由**独立账号数、独立数据空间、DB 连接数**三者中最小的那个决定，CPU 只决定上限。\n\n### Q6. 死锁的四个必要条件？举一个测试场景里的死锁类问题\n\n四个条件：**互斥、占有并等待、不可剥夺、循环等待**。\n\n测试场景的死锁，我用\"两条用例互相等对方释放数据\"来讲，因为这最贴近日常工作：\n\n> 用例 A 先锁测试账号 `user01` 再改订单 `order01`，用例 B 先改订单 `order01` 再锁账号 `user01`。并行执行时 A 持有账号等订单，B 持有订单等账号，永远等不到。\n> 现象不是报错，而是**两条用例一直挂着**，CI 卡住几十分钟，日志停在\"等待资源\"。这种\"挂死\"比\"失败\"危害大得多，因为它不产出任何信息。\n> 排查用 `py-spy dump --pid` 看线程栈，一眼就能看到两处 `acquire` 互相等。\n> 避免：统一加锁顺序（约定先账号后订单）；更彻底的做法是**数据隔离**，每个 worker 用 `user_{worker_id}_01`，根本不共享就不会死锁；锁一律加超时，拿不到就 `skip`。\n> 另外数据库层也会死锁：两个事务反向 update 同一批行，MySQL 会报 `Deadlock found`，这时先怀疑用例并发的数据设计，再提后端 bug。\n\n---\n\n## 8. 复习动作清单\n\n- [ ] 在自己机器上把 `io_task` / `cpu_task` 那四个组合跑一遍，记下数字，面试时能报出量级。\n- [ ] 用 `pytest -n 4` 和 `-n 16` 跑同一套接口用例，对比耗时和失败率，找出自己的\"并行拐点\"在哪。\n- [ ] 故意制造一次用例互锁（两条用例反序锁两个资源），用 `py-spy dump` 抓现场，体会\"挂死\"和\"失败\"的区别。\n- [ ] 在测试机上跑一次 2 小时稳定性脚本，用 `psutil` 记录 RSS 曲线并画图，判断有没有泄漏。\n","chars":8185,"codes":16,"tables":14},{"id":"algo","title":"数据结构与算法篇","desc":"七种结构、四道手写题、复杂度实战","file":"测试开发-数据结构与算法篇.md","content":"# 测试开发-数据结构与算法篇\n\n> 对应清单：数据结构与算法【必须掌握】全部\n> 对应自查：Q7（手写快排/归并、二分查找、哈希表求交集）\n> 全篇约定：Python 3.10。所有代码都是能直接跑、能直接进你测试框架的，不是 LeetCode 答案的搬运。\n> 一句话立场：测开学算法不是为了刷题量，而是为了**造数据、写断言、分析接口为什么慢**这三件事不被卡住。\n\n---\n\n## 0. 先定位：测开工作里算法出现在哪\n\n| 真实工作 | 用到什么 |\n| --- | --- |\n| 造测试数据：生成 10 万条订单、找边界值 | 数组、哈希表、随机、排序 |\n| 断言接口返回：比对两个环境的 JSON 差异 | 递归遍历（树的 DFS）、哈希表 |\n| 处理大响应：从 5000 条记录里找 Top 10 耗时接口 | 堆（Top-K） |\n| 定位接口慢：`for` 循环里发请求、嵌套遍历 | 复杂度分析 |\n| 权限/菜单树断言：校验每个角色能看到的菜单节点 | 树 + BFS/DFS |\n| 找两个数组的交集/差集，判断\"哪些商品只在 A 环境有\" | 哈希表 |\n| 面试 | 手写排序、二分、双指针 |\n\n自查分级：\n\n| 内容 | 档位 | 说明 |\n| --- | --- | --- |\n| 数组/哈希表/栈/队列 | 熟练 | 每天用 |\n| 递归遍历树（JSON、权限树） | 熟练 | 断言核心 |\n| 二分查找（含边界变体） | 熟练 | 面试必考，且边界最容易错 |\n| 快排 / 归并 | 能手写 | 面试 |\n| DFS/BFS | 能手写 | 面试 + 实际 |\n| 堆（Top-K） | 会用 | 实际有用 |\n| 动态规划 | 入门 | 会爬楼梯/背包即可，别硬啃 |\n| 复杂度分析 | 能算 | **最实用的一项** |\n\n---\n\n## 1. 数据结构：每个都对应一个测开场景\n\n### 1.1 数组 / 列表\n\n最常用，也是**性能坑最多**的地方。三个必须知道的：\n\n```python\n# 坑 1：list 的 in 是 O(n)，循环里用就是 O(n²)\n# 找两个环境都有的商品\ncommon = [x for x in env_a_skus if x in env_b_list]   # env_b_list 是 list → O(n*m)\n\n# 正确做法：把其中一个转 set\nenv_b_set = set(env_b_list)\ncommon = [x for x in env_a_skus if x in env_b_set]    # O(n+m)\n```\n\n```python\n# 坑 2：循环里 += 字符串 / 循环里 list.insert(0, x) 都是 O(n) 的\n# 拼接大字符串用 \"\".join()\n# 头插用 collections.deque\nfrom collections import deque\nq = deque()\nq.appendleft(\"x\")   # O(1)\n```\n\n```python\n# 坑 3：边遍历边删除\nnums = [1, 2, 3, 4]\nfor n in nums:\n    if n % 2 == 0:\n        nums.remove(n)     # 会跳过元素，结果不对\n# 正确：nums = [n for n in nums if n % 2 != 0]\n```\n\n**造数据的实测场景**：生成 10 万个订单号并去重，用 set 还是 list 差一个数量级。\n\n```python\nimport random\nimport string\nimport time\n\ndef gen_ids_list(n):\n    ids = []\n    while len(ids) < n:\n        v = \"\".join(random.choices(string.ascii_uppercase + string.digits, k=8))\n        if v not in ids:            # O(n) 每次 → 总 O(n²)\n            ids.append(v)\n    return ids\n\ndef gen_ids_set(n):\n    seen = set()\n    out = []\n    while len(out) < n:\n        v = \"\".join(random.choices(string.ascii_uppercase + string.digits, k=8))\n        if v not in seen:           # O(1)\n            seen.add(v)\n            out.append(v)\n    return out\n```\n\nn=20000 时两者差距就是几十倍。**造数据脚本卡住不动，八成是这种\"顺手写了 `in list`\"。**\n\n### 1.2 链表\n\n真实工作里几乎不用自己写链表，但要理解它，因为：\n\n- **LRU 缓存** = 哈希表 + 双向链表，这是 Redis 淘汰策略的第一个实现，测缓存淘汰必懂。\n- **\"快慢指针找中点/判环\"** 是面试题，逻辑简单但要能写。\n\n```python\nfrom collections import OrderedDict\n\nclass LRUCache:\n    \"\"\"最小可用的 LRU。用来验证「缓存容量满时的淘汰顺序」这类测试点。\"\"\"\n    def __init__(self, capacity: int):\n        self.cap = capacity\n        self.data = OrderedDict()\n\n    def get(self, key):\n        if key not in self.data:\n            return None\n        self.data.move_to_end(key)      # 访问即刷新，这个动作就是\"链表节点挪到头部\"\n        return self.data[key]\n\n    def put(self, key, value):\n        if key in self.data:\n            self.data.move_to_end(key)\n        self.data[key] = value\n        if len(self.data) > self.cap:\n            self.data.popitem(last=False)   # 淘汰最久未用的\n```\n\n测试场景：给一个容量为 100 的缓存，写 101 个 key，断言第 1 个被淘汰、第 2 个还在。**这是\"缓存\"测试最基础也最常被漏掉的一条。**\n\n### 1.3 栈 / 队列\n\n**栈**最有用的测试写法是**校验配对**：括号、标签、JSON 嵌套合法性。\n\n```python\ndef check_bracket(s: str) -> bool:\n    \"\"\"校验表达式里的括号是否配对。造边界数据、校验 SQL/JSON 片段都好用。\"\"\"\n    pairs = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}\n    stack = []\n    for ch in s:\n        if ch in \"([{\":\n            stack.append(ch)\n        elif ch in \")]}\":\n            if not stack or stack.pop() != pairs[ch]:\n                return False\n    return not stack\n```\n\n**队列** = 先进先出，实际用到的地方：\n\n- 任务队列（测试平台的分发）\n- BFS 的辅助结构\n- **消息队列消费顺序验证**：发 M1 M2 M3，断言消费顺序（普通队列保序，分区队列只保分区内有序 —— 这个结论是测 MQ 的关键）\n\n```python\nfrom collections import deque\n\ndef bfs_levels(root):\n    \"\"\"按层遍历，返回每层的节点值。断言「菜单树按层级渲染」时直接用。\"\"\"\n    if not root:\n        return []\n    q = deque([root])\n    result = []\n    while q:\n        level = []\n        for _ in range(len(q)):          # 固定当前层长度，才能分出层\n            node = q.popleft()\n            level.append(node[\"value\"])\n            q.extend(node.get(\"children\") or [])\n        result.append(level)\n    return result\n```\n\n### 1.4 哈希表（dict / set）\n\n**测开最核心的数据结构**，因为\"找重复、查存在、比对差异\"全是它。\n\n真实用例：找出两个环境接口返回的字段差异。\n\n```python\ndef diff_keys(prod: dict, test: dict, path: str = \"$\") -> list[str]:\n    \"\"\"比对两个环境返回的结构差异，契约测试的常用断言。只比结构，不比值。\"\"\"\n    diffs = []\n    for k in prod.keys() - test.keys():          # set 差集，O(n)\n        diffs.append(f\"{path}.{k}: 测试环境缺失\")\n    for k in test.keys() - prod.keys():\n        diffs.append(f\"{path}.{k}: 测试环境多出\")\n    for k in prod.keys() & test.keys():\n        a, b = prod[k], test[k]\n        if isinstance(a, dict) and isinstance(b, dict):\n            diffs += diff_keys(a, b, f\"{path}.{k}\")\n        elif isinstance(a, list) and isinstance(b, list) and a and b and isinstance(a[0], dict):\n            for i, (x, y) in enumerate(zip(a, b)):\n                if isinstance(x, dict) and isinstance(y, dict):\n                    diffs += diff_keys(x, y, f\"{path}.{k}[{i}]\")\n    return diffs\n```\n\n这个函数在实际工作中的价值远超刷十道题：**接口契约变更时，跑一下就知道测试环境和生产环境的结构差异在哪。**\n\n### 1.5 树（重点二叉树）\n\n真实工作里的树全是业务树：**菜单/权限树、组织架构、商品类目、JSON 对象本身**。\n\n**DFS 递归版**（最自然）：从权限树里收集所有叶子权限码。\n\n```python\ndef collect_permissions(node, path=None):\n    \"\"\"DFS 收集所有叶子节点的权限码。用于断言「某角色应有哪些权限」。\"\"\"\n    path = path or []\n    cur = path + [node.get(\"name\", \"?\")]\n    children = node.get(\"children\") or []\n    if not children:\n        code = node.get(\"permission\")\n        return [(code, \"/\".join(cur))] if code else []\n    out = []\n    for c in children:\n        out += collect_permissions(c, cur)\n    return out\n```\n\n**DFS 迭代版**（数据层级很深时防递归超限，Python 默认递归上限 1000）：\n\n```python\ndef collect_permissions_iter(root):\n    stack = [(root, [])]\n    out = []\n    while stack:\n        node, path = stack.pop()\n        cur = path + [node.get(\"name\", \"?\")]\n        children = node.get(\"children\") or []\n        if not children:\n            if node.get(\"permission\"):\n                out.append((node[\"permission\"], \"/\".join(cur)))\n        else:\n            for c in children:\n                stack.append((c, cur))\n    return out\n```\n\n**二叉树本身**的实际意义：把\"找最近公共祖先\"\"判断是否为二叉搜索树\"当成面试题准备就行，工作里不用自己实现树，但**遍历思维**天天用（JSON 就是树）。\n\n三种遍历的用途，一句话区分：\n\n- 前序（根左右）：复制/序列化树，打印目录树\n- 中序（左根右）：BST 能出有序序列，断言排序\n- 后序（左右根）：先算子节点再算父节点，统计目录大小、聚合树形报表\n\n### 1.6 堆（优先队列）\n\n**唯一必会的用途：Top-K。**\n\n真实场景：从 5000 条接口耗时记录里找最慢的 10 个接口。\n\n```python\nimport heapq\n\ndef slowest(records, k=10):\n    \"\"\"records: [{\"api\": \"/a\", \"cost\": 120}, ...]\"\"\"\n    return heapq.nlargest(k, records, key=lambda r: r[\"cost\"])\n```\n\n为什么用堆不用 `sorted()[:10]`：`sorted` 是 O(n log n) 且要全排序，`nlargest` 是 O(n log k)，数据量 100 万时差别明显。数据量小的时候无所谓，但面试会被问。\n\n另一个用途是**定时任务/重试调度**：按\"下次重试时间\"进最小堆，到点就取出来。\n\n---\n\n## 2. 算法（自查 Q7 的四道手写题）\n\n写这几题的通用建议，先把\"面试怎么写不慌\"说清楚：\n\n1. **先说思路再说代码**：一句话说清算法，面试官点头再写。\n2. **边界先列**：空数组、单元素、全相同、有重复、负数。写完先自己用这三个 case 走一遍。\n3. **命名有意义**：`lo/hi`、`pivot`、`left/right` 比 `i/j/k` 好读。\n4. **写完报复杂度**：时间、空间各一句。\n\n### 2.1 快速排序（两版，面试时先给简单的，再补原地版）\n\n```python\ndef quick_sort(nums: list[int]) -> list[int]:\n    \"\"\"易懂版：递归 + 列表推导。缺点是要额外空间。\n    时间：平均 O(n log n)，最坏 O(n²)（已排序 + 取首/尾做 pivot）\n    空间：O(n)（每层都要新建子列表）\n    \"\"\"\n    if len(nums) <= 1:\n        return nums\n    pivot = nums[len(nums) // 2]                  # 取中间值，已排序数组也不会退化\n    left = [x for x in nums if x < pivot]\n    mid = [x for x in nums if x == pivot]         # 相等单独一组，天然处理重复元素\n    right = [x for x in nums if x > pivot]\n    return quick_sort(left) + mid + quick_sort(right)\n```\n\n```python\ndef quick_sort_inplace(nums, lo=0, hi=None):\n    \"\"\"原地版（Lomuto 分区）。空间 O(log n)（递归栈）。\n    注意：pivot 取最后一个元素时，完全有序的输入会退化成 O(n²)。\n    \"\"\"\n    if hi is None:\n        hi = len(nums) - 1\n    if lo >= hi:\n        return nums\n    p = _partition(nums, lo, hi)\n    quick_sort_inplace(nums, lo, p - 1)\n    quick_sort_inplace(nums, p + 1, hi)\n    return nums\n\ndef _partition(nums, lo, hi):\n    pivot = nums[hi]\n    i = lo                      # i 指向\"小于 pivot 区的下一个空位\"\n    for j in range(lo, hi):\n        if nums[j] < pivot:\n            nums[i], nums[j] = nums[j], nums[i]\n            i += 1\n    nums[i], nums[hi] = nums[hi], nums[i]\n    return i\n```\n\n**快排的\"稳定性\"问题**（面试常追问）：快排不稳定，归并稳定。为什么测试要在意？如果断言依赖\"相同 key 的元素保持原顺序\"（比如同一创建时间的两条记录按插入顺序展示），用不稳定排序会偶发失败。\n\n### 2.2 归并排序\n\n```python\ndef merge_sort(nums: list[int]) -> list[int]:\n    \"\"\"时间 O(n log n) 稳定，空间 O(n)。\n    面试加分：它是「稳定」的，且是外部排序/大数据排序的基础（分块排 + 多路归并）。\n    \"\"\"\n    if len(nums) <= 1:\n        return nums\n    mid = len(nums) // 2\n    left = merge_sort(nums[:mid])\n    right = merge_sort(nums[mid:])\n    return _merge(left, right)\n\ndef _merge(a, b):\n    out = []\n    i = j = 0\n    while i < len(a) and j < len(b):\n        if a[i] <= b[j]:        # 必须是 <= 才能保证稳定！用 < 会破坏稳定性\n            out.append(a[i])\n            i += 1\n        else:\n            out.append(b[j])\n            j += 1\n    out.extend(a[i:])\n    out.extend(b[j:])\n    return out\n```\n\n**`<=` 这个细节就是\"稳定性\"的全部秘密**，面试被问\"你的归并是稳定的吗\"时，指出这一行比背概念强。\n\n### 2.3 二分查找（三种变体，边界最容易错）\n\n**基础版**：找到就返回下标。\n\n```python\ndef binary_search(nums, target) -> int:\n    \"\"\"标准二分，找不到返回 -1。前提：nums 有序。\"\"\"\n    lo, hi = 0, len(nums) - 1\n    while lo <= hi:\n        mid = lo + (hi - lo) // 2        # 防溢出写法，Python 无所谓，Java/C++ 必须这么写\n        if nums[mid] == target:\n            return mid\n        if nums[mid] < target:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return -1\n```\n\n**变体版：找左右边界**。这是真正有用的，因为实际业务里数据有重复，你要找\"第一个 >= x 的位置\"。\n\n```python\ndef lower_bound(nums, target) -> int:\n    \"\"\"第一个 >= target 的下标，找不到返回 len(nums)。\n    用左闭右开的 [lo, hi) 区间，循环结束后 lo 就是答案，不用纠结 mid±1。\n    \"\"\"\n    lo, hi = 0, len(nums)\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if nums[mid] < target:\n            lo = mid + 1\n        else:\n            hi = mid\n    return lo\n\ndef upper_bound(nums, target) -> int:\n    \"\"\"第一个 > target 的下标。\"\"\"\n    lo, hi = 0, len(nums)\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if nums[mid] <= target:\n            lo = mid + 1\n        else:\n            hi = mid\n    return lo\n```\n\n**实际用途**：给一批按时间排序的日志/订单，找\"某个时间点之后的所有记录\"、找\"版本号附近的记录\"。用 `lower_bound` 直接 O(log n)，比 `for` 遍历 O(n) 快，而且在 100 万条时不卡。\n\n**面试避坑**：`while lo <= hi` 和 `while lo < hi` 两套模板别混用。用左闭右开 `[lo, hi)` 时循环条件必须是 `lo < hi`，返回 `lo`。记住一套、用到底。\n\n### 2.4 用哈希表找两个数组的交集（三种问法，要分清）\n\n```python\nfrom collections import Counter\n\ndef intersect_unique(a, b):\n    \"\"\"去重交集：{1,2,3} ∩ {2,3,4} → [2,3]\n    时间 O(n+m)，空间 O(min(n, m))\n    \"\"\"\n    return list(set(a) & set(b))\n\ndef intersect_preserve_dup(a, b):\n    \"\"\"多重集交集（LeetCode 350 的口径）：[1,1,2] ∩ [1,2,2] → [1,2]（每个元素取出现次数的较小值）\"\"\"\n    ca, cb = Counter(a), Counter(b)\n    out = []\n    for k in ca.keys() & cb.keys():\n        out.extend([k] * min(ca[k], cb[k]))\n    return out\n\ndef intersect_keep_b_order(a, b):\n    \"\"\"遍历 b，保留 b 的顺序和重复：[1,1,2] ∩ [1,2,2] → [1,2,2]\n    某些业务要求\"按后者的顺序输出\"，写法不一样，先问清需求。\n    \"\"\"\n    seen = set(a)\n    return [x for x in b if x in seen]\n```\n\n**这三个版本的区别必须能讲清**，因为面试官很爱在这上面追问\"你的交集是去重的吗\"。而真实工作中：\n\n- 比对\"两个环境的 SKU 差异\" → 用去重版（`set`）\n- 校验\"订单商品数量是否一致\" → 用多重集版（`Counter`）\n- 保留展示顺序 → 用保序版\n\n---\n\n## 3. 双指针、DFS/BFS、DP（会这几个就够用）\n\n### 3.1 双指针\n\n两个真实用途：\n\n**① 有序数组找两数和 / 三数和**（造测试数据、写断言时偶尔用）\n\n```python\ndef two_sum_sorted(nums, target):\n    \"\"\"有序数组找两数之和，返回下标对。O(n) 时间、O(1) 空间。\"\"\"\n    i, j = 0, len(nums) - 1\n    while i < j:\n        s = nums[i] + nums[j]\n        if s == target:\n            return [i, j]\n        if s < target:\n            i += 1\n        else:\n            j -= 1\n    return []\n```\n\n**② 去重后原地处理**（数组操作的基础）\n\n```python\ndef dedup_sorted(nums):\n    \"\"\"有序数组原地去重，返回新长度。造测试数据时清理重复项。\"\"\"\n    if not nums:\n        return 0\n    slow = 0\n    for fast in range(1, len(nums)):\n        if nums[fast] != nums[slow]:\n            slow += 1\n            nums[slow] = nums[fast]\n    return slow + 1\n```\n\n### 3.2 DFS / BFS\n\n| | DFS | BFS |\n| --- | --- | --- |\n| 结构 | 栈（递归或显式栈） | 队列 |\n| 空间 | O(深度) | O(最宽层) |\n| 找最短路径 | 不行（除非遍历完） | **可以（无权图/树的最短层级）** |\n| 场景 | 遍历全部节点、找路径、找某个节点 | 找层级、找最近 |\n\n实际用例：**校验菜单树里\"某个角色看不到某个节点\"，且要报出路径**。\n\n```python\ndef find_node_path(root, target_code, path=None):\n    \"\"\"DFS 找目标节点，返回从根到它的路径。断言权限时用来输出可读的失败信息。\"\"\"\n    path = (path or []) + [root.get(\"name\", \"?\")]\n    if root.get(\"permission\") == target_code:\n        return path\n    for c in root.get(\"children\") or []:\n        got = find_node_path(c, target_code, path)\n        if got:\n            return got\n    return None\n```\n\n失败时的断言信息写成 `assert got is None, f\"角色 {role} 不应看到 {'/'.join(got)}\"` —— 这条 diff 比\"断言失败\"有价值一百倍。\n\n### 3.3 动态规划（入门就够，别硬啃）\n\n**爬楼梯**（斐波那契，理解\"状态转移\"这个概念）：\n\n```python\ndef climb(n: int) -> int:\n    \"\"\"每次 1 或 2 阶，n 阶有多少种走法。时间 O(n)，空间 O(1)。\"\"\"\n    if n <= 2:\n        return n\n    a, b = 1, 2\n    for _ in range(3, n + 1):\n        a, b = b, a + b\n    return b\n```\n\n**01 背包**（真实对应优惠券组合、凑单满减的用例设计）：\n\n```python\ndef best_coupon_combo(discounts, thresholds, budget):\n    \"\"\"budget 是\"最多能承受的凑单金额\"，discounts 是每张券的优惠，thresholds 是券的门槛消耗。\n    返回在 budget 内能拿到的最大优惠。这就是 01 背包。\n    时间 O(n * budget)\n    \"\"\"\n    dp = [0] * (budget + 1)\n    for v, w in zip(discounts, thresholds):\n        for c in range(budget, w - 1, -1):     # 倒序！保证每件物品只用一次\n            dp[c] = max(dp[c], dp[c - w] + v)\n    return dp[budget]\n```\n\n**背包的测试价值**：设计\"优惠券叠加\"用例时，穷举所有组合是指数级的（10 张券 1024 种，20 张券 100 万种）。用背包能验证\"最优解\"是否正确，也能构造\"刚好卡在门槛上\"和\"差 1 分钱不够门槛\"的边界数据。这正是算法在测试里的正确用法：**不是去实现业务算法，而是用算法生成和验证边界。**\n\n---\n\n## 4. 复杂度分析：最实用的一项\n\n### 4.1 会算就行，重点在\"能说出自己代码的复杂度\"\n\n| 复杂度 | n=1000 时的大致量级 | 典型写法 |\n| --- | --- | --- |\n| O(1) | 立刻 | 哈希查找、数组下标 |\n| O(log n) | ~10 次 | 二分 |\n| O(n) | ~1000 | 单层遍历 |\n| O(n log n) | ~10000 | 排序 |\n| O(n²) | ~100 万，开始慢 | 双重循环、`in list` |\n| O(2^n) | 做不了 | 暴力枚举子集 |\n\n### 4.2 实测：set 把 O(n²) 换成 O(n)\n\n```python\nimport random\nimport time\n\nn = 5000\na = [random.randint(0, 10_000) for _ in range(n)]\nb = [random.randint(0, 10_000) for _ in range(n)]\n\nt0 = time.perf_counter()\ncommon_slow = [x for x in a if x in b]          # b 是 list → 每次 in 都是 O(n)\nt1 = time.perf_counter()\n\nb_set = set(b)\ncommon_fast = [x for x in a if x in b_set]      # 每次 in 是 O(1)\nt2 = time.perf_counter()\n\nprint(f\"O(n²): {t1 - t0:.3f}s, O(n): {t2 - t1:.4f}s\")   # 典型结果：1.2s vs 0.0004s\n```\n\n这不是理论，是造数据脚本从\"跑 10 分钟\"变成\"跑 1 秒\"的差别。\n\n### 4.3 复杂度的业务表现：接口为什么慢\n\n**这是把算法和真实工作连起来的关键一节。** 后台接口慢，八成是下面四种\"复杂度问题\"：\n\n| 代码写法 | 复杂度表现 | 现象 |\n| --- | --- | --- |\n| 循环里发 RPC / 查 DB | **N+1**：1 次请求变 N 次 | 列表接口 20 条数据要 3 秒（20 次 DB 查询） |\n| 列表里 `contains` 判断存在 | O(n²) | 导入 5000 条数据时接口超时 |\n| 嵌套遍历两个大列表做匹配 | O(n*m) | 数据量翻倍，耗时翻四倍 |\n| 无条件全表扫描 | O(n) 但 n 是百万级 | 加了筛选条件也没用，仍要扫全表 |\n\n**所以做接口性能测试时，我的判断顺序是**：\n\n1. 看响应时间随**数据量**增长是否线性/超线性 → 超线性说明有 O(n²) 或 N+1。\n2. 看**日志/慢查询**里 SQL 条数 → 条数和返回条数同阶，就是 N+1。\n3. 让开发改成批量查询（`WHERE id IN (...)`），再测一次，用数据说话。\n\n**断言里的复杂度**也要注意：一个接口返回 10 万条数据，用双重循环比对期望值，断言本身就要跑 30 秒。**测试代码慢，先怀疑自己的断言是 O(n²)。**\n\n---\n\n## 5. 自查 Q7：手写题的完整答案 + 现场发挥建议\n\n面试/自查时按这个顺序交付：\n\n**快排**：先说\"分治 + 分区，平均 O(n log n)，最坏 O(n²)，不稳定\"。手写用列表推导版（15 秒）证明你会，然后主动说\"如果要求原地，我改成 Lomuto 分区\"，再写原地版。**主动补充退化场景和优化（三数取中、随机 pivot）是加分项。**\n\n**归并**：强调\"稳定、O(n log n)、需要 O(n) 额外空间\"，并指出 `a[i] <= b[j]` 里的 `<=` 就是稳定性的来源。再补一句\"大数据外部排序就是分块归并\"。\n\n**二分**：先说\"前提必须有序\"，写左闭右开模板，主动说\"我习惯用 `[lo, hi)` + `lo < hi`，返回 `lo`，这样不用纠结 mid±1\"，然后补充 `lower_bound` / `upper_bound` 变体，说明\"业务里查时间范围用的就是它\"。**面试官大概率追问变体，提前说出来比被问住好。**\n\n**哈希交集**：先说\"转 set 求交集 O(n+m)\"，然后主动区分\"去重交集 / 多重集交集 / 保序交集\"三种语义，说\"实际业务里要先跟产品确认是哪一种\"。**主动区分语义，比写对代码更能体现工程思维。**\n\n一个通用收尾话术：\n\n> 这题我按 XX 思路写，时间 O(..)、空间 O(..)。边界我考虑了空数组、单元素、有重复值三种情况。如果在真实业务里，我会先确认\"重复元素怎么算\"这个语义，因为它比算法本身更容易出 bug。\n\n---\n\n## 6. 复习动作清单\n\n- [ ] 把本篇的 `quick_sort`、`merge_sort`、`binary_search`、`intersect_*` 四种，盲写一遍，限时 15 分钟。写不出来说明还不够熟。\n- [ ] 在真实项目里找一处 `x in list` 的写法，改成 `set`，记录改前改后的耗时。\n- [ ] 用 `collect_permissions` 和 `find_node_path` 去断言你们系统的菜单权限，体会\"树遍历 + 可读的失败信息\"。\n- [ ] 用 `diff_keys` 对比一次测试环境和生产环境的接口返回结构，大概率能发现一两个契约不一致的字段。\n- [ ] 用 `best_coupon_combo` 的思路，给优惠券业务设计一组边界用例，看看穷举和背包的差距。\n","chars":4792,"codes":23,"tables":5},{"id":"sysdesign","title":"系统设计意识篇","desc":"缓存/限流/超时/重试/熔断/降级/幂等","file":"测试开发-系统设计意识篇.md","content":"# 测试开发-系统设计意识篇\n\n> 对应清单：系统设计意识【必须掌握（概念级）】全部\n> 对应自查：Q8（缓存/限流/熔断/降级分别解决什么、测什么）\n> 一句立场：这一篇不是让你去设计系统，而是让你**在评审会上听得懂、在测试设计时不漏项、在出事故时知道往哪查**。\n> 全篇约定：这七个词（缓存、限流、超时、重试、熔断、降级、幂等）+ 三件基础设施（日志、监控、告警），每个都按同一个结构展开：**解决什么问题 → 没有它会怎样 → 测试必须验证什么 → 怎么造出这个场景**。\n\n---\n\n## 0. 七个词的关系：先有一张全局图\n\n```\n用户请求\n  │\n  ├─ 网关：限流（挡住过量）── 鉴权\n  │\n  ├─ 应用 ── 缓存（挡住 DB）\n  │    │\n  │    ├─ 调下游 ── 超时（别无限等）── 重试（可恢复的失败再试一次）\n  │    │              └─ 熔断（下游持续失败就别再试了）\n  │    │\n  │    └─ 主流程挂了 ── 降级（返回兜底，别整体不可用）\n  │\n  └─ 写操作：幂等（保证重复请求不重复生效）\n```\n\n一句话概括这七个词共同服务的目标：**让系统在流量、故障、重复请求面前，表现可预期。**\n\n测试的切入点也在这句话上：**你要验的不是\"功能对不对\"，而是\"在异常条件下行为是否符合预期\"。** 这就是为什么\"系统设计意识\"是测试的分水岭 —— 没有它，你只能测 CRUD 的正向路径。\n\n自查分级：\n\n| 词 | 档位 | 一句话 |\n| --- | --- | --- |\n| 缓存 | 熟练 | 一致性是核心测试点 |\n| 幂等 | 熟练 | 重复提交是必然会出的事故 |\n| 超时 / 重试 | 熟练 | 两者组合会产生重复数据 |\n| 限流 | 会用 | 边界测试要注意时间窗口 |\n| 熔断 / 降级 | 会用 | 要能手工触发 |\n| 幂等 / 日志监控告警 | 熟练 | 质量基础设施 |\n\n---\n\n## 1. 缓存\n\n### 解决什么问题\n\n挡住 DB 的读压力，把毫秒级查询变微秒级。没有它会怎样：热点数据把 DB 打满，全站变慢（DB 的 QPS 上限通常只有几千，缓存能到十万级）。\n\n### 三个经典故障模型（评审会上一定会出现这三个词）\n\n| 名字 | 一句话 | 触发条件 |\n| --- | --- | --- |\n| 缓存穿透 | 查一个**不存在**的数据，缓存不命中，每次都打 DB | 攻击者用随机 ID 猛打 |\n| 缓存击穿 | 某个**热点 key 过期瞬间**，大量请求同时打 DB | 爆款商品缓存到期 |\n| 缓存雪崩 | **大量 key 同时过期** 或缓存集群挂了 | 统一设置了相同过期时间 |\n\n对应解法（测试时要确认有没有）：穿透 → 空值缓存 / 布隆过滤器；击穿 → 互斥锁重建 / 逻辑过期；雪崩 → 过期时间加随机抖动 / 多级缓存 / 熔断降级。\n\n### 测试必须验证什么\n\n| 验证点 | 用例设计 | 最容易漏的 |\n| --- | --- | --- |\n| 缓存是否生效 | 连续请求同一接口两次，第二次响应时间应显著下降；看 Redis `keys`/监控命中率 | 只测了\"能返回\"，没验证真的走缓存 |\n| **数据一致性** | 修改数据 → 立即查询 → 期望看到新值。有延迟就验证延迟上限 | **写后读**和**读后写**两个方向都要测 |\n| 缓存与 DB 双写顺序 | 更新 DB 后删缓存 vs 先删缓存再更新 DB，两条路径都要验 | 并发下\"删了缓存但 DB 还没提交\"，旧值被重新写回缓存 |\n| 缓存穿透 | 用随机不存在的 ID 并发打 1000 次，DB 查询量不应线性增长 | 只测一次不存在的 ID，看不出穿透 |\n| 缓存击穿 | 等热点 key 正好过期的那一刻并发 500 请求（脚本要能对齐时间） | 需要能查 TTL 或指定过期时间 |\n| 缓存雪崩 | 批量写入 key 时看 TTL 是否集中；或直接重启 Redis 观察服务 | 重启 Redis 后服务是否还能降级到 DB |\n| **缓存 key 冲突** | 不同参数/不同租户是否可能生成同一个 key | 参数拼接没分隔符：`a=1,b=23` 和 `a=12,b=3` 都是 `12 3` |\n| 序列化兼容 | 缓存里是旧版本结构，代码升级后能否反序列化 | 发版后第一批请求报反序列化异常 |\n| 缓存容量淘汰 | 超过容量后淘汰策略（LRU/LFU/TTL）是否符合预期 | 测试环境缓存小，容易触发 |\n\n**一个具体的 key 冲突 bug**（值得记）：\n\n```python\n# 危险的拼接方式\nkey = f\"user:{user_id}:{type_}:{status}\"     # 看起来没问题\n# 但如果某处是 f\"user:{user_id}:{a}{b}\"，参数边界丢了分隔符\n# → 不同业务参数命中同一 key，A 用户看到了 B 的数据\n```\n\n测试手段：抓住\"缓存 key 由多个参数拼接\"的接口，构造能让不同参数产生相同字符串的输入。\n\n### 怎么造场景\n\n```python\n# 验证缓存生效：用响应耗时做粗判，稳定时可信\nimport time\nimport requests\n\ndef timed(url, n=20):\n    ts = []\n    for _ in range(n):\n        s = time.perf_counter()\n        requests.get(url, timeout=5)\n        ts.append(time.perf_counter() - s)\n    ts.sort()\n    return ts[0], ts[len(ts) // 2]     # 最小值和 P50，比平均值抗噪\n\nfirst_min, first_p50 = timed(url)\n# 清缓存（测试环境直接 redis-cli DEL，或换一个从没请求过的 id）\nrequests.post(f\"{ADMIN}/cache/flush\", json={\"key\": key}, timeout=5)\nafter_min, after_p50 = timed(url)\nassert after_p50 > first_p50, \"清缓存后耗时未上升，说明缓存没生效或已被预热\"\n```\n\n> 提示：用耗时判断缓存是\"粗判\"，正式结论要看 Redis 命中率监控。但作为自动化断言，耗时突增是足够强的信号。\n\n---\n\n## 2. 限流\n\n### 解决什么问题\n\n保护系统不被过量请求打垮。没有它会怎样：一次营销活动或爬虫就能把服务打死，所有人一起不可用。\n\n### 常见算法（听得懂就够）\n\n| 算法 | 特点 | 缺陷 |\n| --- | --- | --- |\n| 固定窗口计数器 | 简单，窗口内计数 | 窗口边界突刺（两个窗口交界处能通过 2 倍） |\n| 滑动窗口 | 平滑 | 实现稍复杂 |\n| 令牌桶 | 允许一定突发 | 桶容量决定突发上限 |\n| 漏桶 | 恒定速率流出 | 不允突发 |\n\n### 测试必须验证什么\n\n| 验证点 | 用例 | 关键细节 |\n| --- | --- | --- |\n| 阈值准确性 | 窗口内发 N 个通过，第 N+1 个被限 | **必须控制在同一时间窗口内**，跨窗口会漏判 |\n| 返回码与提示 | 期望 429 + `Retry-After`，前端有友好提示 | 有些系统返回 200 + 业务错误码，要跟开发确认约定 |\n| 限流维度 | IP / 用户 / 接口 / 全局，各维度分别测 | 换 token 绕不绕过限流，是安全测试点 |\n| 单机 vs 集群 | 集群总限流=100，10 台机器，是否每台 10？还是共享 Redis 计数？ | 单机限流在扩容后总阈值会翻倍，这是常见设计缺陷 |\n| **误伤** | 正常用户/正常频率不应被限 | 限流规则太宽会误杀 |\n| 限流对性能测试的干扰 | 压测时把限流打满，误以为后端到顶 | **压测前先问限流阈值**，否则结论全错 |\n| 恢复 | 窗口过后是否自动恢复 | 有的实现会把计数器永久卡住 |\n\n### 怎么精确测阈值（这是能直接用的代码）\n\n```python\nimport time\nfrom concurrent.futures import ThreadPoolExecutor\nimport requests\n\ndef probe_limit(url, headers, window=1.0, max_requests=50):\n    \"\"\"在同一个 1s 窗口内并发打请求，统计通过数/被限数。\n    注意：先对齐到窗口起始点，否则测出来的数字会因窗口边界而抖动。\n    \"\"\"\n    # 对齐窗口：等下一个整秒开始，减少边界误差\n    time.sleep(window - (time.time() % window))\n\n    def one(_):\n        r = requests.get(url, headers=headers, timeout=3)\n        return r.status_code\n\n    start = time.perf_counter()\n    with ThreadPoolExecutor(max_workers=max_requests) as pool:\n        codes = list(pool.map(one, range(max_requests)))\n    cost = time.perf_counter() - start\n\n    passed = sum(1 for c in codes if c == 200)\n    limited = sum(1 for c in codes if c == 429)\n    print(f\"窗口内耗时 {cost:.3f}s，通过 {passed}，被限 {limited}\")\n    return passed, limited\n\n# 断言：配置阈值 100/s 时，通过数应≈100（允许 ±10% 的并发时序误差）\npassed, limited = probe_limit(URL, headers)\nassert 90 <= passed <= 110, f\"通过数 {passed} 与配置阈值 100 偏差过大\"\nassert limited > 0, \"没有请求被限流，可能限流未生效\"\n```\n\n**测限流最容易出的错**：用 `for` 循环串行发 200 个请求，耗时 2 秒，横跨 2 个窗口，测出来的\"阈值\"是 200/s，实际配置是 100/s。**限流测试必须并发 + 对齐窗口。**\n
