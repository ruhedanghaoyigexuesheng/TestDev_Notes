PLAIN / 慢 SQL / 索引失效 | 看得懂 | 和性能测试衔接 |\n| 连接数耗尽 | 知道现象 | 报错长什么样 |\n\n---\n\n## 1. 常见 SQL：会写，还要知道哪里会坑测试\n\n### 1.1 查询、过滤、排序、分页\n\n```sql\n-- 基础：最近 7 天、待支付、按创建时间倒序\nSELECT order_no, user_id, status, amount, created_at\nFROM orders\nWHERE status = 'PENDING_PAY'\n  AND created_at >= DATE_SUB(NOW(), INTERVAL 7 DAY)\nORDER BY created_at DESC\nLIMIT 20;\n```\n\n**分页两个坑，测开一定会遇到：**\n\n```sql\n-- 坑 1：深分页。LIMIT 100000, 20 会先扫描 100020 行再丢前 100000 行 → 越翻越慢\nSELECT * FROM orders ORDER BY id LIMIT 100000, 20;\n\n-- 正确做法：记住上一页最后一条的 id（游标分页）\nSELECT * FROM orders WHERE id > 100000 ORDER BY id LIMIT 20;\n```\n\n测试时的表现：接口翻到第 500 页超时。**这不是接口 bug，是分页写法问题**，但你要能指出来。\n\n```sql\n-- 坑 2：排序字段不唯一 → 分页出现重复或漏数据\nORDER BY created_at DESC               -- 同一秒创建的几十条订单，顺序不稳定\nORDER BY created_at DESC, id DESC      -- ✅ 加唯一列兜底\n```\n\n**测试怎么发现这个问题**：连续翻页收集所有 id，看有没有重复或缺失。数据量大时必现。\n\n**时间条件的两种写法，语义不同**（面试常问）：\n\n```sql\n-- 最近 7 天（滚动 168 小时）\ncreated_at >= DATE_SUB(NOW(), INTERVAL 7 DAY)\n\n-- 最近 7 个自然日（含今天往前数 7 天，从 0 点算）\ncreated_at >= DATE_SUB(CURDATE(), INTERVAL 7 DAY)\n```\n\n差别在跨天的那一刻。**测试对账时如果两边写法不一致，会差一整天的数据** —— 这种 bug 只有对账才发现。\n\n### 1.2 聚合：GROUP BY / HAVING\n\n```sql\n-- 每个用户的待支付订单数和总金额，只显示金额超过 100 的\nSELECT u.nickname,\n       COUNT(*)            AS order_cnt,\n       SUM(o.amount)       AS total_amount\nFROM orders o\nINNER JOIN users u ON u.id = o.user_id\nWHERE o.status = 'PENDING_PAY'\nGROUP BY u.id, u.nickname\nHAVING SUM(o.amount) > 100\nORDER BY total_amount DESC;\n```\n\n三个必须分清的点：\n\n| 区别 | 说明 | 测试意义 |\n| --- | --- | --- |\n| `WHERE` vs `HAVING` | WHERE 过滤**行**（聚合前），HAVING 过滤**组**（聚合后） | 用错会得到完全不同结果，且不报错 |\n| `COUNT(*)` vs `COUNT(col)` | 后者不统计 NULL | 统计\"有备注的订单数\"时结果差很多 |\n| `SUM` 遇 NULL | 返回 NULL，不是 0 | 断言 `SUM(amount) == 0` 会失败，要用 `IFNULL(SUM(amount), 0)` |\n\n**测开常用聚合场景**：\n\n```sql\n-- 对账：接口返回的总金额 vs 库里算出来的总金额\nSELECT COUNT(*) AS cnt, IFNULL(SUM(amount),0) AS total\nFROM orders\nWHERE user_id = 1001 AND status = 'PAID'\n  AND created_at >= '2026-10-01' AND created_at < '2026-11-01';\n```\n\n### 1.3 关联查询 JOIN\n\n```sql\n-- INNER JOIN：只返回两边都匹配的\nSELECT o.order_no, u.nickname\nFROM orders o INNER JOIN users u ON u.id = o.user_id;\n\n-- LEFT JOIN：保留左表全部，右表没匹配到就补 NULL\nSELECT u.id, u.nickname, o.order_no\nFROM users u LEFT JOIN orders o ON o.user_id = u.id;\n```\n\n**LEFT JOIN 在测试里最重要的用途：找\"孤儿数据\"。**\n\n```sql\n-- 有订单但找不到用户（数据不一致，通常是外键被禁用或脏数据）\nSELECT o.id, o.order_no, o.user_id\nFROM orders o\nLEFT JOIN users u ON u.id = o.user_id\nWHERE u.id IS NULL;\n\n-- 用户一个订单都没有（验证\"注册后应自动发新人券\"这类场景之前，先确认没数据）\nSELECT u.id, u.nickname\nFROM users u\nLEFT JOIN orders o ON o.user_id = u.id\nWHERE o.id IS NULL;\n```\n\n这段 SQL 是**线上数据体检**的标配。测试环境跑一遍，常能发现造数据脚本留下的孤儿记录，导致某些查询报错或返回异常。\n\nJOIN 的三个坑：\n\n| 坑 | 后果 | 怎么发现 |\n| --- | --- | --- |\n| 一对多 JOIN 导致行数膨胀 | `COUNT` 变大、`SUM` 翻倍 | 先 `COUNT(*)` 对比主表行数 |\n| `ON` 条件写漏（笛卡尔积） | 结果爆炸 | 忘记写 ON 时行数 = 两表乘积 |\n| 用 `WHERE` 过滤右表，把 LEFT JOIN 变成了 INNER JOIN | 左表没匹配的行也消失了 | 把条件移到 `ON` 里 |\n\n```sql\n-- ❌ 这样写，LEFT JOIN 退化成 INNER JOIN（没订单的用户被过滤掉了）\nSELECT u.id, o.order_no\nFROM users u LEFT JOIN orders o ON o.user_id = u.id\nWHERE o.status = 'PAID';\n\n-- ✅ 条件放 ON 里\nSELECT u.id, o.order_no\nFROM users u LEFT JOIN orders o ON o.user_id = u.id AND o.status = 'PAID';\n```\n\n**这是 SQL 里最容易错、也最容易被面试官追问的一个点。**\n\n---\n\n## 2. 表结构：主键、唯一索引、普通索引、外键\n\n### 2.1 四种约束的角色\n\n```sql\nCREATE TABLE orders (\n  id         BIGINT PRIMARY KEY AUTO_INCREMENT,     -- 主键：唯一 + 聚簇索引\n  order_no   VARCHAR(32) NOT NULL,\n  user_id    BIGINT NOT NULL,\n  status     VARCHAR(16) NOT NULL,\n  amount     DECIMAL(10,2) NOT NULL,\n  created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  UNIQUE KEY uk_order_no (order_no),                -- 唯一索引：业务唯一性\n  KEY idx_user_created (user_id, created_at),       -- 普通索引：加速查询\n  CONSTRAINT fk_orders_user FOREIGN KEY (user_id) REFERENCES users(id)\n) ENGINE=InnoDB;\n```\n\n| 类型 | 约束 | 性能 | 测试关注点 |\n| --- | --- | --- | --- |\n| 主键 | 唯一 + 非空 | 聚簇索引，查询最快 | 自增主键是否被用满（INT 溢出）、主键乱序导致页分裂 |\n| 唯一索引 | 唯一 + 允许多个 NULL | 写入时多一次校验 | **幂等的最后一道防线**：重复提交能不能被拦 |\n| 普通索引 | 无约束 | 加速 WHERE/ORDER BY | 有没有、走没走（EXPLAIN） |\n| 外键 | 引用完整性 | **有性能开销**，高并发下易锁 | 阿里规范禁止物理外键，测试要验证**应用层有没有做关联校验** |\n\n### 2.2 唯一索引 = 幂等的地基（这是测试最该关心的）\n\n```\n用户连点两次提交 → 两个请求同时到达\n应用层\"先查有没有，再插入\" → 两个请求都查到\"没有\" → 都插入 → 两条订单\n```\n\n**应用层的\"先查后插\"在并发下必然失效**（查和插之间有窗口）。真正兜底的是唯一索引：\n\n```sql\nINSERT INTO orders (order_no, user_id, status, amount)\nVALUES ('O-20261029-001', 1001, 'PENDING_PAY', 99.00);\n-- 第二个请求：ERROR 1062 (23000): Duplicate entry 'O-20261029-001' for key 'uk_order_no'\n```\n\n**测试动作**：用 10 并发提交同一个 `request_id`/`order_no`，断言只有 1 条记录、且接口对重复请求返回\"幂等成功\"（返回第一次的订单）而不是 500。\n\n如果返回 500（`Duplicate entry`），说明开发只在应用层查重、没捕获唯一索引冲突 → **这是要提的缺陷**，因为并发场景下用户会看到报错。\n\n### 2.3 外键：为什么生产通常不用\n\n| 外键的好处 | 外键的代价 |\n| --- | --- |\n| 数据库层保证引用完整性 | 每次写入都要检查父表，有额外锁 |\n| 级联删除方便 | 分库分表后根本用不了 |\n| | 高并发下容易死锁、锁等待 |\n\n**测试必须知道的影响**：如果数据库不建外键，那\"订单的 user_id 指向不存在的用户\"这种脏数据**数据库不会拦**，只能靠应用层。所以：\n\n- 测\"删除用户后，其订单怎么处理\" → 要验证应用层是逻辑删除还是级联，别指望数据库。\n- 跑数据体检 SQL（§1.3 的孤儿数据检测）→ 这是发现这类问题的唯一手段。\n\n### 2.4 索引三问\n\n```\n有没有？   → SHOW INDEX FROM orders;\n走没走？   → EXPLAIN，看 key 列是不是 NULL\n够不够？   → 看 rows 扫描行数、Extra 有没有 filesort/temporary\n```\n\n---\n\n## 3. 事务：ACID、隔离级别、三种读问题\n\n### 3.1 ACID 各对应一个测试现象\n\n| 特性 | 含义 | 测试里怎么体现 |\n| --- | --- | --- |\n| 原子性 A | 要么全成功要么全回滚 | 下单扣库存+建订单，中间失败时**两个都不能生效** |\n| 一致性 C | 约束在事务前后都成立 | 转账前后总金额不变（余额不能出现负数） |\n| 隔离性 I | 并发事务互不干扰 | 两个用户并发抢最后一件库存，只有一个成功 |\n| 持久性 D | 提交后不丢 | 提交后 kill 数据库进程，重启数据还在 |\n\n**最实用的测试点是原子性**：故意让事务第二步失败（比如传入非法值），验证第一步的写入是否被回滚。这是\"接口返回失败但数据部分写入\"类 bug 的根源。\n\n### 3.2 四种隔离级别\n\n| 隔离级别 | 脏读 | 不可重复读 | 幻读 | MySQL 默认 |\n| --- | --- | --- | --- | --- |\n| READ UNCOMMITTED（读未提交） | 会 | 会 | 会 | |\n| READ COMMITTED（读已提交） | 不会 | 会 | 会 | Oracle 默认 |\n| **REPEATABLE READ（可重复读）** | 不会 | 不会 | **InnoDB 基本不会** | ✅ MySQL 默认 |\n| SERIALIZABLE（串行化） | 不会 | 不会 | 不会 | 性能最差 |\n\n```sql\n-- 查看与设置\nSELECT @@tx_isolation;                                                   -- MySQL 5.7\nSELECT @@transaction_isolation;                                          -- MySQL 8.0\nSET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED;\n```\n\n### 3.3 三种\"读\"的问题，用一句话场景记\n\n| 问题 | 一句话 | 场景 |\n| --- | --- | --- |\n| 脏读 | 读到了**别人还没提交**的数据 | A 转账给 B 还没提交，B 就看到了余额增加，结果 A 回滚了 |\n| 不可重复读 | **同一事务内**两次读同一行，结果不一样（别人改了并提交） | 统计报表算到一半，金额被另一个事务改了 |\n| 幻读 | **同一事务内**两次查同一个范围，行数变了（别人插入并提交） | 查\"待支付订单数\"是 3，一会再查变成 4 |\n\n### 3.4 MySQL RR 的关键细节（面试加分点）\n\nMySQL 的 RR 通过 **MVCC（快照读）+ 间隙锁（当前读）** 实现，所以：\n\n- **普通 SELECT（快照读）**：整个事务看到的是开始时的快照，别人新插入的行看不到 → 看起来没幻读。\n- **UPDATE / DELETE / SELECT ... FOR UPDATE（当前读）**：读的是最新数据 → **能看到别人刚插入的行**。\n\n```sql\n-- 事务 A（RR）\nSTART TRANSACTION;\nSELECT COUNT(*) FROM orders WHERE status = 'PAID';     -- 假设 10 条（快照）\n-- 事务 B 插入一条 PAID 并提交\nSELECT COUNT(*) FROM orders WHERE status = 'PAID';     -- 仍是 10（快照读）\nUPDATE orders SET amount = amount WHERE status = 'PAID';  -- 当前读！会改到 11 条\nSELECT COUNT(*) FROM orders WHERE status = 'PAID';     -- 现在变成 11 了\n```\n\n**所以\"RR 能解决幻读\"这个说法不严谨**：快照读下看不到，但当前读会看到。测试写\"并发插入后统计\"的用例时，如果用例里有 UPDATE，就会看到多出来的行 —— 这不是 bug，是语义。\n\n### 3.5 重复提交与数据库的关系（自查 Q2 的一半）\n\n重复提交能不能被拦住，取决于三层，**数据库是最后一层**：\n\n| 层 | 机制 | 失败表现 |\n| --- | --- | --- |\n| 前端 | 按钮置灰、防抖 | 绕过前端直接打接口就失效 |\n| 应用 | 先查后插、分布式锁、Token 校验 | 并发下\"查\"和\"插\"之间有窗口 → 失效 |\n| **数据库** | **唯一索引 / 乐观锁（version）** | 这才是唯一可靠的兜底 |\n\n```sql\n-- 乐观锁更新，version 不匹配就更新 0 行\nUPDATE coupon SET status='USED', version = version + 1\nWHERE id = 100 AND status='UNUSED' AND version = 3;\n-- 影响行数 0 → 说明被别人抢先了，业务应返回\"已领取\"\n```\n\n**测试要验的**：并发 10 次，数据库最终只有 1 条订单 / 1 次扣减。断言看 `ROW_COUNT()` 和表里的记录数。\n\n---\n\n## 4. 测试场景应用：用 SQL 造数、断言、对账\n\n### 4.1 造数据：直接写库 vs 走接口\n\n| 方式 | 优点 | 缺点 | 什么时候用 |\n| --- | --- | --- | --- |\n| 走接口造 | 符合业务规则、触发完整链路 | 慢、受限（不能造非法状态）、依赖环境 | 验证主流程 |\n| 直接写库 | 快、能造任意状态、可批量 | 绕过校验（可能造出脏数据）、字段多易漏 | 准备前置条件、造边界状态 |\n\n**原则**：**前置数据能直接写库就写库，被测行为必须走接口。** 因为你要测的是\"下单\"，不是\"造一个已支付订单\"。\n\n```sql\n-- 批量造 1000 条待支付订单（用序号表填充）\nINSERT INTO orders (order_no, user_id, status, amount, created_at)\nSELECT CONCAT('O-GEN-', LPAD(n, 6, '0')), 1001, 'PENDING_PAY',\n       100 + n, DATE_SUB(NOW(), INTERVAL n MINUTE)\nFROM (\n  SELECT @row := @row + 1 AS n\n  FROM information_schema.columns a, information_schema.columns b\n  LIMIT 1000\n) t, (SELECT @row := 0) r;\n```\n\n造完记得清理，否则污染环境：\n\n```sql\nDELETE FROM orders WHERE order_no LIKE 'O-GEN-%';\n```\n\n**造数据的三个纪律**（写进团队规范）：\n\n1. **加可识别前缀**（`O-GEN-`、`qa_`），否则以后不知道哪些是测试数据。\n2. **记录造数脚本**，能重复执行、能回滚。\n3. **优先用独立账号/独立商品**，别动公共数据（否则别人的用例会挂）。\n\n### 4.2 核心：用 SQL 做数据断言\n\n**这是测开和\"只会点页面\"的分水岭。** 接口返回 200 只证明\"没报错\"，库里的状态才证明\"做对了\"。\n\n```python\n# 一个可直接用的断言写法（pymysql / mysql-connector 都可以）\nimport pymysql\n\nDB = pymysql.connect(host=\"127.0.0.1\", port=3306, user=\"qa\", password=\"***\",\n                     database=\"shop\", charset=\"utf8mb4\", cursorclass=pymysql.cursors.DictCursor)\n\n\ndef query_one(sql: str, args: tuple = ()) -> dict | None:\n    with DB.cursor() as cur:\n        cur.execute(sql, args)\n        return cur.fetchone()\n\n\ndef test_create_order_persisted(api, base_url):\n    # 1. 走接口创建订单\n    resp = api.post(f\"{base_url}/api/orders\", json={\"sku_id\": 1001, \"num\": 2})\n    assert resp.status_code == 200, resp.text\n    order_no = resp.json()[\"data\"][\"order_no\"]\n\n    # 2. 查库确认落库（关键：用接口返回的 order_no 去查，不要用自增 id）\n    row = query_one(\"SELECT order_no, user_id, status, num FROM orders WHERE order_no = %s\", (order_no,))\n    assert row is not None, f\"订单没有落库: {order_no}\"\n    assert row[\"status\"] == \"PENDING_PAY\"\n    assert row[\"num\"] == 2\n```\n\n**这个模式可以复制到所有写接口**：返回成功 → 查库 → 断言字段值 → 断言关联表。\n\n### 4.3 扣库存：验证\"库存真的减了，且没有超卖\"\n\n```sql\n-- 扣库存的正确写法（带条件，防止扣成负数）\nUPDATE stock SET qty = qty - 1, version = version + 1\nWHERE sku_id = 1001 AND qty >= 1;\n\n-- 检查影响行数：0 表示库存不足，业务必须返回失败\nSELECT ROW_COUNT();\n```\n\n```python\ndef test_stock_deduct(api, base_url):\n    before = query_one(\"SELECT qty FROM stock WHERE sku_id = 1001\")[\"qty\"]\n    r = api.post(f\"{base_url}/api/orders\", json={\"sku_id\": 1001, \"num\": 2})\n    assert r.status_code == 200\n    after = query_one(\"SELECT qty FROM stock WHERE sku_id = 1001\")[\"qty\"]\n    assert after == before - 2, f\"库存扣减错误: {before} -> {after}\"\n\n\ndef test_no_oversell(api, base_url):\n    \"\"\"库存 1 件，并发 10 个请求，只能成功 1 个。\"\"\"\n    from concurrent.futures import ThreadPoolExecutor\n    with ThreadPoolExecutor(max_workers=10) as pool:\n        results = list(pool.map(\n            lambda _: api.post(f\"{base_url}/api/orders\", json={\"sku_id\": 1002, \"num\": 1}).status_code,\n            range(10)))\n    assert results.count(200) == 1, f\"超卖了: {results}\"\n    assert query_one(\"SELECT qty FROM stock WHERE sku_id = 1002\")[\"qty\"] == 0\n```\n\n**这是最经典的并发缺陷，也是最容易被漏测的**：单条用例跑一百遍都不会暴露，必须并发。\n\n### 4.4 对账：接口返回 vs 数据库\n\n```python\ndef test_order_list_consistent_with_db(api, base_url, user_id=1001):\n    \"\"\"列表接口返回的条数和金额，必须和库里一致。\"\"\"\n    api_rows = api.get(f\"{base_url}/api/orders\", params={\"user_id\": user_id, \"status\": \"PAID\"}).json()[\"data\"]\n\n    db_row = query_one(\"\"\"\n        SELECT COUNT(*) AS cnt, IFNULL(SUM(amount),0) AS total\n        FROM orders WHERE user_id = %s AND status = 'PAID'\n    \"\"\", (user_id,))\n\n    assert len(api_rows) == db_row[\"cnt\"], \"条数不一致\"\n    assert sum(float(r[\"amount\"]) for r in api_rows) == float(db_row[\"total\"]), \"金额不一致\"\n```\n\n对账类断言最适合做成**每日定时跑**的用例，比人工抽查有效得多。\n\n---\n\n## 5. 【了解即可】：慢 SQL、索引失效、连接数、EXPLAIN\n\n### 5.1 EXPLAIN 只看四列就够\n\n```sql\nEXPLAIN SELECT o.order_no, u.nickname\nFROM orders o JOIN users u ON u.id = o.user_id\nWHERE o.status = 'PENDING_PAY' AND o.created_at >= DATE_SUB(NOW(), INTERVAL 7 DAY)\nORDER BY o.created_at DESC LIMIT 20;\n```\n\n| 列 | 看什么 | 判断 |\n| --- | --- | --- |\n| `type` | 访问方式 | `const/eq_ref/ref/range` 好；**`ALL` 全表扫描、`index` 全索引扫描**要警惕 |\n| `key` | 实际用的索引 | **NULL = 没走索引** |\n| `rows` | 预估扫描行数 | 越大越危险，和实际返回行数对比 |\n| `Extra` | 额外动作 | `Using filesort`（排序没走索引）、`Using temporary`（用了临时表，GROUP BY 常见）、`Using index`（覆盖索引，最好） |\n\n**测试怎么用**：接口慢 → 拿到它执行的 SQL（开慢查询日志或让开发给你） → EXPLAIN → 看 type 是不是 ALL、key 是不是 NULL。**带着这个结论去找开发，比说\"接口慢\"有效十倍。**\n\n```sql\n-- 开慢查询日志\nSET GLOBAL slow_query_log = ON;\nSET GLOBAL long_query_time = 1;\nSHOW VARIABLES LIKE 'slow_query_log_file';\n```\n\n### 5.2 索引失效的六个常见原因\n\n| 原因 | 反例 | 正确写法 |\n| --- | --- | --- |\n| 字段上用函数 | `WHERE DATE(created_at) = '2026-10-29'` | `WHERE created_at >= '2026-10-29' AND created_at < '2026-10-30'` |\n| 隐式类型转换 | `WHERE order_no = 123`（order_no 是 varchar） | `WHERE order_no = '123'` |\n| 前导模糊 | `LIKE '%abc'` | `LIKE 'abc%'`（或者上搜索引擎） |\n| OR 连接非索引列 | `WHERE a=1 OR b=2`（b 无索引） | 拆成两个查询 union |\n| 联合索引不满足最左前缀 | 索引 `(user_id, created_at)`，却 `WHERE created_at > ...` | 补 `user_id` 条件 |\n| 用 `!=` / `NOT IN` | `WHERE status != 'PAID'` | 枚举取反或改条件 |\n\n**测试的实际价值**：你造的数据让接口变慢了，先排查是不是自己造的数据踩了索引（比如传了个超长字符串、或者传了数字导致隐式转换）。**别一慢就提性能 bug。**\n\n### 5.3 连接数耗尽\n\n```\nERROR 1040 (HY000): Too many connections\n```\n\n```sql\nSHOW VARIABLES LIKE 'max_connections';         -- 上限，默认 151\nSHOW STATUS LIKE 'Threads_connected';          -- 当前连接数\nSHOW STATUS LIKE 'Max_used_connections';       -- 历史峰值\nSHOW PROCESSLIST;                              -- 谁在占连接（看 Command 是 Sleep 的就是空闲占用）\n```\n\n**测试场景真相**：`pytest -n 32` 并行跑用例时，每个 worker 一个连接池，很容易把测试库连接打满。**看到 `Too many connections` 先查自己的并行数和连接池配置，别急着提 bug。**\n\n---\n\n## 6. 自查清单逐条作答（Q1–Q2）\n\n### Q1. 查出最近 7 天创建、状态为「待支付」的订单，按创建时间倒序，含用户昵称\n\n```sql\nSELECT\n    o.order_no,\n    o.status,\n    o.amount,\n    o.created_at,\n    u.nickname\nFROM orders AS o\nINNER JOIN users AS u ON u.id = o.user_id\nWHERE o.status = 'PENDING_PAY'\n  AND o.created_at >= DATE_SUB(NOW(), INTERVAL 7 DAY)\nORDER BY o.created_at DESC;\n```\n\n**口述时主动补充这四点**（这是把答案从\"背 SQL\"变成\"懂业务\"的关键）：\n\n1. **为什么 INNER JOIN**：只查有对应用户的订单。如果要包含\"用户被删了但订单还在\"的脏数据，改 LEFT JOIN 并接受 nickname 为 NULL。\n2. **7 天是滚动还是自然日**：`DATE_SUB(NOW(), INTERVAL 7 DAY)` 是滚动 168 小时；如果业务说\"最近 7 个自然日\"，要用 `DATE_SUB(CURDATE(), INTERVAL 7 DAY)`。**这里差一整天，对账时会暴露。**\n3. **时间字段要能走索引**：`created_at >= ...` 是范围查询可以走索引，但**不要写成 `DATE(created_at) >= ...`**，那样索引失效。\n4. **分页要加唯一列**：`ORDER BY o.created_at DESC, o.id DESC`，否则同一秒的订单顺序不稳定，翻页会重复。\n\n### Q2. 事务隔离级别有哪几种？重复提交用例和数据库的什么机制有关？\n\n**隔离级别四种**：READ UNCOMMITTED、READ COMMITTED、REPEATABLE READ（MySQL 默认）、SERIALIZABLE。对应解决脏读、不可重复读、幻读三种问题（见 §3.2）。\n\n**重复提交与数据库的关系**，答三层：\n\n1. **唯一索引**：`order_no` / `request_id` 上建唯一索引，第二个请求插入时直接报 `Duplicate entry`。这是**唯一可靠的最后防线**，因为应用层的\"先查后插\"在并发下必有窗口。\n2. **乐观锁/版本号**：`UPDATE ... SET version = version + 1 WHERE version = N`，影响行数为 0 就说明被抢先了，适用于扣库存、改状态。\n3. **事务**：把\"扣库存 + 建订单 + 发券\"放进一个事务，任一步失败全回滚，避免\"扣了库存没建订单\"这种半成品。\n\n**加分回答**：重复提交的测试要能区分\"应该失败\"和\"应该幂等成功\"两种情况 —— 用户重复提交同一个订单，正确行为是**返回第一次的结果**（幂等），不是报错也不是建两单。所以要断言\"两次返回同一个 order_id，且库里只有一条记录\"。\n\n---\n\n## 7. 动手清单\n\n- [ ] 用 `LEFT JOIN ... WHERE 右表.id IS NULL` 跑一遍你们测试环境，找出孤儿数据。\n- [ ] 给一个写接口补上\"返回 → 查库 → 断言字段\"的用例，替换掉只看 status_code 的写法。\n- [ ] 用 10 并发打一次下单/领券接口，看库里产生几条记录。\n- [ ] 拿一条慢接口的 SQL 跑 EXPLAIN，看 type 和 key 两列，带着结论找开发。\n","chars":6175,"codes":27,"tables":13},{"id":"redis","title":"Redis与缓存篇","desc":"五种结构选型/redis-cli 造数/一致性用例","file":"测试开发-Redis与缓存篇.md","content":"# 测试开发-Redis与缓存篇\n\n> 对应清单：Redis 与缓存【必须掌握】全部\n> 对应自查：Q3（接口创建了订单但查不到，排查步骤）\n> 说明：缓存三大问题的**通用测试方法**在《系统设计意识篇》§1 已展开，本篇不重复，只讲 **Redis 这一层的具体操作**：用什么结构、怎么连、怎么查、怎么造、怎么验。\n\n---\n\n## 0. 先定位：测开挖 Redis 是为了什么\n\n| 场景 | 具体动作 |\n| --- | --- |\n| 查数据对不对 | `GET` / `HGETALL` 看缓存里到底是旧值还是新值 |\n| 造测试状态 | 直接 `HSET` 改会员等级、篡改余额、塞一个过期的验证码 |\n| 验证过期逻辑 | `TTL` 看剩余时间、`DEL` 模拟过期 |\n| 验证缓存是否生效 | 比对缓存命中前后的响应耗时、看 `keyspace_hits` |\n| 排查\"接口查不到\" | 确认是不是读到了旧的缓存 |\n\n一句话：**数据库是\"最终真相\"，Redis 是\"接口实际读到的值\"，两者不一致就是 bug。**\n\n自查分级：\n\n| 内容 | 档位 | 说明 |\n| --- | --- | --- |\n| 五种结构选型 | 熟练 | 面试必问，且看 key 就能反推业务 |\n| redis-cli 常用命令 | 熟练 | 每天用 |\n| 验证码/会话/排行榜的实现 | 会用 | 对应 String/Hash/ZSet |\n| 缓存一致性验证 | 熟练 | 本篇核心 |\n| 三大问题 | 能讲清（系统设计篇已展开） | 穿透/击穿/雪崩 |\n| RDB/AOF | 知道名字和作用 | 重启后数据还在不在 |\n\n---\n\n## 1. 五种数据结构：选型就是\"看业务要什么\"\n\n| 结构 | 一句话 | 典型用途 | 为什么是它 |\n| --- | --- | --- | --- |\n| **String** | 一个 key 一个值 | 会话 token、验证码、计数器、分布式锁 | 单值、可设 TTL、`INCR` 原子自增 |\n| **Hash** | 一个 key 一组字段 | 用户信息、商品详情、配置 | 可以**只改一个字段**，不用整个覆盖 |\n| **List** | 有序可重复 | 简单队列、最新消息、操作日志 | `LPUSH` + `BRPOP` 天然 FIFO |\n| **Set** | 无序不重复 | 点赞用户、去重、抽奖、共同关注 | `SISMEMBER` O(1) 判存在，自动去重 |\n| **ZSet** | 带分数排序 | 排行榜、延迟队列、热度榜 | `ZREVRANGE` 直接拿 Top N，`score` 可存时间戳 |\n\n### 1.1 会话（String）\n\n```\nSET  session:uid:1001  \"eyJhbGci...\"  EX 1800      # 30 分钟过期\nGET  session:uid:1001\nTTL  session:uid:1001                              # 剩余秒数；-2 表示 key 不存在\nDEL  session:uid:1001                              # 注销/强制下线\n```\n\n**测试点**：\n\n- 登录后 `TTL` 应该在 1800 左右；调用接口后 TTL 会不会续期（滑动过期 vs 固定过期，要跟开发确认语义）。\n- 注销后 key 是否被删（`EXISTS` 返回 0）。\n- 同一账号在新设备登录，旧 session 是否被踢（如果 key 是 `session:uid:1001` 单 key，新登录会覆盖旧值 → 旧 token 立即失效，这是\"单点登录\"的实现）。\n\n### 1.2 验证码（String + TTL，最经典的组合）\n\n```\nSET  sms:code:13800001111  \"4821\"  EX 300          # 5 分钟有效\nGET  sms:code:13800001111\nTTL  sms:code:13800001111\n```\n\n**测试必验的五点**（每一点都能提 bug）：\n\n| 验证点 | 怎么测 | 常见缺陷 |\n| --- | --- | --- |\n| 过期后不可用 | 等 5 分钟，或用 `EXPIRE key 1` 强制快过期 | 过期了还能用（校验时没查 TTL） |\n| 用过一次就失效 | 用同一验证码提交两次 | 第二次还能成功（可重放） |\n| 发送频率限制 | 连点 10 次发送 | 无限发（短信轰炸/费用损失） |\n| 错误次数限制 | 连续输错 5 次 | 无限试错（可爆破 6 位验证码） |\n| 验证码和手机号绑定 | 用 A 手机收到的码去验 B 手机 | 串号（key 设计成 `sms:code` 没带手机号） |\n\n**造数命令**（比等 5 分钟高效得多）：\n\n```bash\n# 造一个\"即将过期\"的验证码，用来测过期逻辑\nredis-cli SET sms:code:13800001111 \"4821\"\nredis-cli EXPIRE sms:code:13800001111 2      # 2 秒后过期\n\n# 造一个\"已过期\"的（或直接删）\nredis-cli DEL sms:code:13800001111\n```\n\n### 1.3 用户信息 / 会员状态（Hash）\n\n```\nHSET  user:1001  nickname \"张三\"  vip_level 0  balance 100\nHGET  user:1001  vip_level\nHGETALL user:1001\nHSET  user:1001  vip_level 3                 # 只改一个字段，其他不动\n```\n\n**为什么用 Hash 不用 String**：用户信息有 20 个字段，改一个昵称时 String 要整个序列化覆盖（有并发覆盖风险），Hash 只改一个字段。\n\n**测试场景：篡改会员状态，验证系统兜底**（清单里明确要求的）\n\n```bash\n# 把普通用户改成 VIP\nredis-cli HSET user:1001 vip_level 3\n```\n\n**这时候要看系统怎么反应，三种结果对应三种质量**：\n\n| 结果 | 说明 | 判定 |\n| --- | --- | --- |\n| 立刻生效，能享受 VIP 权益 | 服务端**完全信任缓存** | ❌ 严重安全问题：改缓存就能提权 |\n| 不生效，仍按数据库的身份处理 | 服务端以 DB 为准，缓存只做展示加速 | ✅ 正确设计 |\n| 生效但有审计日志/风控 | 有兜底和可追溯 | ✅ 可接受，但要确认权限校验在服务端 |\n\n```bash\n# 更强的攻击：改余额\nredis-cli HSET user:1001 balance 999999\n```\n\n**测试结论怎么写**：如果改缓存能改出钱/权限，直接按\"高危安全缺陷\"提，附上复现命令。这不是\"缓存没同步\"的小问题，是**权限模型设计错误**。\n\n### 1.4 排行榜（ZSet）\n\n```\nZADD    rank:2026-10 100 user:1001        # 加分数\nZINCRBY rank:2026-10 10  user:1001        # 累加\nZREVRANGE rank:2026-10 0 9 WITHSCORES     # Top 10（从高到低）\nZRANK   rank:2026-10 user:1001            # 我的名次（从 0 开始）\n```\n\n**测试点**：\n\n- 同分时的排序规则（`ZREVRANGE` 同分按成员字典序，业务常要求\"先达到的先排前面\" → 需要把时间戳编进 score，如 `score = 分数 * 10^10 + (最大时间戳 - 达成时间)`）。**这个坑真实存在，且很难发现。**\n- 名次是从 0 还是 1 开始（接口返回给用户的\"第 N 名\"要 +1）。\n- 榜单过期与重算。\n- 并发加分是否丢失（`ZINCRBY` 是原子的，不会；但\"先 `ZSCORE` 读出来再 `ZADD` 写回去\"会丢）。\n\n### 1.5 队列 / 最新消息（List）\n\n```\nLPUSH  msg:uid:1001  \"新消息1\"        # 头插\nLRANGE msg:uid:1001 0 9               # 取最新 10 条\nLTRIM  msg:uid:1001 0 99              # 只保留 100 条（防止无限增长）\nRPOP   queue:task                     # 消费（FIFO）\n```\n\n**测试点**：`LTRIM` 漏写 → key 无限增长 → 内存爆（这是\"内存泄漏\"的一种形态）。定期跑 `MEMORY USAGE key` 看单个 key 的大小。\n\n### 1.6 选型速查表\n\n```\n要排序取 Top N     → ZSet\n要 O(1) 判断存在   → Set\n要只改部分字段     → Hash\n要先进先出         → List\n其余单值 + 过期    → String\n```\n\n---\n\n## 2. 缓存三大问题（Redis 层怎么观测）\n\n概念在系统设计篇讲过，这里只补**测开能动手的部分**：\n\n| 问题 | Redis 层的观测手段 | 造场景的命令 |\n| --- | --- | --- |\n| **穿透**（查不存在的数据） | 看 `INFO stats` 的 `keyspace_misses` 是否随请求量线性暴涨 | `DEL` 掉一个不存在商品的 key，然后打 1000 次 |\n| **击穿**（热点 key 过期瞬间） | 看某个 key 的 TTL，卡在快过期时并发打 | `EXPIRE hot:sku:1001 1` 然后等 1 秒并发 500 请求 |\n| **雪崩**（大量 key 同时过期） | `TTL` 抽样看是否集中 | 批量 `EXPIRE` 成同一个值，或直接 `FLUSHDB` |\n\n```bash\n# 命中率：hits / (hits + misses)，正常应该 > 90%\nredis-cli INFO stats | Select-String \"keyspace_hits|keyspace_misses\"\n\n# 实时观察（每秒一行，看 qps 和 key 数变化）\nredis-cli --stat\n\n# 看哪些 key 快过期（抽样，生产慎用 KEYS）\nredis-cli --scan --pattern \"hot:*\" | ForEach-Object { \"$_ $((redis-cli TTL $_))\" }\n```\n\n> `KEYS *` 会阻塞 Redis（O(n) 全库扫描），**测试环境也别在压测时用**，用 `SCAN` 或 `--scan` 代替。这条本身就是一个\"你懂 Redis\"的信号。\n\n### 2.1 持久化：RDB / AOF\n\n| | RDB | AOF |\n| --- | --- | --- |\n| 是什么 | 定时把内存**快照**存成文件 | 追加写**每条命令**日志 |\n| 数据安全 | 会丢最后一次快照之后的数据 | 丢失少（取决于 `appendfsync`） |\n| 恢复速度 | 快 | 慢（要重放命令） |\n| 文件大小 | 小 | 大 |\n\n**测试只关心两件事**：\n\n1. **重启后数据还在不在**：`DEBUG RELOAD` 或重启容器，看会话/验证码是否丢失。如果缓存丢了业务能兜底（回源 DB），说明设计是好的；如果直接报错，就是缺陷。\n2. **丢多少数据能接受**：RDB 每 5 分钟一次，意味着最多丢 5 分钟数据。**如果业务把\"不能丢\"的东西放在 Redis，这就是设计问题** —— 该落库的落库。\n\n---\n\n## 3. 测试场景应用（清单里的三条）\n\n### 3.1 用 redis-cli 查数、造数\n\n```bash\n# 连（有密码时）\nredis-cli -h 127.0.0.1 -p 6379 -a \"your-password\" --no-auth-warning\n\n# 常用：看 key 存不存在、类型、大小、剩余时间\nEXISTS user:1001\nTYPE   user:1001\nMEMORY USAGE user:1001\nTTL    sms:code:13800001111\n\n# 看所有 key（测试环境小库可以用，生产用 SCAN）\nSCAN 0 MATCH \"order:*\" COUNT 100\n\n# 造数：直接塞一条订单缓存\nSET  order:20261029001 '{\"order_no\":\"20261029001\",\"status\":\"CREATED\"}'  EX 3600\n\n# 改数：篡改状态\nSET  order:20261029001 '{\"order_no\":\"20261029001\",\"status\":\"PAID\"}'\n\n# 清数：删掉让缓存回源\nDEL  order:20261029001\n\n# 危险操作（只在测试环境）\nFLUSHDB          # 清当前库\nFLUSHALL         # 清所有库 —— 千万别在生产按这个\n```\n\n**安全提示**：`FLUSHALL` 前先 `DBSIZE` 看一眼，确认连的是测试环境（`INFO server` 里看 `tcp_port` 和 `run_id`）。我在真实项目里见过测试脚本连错环境把线上缓存清空的案例 —— 代价是当天全站缓存穿透。\n\n### 3.2 验证码过期逻辑（完整用例设计）\n\n```python\nimport time\nimport redis\n\nr = redis.Redis(host=\"127.0.0.1\", port=6379, db=0, decode_responses=True)\n\n\ndef test_sms_code_expired(api, base_url, phone=\"13800001111\"):\n    # 1. 走接口发验证码\n    api.post(f\"{base_url}/api/sms/code\", json={\"phone\": phone})\n    code = r.get(f\"sms:code:{phone}\")\n    assert code is not None, \"验证码没有写入 Redis\"\n\n    # 2. 断言 TTL 在合理范围（配置是 300s）\n    ttl = r.ttl(f\"sms:code:{phone}\")\n    assert 250 <= ttl <= 300, f\"TTL 异常: {ttl}\"\n\n    # 3. 强制让它过期（比等 5 分钟快）\n    r.expire(f\"sms:code:{phone}\", 1)\n    time.sleep(1.2)\n\n    # 4. 过期后再用，必须失败\n    resp = api.post(f\"{base_url}/api/login/sms\", json={\"phone\": phone, \"code\": code})\n    assert resp.json()[\"code\"] != 0, \"验证码过期后仍然可用\"\n\n\ndef test_sms_code_single_use(api, base_url, phone=\"13800001112\"):\n    api.post(f\"{base_url}/api/sms/code\", json={\"phone\": phone})\n    code = r.get(f\"sms:code:{phone}\")\n\n    first = api.post(f\"{base_url}/api/login/sms\", json={\"phone\": phone, \"code\": code})\n    assert first.json()[\"code\"] == 0\n    assert r.exists(f\"sms:code:{phone}\") == 0, \"验证码用过之后没有删除\"\n\n    second = api.post(f\"{base_url}/api/login/sms\", json={\"phone\": phone, \"code\": code})\n    assert second.json()[\"code\"] != 0, \"同一个验证码可以重复使用（可重放）\"\n```\n\n`r.expire(key, 1)` 这个技巧把\"等 5 分钟\"变成\"等 1 秒\"，是验证过期逻辑的标准手法。\n\n### 3.3 缓存与数据库一致性（清单里明确要求的用例设计）\n\n**只测一个方向是不够的，两个方向都要测：**\n\n| 方向 | 用例 | 期望 |\n| --- | --- | --- |\n| 改库后读 | 更新 DB → 立刻调查询接口 | 返回新值（缓存被更新或删除） |\n| 改库后回源 | 更新 DB → 手动 `DEL` 缓存 → 调查询接口 | 返回新值（说明回源正确） |\n| 并发读写 | 一边高频改、一边高频读 | 短时间内可能旧值，但**最终一致**，且不能长期不一致 |\n| 缓存与库双写失败 | 更新 DB 成功、删缓存失败（可 mock） | 有兜底（延迟双删、消息补偿），不能永久脏 |\n\n```python\ndef test_cache_consistency(api, base_url, r, order_id):\n    \"\"\"改库之后，缓存有没有正确更新/失效。\"\"\"\n    # 1. 先读一次，让缓存建立\n    old = api.get(f\"{base_url}/api/orders/{order_id}\").json()[\"data\"]\n    assert r.exists(f\"order:{order_id}\") == 1, \"读接口没有写缓存（或 key 设计不同）\"\n\n    # 2. 改库（绕过接口直接改，确保一定会变）\n    update_db(\"UPDATE orders SET status='PAID' WHERE order_no=%s\", (order_id,))\n\n    # 3. 再读。有缓存没失效的话这里会返回旧值 → 就是缺陷\n    new = api.get(f\"{base_url}/api/orders/{order_id}\").json()[\"data\"]\n\n    # 4. 允许的延迟：业务通常接受秒级，不允许的是\"永久脏\"\n    for _ in range(5):\n        if new[\"status\"] == \"PAID\":\n            break\n        time.sleep(1)\n        new = api.get(f\"{base_url}/api/orders/{order_id}\").json()[\"data\"]\n\n    assert new[\"status\"] == \"PAID\", f\"改库 5 秒后缓存仍是旧值（脏读）: {new}\"\n```\n\n**这个用例的价值**：它是唯一能发现\"更新 DB 但忘了删缓存\"的用例。而这类 bug 线上表现是\"用户改了地址，刷新还是旧的\"，用户会反复投诉。\n\n---\n\n## 4. 自查 Q3 完整作答：接口创建了订单，但查询接口查不到\n\n这是本批最值钱的一道题，考的是**数据链路排查能力**。按层排查，每步都要给出\"怎么确认\"。\n\n### 排查顺序（从近到远，成本从低到高）\n\n| 步 | 查什么 | 怎么查 | 结论指向 |\n| --- | --- | --- | --- |\n| 1 | **创建接口真的成功了吗** | 看响应码 + 业务码 + 响应体里的 `order_no`/`id` | 如果业务码不是 0，问题在创建侧，不用往下查 |\n| 2 | **数据有没有落库** | 用响应体里的 `order_no` 直接 `SELECT` | 没有 → 事务回滚了 / 落到了别的库 / 异步没执行 |\n| 3 | **查的是主库还是从库** | 对比主从：`SELECT` 主库、`SELECT` 从库 | **主从延迟**是最常见原因（见下） |\n| 4 | **缓存里是什么** | `GET order:xxx` / `HGETALL` | 缓存是旧值或空 → 缓存没有失效，或回源逻辑错 |\n| 5 | **查询接口连的是不是同一个数据源** | 看两个服务的配置（订单服务库 vs 查询服务库） | 分库分表路由错 / 订单服务写了 A 库、查询服务读 B 库 |\n| 6 | **查询条件对不对** | 看 SQL：`user_id`、`status`、时间范围、分页 | 查到了但被过滤掉（比如默认只查\"未删除\"、只查自己的订单） |\n| 7 | **接口是否走了异步/最终一致** | 看有没有 MQ 同步链路 | 写完 CQRS/ES 的库还没同步 |\n\n### 最关键的一步：主从延迟\n\n```\n创建订单 → 写主库（成功返回） → 立刻查询 → 读从库（复制还没完成）→ 查不到\n```\n\n**这是\"创建了查不到\"的头号原因**，尤其在读写分离的架构里。\n\n**怎么确认**：\n\n```sql\nSHOW SLAVE STATUS\\G        -- 看 Seconds_Behind_Master，>0 就是有延迟\nSHOW MASTER STATUS;        -- 主库位点\n```\n\n```bash\n# 或者在业务上验证：创建后立刻查，延迟 100ms 再查\nfor i in 1 2 3 4 5; do\n  curl -s \"$BASE/api/orders/$ORDER_NO\" | head -c 100; echo\n  sleep 0.1\ndone\n```\n\n**如果 0.1 秒后就查到了 → 就是主从延迟**，属于\"最终一致\"，要跟产品确认延迟是否可接受（通常几百毫秒可以，秒级以上要提）。\n\n**如果永远查不到 → 不是延迟，是写错地方了**，继续查第 5、6 步。\n\n### 完整话术（可以直接照着说）\n\n> 我会按\"创建侧 → 存储侧 → 读取侧\"三层排查。\n> **第一**，先确认创建接口真的成功了：不只看 HTTP 200，要看业务码和响应体里的订单号，拿这个订单号后面所有步骤都用得上。\n> **第二**，拿订单号直接查库（`SELECT ... WHERE order_no=?`）。查不到说明没落库 —— 可能是事务回滚、写到了别的库（分库分表路由）、或者写操作是异步的还没执行。\n> **第三**，如果库里有但接口查不到，先怀疑**主从延迟**：读写分离下写主库、读从库，复制需要时间。用 `SHOW SLAVE STATUS` 看 `Seconds_Behind_Master`，或者间隔 100ms 连续查几次，如果延迟一小会儿就能查到，就是最终一致而非 bug。\n> **第四**，再查缓存：`GET order:xxx` 看是空值还是旧值。空值可能是缓存没建立或读接口回源失败；旧值说明改库后没删缓存。\n> **第五**，最后查数据源和查询条件：两个服务是不是连的同一个库、查询 SQL 有没有被 `user_id`/`status`/逻辑删除条件过滤掉。\n> 这个顺序的考虑是**从成本低的开始**：查库最快、最有信息量，缓存和配置排查成本高，放后面。\n\n---\n\n## 5. 动手清单\n\n- [ ] 用 `redis-cli TTL` 查一遍你们系统的会话/验证码 key，确认过期时间符合设计。\n- [ ] 用 `EXPIRE key 1` 造一次过期，验证过期后的接口行为。\n- [ ] `HSET` 篡改一次会员等级/余额，看服务端是信任缓存还是信任 DB。\n- [ ] 写一条\"改库后立刻读\"的一致性用例，看能不能抓到脏读。\n- [ ] `redis-cli INFO stats` 看一次命中率，低于 90% 就去看是哪些 key 在穿透。\n","chars":4844,"codes":16,"tables":9},{"id":"middleware","title":"中间件篇","desc":"MQ 四要点（到达/重复/乱序/积压）+ Nginx 502/504","file":"测试开发-中间件篇.md","content":"# 测试开发-中间件篇（消息队列 + Nginx）\n\n> 对应清单：消息队列与中间件【了解即可】全部（MQ 定位差异、测试要点、Nginx 反向代理与 502/504）\n> 对应自查：Q7（下单后异步发券，验证\"发了\"且\"没重复发\"）、Q8（线上偶发 502 排查思路）\n> 立场：这一类东西**测试不需要会部署，但必须会\"观测\"**。你看不到消息、看不到 upstream，就没法验证异步链路。\n\n---\n\n## 0. 先定位：中间件在测试工作里的三个样子\n\n| 组件 | 它挡在哪 | 测试要能做的事 |\n| --- | --- | --- |\n| 消息队列 | 两个服务之间 | 确认消息发出去了、被消费了、只消费一次、没有积压 |\n| Nginx | 客户端和服务之间 | 确认请求落在哪个环境/哪台机器，502/504 时判断是谁的问题 |\n\n自查分级：\n\n| 内容 | 档位 | 说明 |\n| --- | --- | --- |\n| MQ 解决什么问题、三产品差异 | 能讲清 | 面试 + 评审 |\n| 消息到达/重复/乱序/积压的验证方法 | 熟练 | 本篇核心，也最实用 |\n| Nginx 配置片段看懂 | 能看懂 | 灰度/多环境必用 |\n| 502 / 504 区分与排查 | 熟练 | 线上值班必用 |\n\n---\n\n# 第一部分：消息队列\n\n## 1. 解决什么问题（每个都配一个测试场景）\n\n| 作用 | 含义 | 测试场景 |\n| --- | --- | --- |\n| **异步** | 主流程不等非核心动作 | 下单成功后异步发券、发短信，接口响应从 800ms 降到 120ms |\n| **解耦** | 生产者不用知道消费者是谁 | 订单服务只管发\"订单已支付\"事件，积分/库存/通知各自订阅 |\n| **削峰** | 把瞬时流量缓冲成平稳消费 | 秒杀 5 万请求，消费端按 200/s 慢慢处理 |\n\n**测试必须理解的后果**：异步意味着**接口返回成功 ≠ 业务已完成**。所以\"下单成功\"和\"券到账\"是两个断言，中间需要一个等待/轮询机制。这就是 Q7 的全部难点。\n\n## 2. 三款产品定位差异（能说清这张表就够）\n\n| | Kafka | RabbitMQ | RocketMQ |\n| --- | --- | --- | --- |\n| 定位 | 高吞吐日志/流式管道 | 灵活路由的业务消息 | 业务消息 + 事务/延迟消息（阿里系） |\n| 吞吐 | 十万级/秒 | 万级/秒 | 十万级/秒 |\n| 顺序 | **分区内**有序 | 队列内有序 | 队列内有序 |\n| 延迟消息 | 不支持（要自己做） | 支持（TTL + 死信） | **原生支持**（定时消息） |\n| 事务消息 | 支持 | 不支持 | **支持**（半消息 + 回查） |\n| 典型用途 | 埋点、日志、CDC、大数据 | 业务解耦、任务分发 | 电商交易链路、延迟关单 |\n| 测试最常踩的 | 消费组多分区导致乱序、lag 堆积 | 队列堆积、死信队列没人看 | 延迟消息不生效、事务消息回查 |\n\n**一句话记法**：吞吐和日志找 Kafka，路由灵活找 RabbitMQ，国内电商交易链路找 RocketMQ。\n\n## 3. 测试四要点：怎么验证和观测（这是本篇最实用的部分）\n\n### 3.1 消息有没有到达\n\n**这是异步链路测试的第一问。三种验证手段，从强到弱：**\n\n| 手段 | 做法 | 优点 | 缺点 |\n| --- | --- | --- | --- |\n| **查业务结果表**（最强） | 等一会儿查券表/积分表有没有记录 | 直接证明\"业务生效\" | 只能证明最终结果，定位不到哪一环断 |\n| **查消费位点 / lag** | 看消费组有没有消费到最新 offset | 能证明\"消费端拿到了\" | 消费了但业务失败也算消费了 |\n| **查消息轨迹 / 日志** | RocketMQ 控制台的消息轨迹、Kafka 的消费日志 | 能定位到具体环节 | 需要环境支持 |\n\n**推荐组合**：先查业务表（结果导向），失败时再看位点（定位导向）。\n\n```bash\n# Kafka：消费组消费到哪了，还有多少没消费（LAG 是关键）\nkafka-consumer-groups.sh --bootstrap-server broker:9092 --describe --group coupon-consumer\n# 输出关键列：CURRENT-OFFSET / LOG-END-OFFSET / LAG\n# LAG = 0 表示追平了\n\n# RocketMQ：消费进度\nmqadmin consumerProgress -n nameserver:9876 -g coupon-consumer\n\n# RabbitMQ：管理台 Queues 页面看 Ready（待消费）/ Unacked（已投递未确认）\nrabbitmqctl list_queues name messages messages_ready messages_unacknowledged\n```\n\n### 3.2 重复消费（MQ 语义决定它必然发生）\n\n**先说结论：至少一次（at-least-once）是绝大多数 MQ 的默认语义，重复消费是设计预期，不是 bug。** 所以测试的重点不是\"能不能不重复\"，而是\"**消费端幂等做没做对**\"。\n\n重复的三种来源：\n\n| 来源 | 场景 |\n| --- | --- |\n| 生产端重试 | 生产者发送超时重发（网络抖动，其实第一次已成功） |\n| 消费端失败重投 | 消费者处理到一半挂了，offset 没提交 → 消息重投 |\n| Rebalance | 消费组扩缩容，分区重新分配，部分消息重复 |\n\n**测法（必须主动触发，别等它自然发生）：**\n\n```bash\n# 手段 1：重置消费位点，让消息重新投递\nkafka-consumer-groups.sh --bootstrap-server broker:9092 \\\n  --group coupon-consumer --topic order.paid \\\n  --reset-offsets --to-earliest --execute\n\n# 手段 2：让消费者处理失败（改配置让它抛异常 / 临时 kill 消费进程）\n# 手段 3：直接往 topic 里重发一条相同 payload（模拟生产端重试）\n```\n\n**断言**：券表里该用户该订单只有 1 张券，且重复消费后数量不变、用户不报错。\n\n```python\ndef test_coupon_consume_idempotent(db, consumer):\n    \"\"\"重投同一条消息 3 次，券只能有 1 张。\"\"\"\n    msg = {\"order_no\": \"O-20261029-001\", \"user_id\": 1001, \"template_id\": 88}\n    for _ in range(3):\n        consumer.send_and_wait(\"order.paid\", msg)      # 封装好的发送+等待\n    db.wait_until(lambda: db.count_coupon(\"O-20261029-001\") >= 1, timeout=30)\n    time.sleep(2)                                       # 再等一会儿，看会不会变 2\n    assert db.count_coupon(\"O-20261029-001\") == 1, \"重复消费导致多发券\"\n```\n\n**幂等的实现方式要能说出来**（开发怎么做的，你才能知道该断言什么）：\n\n| 方式 | 验证点 |\n| --- | --- |\n| 唯一索引（`order_no + template_id`） | 重复插入报 `Duplicate entry`，业务要捕获成\"已处理\" |\n| 去重表 / Redis 标记（`SETNX msg_id`） | 第二次直接跳过 |\n| 状态机（只允许 PENDING→SENT） | 已 SENT 的消息再来不处理 |\n\n### 3.3 乱序\n\n**关键事实**：Kafka/RocketMQ 只保证**分区/队列内**有序，跨分区不保证。生产者按 key 分区，同一个 key 才有序。\n\n**什么时候乱序是真 bug**：业务强依赖顺序，比如\"创建订单\"和\"取消订单\"两条消息，取消先到 → 消费失败或状态错乱。\n\n**测法**：\n\n```python\ndef test_message_order(consumer):\n    \"\"\"同一订单连发 创建→支付→完成，检查消费顺序。\"\"\"\n    for action in [\"CREATED\", \"PAID\", \"FINISHED\"]:\n        consumer.send(\"order.event\", {\"order_no\": \"O-1\", \"action\": action})\n    received = consumer.wait_n(3, timeout=30)\n    assert [m[\"action\"] for m in received] == [\"CREATED\", \"PAID\", \"FINISHED\"]\n```\n\n**发现乱序后怎么判断严重性**：\n\n- 业务有版本号/时间戳做兜底 → 可接受（乱序到达但按版本处理，最终一致）。\n- 业务直接按到达顺序覆盖状态 → **真 bug**，会丢状态（FINISHED 后来了 PAID，把状态改回 PAID）。\n\n**测试建议**：让开发用 `order_no` 作为分区 key（同订单进同分区，保序），否则跨分区必然乱序。\n\n### 3.4 积压\n\n**怎么观测**（见 3.1 的命令）：LAG 持续上涨、`Ready` 队列数增长就是积压。\n\n**积压的三种成因，测法不同**：\n\n| 成因 | 现象 | 测法 |\n| --- | --- | --- |\n| 生产快于消费 | LAG 线性上涨 | 压测下单接口，观察 LAG 和消费耗时 |\n| 消费端卡死 | LAG 突然不降，消费者 CPU 低 | 看消费者线程栈（`jstack`）/ 日志，常见是下游 DB 慢或死锁 |\n| 单条消息一直失败 | 同一条反复重试，阻塞后续 | 看死信队列 / 重试次数 |\n\n**积压的业务影响**（这才是测试要验证的）：券延迟发放多久算不可接受？积压 10 万条时，用户下单后多久能收到券？\n\n```python\ndef test_coupon_delay_under_backlog(consumer, api):\n    \"\"\"积压场景下，券的到账延迟。\"\"\"\n    consumer.pause(\"coupon-consumer\")          # 暂停消费，制造积压\n    for i in range(1000):\n        api.post(f\"{BASE}/api/orders\", json={\"sku_id\": 1, \"num\": 1})\n    consumer.resume(\"coupon-consumer\")\n    start = time.time()\n    # 轮询第一笔订单的券\n    ...\n    delay = time.time() - start\n    assert delay < 60, f\"积压后发券延迟 {delay:.0f}s，超出业务可接受范围\"\n```\n\n---\n\n# 第二部分：Nginx\n\n## 4. 反向代理与负载均衡\n\n```\n用户 → [Nginx 反向代理/负载均衡] → ┬─ 后端实例 A\n                                    ├─ 后端实例 B\n                                    └─ 后端实例 C\n```\n\n| 概念 | 一句话 |\n| --- | --- |\n| 正向代理 | 替**客户端**发请求（翻墙、抓包代理） |\n| 反向代理 | 替**服务端**接请求（用户不知道后面有几台机器） |\n| 负载均衡 | 反向代理把请求分给多个后端（轮询、权重、ip_hash） |\n\n## 5. 能读懂的配置片段\n\n```nginx\nupstream order_service {\n    server 10.0.0.11:8080 weight=1;\n    server 10.0.0.12:8080 weight=1;\n    server 10.0.0.13:8080 weight=1 backup;   # 备用，前面全挂才用\n    keepalive 32;                              # 与后端保持长连接（重要！）\n}\n\nserver {\n    listen 80;\n    server_name api.test.example.com;\n\n    # 静态资源\n    location /static/ {\n        alias /data/static/;\n        expires 7d;\n    }\n\n    # 接口：转发到后端\n    location /api/ {\n        proxy_pass http://order_service/;      # 注意末尾的斜杠！\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n\n        proxy_connect_timeout 3s;\n        proxy_send_timeout   30s;\n        proxy_read_timeout   30s;\n        client_max_body_size 10m;\n    }\n}\n```\n\n### 5.1 五个必须知道的配置坑（每个都是真实事故）\n\n| 配置 | 坑 | 现象 |\n| --- | --- | --- |\n| `proxy_pass http://backend/` vs `http://backend` | **末尾有无斜杠，路径拼接完全不同** | `/api/user` 转发成 `/user` 还是 `/api/user`，404 或 502 |\n| `proxy_set_header Host $host` | 不传 Host，后端拿到的是 upstream 名字 | 后端按 Host 做路由/签名校验失败 |\n| `proxy_set_header X-Forwarded-For` | 不传的话后端只能拿到 Nginx 的 IP | 风控按 IP 限流失效，日志里全是 Nginx IP |\n| `proxy_read_timeout` 默认 60s | 后端慢接口超过 60s 被 Nginx 切断 | 504，且后端还在跑（数据半成品） |\n| `client_max_body_size` 默认 1m | 上传大文件 413 | 压测/上传用例必踩 |\n\n**`proxy_pass` 斜杠的规则**（面试常问，也是排查 404 的第一顺位）：\n\n```\nlocation /api/  +  proxy_pass http://backend/   → /api/user  →  /user      （替换掉 /api/）\nlocation /api/  +  proxy_pass http://backend    → /api/user  →  /api/user  （原样拼接）\n```\n\n## 6. 502 / 504：怎么判断是谁的问题（自查 Q8 底座）\n\n| 状态码 | 含义 | 责任方 | 典型原因 |\n| --- | --- | --- | --- |\n| **502** Bad Gateway | Nginx **连不上**或**连上了但收到无效响应** | 后端/链路 | 后端进程挂了、端口错、后端主动断开、响应头过大、超时被 Nginx 判为无效 |\n| **504** Gateway Timeout | Nginx **连上了，但等后端超时** | 后端慢 | SQL 慢、下游慢、死锁、GC、线程池满 |\n\n**一句话区分**：502 是\"**后端不对**\"，504 是\"**后端太慢**\"。\n\n**Nginx 侧第一手证据永远是 error.log：**\n\n```bash\n# 实时看 502/504 的原因\ntail -F /var/log/nginx/error.log | grep -E \"502|504|upstream\"\n\n# 统计某段时间的错误分布\nawk '{print $9, $10, $11}' /var/log/nginx/error.log | sort | uniq -c | sort -rn | head\n```\n\n常见 error.log 关键行与含义：\n\n| error.log 内容 | 含义 | 下一步 |\n| --- | --- | --- |\n| `connect() failed (111: Connection refused)` | 后端端口没监听 | 后端进程挂了 / 端口配错 |\n| `upstream prematurely closed connection` | 后端收到请求后主动断开 | 后端崩溃、OOM、或超时自己断了 |\n| `no live upstreams` | 所有后端都被标记为不可用 | 健康检查把全部实例摘了 |\n| `upstream timed out (110)` | 读超时 | 后端慢 → 查 SQL/依赖 |\n| `upstream sent too big header` | 后端响应头太大 | 加大 `proxy_buffer_size`（常见于大 Cookie/token） |\n\n---\n\n## 7. 自查清单逐条作答（Q7–Q8）\n\n### Q7. 下单接口返回成功，但优惠券是异步发放的（走消息队列），怎么验证「券确实发了」且「没有重复发」？\n\n**先说清这道题的难点**：接口 200 只代表\"订单创建成功、消息已投递\"，**不代表券已发出**。所以要用\"最终一致\"的验证思路：**轮询等待 + 幂等校验 + 故障注入**。\n\n#### 第一部分：验证\"券确实发了\"\n\n```python\ndef test_coupon_sent_after_order(api, db, base_url):\n    # 1. 下单\n    resp = api.post(f\"{base_url}/api/orders\", json={\"sku_id\": 1001, \"num\": 1, \"request_id\": rid()})\n    assert resp.json()[\"code\"] == 0\n    order_no = resp.json()[\"data\"][\"order_no\"]\n\n    # 2. 轮询等券（不能 sleep 死等，要有超时和可读的失败信息）\n    deadline = time.time() + 30\n    coupon = None\n    while time.time() < deadline:\n        coupon = db.query_one(\n            \"SELECT id, template_id, status FROM coupons WHERE order_no=%s\", (order_no,))\n        if coupon:\n            break\n        time.sleep(0.5)\n\n    assert coupon is not None, f\"30s 内没有发券，order_no={order_no}（消息未投递/未消费/消费失败）\"\n    assert coupon[\"status\"] == \"AVAILABLE\"\n```\n\n**轮询失败时，按这条链路继续定位**（取证顺序）：\n\n| 检查点 | 命令/方法 | 结论 |\n| --- | --- | --- |\n| 消息有没有发出去 | 查生产者日志 / RocketMQ 消息轨迹 | 没发 → 生产端问题（事务消息回滚？异常被吞？） |\n| 消费组有没有消费 | `kafka-consumer-groups --describe` 看 LAG | 有 LAG → 消费端没起来或卡住 |\n| 消费有没有报错 | 消费者日志 grep ERROR | 消费失败 → 消息进重试队列/死信 |\n| 死信队列 | 查 DLQ topic / `mqadmin` | 有 → 消费逻辑 bug |\n| 业务落库 | 查券表 | 位点追平但没数据 → 消费逻辑跑飞了 |\n\n#### 第二部分：验证\"没有重复发\"\n\n**主动制造重复**（不能只跑一次通过就认为没问题）：\n\n```python\ndef test_coupon_no_duplicate_on_redelivery(consumer, db):\n    \"\"\"消息重投 3 次，只能有 1 张券。\"\"\"\n    msg = {\"order_no\": \"O-20261029-002\", \"user_id\": 1001, \"template_id\": 88}\n    for _ in range(3):\n        consumer.publish(\"order.paid\", msg)          # 直接投递相同消息\n    time.sleep(5)\n    cnt = db.query_one(\"SELECT COUNT(*) AS c FROM coupons WHERE order_no=%s\",\n                       (\"O-20261029-002\",))[\"c\"]\n    assert cnt == 1, f\"重复消费发了 {cnt} 张券\"\n\n\ndef test_coupon_duplicate_on_retry(consumer, db):\n    \"\"\"让消费者第一次失败，MQ 自动重投，验证幂等。\"\"\"\n    consumer.set_fail_once(True)                     # 测试后门：第一次处理抛异常\n    consumer.publish(\"order.paid\", {\"order_no\": \"O-20261029-003\", \"user_id\": 1001})\n    time.sleep(10)\n    cnt = db.query_one(\"SELECT COUNT(*) AS c FROM coupons WHERE order_no=%s\",\n                       (\"O-20261029-003\",))[\"c\"]\n    assert cnt == 1, \"失败重投后重复发券\"\n```\n\n**还要验的边界**（这是区分\"测了\"和\"测透了\"的地方）：\n\n| 场景 | 期望 |\n| --- | --- |\n| 用户连续下 2 单（不同订单） | 发 2 张券（别把不同订单也幂等掉） |\n| 同一订单用户手动点\"重发券\" | 业务允许的话发，但不允许重复点击产生多张 |\n| 券模板库存只剩 1，同时两笔订单到账 | 只有 1 张发出去，另一笔走补偿/退款 |\n| 消费失败超过重试次数 | 进死信队列 + 告警，**不能静默丢弃** |\n| 消息重复 + 券已被使用 | 不能重新发一张（幂等要覆盖\"已使用\"状态） |\n\n#### 完整话术\n\n> 分两步。\n> **第一步验\"发了\"**：接口返回成功后，用**轮询**（不是固定 sleep）查券表，30 秒内出现且状态正确。轮询超时就顺着链路取证：生产者日志 → 消费位点 LAG → 消费者错误日志 → 死信队列 → 券表，能定位到断在哪一环。\n> **第二步验\"没重复\"**：因为 MQ 是至少一次投递，重复是必然的，所以要主动制造重复 —— 重投相同消息、让消费者第一次故意失败触发重试、并发下单，然后断言**券表只有一条记录**。同时还要验\"不同订单不能被误幂等\"，以及\"券已使用后重复消息不能重新发\"。\n> **另外必须验积压**：暂停消费造 1000 条积压，看恢复后发券延迟多久，这是用户真实感知。\n\n### Q8. 线上接口偶发 502，说说你的排查思路\n\n**关键判断：偶发（不是全挂）** —— 这个限定词决定了排查方向。全挂通常是服务没起来；偶发说明\"有时能找到能用的实例\"或\"某些请求形态才会触发\"。\n\n#### 排查顺序（先取证，再猜）\n\n| 步 | 做什么 | 看什么 |\n| --- | --- | --- |\n| 1 | 拿请求特征 | 哪个接口、哪个时间点、是否有规律（特定参数？大 body？高峰？发版时间附近？） |\n| 2 | **看 Nginx error.log** | 用时间点对齐，grep `502`，拿到具体的 upstream 报错原因 |\n| 3 | 对照后端日志同一时刻 | 有没有异常栈、OOM、重启记录 |\n| 4 | 看后端实例健康 | `kubectl get pods` / 进程列表，是否有实例在重启、被摘除 |\n| 5 | 看资源指标 | 内存是否接近上限（OOMKilled 退出码 137）、线程池是否满、连接数是否打满 |\n| 6 | 看是否发版期间 | 滚动发布会短暂出现新旧实例混跑，502 集中在那 1-2 分钟是正常的 |\n\n#### 偶发 502 的六个典型根因（按出现频率）\n\n| 根因 | 怎么确认 | 特征 |\n| --- | --- | --- |\n| **Nginx 复用了后端已关闭的连接** | error.log 出现 `upstream prematurely closed connection` / `broken pipe` | 配了 `keepalive` 但后端 `keepalive_timeout` 更短，Nginx 拿到一个刚被后端关掉的连接 |\n| 后端实例在重启/崩溃 | 实例启动时间、OOM 记录 | 502 集中在某个实例，或多个实例交替 |\n| 后端处理超时后自己断开 | 后端日志有超时异常 | 慢请求多的时段 502 增多 |\n| 响应头太大 | `upstream sent too big header` | 大 Cookie、大 token 的用户才复现 |\n| 后端线程池/连接池打满 | 后端监控的 Active 线程数 | 高峰时段 |\n| 发版/扩容期间健康检查未就绪 | 发版时间对齐 | 集中在发版后 1-2 分钟 |\n\n**最容易被忽略、也最常见的是第一条**：Nginx 配了 `keepalive 32`，但后端 Tomcat/Go 的 `keepalive_timeout` 只有 5s，Nginx 的空闲连接池里躺着一个后端已经关掉的连接，下一个请求复用它 → 502。**特征是\"低频偶发，重试就好\"**，跟请求内容无关。\n\n#### 排查话术（可直接照着说）\n\n> 我先确认是\"全挂\"还是\"偶发\"，偶发的话重点在两处。\n> **Nginx 侧**：看 error.log 里 502 前后的那条 upstream 报错，这是最直接的证据 —— `Connection refused` 说明后端没监听，`prematurely closed` 说明后端主动断开（常见于 keepalive 超时不匹配），`no live upstreams` 说明全部实例被摘了。同时看 access.log 里 502 的分布：是否集中在某个实例、某个时段、某个接口。\n> **后端侧**：对照同一时刻的日志和指标 —— 有没有异常栈、有没有 OOM（退出码 137）、实例是否在重启、线程池/连接数是否打满、是否在发版窗口内。\n> 如果两边都没有异常，就怀疑**长连接复用**：检查 Nginx 的 `keepalive` 和后端的 `keepalive_timeout` 是否匹配（后端应大于 Nginx）。这个问题的典型特征是\"低频偶发、重试就好、与请求内容无关\"。\n> 最后一步是**能复现**：如果能拿到 502 的请求样本，用同一台机器、同一个 upstream 直连后端压一轮，能把范围缩小到\"某个实例\"还是\"整条链路\"。\n\n---\n\n## 8. 动手清单\n\n- [ ] 找一次异步链路（发券/发短信/积分），看消费组 LAG 怎么查，记下命令。\n- [ ] 手动重投一条消息，验证消费幂等（券/积分只能有一条）。\n- [ ] 读一遍你们测试环境的 Nginx 配置，重点看 `proxy_pass` 有没有斜杠、`proxy_read_timeout` 是多少。\n- [ ] `grep 502` 一次 error.log，把每条报错对照 §6 的表格认一遍。\n","chars":6378,"codes":11,"tables":16},{"id":"linux","title":"Linux命令篇","desc":"查日志（grep/tail/awk/sed）、看状态、网络排查","file":"测试开发-Linux命令篇.md","content":"# 测试开发-Linux命令篇\n\n> 对应清单：Linux【必须掌握】全部\n> 对应自查：Q4（tail -f / grep -C 5 / ps aux | grep 分别在什么场景用）\n> 立场：清单里那句定位非常准 —— **Linux 命令在测试岗位只服务两件事：查日志、看状态**。这两件事做到位，90% 的\"环境问题\"不用找运维。\n\n---\n\n## 0. 先定位：命令不是背，是\"排障组合拳\"\n\n| 你要回答的问题 | 组合拳 |\n| --- | --- |\n| 这个订单在日志里发生了什么 | `grep` 定位 → `grep -C` 看上下文 → `tail -F` 实时跟 |\n| 服务是不是还活着 | `ps aux \\| grep` → `ss -tlnp` → `curl` 探活 |\n| 为什么越来越慢 | `top` → `ps` 排序 → `df` / `du` / `free` |\n| 请求到底打到哪台机器 | `curl -v` → `ss` → Nginx 日志 |\n| 日志太大翻了半天 | `awk` 按列取 → `sort \\| uniq -c` 统计 |\n\n自查分级：\n\n| 内容 | 档位 | 说明 |\n| --- | --- | --- |\n| `grep` / `tail -f` / `ps` | 熟练 | 每天都在用 |\n| `grep -C/-A/-B`、`awk` 取列 | 熟练 | 高效排障的关键 |\n| `ss` / `curl -v` | 熟练 | 网络问题第一手 |\n| `df/du/free/top` | 会用 | 资源问题 |\n| `sed` 替换 | 会用 | 批量处理 |\n| `chmod/chown` | 会用 | 权限问题偶发 |\n\n---\n\n## 1. 文件与目录：`cd ls cat tail -f grep find`\n\n### 1.1 最常用的六条\n\n```bash\ncd /opt/app/logs            # 进目录\ncd -                        # 回上一个目录（在两个目录间来回切，很实用）\nls -lh                      # 带大小、带权限、可读\ncat app.log | head -50      # 看开头\ntail -n 200 app.log         # 看最后 200 行\ntail -f app.log             # 实时跟（Ctrl+C 退出）\n```\n\n### 1.2 `tail -f` 的坑：日志轮转后要改用 `tail -F`\n\n| 命令 | 行为 | 什么时候用 |\n| --- | --- | --- |\n| `tail -f` | 跟着**文件描述符** | 文件不会被轮转时 |\n| `tail -F` | 跟着**文件名**，文件被重命名/重建后自动重新打开 | **日志按天切割 → 必须用大写 F** |\n\n**真实场景**：日志每天 0 点切割，你前一天晚上开着 `tail -f` 看，跨过 0 点后就再也不出内容了 —— 因为文件被 mv 走了，你还在跟旧 inode。**`tail -F` 不会断。**\n\n### 1.3 `grep`：从\"找行\"到\"看上下文\"\n\n```bash\ngrep \"order_no=O-20261029-001\" app.log          # 找行\ngrep -n \"ERROR\" app.log                          # 带行号\ngrep -i \"error\" app.log                          # 忽略大小写\ngrep -c \"ERROR\" app.log                          # 只统计条数\ngrep -v \"healthcheck\" app.log                    # 排除（过滤掉探活噪音）\ngrep -C 5 \"O-20261029-001\" app.log               # 前后各 5 行 ← 最常用\ngrep -A 10 \"ERROR\" app.log                       # 后 10 行（看堆栈）\ngrep -B 10 \"ERROR\" app.log                       # 前 10 行（看请求参数）\ngrep -E \"ERROR|WARN|Exception\" app.log           # 多关键词\ngrep -r \"skuservice\" /opt/app/config/            # 递归搜目录\n```\n\n**`-C 5` 为什么最常用**：日志一行通常只有一个时间戳和一句话，真正的信息（请求参数、堆栈、返回值）在上下文里。**只 grep 不加 `-C`，等于只看到\"错了\"，看不到\"为什么错\"。**\n\n```bash\n# 标准排障动作：一个订单号，要看到它前后的完整链路\ngrep -C 10 \"O-20261029-001\" app.log | grep -v healthcheck\n```\n\n### 1.4 `find`：按条件找文件\n\n```bash\nfind /opt/app/logs -name \"*.log\" -mtime -1              # 1 天内改过的 log\nfind . -name \"*.py\" -newermt \"2026-10-29 09:00\"          # 今天 9 点后改的代码\nfind /var/log -size +100M                                # 大于 100M 的文件（找吃磁盘的）\nfind . -type f -name \"*.log\" -exec ls -lh {} \\; | sort -k5 -rh | head   # 大日志排行\nfind /tmp -name \"*.tmp\" -mtime +7 -print                 # 先 -print 看一眼，别直接 -delete\n```\n\n**纪律**：`find ... -delete` 之前一定先跑 `-print`，确认匹配的是你要删的文件。我见过 `-name \"*.log\" -delete` 把正在写的日志删掉导致服务异常的例子。\n\n---\n\n## 2. 文本处理：`awk` 和 `sed`（按列取数 + 替换）\n\n### 2.1 `awk`：按列取数 + 简单统计\n\n日志是 tab/空格分隔时，`awk '{print $N}'` 就是最快的取列方式。\n\n```bash\n# 取第 9 列（Nginx access.log 里第 9 列是状态码）\nawk '{print $9}' access.log | sort | uniq -c | sort -rn | head\n# 输出：\n#   8231 200\n#    142 502\n#     37 504\n\n# 按状态码筛出 5xx，并看对应的 URL（第 7 列）\nawk '$9 ~ /^5/ {print $9, $7}' access.log | sort | uniq -c | sort -rn | head\n\n# 计算接口耗时平均值（假设第 10 列是耗时）\nawk '{sum += $10; n++} END {printf \"平均 %.3f ms, 共 %d 条\\n\", sum/n, n}' access.log\n\n# 指定分隔符（处理 CSV 或 tab 日志）\nawk -F'\\t' '{print $2, $5}' app.log\n\n# 统计每个用户的请求数（第 1 列是 user_id）\nawk '{print $1}' app.log | sort | uniq -c | sort -rn | head -20\n```\n\n**测试最常用的三个 `awk` 用法**，记住就够：\n\n1. `awk '{print $N}'` 取列\n2. `awk -F'分隔符' '{print $N}'` 指定分隔符\n3. `awk '$N ~ /正则/ {print ...}'` 按列过滤\n\n### 2.2 `sed`：替换、删除、截取\n\n```bash\nsed -n '100,200p' app.log                    # 打印 100-200 行\nsed -n '/O-20261029-001/,/O-20261029-002/p' app.log   # 打印两个标记之间的内容\nsed 's/127.0.0.1/10.0.0.5/g' config.conf     # 预览替换（不写回）\nsed -i 's/127.0.0.1/10.0.0.5/g' config.conf  # 原地替换（-i）\nsed -i.bak 's/old/new/g' file                # 原地替换并留备份（推荐）\nsed '/^#/d; /^$/d' config.conf               # 删掉注释行和空行\n```\n\n**纪律**：`sed -i` 前先不加 `-i` 跑一遍看输出，或者用 `-i.bak` 留备份。**在测试服务器上改配置文件，改错了服务起不来，比不改更麻烦。**\n\n### 2.3 组合拳：一个订单号的完整链路\n\n```bash\n# 1. 找到这个订单所有日志\ngrep \"O-20261029-001\" app.log > /tmp/order.log\n\n# 2. 看时间线（按时间排序后看首尾，能算出全链路耗时）\nhead -1 /tmp/order.log; tail -1 /tmp/order.log\n\n# 3. 只看 ERROR/WARN 级别\ngrep -E \"ERROR|WARN\" /tmp/order.log\n\n# 4. 统计每一步出现的次数（看有没有重复调用）\nawk '{print $5}' /tmp/order.log | sort | uniq -c\n```\n\n---\n\n## 3. 进程与资源：`ps top df du free`\n\n### 3.1 `ps`：进程还在不在\n\n```bash\nps aux | grep myservice           # 最常用（包含自己这条 grep，用下面两种避免）\nps -ef | grep \"[m]yservice\"       # 方括号技巧：排除 grep 自己\npgrep -af myservice               # 更干净的写法\nps -eo pid,ppid,pcpu,pmem,etime,cmd --sort=-pcpu | head -10   # CPU 占用 Top 10\nps -eo pid,rss,cmd --sort=-rss | head -10                     # 内存占用 Top 10（RSS 单位 KB）\n```\n\n**`ps aux | grep xxx` 一个必知的细节**：结果里会包含 `grep xxx` 这条命令本身。用 `[m]yservice` 或 `pgrep` 规避，否则你会误判\"服务起了两个进程\"。\n\n```bash\n# 看某个进程启动多久了（判断是不是刚重启过 → 502 的原因）\nps -eo pid,lstart,etime,cmd | grep \"[m]yservice\"\n```\n\n### 3.2 `top`：谁在吃 CPU\n\n```bash\ntop -c          # 显示完整命令\ntop -H -p 1234  # 看这个进程内的各个线程（定位是哪个线程在飙 CPU）\n```\n\n`top` 顶部要会看三行：\n\n| 指标 | 含义 | 异常判断 |\n| --- | --- | --- |\n| `load average: 0.5, 1.2, 2.0` | 1/5/15 分钟的平均负载 | **超过 CPU 核数**就是排队（`nproc` 看核数） |\n| `%Cpu(s): 20 us, 30 sy, 50 id, 0 wa` | 用户态/内核态/空闲/等 IO | `sy` 高 → 系统调用多（上下文切换/中断）；`wa` 高 → 磁盘慢 |\n| `KiB Mem / KiB Swap` | 内存和交换分区 | swap 被大量使用 → 内存不够，性能会崩 |\n\n### 3.3 `df` / `du`：磁盘\n\n```bash\ndf -h          # 各分区使用率（看还剩多少）\ndf -i          # inode 使用率 ← 关键：还有空间但写不进文件，就是 inode 满了\ndu -sh /opt/app/logs/*        # 每个子目录/文件占多大\ndu -sh * | sort -rh | head    # 当前目录下最大的 10 个\n```\n\n**两个经典故障**：\n\n| 现象 | 命令 | 结论 |\n| --- | --- | --- |\n| `No space left on device` 但 `df -h` 显示还有空间 | `df -i` | **inode 耗尽**（海量小文件，日志碎片） |\n| 服务跑着跑着写不了日志 | `du -sh` 找大文件 | 日志没切割，把磁盘吃满 |\n\n### 3.4 `free`：内存\n\n```bash\nfree -h\n#               total        used        free      shared  buff/cache   available\n# Mem:            15Gi       9.0Gi       1.0Gi       100Mi       5.0Gi       5.8Gi\n```\n\n**看 `available`，不要看 `free`**。Linux 会把空闲内存拿去做缓存（`buff/cache`），`free` 小是正常的；`available` 才是\"新程序还能用多少\"。\n\n**判断内存泄漏**：`available` 持续下降、`swap` 持续上涨、进程 `RSS` 单调上涨不回落。\n\n---\n\n## 4. 网络排查：`curl` / `ss` / `ping`\n\n### 4.1 `curl`：不只用来发请求\n\n```bash\ncurl -v https://api.test.example.com/api/ping        # 看 DNS、TCP 连接、TLS、请求响应全过程\ncurl -o /dev/null -s -w \"code=%{http_code} time=%{time_total}s\\n\" https://api.test.example.com/api/ping\ncurl -I https://api.test.example.com                 # 只看响应头\ncurl -X POST -H \"Content-Type: application/json\" -d '{\"a\":1}' https://api.test.example.com/api/order\ncurl --resolve api.test.example.com:443:10.0.0.5 https://api.test.example.com/api/ping   # 绕过 DNS 指定 IP（切环境神器）\ncurl -k https://self-signed.test/api                 # 忽略证书校验（仅测试环境）\ncurl --connect-timeout 3 --max-time 10 ...           # 连接超时 / 总超时\n```\n\n**`-w` 这个参数是测开必备**：一条命令直接拿到状态码和耗时，比看 `-v` 的一堆输出更实用，也容易做成脚本断言。\n\n```bash\n# 连续探活 10 次，看接口是否稳定（偶发 5xx 时用）\nfor i in $(seq 1 10); do\n  curl -o /dev/null -s -w \"%{http_code} %{time_total}\\n\" https://api.test.example.com/api/ping\ndone\n```\n\n### 4.2 `ss`（替代 netstat）：端口和连接状态\n\n```bash\nss -tlnp                  # 监听中的 TCP 端口 + 对应进程（-p 要 root）\nss -tanp                  # 所有 TCP 连接\nss -s                     # 连接状态汇总（总数、TIME_WAIT 数）\nss -tan state time-wait | wc -l        # TIME_WAIT 数量\nss -tan state close-wait | wc -l       # CLOSE_WAIT 数量\nss -tan dst :3306          # 到 MySQL 的连接\n```\n\n```bash\n# 端口被谁占了（服务起不来时第一个查的）\nss -tlnp | grep 8080\n# 或\nlsof -i :8080\n```\n\n**判断标准**（和网络篇呼应）：\n\n- `TIME_WAIT` 多 → 连接没复用（客户端）或服务端主动关（服务端）。\n- **`CLOSE_WAIT` 多 → 应用层没调 close，是代码 bug（连接泄漏）。**\n\n### 4.3 `ping`\n\n```bash\nping -c 4 api.test.example.com      # 只发 4 个包\nping -c 4 10.0.0.5\n```\n\n`ping` 通只能证明**网络层**通，**不代表服务可用**（端口可能没开、服务可能挂了）。真正的探活是 `curl` 或 `nc`。这是很常见的误判：运维说\"ping 得通啊\"，但服务根本没起。\n\n---\n\n## 5. 权限：`chmod` / `chown`\n\n```bash\nls -l app.sh\n# -rwxr-xr-x 1 qa qa 1200 Oct 29 10:00 app.sh\n#  ↑权限      ↑属主 ↑属组\n```\n\n`rwx` 三组，分别对应**属主（u）/ 属组（g）/ 其他人（o）**：\n\n| 数字 | 权限 | 含义 |\n| --- | --- | --- |\n| 7 | rwx | 读写执行 |\n| 6 | rw- | 读写 |\n| 5 | r-x | 读执行 |\n| 4 | r-- | 只读 |\n| 0 | --- | 无 |\n\n```bash\nchmod +x run_tests.sh          # 加执行权限（脚本跑不起来最常见的原因）\nchmod 755 run_tests.sh         # rwxr-xr-x：脚本的标准权限\nchmod 644 config.yaml          # rw-r--r--：配置文件的权限（不能有 x）\nchmod -R 755 /opt/app/bin      # 递归\nchown -R qa:qa /opt/app/logs   # 改属主和属组（容器里的挂载目录权限不对时必用）\n```\n\n**两个真实场景**：\n\n1. 脚本从 Windows 拷到 Linux，`chmod +x` 忘了加 → `Permission denied`。\n2. 容器挂载宿主机目录，容器内用户 UID 和宿主机不一致 → 写不进去 → `chown -R` 或 Dockerfile 里指定 UID。\n\n---\n\n## 6. 自查 Q4 完整作答\n\n### Q4. `tail -f`、`grep -C 5`、`ps aux | grep xxx` 分别在什么排障场景用？\n\n**`tail -f`：实时跟日志，看\"现在正在发生什么\"。**\n\n> 场景：测试时接口报错，我一边复现一边展示服务器上的日志滚动，看请求进来那一刻服务端打了什么。\n> 关键点：日志有轮转时必须用 `tail -F`（跟文件名而不是文件描述符），否则跨 0 点或文件被重建后就停止输出。\n> 配合：`tail -F app.log | grep -v healthcheck` 过滤掉探活噪音；`tail -F app.log | grep -E \"ERROR|Exception\"` 只看异常。\n\n**`grep -C 5`：定位到某一行后，看它前后的上下文。**\n\n> 场景：日志里 grep 到 `order_no=O-20261029-001` 的 error 行，但我需要知道它前面请求带的是什么参数、后面抛的什么堆栈。`-C 5` 前后各看 5 行就够。\n> 变体：看堆栈用 `-A`（后），看入参用 `-B`（前）。\n> 为什么重要：只 grep 不带上下文，你只知道\"报错了\"，不知道\"为什么报错\"，等于没查到。\n\n**`ps aux | grep xxx`：确认进程在不在、起了几个、什么时候起的。**\n\n> 场景：接口全挂，先确认服务进程还活着；或者 `ss` 发现端口不对，确认是不是有多个实例抢端口。\n> 技巧：用 `ps -ef | grep \"[m]yservice\"` 或 `pgrep -af myservice` 排除 grep 自己那条，否则会误判成两个进程。\n> 加分：`ps -eo pid,lstart,etime,cmd | grep \"[m]yservice\"` 看启动时间，能判断\"是不是刚重启过\"——这对偶发 502 的排查很关键（重启期间请求会失败）。\n\n**一句话串联**：\n\n> 三者的关系是\"先发现 → 再定位 → 最后确认状态\"：`tail -f` 发现异常实时出现，`grep -C 5` 把异常周围的上下文拉出来定位原因，`ps aux` 确认服务本身还活着还是已经挂了。**排障时我一般三个窗口同时开着。**\n\n---\n\n## 7. 动手清单\n\n- [ ] 用 `awk` 统计一次 access.log 的状态码分布，找出 5xx 占比。\n- [ ] 用一个订单号跑一次完整链路：`grep` → `-C 10` → `awk` 统计步骤。\n- [ ] `ss -tan state close-wait | wc -l`，看你们服务有没有连接泄漏。\n- [ ] `df -i` 看一眼 inode 使用率，很多环境这里是隐性炸弹。\n","chars":3730,"codes":19,"tables":6},{"id":"git","title":"Git篇","desc":"reset vs revert/reflog/blame/密钥泄露处理","file":"测试开发-Git篇.md","content":"# 测试开发-Git篇\n\n> 对应清单：Git【必须掌握】全部\n> 对应自查：Q5（reset 和 revert 的区别；误提交了含密码的代码怎么办）\n> 立场：Git 对测开不是\"会 pull/push 就行\"。**自动化脚本是团队共享资产，它的历史要能追溯、回滚要安全、密钥不能进库。**\n\n---\n\n## 0. 先定位：测开用 Git 的四个高频场景\n\n| 场景 | 用到的能力 |\n| --- | --- |\n| 想回退一次错误的提交 | `reset` / `revert` / `reflog` |\n| 定位\"这行代码谁什么时候改的\" | `blame` / `log -S` |\n| 多人协作提 MR | 分支、合并、冲突解决 |\n| 防止密钥/日志进库 | `.gitignore` + 历史清理 |\n\n自查分级：\n\n| 内容 | 档位 | 说明 |\n| --- | --- | --- |\n| 分支/提交/合并/冲突 | 熟练 | 每天 |\n| `reset` 三种模式 + `revert` | 熟练 | 回滚安全的关键 |\n| `reflog` | 会用 | 救命用 |\n| `log` / `diff` / `blame` | 熟练 | 追溯 |\n| 密钥泄露处理 | 知道完整流程 | 面试常问，实战救命 |\n\n---\n\n## 1. 分支、提交、合并、冲突\n\n### 1.1 最小工作流\n\n```bash\ngit switch -c feature/order-idempotent      # 建功能分支（新版用 switch，checkout 也能用）\ngit add tests/test_order.py\ngit commit -m \"test(order): 补充下单幂等并发用例\"\ngit push -u origin feature/order-idempotent # 首次推送并建立追踪\n# → 提 PR/MR → review → 合并\n```\n\n### 1.2 合并方式：merge vs rebase（测试代码库的影响）\n\n| | `merge` | `rebase` |\n| --- | --- | --- |\n| 历史 | 保留分叉，有 merge commit | 线性，干净 |\n| 冲突 | 一次性解决一次 | **每个提交都可能冲突，要逐个解决** |\n| 公共分支 | ✅ 用 merge | ❌ 不要对已推送的公共分支 rebase（会改写别人的历史） |\n| 个人分支 | 也行 | ✅ 推荐，提交历史更清楚 |\n\n**测开的实际建议**：功能分支合并前 `git rebase origin/main` 保持线性，然后在 MR 里合并；**永远不要 rebase 已经推给别人用的分支**。\n\n### 1.3 解决冲突\n\n```bash\ngit merge origin/main\n# CONFLICT (content): Merge conflict in tests/conftest.py\n\ngit status                      # 看哪些文件冲突\n# 打开文件，会看到：\n# <<<<<<< HEAD\n# BASE = \"http://test.example.com\"\n# =======\n# BASE = \"http://dev.example.com\"\n# >>>>>>> origin/main\n\n# 手工改成想要的结果后：\ngit add tests/conftest.py\ngit commit                      # 完成 merge\n# 如果是 rebase 冲突：\ngit rebase --continue\n```\n\n**冲突处理原则**：**冲突不是\"选一边\"，是\"想清楚两边为什么改\"。** 测试代码里最常见的冲突是\"环境地址\"和\"依赖版本\"，这两类处理方式完全不同：\n\n| 冲突点 | 处理 |\n| --- | --- |\n| 环境地址 | 大概率应该走配置（配置分离的收益就是消灭这类冲突） |\n| 依赖版本 | 取更新的 + 双方都要的，别直接舍弃一边 |\n| 断言期望值 | 必须两个人对一下业务规则，不能靠猜 |\n\n**放弃这次合并**：`git merge --abort` / `git rebase --abort`。这是排障的第一步，很多人不知道。\n\n---\n\n## 2. 回滚：`reset` 和 `revert`（自查 Q5 前半）\n\n### 2.1 一句话区别\n\n> **`reset` 是\"把分支指针挪回去\"，历史被改写；`revert` 是\"做一次反向提交\"，历史保留、追加。**\n\n### 2.2 三种 `reset` 模式\n\n```bash\ngit reset --soft HEAD~1     # 撤销提交，改动留在【暂存区】（想重新提交时用）\ngit reset --mixed HEAD~1    # 撤销提交和暂存，改动留在【工作区】（默认，最常用）\ngit reset --hard HEAD~1     # 撤销提交，改动【全部丢弃】（危险！）\n```\n\n| 模式 | 提交 | 暂存区 | 工作区 | 场景 |\n| --- | --- | --- | --- | --- |\n| `--soft` | 撤销 | 保留 | 保留 | 提交信息写错了，想重新 commit |\n| `--mixed`（默认） | 撤销 | 清空 | 保留 | 想拆成多个提交 / 换个方式提交 |\n| `--hard` | 撤销 | 清空 | **丢弃** | 彻底不要这些改动（**先确认没有未提交的工作**） |\n\n**`--hard` 的危险**：工作区的未提交改动会**永久丢失**（除非用 `reflog` 找回提交，但未提交的改动找不回）。执行前先 `git stash` 或 `git status` 确认。\n\n### 2.3 `revert`：安全回滚已推送的提交\n\n```bash\ngit revert <commit>                   # 生成一个反向提交，抵消那次改动\ngit revert -n <commit1> <commit2>     # 多个一起 revert，不自动提交\ngit revert -m 1 <merge-commit>        # 回滚一个 merge commit（-m 1 表示保留第一父分支）\n```\n\n**为什么公共分支必须用 revert**：\n\n```\n同事已经 pull 了你的提交并基于它开发\n你用 reset 把历史改写 + 强推\n→ 同事本地历史和远端分叉，下次 pull 全乱\n→ 更糟的是 CI/制品库里的构建记录对不上代码\n```\n\n### 2.4 决策表（记住这张表就不会用错）\n\n| 情况 | 用什么 |\n| --- | --- |\n| 只在本地，还没 push | `reset`（`--soft`/`--mixed` 优先，少用 `--hard`） |\n| 已 push，分支是共享的（main/develop） | **`revert`** |\n| 已 push，但那是你自己的临时分支 | 可以 `reset` + `git push --force-with-lease` |\n| 只想撤销某个文件 | `git checkout -- file` / `git restore file` |\n| 撤销后想再撤销（恢复回来） | `git reset --hard <reflog 里的 hash>` |\n\n**`--force` vs `--force-with-lease`**：后者会在远端有你没拉取的提交时拒绝推送，是安全版本。**养成只用 `--force-with-lease` 的习惯。**\n\n### 2.5 `reflog`：误操作的救命稻草\n\n```bash\ngit reflog                    # 所有 HEAD 移动记录（本地，保留 90 天）\ngit reset --hard HEAD@{3}     # 回到某个历史状态\n```\n\n`reflog` 记录的是**本地操作历史**，reset 掉的东西只要没被 gc 就能找回。**误 `reset --hard` 后第一件事就是 `git reflog`，别慌着重新写代码。**\n\n---\n\n## 3. 查看历史：`log`、`diff`、`blame`\n\n### 3.1 `log`：看提交历史\n\n```bash\ngit log --oneline -20                        # 简洁\ngit log --oneline --graph --all              # 分支图\ngit log -p tests/test_order.py               # 这个文件的每次改动内容\ngit log --author=\"张三\" --since=\"2026-10-01\"  # 按人和时间\ngit log --grep=\"幂等\"                         # 按提交信息搜\ngit log -S \"O-GEN-\" --oneline                # ★ 搜\"哪次提交引入/删除了这个字符串\"\n```\n\n**`git log -S`（pickaxe）是测开的神器**：想知道\"这个关掉的开关是哪次提交删的\"\"这个测试账号是什么时候写死的\" —— `-S` 一搜就出来。比翻几百个 commit 快得多。\n\n### 3.2 `diff`：看改了什么\n\n```bash\ngit diff                        # 工作区 vs 暂存区\ngit diff --staged               # 暂存区 vs 最后一次提交\ngit diff HEAD~1                 # 最新提交改了什么\ngit diff --stat                 # 只看改了哪些文件、多少行\ngit diff main...feature/x       # 分支间差异（PR 里看到的就是这个）\ngit diff -- tests/conftest.py   # 只看某个文件\n```\n\n### 3.3 `blame`：定位\"这行是谁什么时候改的\"\n\n```bash\ngit blame tests/conftest.py\ngit blame -L 20,40 tests/conftest.py      # 只看 20-40 行\ngit blame -w -C tests/conftest.py         # -w 忽略空白改动，-C 跨文件追踪复制\n```\n\n**注意**：`blame` 给的是\"最后一次改这行的人\"，不一定是\"引入问题的人\"。**正确用法是配合 `log -p -L` 追历史**：\n\n```bash\ngit log -L 20,40:tests/conftest.py        # 这 20-40 行的完整变更历史（谁改的、改了几次）\n```\n\n这条命令比 blame 更有用，因为它能看到\"这行被改过的每一次\"，而不是只看到最后一次。\n\n---\n\n## 4. 团队协作流程：feature → PR → review → 合并\n\n```\nmain（保护分支，不允许直接 push）\n  │\n  ├─ feature/xxx ──→ push ──→ 开 PR ──→ CI 跑起来 ──→ review ──→ merge\n  │                                                      │\n  └──────────────────────────────────────────────────────┘\n```\n\n### 4.1 一个健康的 PR 应该包含什么\n\n| 内容 | 为什么 |\n| --- | --- |\n| 改动范围小 | 300 行以内能认真 review，1000 行只能扫一眼\"看起来没问题\" |\n| 描述写清\"为什么改\" | 不是\"改了什么\"（diff 自己会说），而是动机和影响 |\n| 关联用例/缺陷号 | 可追溯 |\n| CI 通过 | 别让人 review 一个跑不过的 PR |\n| 自己先看一遍 diff | 最常见的低级错误都是自己 review 能发现的 |\n\n### 4.2 测试代码 review 要抓的五点\n\n1. 断言是不是真的能失败（有没有 `assert True`、`try/except pass`）。\n2. 有没有硬编码环境地址、账号。\n3. 用例能不能重复执行（幂等、清理是否完整）。\n4. 失败信息够不够（能不能一眼看出问题）。\n5. 有没有影响别人（改了公共 fixture 会不会拖慢全量）。\n\n### 4.3 常用救援命令\n\n```bash\ngit stash                     # 临时收起当前改动（切分支前）\ngit stash pop                 # 恢复\ngit cherry-pick <commit>      # 把某个提交摘到当前分支（修复要同步到 release 分支时）\ngit checkout HEAD -- file     # 撤销某个文件的修改\ngit clean -fd                 # 删除未跟踪的文件（危险，先 -n 预览）\n```\n\n---\n\n## 5. `.gitignore`：哪些东西绝对不能进仓库\n\n```gitignore\n# 密钥与配置（最重要的三类）\n.env\n*.local.yaml\nconfig/secrets.yaml\n*.pem\n*.key\ncredentials.json\n\n# 测试产物\nlogs/\nartifacts/\nreports/\nscreenshots/\n*.log\n\n# 缓存\n.pytest_cache/\n__pycache__/\n*.pyc\n.ruff_cache/\n.coverage\nhtmlcov/\n\n# IDE / 系统\n.idea/\n.vscode/\n.DS_Store\n\n# 依赖目录（根据团队约定，一般不提交）\nnode_modules/\n.venv/\nvenv/\n```\n\n**最容易漏的三项**：\n\n| 漏项 | 后果 |\n| --- | --- |\n| `artifacts/`（失败落盘的请求响应） | 里面可能包含**真实 token、手机号**，一旦提交就是数据泄露 |\n| `*.log` | 日志里有数据库密码、用户信息 |\n| `.env` / `*.local.yaml` | 环境密码 |\n\n**养成习惯**：`git add` 之后**先 `git status` 和 `git diff --staged` 看一眼再 commit**，尤其是用 `git add .` 的时候。\n\n---\n\n## 6. 自查 Q5 完整作答\n\n### Q5. `git reset` 和 `git revert` 的区别？误提交了含密码的代码怎么办？\n\n#### 第一部分：reset vs revert\n\n> **`reset` 是移动分支指针，改写历史**：`git reset --hard HEAD~1` 之后，那次提交就像没发生过，本地历史里查不到（还能靠 `reflog` 找回），但**如果已经 push，必须强推，会破坏别人的本地历史**。\n> **`revert` 是新增一个反向提交来抵消之前的改动**：历史保留，前面那次提交还在，只是在它后面多了一条\"撤销它\"的提交。\n>\n> **选择标准只有一条：这个分支有没有别人在用。**\n> - 本地没 push → 用 `reset`，干净。\n> - 已经 push 到共享分支（main/develop，或别人已经 pull 过）→ **必须用 `revert`**，因为 reset + 强推会让所有人的本地历史和远端分叉。\n> - 自己的临时分支 → `reset --hard` + `push --force-with-lease` 也可以。\n>\n> 补充：`reset` 有三种模式，`--soft` 留暂存区、`--mixed` 留工作区、`--hard` 全丢。日常最常用 `--mixed`（改提交方式），`--hard` 要确认没有未保存的改动再用。\n\n#### 第二部分：误提交密码 —— 这是流程题，不是命令题\n\n**关键认知：改历史不等于消除泄露。** 历史可能已经被别人 clone、被 CI 缓存、被制品库留存、被公开 fork。所以顺序必须是：\n\n```\n第一步：立刻吊销     第二步：改历史      第三步：强推 + 通知\n（止损）             （清理）            （收尾）\n```\n\n**第一步：先让这个密码失效（最重要，也最容易被跳过）**\n\n| 泄露的是什么 | 立刻做什么 |\n| --- | --- |\n| 数据库密码 | 改数据库密码，重启服务 |\n| 云厂商 AccessKey | 到控制台**禁用并轮换**，查有没有异常调用 |\n| 第三方 API Key | 吊销重新生成 |\n| token/证书 | 吊销证书、重置 token |\n\n**为什么必须先做这一步**：改历史要花时间，而爬虫扫 GitHub 是分钟级的。曾经有团队\"先整理历史\"，结果密钥在整理期间被用来挖矿。\n\n**第二步：从历史中彻底清除**\n\n`git revert` 只能\"再提交一次删除动作\"，**旧提交里的密码还在历史里**（`git log -p` 依然能看到）。所以要用历史重写工具：\n\n```bash\n# 方案 A：git filter-repo（官方推荐，比 filter-branch 快且不易出错）\npip install git-filter-repo\n\n# 删掉整个文件的历史\ngit filter-repo --path config/secrets.yaml --invert-paths\n\n# 或者替换文件里的敏感字符串（更精细）\necho \"db_password==>***REMOVED***\" > expressions.txt\ngit filter-repo --replace-text expressions.txt\n\n# 方案 B：BFG（Java 工具，速度快）\njava -jar bfg.jar --delete-files secrets.yaml\njava -jar bfg.jar --replace-text passwords.txt\ngit reflog expire --expire=now --all && git gc --prune=now --aggressive\n```\n\n**第三步：强推 + 通知所有人**\n\n```bash\ngit push --force-with-lease           # 所有分支都要推\ngit push --force-with-lease --tags\n```\n\n然后必须做两件事（不做等于没完成）：\n\n1. **通知所有协作者重新 clone**（或 `git fetch && git reset --hard origin/main`），因为历史被改写了，他们本地的旧历史会导致下次 push 冲突或把旧密码又推回去。\n2. **检查 CI/CD 的缓存、制品、日志**里有没有残留。**CI 日志里打印过密码的话，也是泄露面。**\n\n**如果推到过公开仓库**：直接假设已泄露，走第一步吊销，不要指望\"删掉就没事\"。GitHub 上的提交会被搜索引擎、代码扫描工具、fork 长期留存。\n\n#### 完整话术\n\n> `reset` 改写历史、只能用于本地；`revert` 追加反向提交、用于已推送的共享分支。\n> 误提交密码，我按三步走：**先吊销密码**（因为泄露是按分钟算的，改历史要时间）；**再改历史**（`git filter-repo` 或 BFG，因为 `revert` 只是删除动作，旧提交里的密码还在）；**最后强推并通知所有人重新 clone**，同时清理 CI 缓存和日志残留。\n> 根本预防是两点：`.gitignore` 提前排除 `.env`、`secrets.yaml`、`artifacts/`；用 `detect-private-key` 这类 pre-commit hook 在提交时拦截。\n\n---\n\n## 7. 动手清单\n\n- [ ] 在一个测试仓库里跑 `git log -S \"某个硬编码的地址\"`，看是哪次提交引入的。\n- [ ] 用 `git log -L` 看某个 fixture 的完整变更历史，比 blame 更有信息量。\n- [ ] 检查你们的 `.gitignore` 有没有 `artifacts/`、`*.log`、`.env`（失败落盘文件最容易漏）。\n- [ ] 演练一次\"误提交 → revert → 找回\"（用 reflog），形成肌肉记忆。\n","chars":4533,"codes":16,"tables":9},{"id":"docker","title":"Docker与K8s篇","desc":"镜像容器/挂载/compose/一次性干净库/kubectl 四板斧","file":"测试开发-Docker与K8s篇.md","content":"# 测试开发-Docker与K8s篇\n\n> 对应清单：Docker【必须掌握】+ Docker【了解即可】+ K8s【了解即可】全部\n> 对应自查：Q6（用 docker 起 MySQL、挂载配置、建库建表、宿主机连上）\n> 立场：Docker 对测开的真正价值不是\"会启容器\"，而是**随时能造一个干净、可复现、测完就扔的测试环境** —— 这是解决\"测试环境脏了没人洗\"的唯一实用手段。\n\n---\n\n## 0. 先定位：容器能力在测试工作里的三个落点\n\n| 落点 | 具体做法 | 解决什么问题 |\n| --- | --- | --- |\n| 造干净数据库 | 每次跑用例前起一个一次性 MySQL | 测试库被脏数据污染、用例互相干扰 |\n| 造完整依赖环境 | `docker-compose` 一键起\"MySQL + Redis + 后端\" | 本地复现环境、新人一条命令上手 |\n| 造被测服务 | 把自己的 mock 服务打成镜像 | 部署到任意环境、当第三方 mock |\n\n自查分级：\n\n| 内容 | 档位 | 说明 |\n| --- | --- | --- |\n| 镜像/容器、启停、看日志 | 熟练 | 每天 |\n| 端口映射、挂载、环境变量 | 熟练 | 配错一个就起不来 |\n| Dockerfile | 会写 | 打自己的测试服务 |\n| compose | 会用 | 一键起组合环境 |\n| 一次性容器隔离测试 | 熟练 | 本篇最值钱的一条 |\n| K8s 三件套 + kubectl 四板斧 | 能查能用 | 测试环境排障 |\n\n---\n\n# 第一部分：Docker\n\n## 1. 镜像与容器：一句话说清\n\n```\n镜像（Image） = 只读模板（类似\"安装光盘\"或\"类\"）\n容器（Container） = 镜像跑起来的实例（类似\"装好的系统\"或\"对象\"）\n一个镜像 → 可以跑 N 个容器（互不影响）\n容器里改的东西 → 默认不落回镜像（除非 commit 或挂载）\n```\n\n```bash\ndocker pull mysql:5.7                    # 拉镜像\ndocker images                            # 本地有哪些镜像\ndocker run -d --name mysql-test mysql:5.7 # 起容器（-d 后台）\ndocker ps                                # 跑着的容器\ndocker ps -a                             # 包括已停止的（排查\"容器怎么没了\"必看）\ndocker stop mysql-test                   # 停止\ndocker rm mysql-test                     # 删除容器\ndocker rmi mysql:5.7                     # 删除镜像\n```\n\n## 2. 三个必须用对的参数\n\n### 2.1 端口映射 `-p 宿主机:容器`\n\n```bash\ndocker run -d -p 13306:3306 mysql:5.7\n#                      ↑宿主机端口  ↑容器内端口\ndocker port mysql-test          # 查看映射关系\n```\n\n**坑**：宿主机端口冲突 → `Error starting userland proxy: Bind for 0.0.0.0:3306 failed: port is already allocated`。改宿主机端口就行（容器内端口不用改）。**这也是为什么测试环境要用非默认端口（3306→13306），避免和本机已装的 MySQL 抢。**\n\n### 2.2 挂载 `-v 宿主机路径:容器路径`\n\n```bash\n-v /data/mysql/conf:/etc/mysql/conf.d      # 挂配置目录（改配置不用重建镜像）\n-v /data/mysql/data:/var/lib/mysql          # 挂数据目录（容器删了数据还在）\n-v $(pwd)/init:/docker-entrypoint-initdb.d  # 挂初始化脚本（首次启动自动执行）\n```\n\n| 挂载目的 | 好处 | 坑 |\n| --- | --- | --- |\n| 配置目录 | 改配置不用重建容器 | 宿主机文件权限不对 → 容器内读不到 |\n| 数据目录 | 数据持久化 | **宿主机目录非空且不是 MySQL 格式 → 起不来**；Windows 挂载有文件锁/权限问题 |\n| 初始化脚本 | 自动建库建表造数 | **只在数据目录为空时执行一次**，第二次起就不跑了 |\n\n### 2.3 环境变量 `-e`\n\n```bash\n-e MYSQL_ROOT_PASSWORD=123456      # MySQL 必须有，否则拒绝启动\n-e MYSQL_DATABASE=qa_shop          # 首次启动自动建库\n-e MYSQL_USER=qa -e MYSQL_PASSWORD=qa123   # 自动建用户\n```\n\n**纪律**：密码不要写进 Dockerfile，用 `-e` 或 `--env-file`，并且 `--env-file` 的文件加进 `.gitignore`。\n\n## 3. 排查容器问题的四条命令\n\n```bash\ndocker logs -f --tail 100 mysql-test       # 看日志（-f 实时跟，--tail 只看最后 100 行）\ndocker exec -it mysql-test bash            # 进容器（没有 bash 用 sh）\ndocker inspect mysql-test                  # 看全部配置：IP、挂载、环境变量、退出码\ndocker stats                               # 实时资源占用（CPU/内存/网络）\n```\n\n**容器起不来时的排查顺序**（和 K8s 那套一模一样）：\n\n```\ndocker ps -a 看 STATUS（Exited (1)? Exited (137)?）\n  → docker logs 看最后几十行（最常见的错误都在这里）\n  → docker inspect 看 State.ExitCode 和 Mounts 是否正确\n  → docker exec 进去手动跑一遍启动命令\n```\n\n| 退出码 | 含义 | 典型原因 |\n| --- | --- | --- |\n| 0 | 正常退出 | 前台进程跑完就退了（没加 `-d` 或 CMD 写错） |\n| 1 | 应用报错 | 配置错、端口占用、依赖缺失 |\n| 137 | 128+9（SIGKILL） | **被 OOM 杀** 或 `docker stop` 超时强杀 → 调大内存限制 |\n| 143 | 128+15（SIGTERM） | 正常 `docker stop` |\n\n## 4. 写一个 Dockerfile：把自己的测试服务打进去\n\n```dockerfile\n# 一个最小可用的测试靶子服务镜像\nFROM python:3.10-slim\n\nWORKDIR /app\n\n# 先拷依赖再拷代码 → 利用 layer 缓存，改代码时不用重装依赖\nCOPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt \\\n    -i https://pypi.tuna.tsinghua.edu.cn/simple\n\nCOPY mock_server/ ./mock_server/\n\n# 不用 root 跑（生产要求，测试镜像也建议养成习惯）\nRUN useradd -m -u 1000 app\nUSER app\n\nEXPOSE 5057\nHEALTHCHECK --interval=10s --timeout=3s --retries=3 \\\n    CMD python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:5057/api/health')\" || exit 1\n\nCMD [\"python\", \"-m\", \"mock_server.app\"]\n```\n\n```bash\ndocker build -t qa-mock-server:0.1 .\ndocker run -d --name mock -p 5057:5057 qa-mock-server:0.1\ndocker logs -f mock\n```\n\n**四个值得记住的点**：\n\n1. **依赖单独 COPY + RUN**：代码改动不会让依赖层失效，构建从几分钟降到几秒。\n2. **`--no-cache-dir`**：减小镜像体积。\n3. **HEALTHCHECK**：容器\"跑着\"不等于\"服务可用\"，健康检查才有意义。\n4. **不用 root**：养成习惯，避免挂载目录权限问题。\n\n## 5. docker-compose：一键起组合环境\n\n```yaml\n# docker-compose.yml\nservices:\n  mysql:\n    image: mysql:5.7\n    container_name: qa-mysql\n    ports:\n      - \"13306:3306\"\n    environment:\n      MYSQL_ROOT_PASSWORD: \"123456\"\n      MYSQL_DATABASE: \"qa_shop\"\n    volumes:\n      - ./mysql/conf:/etc/mysql/conf.d\n      - ./mysql/init:/docker-entrypoint-initdb.d\n    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci\n    healthcheck:\n      test: [\"CMD\", \"mysqladmin\", \"ping\", \"-h\", \"127.0.0.1\", \"-p123456\"]\n      interval: 5s\n      retries: 10\n\n  redis:\n    image: redis:7-alpine\n    ports:\n      - \"16379:6379\"\n\n  mock-server:\n    build: .\n    ports:\n      - \"5057:5057\"\n    depends_on:\n      mysql:\n        condition: service_healthy     # 等 MySQL 真的能连了再起\n    environment:\n      DB_HOST: mysql\n      DB_PORT: \"3306\"\n```\n\n```bash\ndocker compose up -d          # 起全部（旧版是 docker-compose up -d）\ndocker compose ps             # 看状态\ndocker compose logs -f mysql  # 看某个服务日志\ndocker compose down -v        # 停并删除数据卷（彻底干净）\n```\n\n**`depends_on` + `healthcheck` 是关键**：只写 `depends_on` 只保证\"容器启动了\"，不保证\"MySQL 能连了\"，应用会连不上数据库。这是 compose 里最常见的坑。\n\n## 6. 测试里最值钱的用法：一次性干净数据库\n\n**问题**：测试库跑了一周全量回归，里面堆了几万个测试订单、错乱的库存、脏的配置项。某天开始用例随机失败，查一整天发现是数据被污染了。\n\n**解法**：每个测试会话（或每个 CI job）起一个全新的数据库容器，测完销毁。\n\n```python\n# conftest.py\nimport subprocess\nimport time\n\nimport pytest\nimport pymysql\n\nMYSQL_PORT = 13306\n\n\ndef wait_mysql(port: int, timeout: int = 60):\n    \"\"\"等 MySQL 真的可连接（不能只 sleep，启动时间不确定）。\"\"\"\n    deadline = time.time() + timeout\n    while time.time() < deadline:\n        try:\n            conn = pymysql.connect(host=\"127.0.0.1\", port=port, user=\"root\",\n                                   password=\"123456\", connect_timeout=2)\n            conn.close()\n            return True\n        except Exception:\n            time.sleep(1)\n    return False\n\n\n@pytest.fixture(scope=\"session\")\ndef clean_db():\n    name = \"qa-mysql-ephemeral\"\n    subprocess.run([\"docker\", \"rm\", \"-f\", name], capture_output=True)     # 清掉上次残留\n    subprocess.run([\n        \"docker\", \"run\", \"-d\", \"--rm\", \"--name\", name,\n        \"-p\", f\"{MYSQL_PORT}:3306\",\n        \"-e\", \"MYSQL_ROOT_PASSWORD=123456\",\n        \"-e\", \"MYSQL_DATABASE=qa_shop\",\n        \"-v\", f\"{INIT_SQL_DIR}:/docker-entrypoint-initdb.d\",              # 自动建表+基础数据\n        \"mysql:5.7\", \"--character-set-server=utf8mb4\",\n    ], check=True)\n\n    assert wait_mysql(MYSQL_PORT), \"MySQL 60s 内未就绪\"\n    yield f\"127.0.0.1:{MYSQL_PORT}\"\n\n    subprocess.run([\"docker\", \"rm\", \"-f\", name], capture_output=True)     # --rm 也会删，双保险\n```\n\n**这个模式的价值**：\n\n| 收益 | 说明 |\n| --- | --- |\n| 消除数据污染 | 每次从零开始，用例之间不会互相影响 |\n| 消除 flaky | \"昨天能过今天不能过\"的数据类问题基本消失 |\n| 可并行 | 每个 worker 一个容器（不同端口），互不干扰 |\n| 可复现 | 任何人任何机器，起出来的库完全一样 |\n\n**代价**：启动 20~40 秒。所以只适合\"每个会话/每个 CI job 一次\"，不要每条用例都起。\n\n---\n\n# 第二部分：K8s（了解即可，但要知道怎么查）\n\n## 7. 为什么需要容器编排\n\n单机 Docker 解决\"跑起来\"，但生产有 100 台机器、200 个容器时要解决：\n\n| 问题 | Docker 单机 | K8s |\n| --- | --- | --- |\n| 容器挂了谁重启 | 没人 | 自动重启 |\n| 扩容怎么办 | 手工起 | 改副本数 |\n| 服务怎么找到彼此 | 记 IP | Service 提供稳定域名 |\n| 发版怎么不停机 | 手工 | 滚动更新 |\n\n## 8. 三个核心对象（理解到这一层就够）\n\n| 对象 | 是什么 | 测试怎么看它 |\n| --- | --- | --- |\n| **Pod** | 最小调度单位，1~N 个容器共享网络和存储 | `kubectl get pods`，看状态和重启次数 |\n| **Deployment** | 管理 Pod 的副本数 + 滚动更新 + 回滚 | `kubectl get deploy`，看期望/就绪副本数 |\n| **Service** | 给一组 Pod 提供**固定访问入口** + 负载均衡 | `kubectl get svc`，看 ClusterIP / NodePort |\n\n```\nDeployment(order-service, 3 副本)\n   ├─ Pod A  ← 自动创建、自动重启\n   ├─ Pod B\n   └─ Pod C\n        ↑\nService(order-svc:8080)  ← 固定入口，把流量分给这三个 Pod\n```\n\n**关键认知**：**Pod 的 IP 会变，Service 的地址不变。** 所以配置里永远写 Service 名，不写 Pod IP。\n\n## 9. kubectl 四板斧\n\n```bash\n# 1. get：有什么、状态如何\nkubectl get pods -n test -o wide          # Pod 列表（-o wide 看 IP 和所在节点）\nkubectl get pods -n test -w               # 实时看变化（发版时盯这个）\nkubectl get deploy,svc -n test            # Deployment 和 Service\nkubectl get events -n test --sort-by=.lastTimestamp | tail -20   # 最近的事件（排障神器）\n\n# 2. describe：为什么是这个状态（最重要的一条）\nkubectl describe pod <pod> -n test\n# 重点看最后 Events 段落：镜像拉取失败？调度失败？探针失败？OOM？\n\n# 3. logs：应用自己说了什么\nkubectl logs <pod> -n test\nkubectl logs <pod> -n test --tail=200\nkubectl logs <pod> -n test -f                   # 实时跟\nkubectl logs <pod> -n test --previous           # ★ 上一个已死容器的日志（CrashLoopBackOff 必用）\n\n# 4. exec：进去手动验证\nkubectl exec -it <pod> -n test -- sh\nkubectl exec -it <pod> -n test -- curl -s localhost:8080/api/health\n```\n\n## 10. Pod 起不来时的排查（带着信息找开发）\n\n| Pod 状态 | 含义 | 先看什么 |\n| --- | --- | --- |\n| `Pending` | 调度不出去 | `describe` 的 Events：资源不足（Insufficient cpu/memory）、节点选择器不匹配、PVC 挂不上 |\n| `ImagePullBackOff` / `ErrImagePull` | 镜像拉不到 | 镜像名/tag 写错、私有仓库没配 `imagePullSecrets`、网络不通 |\n| `CrashLoopBackOff` | 启动后反复崩溃 | `logs --previous` 看上一轮日志；`describe` 看退出码和探针配置 |\n| `OOMKilled` | 内存超限被杀 | `describe` 里 `Last State: Terminated Reason: OOMKilled ExitCode: 137` → 调大 limits 或查内存泄漏 |\n| `Running` 但没就绪（0/1） | 探针没过 | `describe` 看 Readiness probe failed，`exec` 进去手动 `curl` 探针地址 |\n| `Terminating` 卡住 | 优雅退出没完成 | finalizer、`terminationGracePeriodSeconds` |\n\n**标准排查顺序**（这三步覆盖 90% 的问题）：\n\n```bash\nkubectl get pods -n test                    # 1. 是什么状态\nkubectl describe pod xxx -n test            # 2. 看 Events 说了什么\nkubectl logs xxx -n test --previous         # 3. 看应用自己报了什么\n```\n\n**测开的正确姿势**：**先自己看，带着 Events 里的错误信息去找开发**。说\"Pod 起不来\"和说\"镜像拉取失败，Events 里是 401 Unauthorized，imagePullSecrets 没配\" —— 后者能省掉半小时的来回。\n\n---\n\n## 11. 自查 Q6 完整作答：用 docker 起 MySQL、挂载配置、建库建表、宿主机连上\n\n**完整命令链（可以直接照抄改端口密码）：**\n\n```bash\n# 1. 准备目录（配置、初始化脚本、数据）\nmkdir -p ~/qa-mysql/{conf,init,data}\n\n# 2. 放一个自定义配置（可选，验证挂载生效）\ncat > ~/qa-mysql/conf/my.cnf <<'EOF'\n[mysqld]\ncharacter-set-server=utf8mb4\ncollation-server=utf8mb4_unicode_ci\nmax_connections=500\nslow_query_log=1\nlong_query_time=1\nEOF\n\n# 3. 放初始化脚本（首次启动自动执行：建库建表 + 基础数据）\ncat > ~/qa-mysql/init/01-init.sql <<'EOF'\nCREATE DATABASE IF NOT EXISTS qa_shop DEFAULT CHARSET utf8mb4;\nUSE qa_shop;\nCREATE TABLE IF NOT EXISTS orders (\n  id BIGINT PRIMARY KEY AUTO_INCREMENT,\n  order_no VARCHAR(32) NOT NULL,\n  user_id BIGINT NOT NULL,\n  status VARCHAR(16) NOT NULL,\n  amount DECIMAL(10,2) NOT NULL,\n  created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  UNIQUE KEY uk_order_no (order_no),\n  KEY idx_status_created (status, created_at)\n) ENGINE=InnoDB;\nINSERT INTO orders (order_no, user_id, status, amount)\nVALUES ('O-SEED-001', 1001, 'PENDING_PAY', 99.00);\nEOF\n\n# 4. 起容器（端口 13306，挂三类目录，设密码和初始库）\ndocker run -d --name qa-mysql \\\n  -p 13306:3306 \\\n  -e MYSQL_ROOT_PASSWORD=123456 \\\n  -e MYSQL_DATABASE=qa_shop \\\n  -v ~/qa-mysql/conf:/etc/mysql/conf.d \\\n  -v ~/qa-mysql/init:/docker-entrypoint-initdb.d \\\n  -v ~/qa-mysql/data:/var/lib/mysql \\\n  mysql:5.7\n\n# 5. 等就绪（不要只 sleep，看日志更可靠）\ndocker logs -f qa-mysql\n# 看到 \"ready for connections\" 两次（一次初始化、一次正常启动）就好了\n\n# 6. 容器内验证：配置有没有生效、库表有没有建好、种子数据在不在\ndocker exec -it qa-mysql mysql -uroot -p123456 -e \"\n  SHOW VARIABLES LIKE 'character_set_server';\n  SHOW VARIABLES LIKE 'max_connections';\n  SHOW DATABASES;\n  USE qa_shop; SHOW TABLES; SELECT * FROM orders;\"\n\n# 7. 从宿主机连（这才是\"从外面能连上\"的验证）\nmysql -h127.0.0.1 -P13306 -uroot -p123456 -e \"SELECT COUNT(*) FROM qa_shop.orders;\"\n# 没有 mysql 客户端就用 docker：见下面的说明\n# 用 Python 连：\n# python -c \"import pymysql;c=pymysql.connect(host='127.0.0.1',port=13306,user='root',password='123456');print(c)\"\n```\n\n**验证清单（做完这四项才算真的\"起好了\"）：**\n\n| 验证项 | 命令 | 期望 |\n| --- | --- | --- |\n| 容器在跑 | `docker ps` | STATUS 是 `Up` 且没有频繁 `Restarting` |\n| 端口映射对 | `docker port qa-mysql` | `3306/tcp -> 0.0.0.0:13306` |\n| 配置挂载生效 | `SHOW VARIABLES LIKE 'max_connections'` | 500（不是默认 151） |\n| 初始化脚本执行了 | `SHOW TABLES` / `SELECT * FROM orders` | 表和种子数据都在 |\n| 宿主机能连 | `mysql -h127.0.0.1 -P13306 ...` | 能查数据 |\n\n**四个必踩的坑，提前说清：**\n\n| 坑 | 现象 | 解法 |\n| --- | --- | --- |\n| 挂载 `data` 目录时宿主机目录非空 | 容器起不来或初始化被跳过 | 确保第一次挂载时目录为空；**初始化脚本只在 data 为空时执行** |\n| 端口冲突 | `port is already allocated` | 换宿主机端口（13306 → 13307） |\n| `-e MYSQL_ROOT_PASSWORD` 没设 | 容器直接退出 | MySQL 镜像强制要求设密码，或用 `MYSQL_ALLOW_EMPTY_PASSWORD=yes`（仅本地） |\n| Windows 挂载路径 | 路径要用绝对路径且 Docker Desktop 要授权共享盘 | 用 `//c/data/mysql` 或换成命名卷 `-v qa_mysql_data:/var/lib/mysql` |\n\n**如果宿主机没有 mysql 客户端**（很常见），两种替代：\n\n```bash\n# 方式 1：进容器里执行（验证的是容器内连接，不是宿主机）\ndocker exec -it qa-mysql mysql -uroot -p123456 -e \"SELECT 1\"\n\n# 方式 2：用 Python/Java 从宿主机连（这才等价于\"应用能连上\"）\npython -c \"\nimport pymysql\nconn = pymysql.connect(host='127.0.0.1', port=13306, user='root', password='123456', database='qa_shop')\nwith conn.cursor() as cur:\n    cur.execute('SELECT COUNT(*) FROM orders')\n    print('orders =', cur.fetchone()[0])\n\"\n```\n\n**完整话术**：\n\n> 我会用 `docker run` 起一个 mysql:5.7，映射宿主机 13306 到容器 3306，用 `-e` 设 root 密码和初始库，`-v` 挂三个目录：`conf` 挂配置、`init` 挂初始化 SQL、`data` 挂数据目录。\n> 建库建表我倾向放在 `init/*.sql` 里而不是手动执行 —— 因为 `/docker-entrypoint-initdb.d` 会在数据目录为空时自动跑，**保证每次起出来的库结构一致，这也是 CI 里能复现的前提**。\n> 验证分四步：`docker ps` 看状态、`docker port` 看映射、`docker exec ... mysql -e` 看配置和表是否生效、最后从**宿主机**用客户端或 Python 连一次 —— 因为容器内能连不代表宿主机能连，这才对应应用真实的访问路径。\n> 测完直接 `docker rm -f`（加 `--rm` 起的话 stop 就自动删），数据不残留，下次从零开始。\n\n---\n\n## 12. 动手清单\n\n- [ ] 用 §11 的命令起一个 MySQL，验证挂载的配置真的生效（改 `max_connections` 看值变没变）。\n- [ ] 用 `--rm` 起一个一次性 MySQL，跑一遍用例，然后 `docker stop` 确认自动销毁。\n- [ ] 写一个 Dockerfile 把自己的 mock 服务打进去，`HEALTHCHECK` 要能通过。\n- [ ] 在测试环境用 `kubectl describe pod` 看一次 Events，对照 §10 的表格认一遍状态。\n","chars":4405,"codes":17,"tables":10},{"id":"cicd","title":"CI-CD篇","desc":"流水线三段结构/GitHub Actions/失败定位","file":"测试开发-CI-CD篇.md","content":"# 测试开发-CI/CD篇\n\n> 对应清单：CI/CD【必须掌握（概念 + 一次实操）】全部\n> 对应自查：Q9（描述一条 GitHub Actions 流水线：触发、跑什么、产物在哪、失败怎么通知）\n> 立场：这一篇的目标只有一个 —— **让\"提交代码 → 自动跑测试 → 出报告\"这条链路真的跑起来一次**。跑通过一次，你对 CI 的理解就会超过 90% 只会点\"重新运行\"的人。\n\n---\n\n## 0. 先定位：CI 在测试工作里的意义\n\n没有 CI 的时候：\n\n```\n开发改完 → 群里喊\"帮忙回归一下\" → 你本地拉代码跑 → 报告发群里 → 漏了没人知道\n```\n\n有 CI 之后：\n\n```\n开发提 PR → 自动跑测试 → 结果挂在 PR 上 → 红了不许合 → 报告自动归档\n```\n\n**关键差别不是\"自动化\"，是\"门禁\"**：让\"测试没通过\"这件事**没法被忽略**。\n\n自查分级：\n\n| 内容 | 档位 | 说明 |\n| --- | --- | --- |\n| 流水线结构（触发/阶段/通知） | 熟练 | 概念题 |\n| GitHub Actions 写一条能跑的 | **会一次实操** | 本篇核心 |\n| 看日志定位失败 | 熟练 | 值班必用 |\n| Jenkins 的对应概念 | 看得懂 | 多数公司在用 |\n| 分层跑测试（冒烟/全量/夜间） | 会用 | 决定流水线快不快 |\n\n---\n\n## 1. 流水线的基本结构：三段\n\n```\n触发（Trigger）\n  ├─ push 到某分支\n  ├─ 提 PR / MR\n  ├─ 定时（每天凌晨全量）\n  └─ 手动（发版前）\n       ↓\n阶段（Stages）\n  ├─ 准备：拉代码、装依赖（缓存）\n  ├─ 构建：打包/编译（可选）\n  ├─ 测试：单元 → 接口 → UI（按耗时从短到长）\n  ├─ 报告：生成 HTML/Allure，上传 artifact\n  └─ 归档/发布：推制品、打 tag\n       ↓\n通知（Notify）\n  ├─ 失败通知（IM 群/邮件/@ 人）\n  └─ 结果沉淀（报告链接、覆盖率趋势）\n```\n\n### 1.1 测试在流水线里的分层（决定流水线快不快）\n\n| 层 | 什么时候跑 | 目标耗时 | 失败怎么办 |\n| --- | --- | --- | --- |\n| 单元测试 | 每次 push | < 2 分钟 | **阻塞合并** |\n| 接口冒烟（`-m smoke`） | 每次 push / PR | < 5 分钟 | **阻塞合并** |\n| 接口全量 | 合并到 main / 每晚 | < 30 分钟 | 阻塞发版 |\n| UI 自动化 | 每晚 / 发版前 | 1~2 小时 | 阻塞发版 |\n| 性能压测 | 每周 / 大版本前 | 按场景 | 出报告评审 |\n\n**核心原则**：**提交级只跑冒烟，全量放到夜间。** 一个 40 分钟的流水线，开发会想办法绕过它（比如把测试标记成 skip），那 CI 就名存实亡了。\n\n---\n\n## 2. GitHub Actions 实操：一条能跑的流水线\n\n### 2.1 文件放哪\n\n```\n你的仓库/\n├── .github/\n│   └── workflows/\n│       └── api-tests.yml      ← 就放这里\n├── tests/\n├── requirements.txt\n└── pytest.ini\n```\n\n### 2.2 完整配置（可直接用）\n\n```yaml\n# .github/workflows/api-tests.yml\nname: api-tests\n\n# ── 触发 ────────────────────────────────────────────\non:\n  push:\n    branches: [main, develop]\n  pull_request:\n    branches: [main]\n  schedule:\n    - cron: \"0 18 * * *\"        # UTC 18:00 = 北京时间次日 02:00，跑夜间全量\n  workflow_dispatch:             # 支持手动触发（带参数见下文）\n\n# 同一个分支的旧流水线自动取消，省资源也避免结果混乱\nconcurrency:\n  group: ${{ github.workflow }}-${{ github.ref }}\n  cancel-in-progress: true\n\n# ── 任务 ────────────────────────────────────────────\njobs:\n  api-test:\n    runs-on: ubuntu-latest\n    timeout-minutes: 30          # 兜底：防止卡死占用额度\n\n    # 用容器起依赖，流水线自带干净的 MySQL\n    services:\n      mysql:\n        image: mysql:5.7\n        env:\n          MYSQL_ROOT_PASSWORD: \"123456\"\n          MYSQL_DATABASE: \"qa_shop\"\n        ports:\n          - 3306:3306\n        options: >-\n          --health-cmd=\"mysqladmin ping -h 127.0.0.1 -p123456\"\n          --health-interval=5s\n          --health-timeout=3s\n          --health-retries=10\n\n    steps:\n      - name: 拉代码\n        uses: actions/checkout@v4\n\n      - name: 装 Python\n        uses: actions/setup-python@v5\n        with:\n          python-version: \"3.10\"\n          cache: pip                    # 缓存 pip 下载，第二次跑快很多\n\n      - name: 安装依赖\n        run: |\n          python -m pip install --upgrade pip\n          pip install -r requirements.txt\n\n      - name: 初始化数据库\n        run: |\n          sudo apt-get install -y mysql-client\n          mysql -h127.0.0.1 -P3306 -uroot -p123456 < db/init.sql\n\n      - name: 跑冒烟（提交级）\n        env:\n          AUTOTEST_ENV: test\n          AUTOTEST_BASE_URL: http://127.0.0.1:8080\n          AUTOTEST_PWD: ${{ secrets.AUTOTEST_PWD }}     # 密码从 Secrets 注入，绝不写死\n        run: pytest -m smoke -v --tb=short --durations=10 --html=report.html --self-contained-html\n\n      - name: 跑全量（仅 main 分支或夜间定时）\n        if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'\n        env:\n          AUTOTEST_ENV: test\n          AUTOTEST_PWD: ${{ secrets.AUTOTEST_PWD }}\n        run: pytest -v --tb=short --durations=10 --html=report-full.html --self-contained-html\n\n      - name: 上传报告（无论成败都要传）\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: test-report-${{ github.run_number }}\n          path: |\n            report.html\n            report-full.html\n            artifacts/\n            logs/\n          retention-days: 14\n```\n\n### 2.3 六个必须理解的关键字\n\n| 关键字 | 作用 | 常见错误 |\n| --- | --- | --- |\n| `on` | 触发条件 | `cron` 是 **UTC**，不是本地时间 |\n| `jobs` | 任务集合，默认**并行** | 需要顺序时用 `needs: other-job` |\n| `runs-on` | 跑在哪个 runner | GitHub 托管 runner 是干净容器，**没预装你的工具** |\n| `steps` | 顺序执行的步骤 | 任一步失败，后续默认跳过（除 `if: always()`） |\n| `if: always()` | 无论如何都执行 | **上传报告、发通知必须加**，否则失败时报告丢失 |\n| `secrets` | 加密变量 | 只能在 env/with 里用，**不能在 `if:` 里直接引用** |\n\n### 2.4 三个容易忽略的细节\n\n**① `--tb=short` 很重要**\n\nCI 日志里默认的完整堆栈会把报错埋在一堆无关键帧里。加 `--tb=short` 让日志直接到断言那一行，**这是\"会看 CI 日志\"和\"不会看\"的分界线**。\n\n再加上 `-ra`（简短汇总失败原因），pytest.ini 里配一次就全生效：\n\n```ini\n[pytest]\naddopts = -ra --tb=short --strict-markers\n```\n\n**② `cache: pip` 能省一半时间**\n\n没有缓存的流水线每次都要重新下载所有依赖，30 个包可能要 2 分钟。加 `cache: pip` 后第二次开始几秒钟。\n\n**③ 失败时报告必须上传**\n\n`if: always()` 少写一次，就会出现\"失败了，但报告没传，只能重跑一遍\"的浪费。\n\n### 2.5 手动触发带参数\n\n```yaml\non:\n  workflow_dispatch:\n    inputs:\n      env:\n        description: \"环境\"\n        required: true\n        default: \"test\"\n        type: choice\n        options: [test, dev, staging]\n```\n\n```yaml\n      - name: 用手动参数跑\n        env:\n          AUTOTEST_ENV: ${{ inputs.env }}\n        run: pytest -m smoke -v\n```\n\n这样\"发版前手动跑一次 staging\"就不用改代码了。\n\n---\n\n## 3. 看日志定位失败（自查要求\"失败时能定位到具体步骤和原因\"）\n\n### 3.1 定位流程\n\n```\n1. 看哪一步是红叉（job 里会标出失败的 step）\n2. 展开这一步的日志，从下往上读（错误通常在末尾）\n3. 关键词搜索：ERROR / FAILED / ModuleNotFound / Connection refused / AssertionError\n4. 如果是测试失败：看 pytest 摘要（FAILED 列表 + -ra 的简短原因）\n5. 如果日志不够用：去 artifact 里下载 HTML 报告和 artifacts/ 的失败现场 JSON\n```\n\n### 3.2 常见失败原因分类（对着查最快）\n\n| 日志现象 | 原因 | 处理 |\n| --- | --- | --- |\n| `ModuleNotFoundError: No module named 'xxx'` | 依赖没写进 requirements.txt | 补依赖；本地能跑是因为本地装过 |\n| `Connection refused` / `UnknownHostException` | 服务没起 / 地址写错 | 检查 `services` 配置、环境变量 |\n| `AUTOTEST_PWD` 为空 | Secrets 没配或名字拼错 | 仓库 Settings → Secrets 检查 |\n| `Permission denied` | 脚本没有执行权限 | `chmod +x`，或提交时丢失了权限位 |\n| `No space left on device` | 日志/产物太多 | 清理 artifact，加保留天数 |\n| 用例在本地过、CI 挂 | 环境差异（时区/编码/数据/并行） | 见下 |\n\n**\"本地过、CI 挂\"的四个高频原因**（测开一定会遇到）：\n\n| 原因 | 表现 | 解法 |\n| --- | --- | --- |\n| 依赖范围没锁 | 昨天过今天挂 | `requirements.txt` 锁 `==` |\n| 时区不同 | 时间断言失败（UTC vs +8） | 统一用 UTC 或显式设 `TZ=Asia/Shanghai` |\n| 用例依赖执行顺序 | 单独跑过、一起跑挂 | 用例必须独立，数据用 fixture 造 |\n| 依赖外部环境（内网服务） | `Connection refused` | CI 里用 mock server 替代 |\n| 并行冲突 | 随机失败 | 独立账号/独立数据，或串行跑该模块 |\n\n### 3.3 重跑的正确姿势\n\n```yaml\n# 只重跑失败的 job（GitHub UI 上点 Re-run failed jobs）\n# 或用 pytest 的 --lf 在本地复现\npytest --lf -v\n```\n\n**态度**：重跑一次是正常排查（确认是否 flaky）；**重跑三次就过了**，要登记 flaky 并去找原因，别把它当解决方案。\n\n---\n\n## 4. Jenkins 的对应概念（多数公司在用）\n\n```groovy\n// Jenkinsfile（Declarative Pipeline）\npipeline {\n    agent { label 'linux && docker' }\n    options {\n        timeout(time: 30, unit: 'MINUTES')\n        buildDiscarder(logRotator(numToKeepStr: '50'))\n    }\n    triggers {\n        cron('H 2 * * *')                // 每天 2 点（H = 随机分钟，避免所有任务同一时刻）\n        pollSCM('H/15 * * * *')          // 每 15 分钟检查代码变化\n    }\n    stages {\n        stage('准备') {\n            steps {\n                checkout scm\n                sh 'python -m venv .venv && . .venv/bin/activate && pip install -r requirements.txt'\n            }\n        }\n        stage('冒烟') {\n            steps { sh '
