\n---\n\n## 3. 超时\n\n### 解决什么问题\n\n避免一个慢调用把线程/连接全占死，引发级联雪崩。没有它会怎样：下游卡 10 分钟，上游线程池被占满，整个服务不可用。\n\n### 分四层，必须对齐\n\n| 层 | 典型配置 | 配错的后果 |\n| --- | --- | --- |\n| 客户端/前端 | 10s | 用户以为失败，实际后端成功 |\n| 网关 | 3s | 网关先超时返回 504，后端还在算 |\n| 应用调下游 RPC | 1s | 下游 hang 住，应用线程堆积 |\n| DB / 缓存 | 500ms~2s | 慢查询拖死连接池 |\n\n**核心原则：外层超时 > 内层超时**（3s 网关 > 2s 应用 > 1s RPC）。反过来会怎样：网关 1s 就放弃，但应用还在算 2s，用户看到失败、数据却写进去了 —— 这是**\"用户看到失败但订单已创建\"事故的根源**。\n\n### 测试必须验证什么\n\n| 验证点 | 怎么测 | 期望 |\n| --- | --- | --- |\n| 超时配置存在 | 注入延迟（toxiproxy / mock 睡眠 / tc netem） | 在配置时间内返回 |\n| 超时后的响应 | 注入 5s 延迟，服务端超时 2s | 明确错误码（504/500），**不能一直挂着** |\n| **超时后的最终状态** | 超时后立刻查订单/流水 | 要么全成功要么全失败，不能\"用户失败但数据已写入\" |\n| 超时 + 重试 | 注入间歇延迟 | 不产生重复数据（见第 4 节） |\n| 慢请求并发 | 100 个慢请求并发，看线程池/连接池是否耗尽 | 池未耗尽，或有排队上限 |\n| 超时是否可配 | 改配置是否生效（不需要重启最好） | 灰度可调 |\n\n### 怎么注入延迟（不用改被测代码）\n\n```bash\n# 方案 A：toxiproxy，最推荐，可编程、可撤销\ntoxiproxy-cli create pg -l 127.0.0.1:26379 -u 127.0.0.1:6379\ntoxiproxy-cli toxic add pg -t latency -a latency=3000   # 注入 3s 延迟\ntoxiproxy-cli toxic remove pg -n latency0               # 撤销\n\n# 方案 B：tc netem，在内核层加延迟（需要 root，影响整台机器）\ntc qdisc add dev eth0 root netem delay 3000ms\ntc qdisc del dev eth0 root netem\n```\n\n方案 A 更适合测试：只影响指定链路、可精确到某一个下游、可随时撤销。**压测和稳定性测试里，\"注入故障\"比\"等待故障\"高效一万倍。**\n\n```python\n# 方案 C：应用层 mock，最轻量：让 mock server 睡 5 秒再返回\nfrom flask import Flask, jsonify\nimport time\n\napp = Flask(__name__)\n\n@app.get(\"/slow\")\ndef slow():\n    time.sleep(5)\n    return jsonify({\"code\": 0})\n\n@app.get(\"/error\")\ndef error():\n    return jsonify({\"code\": 500}), 500\n```\n\n---\n\n## 4. 重试\n\n### 解决什么问题\n\n应对**偶发**失败（网络抖动、下游瞬时 503）。没有它会怎样：一次网络抖动就让用户看到失败。\n\n### 但重试是最容易制造事故的机制\n\n三个必须记住的前提：\n\n1. **只有幂等接口才能自动重试**。POST 下单重试 = 可能下两单。\n2. **必须限次数 + 退避**。无退避的立即重试会形成\"重试风暴\"，下游本来就挂了，你还加压。\n3. **必须加抖动（jitter）**。否则所有客户端在同一时刻重试，形成脉冲。\n\n### 测试必须验证什么\n\n| 验证点 | 用例 | 期望 |\n| --- | --- | --- |\n| 幂等接口重试 | 让下游返回一次 503 再正常 | 最终成功，只产生一条数据 |\n| **非幂等接口不重试** | 下单接口注入超时 | 不能产生两笔订单（重点是\"业务上不能重试\"） |\n| 重试次数上限 | 下游持续 503 | 重试 N 次后放弃，返回明确错误，不是一直转 |\n| 退避间隔 | 抓包/看日志时间戳 | 间隔递增（如 1s、2s、4s），不是 0.1s 连发 |\n| 重试风暴 | 下游全部不可用 | 应触发熔断而不是无限重试 |\n| 重试日志 | 每次重试是否留痕 | 有 requestId + 重试次数，便于排查 |\n\n### 一个必须测的组合：超时 + 重试 = 重复请求\n\n这是最经典的线上事故形态，值得单独讲：\n\n```\n1. 用户下单，请求正常到达，后端创建订单成功\n2. 后端处理慢（3.5s），网关超时（3s）先返回 504\n3. 客户端/网关认定为失败，重试\n4. 第二次请求又创建了一笔订单\n→ 用户看到\"下单失败\"，账户被扣两次钱\n```\n\n**测试方法**：注入 3.5s 延迟，客户端超时 3s，观察订单表有几条记录。\n\n**正确设计**：客户端生成 `requestId`（幂等键），服务端做唯一约束/去重表，重复请求直接返回第一次的结果。测试时专门断言\"同一 requestId 提交两次，只有一条记录，两次返回同一个 orderId\"。\n\n---\n\n## 5. 熔断\n\n### 解决什么问题\n\n下游持续失败时，**快速失败**，不再浪费资源去等。没有它会怎样：下游挂了，所有请求都卡在超时上，线程池耗尽，你自己也挂了（级联雪崩）。\n\n### 状态机（必须能画出来）\n\n```\nCLOSED（正常放行）\n   │ 失败率 > 阈值（如 50%）且请求数 > 最小样本数\n   ▼\nOPEN（快速失败，直接返回兜底，不发请求）\n   │ 等待窗口（如 30s）后\n   ▼\nHALF_OPEN（放少量请求试探）\n   │ 成功 → CLOSED    │ 失败 → OPEN\n```\n\n### 测试必须验证什么\n\n| 验证点 | 怎么测 | 期望 |\n| --- | --- | --- |\n| 触发条件 | mock 下游连续返回 500 | 达到阈值后进入 OPEN |\n| **快速失败** | 熔断后继续请求，看响应时间 | 从几秒骤降到几毫秒（这是最直观的验证） |\n| 兜底内容 | 熔断期间返回什么 | 明确错误码/默认数据，不能 500 或空白 |\n| 半开放量 | 等待窗口后发请求 | 只放少量（如 1 个）试探，不是全部放行 |\n| **恢复** | 下游恢复后 | 自动回到 CLOSED，不需要重启 |\n| 阈值合理性 | 用正常波动（如 10% 错误率）测试 | 不应误熔断（正常抖动不能触发） |\n| 熔断范围 | 只影响调用该下游的功能 | 不能把不相关的功能也熔了 |\n\n### 怎么触发（不需要真搞挂下游）\n\n```python\n# 用一个可控的 mock server 当下游：能按开关返回 500\n# 然后把被测服务的下游地址指向它，通过开关触发熔断\nimport requests\n\nMOCK = \"http://127.0.0.1:9999\"\n\ndef set_downstream_mode(mode: str):\n    requests.post(f\"{MOCK}/admin/mode\", json={\"mode\": mode}, timeout=3)\n\n# 1. 打挂下游\nset_downstream_mode(\"down\")\n# 2. 连续调用被测接口，直到熔断\ncodes = [requests.get(TARGET, timeout=5).status_code for _ in range(30)]\n# 3. 验证熔断后响应变快（快速失败）\nimport time\ns = time.perf_counter()\nrequests.get(TARGET, timeout=5)\nassert time.perf_counter() - s < 0.2, \"熔断后仍然很慢，说明没快速失败\"\n# 4. 恢复下游，等待窗口，验证自动恢复\nset_downstream_mode(\"up\")\n```\n\n**验证\"熔断生效\"最硬的指标是响应时间骤降**，不是错误率（错误率在没熔断时也是 100%）。这一点面试讲出来很加分。\n\n---\n\n## 6. 降级\n\n### 解决什么问题\n\n主流程不可用时，**牺牲非核心功能，保住核心链路**。没有它会怎样：评论服务挂了导致商品详情页打不开。\n\n### 和熔断的区别（常被问混）\n\n- **熔断**是自动的、针对\"某个下游一直失败\"的**快速失败机制**。\n- **降级**可以是自动（熔断后走兜底）也可以是**手动开关**，是\"牺牲功能换可用性\"的策略。\n\n一句话：熔断是\"不再调用\"，降级是\"调用失败之后给什么\"。\n\n### 测试必须验证什么\n\n| 验证点 | 用例 | 期望 |\n| --- | --- | --- |\n| 开关有效性 | 打开降级开关，请求接口 | 立刻返回兜底数据，不需要发版/重启 |\n| **兜底数据质量** | 看降级返回的内容 | 有数据可读（缓存老数据/默认值），而不是空白或 500 |\n| 降级范围 | 只降非核心（评论、推荐、积分） | **不能误降核心功能**（下单、支付） |\n| 页面可用性 | 降级后前端是否正常渲染 | 不能白屏、不能报 JS 错 |\n| 核心链路不受影响 | 降级评论后走完下单全流程 | 下单/支付正常 |\n| 恢复 | 关闭开关后 | 数据/功能自动恢复，无残留脏数据 |\n| 降级期间的可见性 | 是否有告警/日志 | 运维能知道\"正在降级\" |\n\n### 关键认知\n\n降级**不是测试能\"顺便测一下\"的**，它需要一个\"降级演练\"：把每个降级开关都打开一次，验证核心链路可用。这件事在很多团队一年做不了一次，但它是事故时唯一能救命的东西。你要做的是：**整理一份降级开关清单 + 每个开关对应的验证用例**，这就是测开在稳定性建设里最实在的贡献。\n\n---\n\n## 7. 幂等\n\n### 解决什么问题\n\n同一个请求执行多次，效果和执行一次相同。没有它会怎样：重复下单、重复扣款、重复发货。\n\n### 四种实现方式 + 对应测试点\n\n| 实现 | 原理 | 测试点 |\n| --- | --- | --- |\n| **唯一索引** | DB 层保证（如 `order_no` 唯一） | 并发插入相同单号，只有一个成功，另一个报重复（要处理成幂等返回而不是 500） |\n| **Token / 去重表** | 先申请 token，提交时校验并消费 | 同一 token 第二次提交被拒；token 未申请就提交被拒；**注意\"先查后插\"的并发窗口** |\n| **状态机** | 只允许合法流转（PENDING→PAID，不能 PAID→PAID） | 重复支付回调只生效一次；乱序回调不破坏状态 |\n| **乐观锁 / 版本号** | `UPDATE ... WHERE version = N` | 并发更新只有一次成功，另一次返回冲突（提示用户刷新） |\n\n### 测试必须验证什么（含代码）\n\n**① 串行重复提交**\n\n```python\ndef test_duplicate_submit_serial(api):\n    payload = {\"sku_id\": 1001, \"num\": 1, \"request_id\": \"req-20261028-001\"}\n    r1 = api.post(\"/api/order\", json=payload)\n    r2 = api.post(\"/api/order\", json=payload)          # 完全相同的请求\n    assert r1.status_code == 200 and r2.status_code == 200\n    assert r1.json()[\"order_id\"] == r2.json()[\"order_id\"], \"同一 requestId 产生了两个订单\"\n```\n\n**② 并发重复提交（最接近真实事故）**\n\n```python\nfrom concurrent.futures import ThreadPoolExecutor\nimport requests\n\ndef test_duplicate_submit_concurrent():\n    payload = {\"sku_id\": 1001, \"num\": 1, \"request_id\": \"req-20261028-002\"}\n    def send(_):\n        return requests.post(f\"{BASE}/api/order\", json=payload, timeout=10)\n\n    with ThreadPoolExecutor(max_workers=10) as pool:\n        results = list(pool.map(send, range(10)))\n\n    order_ids = {r.json().get(\"order_id\") for r in results if r.status_code == 200}\n    assert len(order_ids) == 1, f\"并发重复提交产生了 {len(order_ids)} 个订单: {order_ids}\"\n    # 再查一次库存/余额，确认只扣了一次\n```\n\n**③ 跨入口重复：前端防抖不算幂等**\n\n测试要点：**前端按钮置灰只是减少概率，不是幂等**。必须绕过前端直接打接口。用 `curl` 或脚本重复调用，这是测幂等的唯一有效方式。\n\n**④ 消息队列重复消费**\n\nMQ 的语义是 at-least-once，重复消费是**必然**的。测试方法：让消费者在提交 offset 前抛异常，触发重投，观察业务是否重复处理。Kafka/RocketMQ 都有对应的实验方法。\n\n**⑤ 幂等 key 的边界**\n\n- 同一 key 但**参数不同**（改了商品数量）→ 应该返回第一次的结果还是拒绝？**必须跟开发确认语义**，两种设计都有，但测试要知道预期。\n- 幂等 key 的有效期（24h 后同 key 又成功下单，是合理的）。\n- 幂等记录本身的清理。\n\n---\n\n## 8. 日志、监控、告警：为什么是质量保障的基础设施\n\n这一节回答清单里那句\"为什么\"。因为**测试只能覆盖你想得到的问题，日志监控告警负责你想不到的问题。**\n\n| 层次 | 作用 | 没有它 |\n| --- | --- | --- |\n| 日志 | 事后**定位**：知道发生了什么 | 线上报错只能猜，复现不了 |\n| 监控 | 事中**发现**：知道现在好不好 | 用户投诉了才知道服务挂了 |\n| 告警 | 主动**通知**：让对的人立刻知道 | 挂了 3 小时没人理 |\n\n测开在这里的角色不只是\"用日志\"，而是**把\"可观测性\"当成被测对象来测**。\n\n### 日志要测什么\n\n| 验证点 | 用例 | 判据 |\n| --- | --- | --- |\n| 关键路径有日志 | 下单流程 | 每一步都能在日志里找到 |\n| **链路可串** | 一次请求的所有日志带同一个 traceId | 用 traceId 能捞全 |\n| 级别正确 | 业务异常打 error，正常打 info | 异常都打到 info 里 → 告警永远不响 |\n| **不含敏感信息** | 检查日志里的手机号、身份证、密码、token | 明文 = 安全漏洞 |\n| 能定位到现场 | 500 错误日志里有入参、用户 ID | 只有\"系统繁忙\"= 无法排查 |\n| 格式可解析 | JSON 格式 | 便于检索和接监控 |\n\n```python\n# 一个可以直接用的断言：检查一次请求的日志是否可串、是否泄露敏感信息\nimport re\nimport requests\n\nSENSITIVE = re.compile(r\"(1[3-9]\\d{9})|(\\d{17}[\\dXx])|(password\\\"?:\\s*\\\"[^\\\"]+\\\")\")\n\ndef test_log_traceable(log_client, api):\n    trace_id = \"trace-test-20261028-001\"\n    api.get(\"/api/order/list\", headers={\"X-Request-Id\": trace_id})\n    logs = log_client.query(trace_id=trace_id, last=\"5m\")\n\n    assert logs, f\"按 traceId {trace_id} 查不到日志，链路断了\"\n    assert any(\"order\" in l[\"msg\"] for l in logs), \"关键路径没有日志\"\n    leaked = [l for l in logs if SENSITIVE.search(l[\"msg\"])]\n    assert not leaked, f\"日志泄露敏感信息: {leaked[:2]}\"\n```\n\n### 监控要测什么\n\n| 指标 | 验证方法 | 常见问题 |\n| --- | --- | --- |\n| 接口 QPS / 成功率 / P99 | 压测时对比监控数字与实际 | 监控采样率低，数字对不上 |\n| 错误码分布 | 人为造一批 500，看监控是否分化 | 只统计总量，看不出是哪类错 |\n| 业务指标（下单量、支付成功率） | 造单后看指标是否增长 | 埋点漏了某条路径 |\n| 资源指标（CPU/内存/连接数/队列堆积） | 压测时观察 | 告警阈值配错 |\n| **监控本身可用** | 故意停掉监控 agent | 停了没人知道 = 假监控 |\n\n### 告警要测什么\n\n这是最容易被漏的，但价值最高：\n\n1. **告警能触发**：人为造错误（下游 mock 全 500），确认告警真的发出来。**没验证过的告警等于没有。**\n2. **阈值合理**：太灵敏 → 疲劳（大家都无视）；太钝 → 滞后。\n3. **告警内容可行动**：包含服务名、时间、错误摘要、traceId、处理人。只有\"服务异常\"的告警等于没告警。\n4. **收敛与静默**：同一个故障 5 分钟发 1000 条 = 报警风暴。\n5. **值班链路通**：告警发到了谁那里，有没有人能收到。\n\n**一个必做的动作**：把\"告警演练\"写进测试用例库 —— 每次大版本发布前，跑一遍关键告警的触发验证。这件事成本极低，收益在事故当天体现。\n\n---\n\n## 9. 自查 Q8 完整作答\n\n### 缓存、限流、熔断、降级分别解决什么问题？测试时要分别验证什么？\n\n| | 解决什么问题 | 一句话机制 | 测试重点（按优先级） |\n| --- | --- | --- | --- |\n| **缓存** | DB 读压力大 | 把热点数据放内存，命中就不查库 | ① 数据一致性（写后读）② 穿透/击穿/雪崩 ③ key 冲突 ④ 淘汰策略 |\n| **限流** | 流量超过系统承载能力 | 超过阈值直接拒绝（429） | ① 阈值准确性（并发+对齐窗口）② 返回码与提示 ③ 维度与集群总限流 ④ 是否误伤 ⑤ **别把压测结论污染了** |\n| **熔断** | 下游持续失败导致级联雪崩 | 失败率超阈值 → 快速失败 → 半开试探 → 恢复 | ① 能触发 ② **熔断后响应时间骤降** ③ 半开只放少量 ④ 能自动恢复 ⑤ 不误熔断 |\n| **降级** | 保证核心链路可用 | 关掉非核心功能 / 返回兜底数据 | ① 开关实时生效 ② 兜底数据可读 ③ **不误降核心功能** ④ 恢复后无脏数据 ⑤ 降级时有告警 |\n\n**如果再被追问\"这四者怎么协作\"**，用订单流程回答：\n\n> 用户下单时，商品详情走缓存（挡住读压力）；网关对下单接口限流（保护写能力）；调用风控服务设 1s 超时，失败重试 1 次且带幂等键（防重复）；风控连续失败触发熔断，熔断后走降级（跳过风控，改为异步事后审查）；整个过程中日志带 traceId、监控看下单成功率、告警盯着错误率。\n> **测试的时候我不能只测\"正常下单成功\"，而要在这条链路的每个环节注入故障，验证系统的反应是不是设计预期的。** 这才是\"系统设计意识\"落到测试上的样子。\n\n---\n\n## 10. 综合实战：一个下单接口的完整测试设计\n\n把上面的词全串起来。这是本篇最有价值的产出，可以直接当模板用。\n\n| 分类 | 用例 | 验证的机制 | 怎么造 |\n| --- | --- | --- | --- |\n| 功能正向 | 正常下单，库存扣减正确 | 基础流程 | 正常调用 |\n| 边界 | 库存为 1 时下单成功、0 时失败 | 并发控制 | 预置库存 |\n| 缓存 | 下单后商品详情缓存是否更新 | 缓存一致性 | 下单后立刻查详情 |\n| 缓存 | 库存为 0 的商品高并发查详情 | 缓存穿透 | 随机不存在 ID |\n| 幂等 | 同 requestId 并发 10 次 | 幂等键 | 线程池并发 |\n| 幂等 | 重复支付回调 | 状态机 | 重放回调报文 |\n| 超时 | 支付回调延迟 5s 到达 | 超时 + 最终一致 | toxiproxy 注入 |\n| 超时 | 风控 3s 才返回（配置 1s） | 超时配置 | mock 睡眠 |\n| 重试 | 风控首次 503，第二次成功 | 重试 + 幂等 | mock 计数器 |\n| 重试 | 风控持续 503 | 重试上限 + 熔断 | mock 全 500 |\n| 熔断 | 熔断后下单响应时间 | 快速失败 | 观察 P99 |\n| 熔断 | 熔断恢复 | 半开 | 等窗口后放量 |\n| 降级 | 打开\"跳过风控\"开关 | 降级开关 | 配置中心改开关 |\n| 降级 | 评价服务降级后下单页可用 | 核心链路 | 开关 |\n| 限流 | 1s 内打 200 次下单 | 限流阈值 | 并发脚本 |\n| 限流 | 被限流时前端提示 | 错误码 | 看 429 + 提示 |\n| 可观测 | traceId 串起全链路日志 | 链路追踪 | 带 X-Request-Id |\n| 可观测 | 下单失败触发告警 | 告警 | 造一批失败 |\n| 可观测 | 日志不泄露手机号 | 安全 | 正则扫描 |\n\n**这张表的用法**：评审需求时拿它当 checklist 过一遍，能问出\"这个接口有幂等吗\"\"风控挂了会降级吗\"\"限流阈值多少\"\"日志带 traceId 吗\"—— 会问这四个问题，你在评审会上就不再是记录员了。\n\n---\n\n## 11. 复习动作清单\n\n- [ ] 拿你们系统里一个核心写接口（下单/支付/提交），问开发四个问题：有没有幂等键？超时配置多少？下游挂了会不会熔断？有没有降级开关？把答案记下来。\n- [ ] 用 `ThreadPoolExecutor` 对那个接口并发发 10 个相同请求，看产生几条数据。**这一步大概率能发现真问题。**\n- [ ] 用 toxiproxy 给一个下游注入 3s 延迟，验证网关超时 + 最终数据状态。重点看\"用户失败但数据写入\"。\n- [ ] 找一次告警配置，人为触发它，确认真的能收到。**没验证过的告警等于没有。**\n- [ ] 整理一份你们系统的\"降级开关清单\"，每个开关配一条验证用例。\n","chars":8035,"codes":12,"tables":16}]},{"name":"二、语言与框架（Python）","articles":[{"id":"python","title":"Python语言核心篇","desc":"异常处理/OOP封装/集合选型/文件读写/requests/并发","file":"测试开发-Python语言核心篇.md","content":"# 测试开发-Python语言核心篇\n\n> 对应清单：语言核心【必须掌握】全部（Python 口径）\n> 对应自查：Q1（写一个带超时和异常处理的取字段函数）\n> 全篇约定：Python 3.10 + requests。文中代码都能直接跑，改掉 URL 就是你的工具函数。\n> 立场：**测开写 Python 的评判标准不是\"写得优雅\"，而是\"别人接手能看懂、失败时能查到原因、换环境能跑起来\"。**\n\n---\n\n## 0. 先定位：测开的 Python 和开发的 Python 差在哪\n\n| 开发关心 | 测开关心 |\n| --- | --- |\n| 功能正确、性能好 | **失败可定位**：报错能不能一眼看出是请求问题还是断言问题 |\n| 抽象、可扩展 | **多环境可跑**：改配置不改代码 |\n| 类型安全、设计模式 | **数据驱动**：加用例不加代码 |\n| — | **脚本要能活过半年**：依赖锁死、别人能接手 |\n\n所以本篇重点不是语法细节，而是这四件事怎么用 Python 做好。\n\n自查分级：\n\n| 内容 | 档位 | 说明 |\n| --- | --- | --- |\n| 异常处理 | 熟练 | 用错会造出\"永远绿\"的假用例 |\n| requests 封装 | 熟练 | 每天都在用 |\n| 集合选型 | 熟练 | 影响造数据速度和断言稳定性 |\n| 文件读写 | 熟练 | JSON/YAML/CSV 是数据驱动的地基 |\n| 类与对象 | 会用 | PO 模式、HTTP 客户端封装 |\n| 依赖管理 | 会用 | CI 里环境不一致的根源 |\n| 并发三模型 | 会用 | 并行跑用例 |\n| 魔术方法 | 知道常用几个 | `__repr__` 调试最实用 |\n\n---\n\n## 1. 基本语法：真正天天用的只有这些\n\n语法本身不用学，但**测试场景下的写法**有讲究。\n\n### 1.1 异常处理：这是最容易写出假绿的地方\n\n**反面教材，一定见过**：\n\n```python\n# ❌ 假绿：任何异常都被吞掉，用例永远通过\ntry:\n    resp = requests.get(url, timeout=3)\n    assert resp.json()[\"code\"] == 0\nexcept Exception:\n    pass        # 请求超时、断言失败、字段不存在，全被吃掉\n```\n\n更隐蔽的版本：\n\n```python\n# ❌ 断言放在 try 里，AssertionError 继承了 Exception，被捕获后当\"业务异常\"处理\ntry:\n    assert resp.json()[\"data\"][\"id\"] == 1001\nexcept Exception as e:\n    logger.error(\"断言失败: %s\", e)     # 只记日志，不 fail → 用例还是绿的\n```\n\n**正确姿势：断言不进 try。**\n\n```python\ndef test_create_order(api):\n    resp = api.post(\"/api/order\", json={\"sku_id\": 1, \"num\": 1})\n    # 断言都放在最外层，失败就是失败\n    assert resp.status_code == 200, resp.text          # 把响应体带上，失败时才知道为什么\n    body = resp.json()\n    assert body[\"code\"] == 0, body\n    assert body[\"data\"][\"order_id\"]\n```\n\n**需要 try 的只有\"预期的异常\"**，而且要抓得准、抛得清：\n\n```python\nimport logging\nimport requests\n\nlogger = logging.getLogger(__name__)\n\ndef get_user(uid: int) -> dict:\n    url = f\"{BASE}/api/users/{uid}\"\n    try:\n        resp = requests.get(url, timeout=(3, 10))\n    except requests.Timeout:\n        # 超时是可重试的，记日志后往上抛，别自己吞\n        logger.warning(\"请求超时 url=%s timeout=(3,10)\", url)\n        raise\n    except requests.ConnectionError as e:\n        # 连接错误通常是环境问题，包装成更明确的错误，保留原始异常链\n        raise RuntimeError(f\"连不上测试环境，检查 VPN/hosts：{url}\") from e\n\n    if resp.status_code >= 400:\n        raise RuntimeError(f\"GET {url} -> {resp.status_code} {resp.text[:500]}\")\n    return resp.json()\n```\n\n几条硬规则，写在团队规范里：\n\n| 规则 | 原因 |\n| --- | --- |\n| 禁止 `except:` 和 `except Exception: pass` | 造出假绿，最不可救的 bug |\n| 断言不写在 try 块里 | `AssertionError` 是 `Exception` 子类，会被误捕 |\n| 捕获后要么 `raise`，要么 `raise Xxx from e` | 保留原始堆栈，否则排查时全是\"我包装的那句话\" |\n| 只捕获你能处理的异常 | 乱捕会让真正的 bug 隐蔽 |\n| 用 `pytest.raises` 断言\"应该抛异常\" | 别手写 try/except 判断 |\n\n```python\n# 测\"非法参数应报错\"，用 pytest.raises 而不是 try/except\nimport pytest\n\ndef test_invalid_sku(api):\n    with pytest.raises(requests.HTTPError) as exc:\n        api.post(\"/api/order\", json={\"sku_id\": -1}).raise_for_status()\n    assert exc.value.response.status_code == 400\n```\n\n### 1.2 其他天天用的写法\n\n```python\n# f-string：拼 URL、拼断言信息，比 % 和 format 都清楚\nurl = f\"{base}/api/users/{uid}?page={page}\"\n\n# 推导式：造数据、过滤集合，最常用\nids = [u[\"id\"] for u in users if u[\"status\"] == \"active\"]\nbyname = {u[\"name\"]: u for u in users}          # 转 dict 便于查找\n\n# 解包：函数返回多值\nstatus, body = fetch(...)\n\n# 海象运算符：少一行临时变量（别滥用，可读性优先）\nif (token := resp.headers.get(\"X-Token\")):\n    session.headers[\"Authorization\"] = token\n\n# for-else：找遍了都没找到才执行 else，适合\"断言不存在某个元素\"\nfor item in items:\n    if item[\"name\"] == \"admin\":\n        break\nelse:\n    pytest.fail(\"菜单里没有 admin\")\n```\n\n---\n\n## 2. 面向对象：测试里只有三个正当用途\n\n清单说\"能设计简单封装即可\"，所以别纠结设计模式。**测开写类，只有三个场景是值得的：**\n\n1. **封装一个被测系统的客户端**（`ApiClient`），统一处理 base_url、鉴权、超时、日志。\n2. **封装页面/模块对象**（Page Object），把\"怎么点\"和\"测什么\"分开。\n3. **封装测试数据对象**（`Order`、`User`），用 dataclass，让造数据能带默认值。\n\n超过这三个场景的类，多半是在给自己挖坑。三层继承的测试框架，接手的人一定骂。\n\n### 2.1 四个必须懂的魔术方法\n\n```python\nfrom dataclasses import dataclass, field\nfrom typing import Any\n\n\n@dataclass\nclass ApiResponse:\n    \"\"\"包装一次请求的结果。dataclass 自动生成 __init__/__repr__/__eq__，\n    失败时 print 出来直接可读，不用自己写 __repr__。\"\"\"\n    status: int\n    body: Any\n    elapsed: float\n    url: str = \"\"\n    headers: dict = field(default_factory=dict)   # 可变默认值必须用 field(default_factory=...)！\n\n    @property\n    def code(self) -> Any:\n        \"\"\"业务码，统一取法。\"\"\"\n        return self.body.get(\"code\") if isinstance(self.body, dict) else None\n\n    def __bool__(self) -> bool:\n        \"\"\"让 `if resp:` 表示\"HTTP 成功且业务成功\"。⚠️ 自定义 __bool__ 要谨慎，\n        容易让人误以为对象存在与否，团队里要么统一用、要么不用。\"\"\"\n        return self.status == 200 and self.code == 0\n```\n\n| 魔术方法 | 用途 | 测开里为什么用 |\n| --- | --- | --- |\n| `__repr__` | 打印对象 | **调试第一需求**。默认的 `<object at 0x7f...>` 等于没信息 |\n| `__eq__` | 对象比较 | 断言\"期望的数据对象 == 实际的数据对象\"，比逐字段断言清楚 |\n| `__enter__` / `__exit__` | `with` 上下文 | 资源清理（临时文件、DB 连接、mock 开关），**保证异常时也清理** |\n| `__call__` | 让实例可调用 | 写 fixture 工厂：`user_factory(role=\"admin\")` |\n\n### 2.2 可变默认参数：这个坑 100% 会遇到\n\n```python\n# ❌ 默认值只在函数定义时创建一次，所有调用共享同一个 list\ndef add_step(name, steps=[]):\n    steps.append(name)\n    return steps\n\nadd_step(\"a\")   # ['a']\nadd_step(\"b\")   # ['a', 'b']  ← 不是 ['b']\n\n# ✅ 用 None 做默认值\ndef add_step(name, steps=None):\n    steps = steps or []\n    steps.append(name)\n    return steps\n```\n\n同一个坑的类版本（更隐蔽）：\n\n```python\nclass CaseCollector:\n    cases = []          # ❌ 类属性，所有实例共享\n\n    def add(self, c):\n        self.cases.append(c)\n\nclass CaseCollector:\n    def __init__(self):\n        self.cases = []  # ✅ 实例属性\n```\n\n**测试里的实际表现**：用例 A 的结果出现在用例 B 的报告里；参数化用例之间互相污染。看到\"用例单独跑通过、一起跑失败\"，先查这种共享可变状态。\n\n### 2.3 组合优于继承：一个真实的封装\n\n```python\nimport logging\nimport time\nimport requests\n\nlogger = logging.getLogger(__name__)\n\n\nclass ApiClient:\n    \"\"\"统一封装：base_url、鉴权、超时、日志、耗时。\n\n    设计要点（面试可以讲）：\n    1. 组合 requests.Session 而不是继承 Session —— 我们只要它的连接复用，不要它的全部接口\n    2. 所有请求走同一个入口 _request，日志和耗时只写一份\n    3. 不要在封装里做断言 —— 断言属于用例，客户端只负责\"发出去、拿回来\"\n    \"\"\"\n    def __init__(self, base_url: str, token: str | None = None,\n                 timeout: tuple[float, float] = (3, 10)):\n        self.base_url = base_url.rstrip(\"/\")\n        self.timeout = timeout\n        self.session = requests.Session()\n        if token:\n            self.session.headers[\"Authorization\"] = f\"Bearer {token}\"\n\n    def _request(self, method: str, path: str, **kwargs):\n        url = f\"{self.base_url}{path}\"\n        kwargs.setdefault(\"timeout\", self.timeout)\n        start = time.perf_counter()\n        try:\n            resp = self.session.request(method, url, **kwargs)\n        except requests.Timeout:\n            logger.warning(\"TIMEOUT %s %s timeout=%s\", method, url, self.timeout)\n            raise\n        except requests.ConnectionError:\n            logger.error(\"CONN_ERROR %s %s\", method, url)\n            raise\n        cost = time.perf_counter() - start\n        logger.info(\"%s %s -> %s (%.3fs)\", method, url, resp.status_code, cost)\n        return resp\n\n    def get(self, path: str, **kw):\n        return self._request(\"GET\", path, **kw)\n\n    def post(self, path: str, **kw):\n        return self._request(\"POST\", path, **kw)\n\n    def close(self):\n        self.session.close()\n```\n\n这段代码的价值：**以后所有接口用例都从 `ApiClient` 出发，日志、超时、鉴权只维护一处。** 这就是\"能设计简单封装\"的标准答案。\n\n---\n\n## 3. 集合选型：选错会让造数据脚本慢 100 倍\n\n### 3.1 选型表\n\n| 类型 | 有序 | 可变 | 元素可重复 | 查找 | 测开里典型用途 |\n| --- | --- | --- | --- | --- | --- |\n| `list` | 是 | 是 | 是 | O(n) | 用例列表、参数列表、响应数组 |\n| `tuple` | 是 | **否** | 是 | O(n) | 固定配置、函数多返回值、dict 的 key |\n| `dict` | 是（3.7+） | 是 | key 唯一 | O(1) | JSON 对象、配置、按 id 索引 |\n| `set` | **否** | 是 | 否 | O(1) | 去重、集合运算、快速判断存在 |\n\n**一句话记法**：需要顺序和下标用 list；需要\"按 key 查\"用 dict；需要\"存在性判断/去重\"用 set；需要不可变（能当 key、防误改）用 tuple。\n\n### 3.2 四个真实场景\n\n```python\n# ① 去重且保持顺序：dict.fromkeys（set 会打乱顺序）\nuniq = list(dict.fromkeys(skus))          # ['a','b','c']\n# 用 set 的后果：顺序没了，断言顺序时会失败\n\n# ② 存在性判断：一定要用 set，别用 list\n#   sku_id in sku_set    → O(1)\n#   sku_id in sku_list   → O(n)，放在循环里就是 O(n²)\n\n# ③ 集合运算：比对两个环境的差异\nonly_prod = set(prod_skus) - set(test_skus)\nonly_test = set(test_skus) - set(prod_skus)\nboth = set(prod_skus) & set(test_skus)\n\n# ④ 参数组合：用 itertools.product 生成笛卡尔积，别手写嵌套循环\nfrom itertools import product\ncases = list(product([\"alipay\", \"wechat\"], [\"1\", \"0\"], [\"v1\", \"v2\"]))   # 8 组\n```\n\n### 3.3 断言里的坑：set 无序\n\n```python\n# ❌ 顺序不稳定，偶发失败\nassert list(set(resp[\"tags\"])) == [\"a\", \"b\", \"c\"]\n\n# ✅ 要么排序，要么比较集合\nassert sorted(set(resp[\"tags\"])) == [\"a\", \"b\", \"c\"]\nassert set(resp[\"tags\"]) == {\"a\", \"b\", \"c\"}\n```\n\n这个坑会在\"Python 3.7 前 dict 无序\"的老项目里更明显，但现在也常见于把 set 直接 `json.dumps` 落盘后再比对的写法。\n\n---\n\n## 4. 文件读写：数据驱动的地基\n\n### 4.1 编码：Windows 上最容易踩的坑\n\n```python\n# ❌ 不写 encoding → 用系统默认编码（中文 Windows 是 GBK）→ 读 UTF-8 文件报 UnicodeDecodeError\nwith open(\"data.yaml\") as f:\n    ...\n\n# ✅ 永远显式写 encoding\nwith open(\"data.yaml\", encoding=\"utf-8\") as f:\n    ...\n\n# 读 CSV 更要注意：Excel 导出的中文 CSV 常是 GBK\nwith open(\"cases.csv\", encoding=\"gbk\", newline=\"\") as f:\n    ...\n```\n\n`newline=\"\"` 是 CSV 的标准写法，不写会在 Windows 上多出空行。\n\n### 4.2 路径：用 pathlib，别拼字符串\n\n```python\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parent          # 当前文件所在目录\nDATA = ROOT / \"data\" / \"cases.yaml\"             # / 拼接，跨平台\nOUT = ROOT / \"output\"\nOUT.mkdir(parents=True, exist_ok=True)          # 不存在就建，包括父目录\n\nif not DATA.exists():\n    raise FileNotFoundError(f\"数据文件不存在: {DATA}\")   # 报错带上绝对路径\n\n# 遍历目录下所有 json\nfor p in (ROOT / \"cases\").rglob(\"*.json\"):\n    ...\n```\n\n**为什么重要**：CI 里工作目录和执行目录经常不是同一个，用 `os.getcwd()` 拼相对路径一定出事。`Path(__file__)` 是唯一可靠的基准。\n\n### 4.3 JSON\n\n```python\nimport json\n\n# 读\nwith open(p, encoding=\"utf-8\") as f:\n    data = json.load(f)\n\n# 写：ensure_ascii=False 保留中文可读，indent 便于 diff 和 code review\nwith open(p, \"w\", encoding=\"utf-8\") as f:\n    json.dump(data, f, ensure_ascii=False, indent=2)\n```\n\n**必须养成的习惯：失败时把响应体落盘。** 光看日志里的 `resp.text[:200]` 往往不够（排查问题经常需要完整报文）：\n\n```python\nimport json\nfrom pathlib import Path\n\n\ndef dump_failure(resp, name: str, out_dir: Path):\n    \"\"\"用例失败时把现场存成文件，便于事后分析/贴到缺陷单。\"\"\"\n    out_dir.mkdir(parents=True, exist_ok=True)\n    payload = {\n        \"request\": {\n            \"method\": resp.request.method,\n            \"url\": resp.request.url,\n            \"headers\": dict(resp.request.headers),\n            \"body\": resp.request.body if isinstance(resp.request.body, str)\n                    else (resp.request.body or b\"\").decode(\"utf-8\", \"replace\"),\n        },\n        \"response\": {\n            \"status\": resp.status_code,\n            \"headers\": dict(resp.headers),\n            \"body\": resp.text,\n        },\n        \"elapsed_seconds\": resp.elapsed.total_seconds(),\n    }\n    path = out_dir / f\"{name}.json\"\n    with open(path, \"w\", encoding=\"utf-8\") as f:\n        json.dump(payload, f, ensure_ascii=False, indent=2)\n    return path\n```\n\n### 4.4 CSV（参数化数据最常用的格式）\n\n```python\nimport csv\n\ndef load_cases(path: Path) -> list[dict]:\n    with open(path, encoding=\"utf-8\", newline=\"\") as f:\n        return list(csv.DictReader(f))       # 第一行自动当表头，每行一个 dict\n\n# 用法：写一个 cases/cart_add.csv\n# case_name,sku_id,num,expected_code\n# 正常加购,1001,1,0\n# 数量为0,1001,0,400\n```\n\n坑：\n\n- `DictReader` 读出来的值**全是字符串**，判断 `int` 时要转换。\n- Excel 存 CSV 可能带 BOM（`\\ufeff`），导致第一列表头变成 `\\ufeffcase_name`。用 `encoding=\"utf-8-sig\"` 解决，这一条非常值得记住。\n- 数字前导 0 被 Excel 吃掉（手机号变 1380000000），测试数据要加引号或用文本格式。\n\n### 4.5 YAML（配置文件常态）\n\n```python\nimport yaml\n\ndef load_yaml(path: Path) -> dict:\n    with open(path, encoding=\"utf-8\") as f:\n        # 必须用 safe_load，load 能执行任意 Python 对象，等于代码注入\n        return yaml.safe_load(f) or {}\n```\n\nYAML 三个坑：\n\n| 坑 | 例子 | 处理 |\n| --- | --- | --- |\n| `yes/no/on/off` 被解析成布尔 | `enabled: no` → `False` | 配置值加引号，或统一用 `true/false` |\n| 版本号被当数字 | `version: 1.10` → `1.1` | 加引号 `\"1.10\"` |\n| 日期被转成 date 对象 | `date: 2026-10-28` → `datetime.date` | 加引号，或 json 序列化时 `default=str` |\n\n这些坑在\"配置里放版本号/开关\"时百分百遇到，面试也能讲。\n\n---\n\n## 5. 模块与依赖管理\n\n### 5.1 最小可复现流程\n\n```bash\n# 创建并激活虚拟环境（每个项目一个，别用全局 python）\npython -m venv .venv\n# Windows\n.venv\\Scripts\\activate\n# macOS / Linux\nsource .venv/bin/activate\n\npip install -r requirements.txt\n```\n\n### 5.2 requirements：锁版本是纪律，不是建议\n\n```\n# requirements.txt —— 测试工程的最小示范\nrequests==2.31.0\npytest==7.4.0\npytest-xdist==3.5.0\npytest-rerunfailures==12.0\npytest-timeout==2.2.0\nPyYAML==6.0.1\n```\n\n三条规则：\n\n1. **锁精确版本（`==`）**，不要 `>=`。CI 某天突然挂了，十有八九是某个依赖自己升级了。\n2. **区分运行时与开发依赖**：`requirements.txt` + `requirements-dev.txt`（lint、报告等），减少 CI 安装量。\n3. **别用 `pip freeze` 生成项目依赖**。它会把环境里所有包（包括你 `pip install` 试玩留下的）全写进去，导致依赖膨胀、传递依赖被锁死。正确做法是手工维护直接依赖，或用 `pip-tools`：\n\n```bash\npip install pip-tools\n# requirements.in 里只写直接依赖，不带版本或带宽松版本\npip-compile --output-file=requirements.txt requirements.in   # 生成锁文件（含全部传递依赖）\npip-sync requirements.txt\n```\n\n### 5.3 pyproject.toml（新项目推荐）\n\n```toml\n[project]\nname = \"qa-autotest\"\nversion = \"0.1.0\"\nrequires-python = \">=3.10\"\ndependencies = [\n    \"requests==2.31.0\",\n    \"PyYAML==6.0.1\",\n]\n\n[project.optional-dependencies]\ndev = [\"pytest==7.4.0\", \"pytest-xdist==3.5.0\", \"ruff==0.6.0\"]\n\n[tool.pytest.ini_options]\ntestpaths = [\"tests\"]\naddopts = \"-ra --strict-markers\"\n```\n\n`[tool.pytest.ini_options]` 写在 `pyproject.toml` 里，就不用再维护 `pytest.ini`，配置**和依赖放在一处**，新人 clone 下来一次搞定。\n\n### 5.4 国内镜像\n\n```bash\npip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple\n```\n\nCI 里如果没有镜像，装一个 pytest 生态的包可能要等几分钟，**这是流水线慢的常见原因，比优化代码收益大**。\n\n---\n\n## 6. requests：把细节用对\n\n### 6.1 三个参数的区别（新手最常混）\n\n| 参数 | 作用 | 实际发出的 |\n| --- | --- | --- |\n| `params={\"page\": 1}` | 拼到 URL 查询串 | `?page=1` |\n| `data={\"a\": 1}` | **表单**编码 | `Content-Type: application/x-www-form-urlencoded`，body `a=1` |\n| `json={\"a\": 1}` | **JSON** 编码 | `Content-Type: application/json`，body `{\"a\": 1}` |\n\n**最常见的错误**：服务端要 JSON，脚本写了 `data={\"a\":1}`，接口返回 400 或字段全 null。**排查方法：`print(resp.request.headers)`**，一眼就能看出 `Content-Type` 是 form 还是 json。\n\n### 6.2 超时：必须同时给连接和读取\n\n```python\n# ❌ 不设超时：请求可能永远挂着，CI 卡死，排查时以为是死锁\nrequests.get(url)\n\n# ⚠️ 单值超时：连接和读取都用 10s，但语义模糊\nrequests.get(url, timeout=10)\n\n# ✅ 元组：(连接超时, 读取超时)\nrequests.get(url, timeout=(3, 10))\n```\n\n区分两种超时的实际价值：\n\n- **连接超时**（3s）：TCP 建连阶段。报这个说明网络/端口/防火墙有问题，重试通常没用。\n- **读取超时**（10s）：连上了但服务端迟迟不响应。报这个说明后端慢，重试可能有用（但要考虑幂等）。\n\n排查时看到 `ConnectTimeout` 和 `ReadTimeout`，**结论完全不同**，所以超时必须设成元组，别用一个数字糊过去。\n\n### 6.3 Session：复用连接 + 保持登录态\n\n```python\nimport requests\n\ns = requests.Session()\ns.headers.update({\"User-Agent\": \"qa-autotest/1.0\"})\ns.post(f\"{BASE}/api/login\", json={\"user\": \"qa\", \"pwd\": \"p\"})   # 自动存 cookie\n\nr = s.get(f\"{BASE}/api/orders\")     # 自动带 cookie，且复用 TCP 连接\n```\n\n用 Session 的三个理由：\n\n1. **连接复用**：省调握手开销，压测和批量用例下差别巨大（网络篇讲过 TIME_WAIT）。\n2. **自动管理 Cookie**。\n3. **统一默认 Header**。\n\n注意：`requests.Session` **不是线程安全的**。多线程并发时每线程一个 Session，或加锁（网络篇给过 `threading.local` 的写法）。\n\n### 6.4 异常类型要分清\n\n| 异常 | 什么时候抛 | 排查方向 |\n| --- | --- | --- |\n| `requests.exceptions.MissingSchema` | URL 没写 `http://` | 配置错误 |\n| `ConnectionError` | DNS 失败、端口不通、被拒 | 环境、VPN、hosts、服务未启动 |\n| `ConnectTimeout` | 建连超时 | 网络、防火墙 |\n| `ReadTimeout` | 连上了但读取超时 | 后端慢、DB 慢、死锁 |\n| `TooManyRedirects` | 重定向循环 | Cookie/登录态失效被反复重定向到登录页 |\n| `HTTPError`（由 `raise_for_status()` 主动抛） | 4xx/5xx | 接口行为问题 |\n\n`raise_for_status()` 只在你想把 4xx/5xx 当异常时才调；**接口测试里往往不该调**，因为你要断言具体的错误码。\n\n### 6.5 中文乱码：`resp.encoding`\n\n```python\n# 服务端返回 Content-Type: application/json 时正常\n# 返回 text/html 且没写 charset 时，requests 默认按 ISO-8859-1 解码 → 中文乱码\nresp.encoding = resp.apparent_encoding      # 或者直接指定\nresp.encoding = \"utf-8\"\nprint(resp.text)\n```\n\n断言中文报错信息时踩过这个坑，就会记得：**先看 `resp.encoding`，再看 `resp.text`。**\n\n---\n\n## 7. 并发：线程 / 进程 / 协程怎么选\n\n### 7.1 一句话选型\n\n| 模型 | 适合 | 测试场景 | 代价 |\n| --- | --- | --- | --- |\n| 线程 `ThreadPoolExecutor` | IO 密集 | **并行跑接口用例**（等网络的时间占 95%） | GIL 限制 CPU 并行；共享状态要小心 |\n| 进程 `ProcessPoolExecutor` | CPU 密集 | 图片比对、大报文签名、压测造数据 | 创建慢（Windows 是 spawn）、进程间不能共享对象 |\n| 协程 `asyncio` | 高并发 IO | 压测脚本、批量探测 | 全链路异步，库要支持（`aiohttp`/`httpx`），不能混用同步库 |\n\n**结论直接背**：接口用例用线程池；CPU 计算用进程池；要做万级并发压测用协程。\n\n### 7.2 线程池跑用例（最常用的形态）\n\n```python\nfrom concurrent.futures import ThreadPoolExecutor, as_completed\nimport logging\n\nlogger = logging.getLogger(__name__)\n\ndef run_cases(cases: list[dict], fn, max_workers: int = 10) -> list:\n    results = []\n    with ThreadPoolExecutor(max_workers=max_workers) as pool:\n        future_map = {pool.submit(fn, c): c for c in cases}\n        for fut in as_completed(future_map):\n            case = future_map[fut]\n            try:\n                results.append(fut.result())          # 异常在这里抛出\n            except Exception as e:\n                # 关键：线程里的异常不会自动冒泡到主线程，必须显式收集\n                logger.error(\"用例失败 case=%s err=%s\", case.get(\"case_name\"), e, exc_info=True)\n                results.append({\"case\": case, \"error\": repr(e)})\n    return results\n```\n\n**坑 1：线程里的异常会被静默吞掉**。用 `future.result()` 取结果才会抛出来，否则你只能看到\"跑完了但没结果\"。\n\n**坑 2：不要在线程里共享 Session / driver / 全局可变状态**（见第 2.2 节）。\n\n### 7.3 协程（了解形态即可）\n\n```python\nimport asyncio\nimport aiohttp\n\nasync def one(session, url, sem):\n    async with sem:\n        async with session.get(url, timeout=aiohttp.ClientTimeout(total=10)) as resp:\n            return resp.status\n\nasync def main(urls):\n    sem = asyncio.Semaphore(50)\n    async with aiohttp.ClientSession() as session:\n        return await asyncio.gather(*[one(session, u, sem) for u in urls])\n\n# asyncio.run(main(urls))\n```\n\n协程的价值在\"一个线程扛几千并发\"，测普通接口用线程池足够，别为了炫技引入 async 复杂度。\n\n---\n\n## 8. 自查 Q1 完整作答：带超时和异常处理的取字段函数\n\n题目要求：请求指定 URL，返回状态码和响应 JSON 中指定字段的值，带超时和异常处理。\n\n### 8.1 基础版（面试先写这个）\n\n```python\nimport requests\n\n\ndef fetch_field(url: str, field: str, timeout: float = 10) -> tuple[int, object]:\n    \"\"\"请求 URL，返回 (状态码, 字段值)。\n\n    设计取舍：\n    - 非 2xx 不抛异常，因为测试需要看到状态码和错误响应\n    - 响应不是 JSON 时抛 ValueError，并带上状态码和原文片段\n    - 字段不存在返回 None（用 dict.get 的语义），而不是抛 KeyError\n    \"\"\"\n    if not url.startswith((\"http://\", \"https://\")):\n        raise ValueError(f\"url 必须以 http(s):// 开头: {url}\")\n\n    try:\n        resp = requests.get(url, timeout=timeout)\n    except requests.exceptions.Timeout:\n        raise RuntimeError(f\"请求超时({timeout}s): {url}\") from None\n    except requests.exceptions.ConnectionError as e:\n        raise RuntimeError(f\"连接失败: {url}\") from e\n    except requests.exceptions.RequestException as e:\n        raise RuntimeError(f\"请求异常: {e}\") from e\n\n    try:\n        body = resp.json()\n    except ValueError:\n        raise ValueError(f\"响应不是 JSON (status={resp.status_code}): {resp.text[:200]}\")\n\n    if not isinstance(body, dict):\n        raise ValueError(f\"响应 JSON 不是对象，无法取字段: {type(body).__name__}\")\n\n    return resp.status_code, body.get(field)\n```\n\n### 8.2 工程版（加日志、嵌套字段、连接复用）\n\n面试时说完基础版，主动说\"实际项目里我会再考虑四点\"，然后给这版：\n\n```python\nimport logging\nimport requests\n\nlogger = logging.getLogger(__name__)\n\n\ndef _dig(data: object, path: str) -> object:\n    \"\"\"支持 'a.b.c' 和 'items[0].id' 这种路径。找不到返回 None。\"\"\"\n    if not path:\n        return data\n    cur = data\n    for part in path.split(\".\"):\n        name, _, idx = part.partition(\"[\")\n        if name:\n            if not isinstance(cur, dict):\n                return None\n            cur = cur.get(name)\n            if cur is None:\n                return None\n        if idx:\n            try:\n                i = int(idx.rstrip(\"]\"))\n                cur = cur[i]\n            except (ValueError, IndexError, TypeError):\n                return None\n    return cur\n\n\ndef fetch_field(url: str,\n                field: str = \"\",\n                timeout: tuple[float, float] = (3, 10),\n                headers: dict | None = None,\n                session: requests.Session | None = None) -> tuple[int, object]:\n    \"\"\"请求 URL，返回 (状态码, JSON 中字段值)。\n\n    - timeout 用元组区分 (连接超时, 读取超时)\n    - field 支持点路径和下标：'data.order.id'、'items[0].sku'\n    - session 可传入复用连接；不传则新建（用完即关）\n    \"\"\"\n    own_session = session is None\n    sess = session or requests.Session()\n    try:\n        resp = sess.get(url, timeout=timeout, headers=headers or {})\n    except requests.exceptions.ConnectTimeout:\n        logger.error(\"连接超时 url=%s connect_timeout=%s\", url, timeout[0])\n        raise\n    except requests.exceptions.ReadTimeout:\n        logger.error(\"读取超时 url=%s read_timeout=%s\", url, timeout[1])\n        raise\n    except requests.exceptions.ConnectionError:\n        logger.error(\"连接失败 url=%s（检查服务是否启动、hosts、VPN）\", url)\n        raise\n    finally:\n        if own_session:\n            sess.close()\n\n    logger.info(\"GET %s -> %s (%.3fs)\", url, resp.status_code, resp.elapsed.total_seconds())\n\n    try:\n        body = resp.json()\n    except ValueError:\n        logger.error(\"非 JSON 响应 status=%s body=%s\", resp.status_code, resp.text[:300])\n        raise ValueError(f\"响应不是 JSON (status={resp.status_code})\") from None\n\n    return resp.status_code, _dig(body, field)\n```\n\n### 8.3 面试官大概率追问的五个点（提前准备）\n\n| 追问 | 怎么答 |\n| --- | --- |\n| 响应不是 JSON 怎么办 | 显式抛 `ValueError` 并带上状态码和原文片段；或者设计成返回 `(status, None, raw)` 三元组，让调用方决定 |\n| 字段不存在返回 None 还是抛异常 | 取决于用法：做\"存在性断言\"返回 None 更好用；做\"必填校验\"应该抛，否则 `assert None == 1001` 的失败信息不直观。**团队里要统一，我的偏好是补一个 `required=True` 参数** |\n| 4xx/5xx 要不要抛 | **不抛**。测试需要拿到状态码做断言，抛了就丢了信息。调用方需要时自己 `raise_for_status()` |\n| 超时怎么设 | 元组 (connect, read)，connect 小（3s，网络问题重试无用），read 按接口 P99 估（10s），**不能拍脑袋，要看监控的 P99** |\n| 要不要加日志 | 必须。而且日志里要有 URL、状态码、耗时；断言失败时能直接看出是大是小 |\n\n### 8.4 顺手补一个单测（这是工本篇的伏笔）\n\n```python\nfrom unittest.mock import patch\nimport pytest\n\n\ndef test_fetch_field_nested():\n    class FakeResp:\n        status_code = 200\n        elapsed = type(\"E\", (), {\"total_seconds\": lambda self: 0.1})()\n        text = '{\"data\":{\"items\":[{\"sku\":\"A1\"}]}}'\n\n        def json(self):\n            return {\"data\": {\"items\": [{\"sku\": \"A1\"}]}}\n\n        def __init__(self):\n            self.request = None\n            self.headers = {}\n\n    with patch(\"requests.Session.get\", return_value=FakeResp()):\n        status, value = fetch_field(\"http://x.test/api\", \"data.items[0].sku\")\n    assert status == 200\n    assert value == \"A1\"\n\n\ndef test_fetch_field_timeout():\n    import requests\n    with patch(\"requests.Session.get\", side_effect=requests.exceptions.ConnectTimeout()):\n        with pytest.raises(requests.exceptions.ConnectTimeout):\n            fetch_field(\"http://x.test/api\", \"a\")\n```\n\n**注意**：`requests.Session.get` 的 patch 路径要打在\"使用处\"（这里就是 `requests.Session.get`”，因为我们的代码用的是 `sess.get`）。patch 路径写错是 mock 最常见的失败原因，pytest 篇会细讲。\n\n---\n\n## 9. 复习动作清单\n\n- [ ] 把 §8.2 的 `fetch_field` 放进你的工具库，用它替换掉自己脚本里 `requests.get(...)` + `resp.json()[\"x\"]` 的裸写。\n- [ ] 翻一遍现有脚本，搜 `except` 和 `pass`，找出至少一处\"吞异常\"的地方改掉。\n- [ ] 把一个硬编码的测试环境地址，改成从 YAML 配置读（配置篇会讲完整方案，先动手）。\n- [ ] 用 `ThreadPoolExecutor` 把一段 `for` 循环跑 100 个接口请求改成并行，记录耗时差异。\n- [ ] 给一个有中文报错信息的接口写断言，故意用 `resp.text` 看是否乱码，练 `resp.encoding` 的处理。\n","chars":6156,"codes":31,"tables":10},{"id":"pytest","title":"pytest框架篇","desc":"fixture/参数化/mark/conftest+hook/插件/Mock","file":"测试开发-pytest框架篇.md","content":"# 测试开发-pytest框架篇\n\n> 对应清单：测试框架【必须掌握】Python 部分（pytest / unittest / Mock）\n> 对应自查：Q2（fixture 与 setup/teardown）、Q3（参数化数据放哪）、Q4（Mock 与 mock 第三方）\n> 全篇约定：pytest 7.4 + Python 3.10。文中的 `conftest.py` 和测试文件都是能直接跑起来的完整文件，我在本机验证过。\n> 立场：pytest 不是\"断言库 + 跑用例\"，它的价值是**用 fixture 管住所有外部资源，用参数化管住用例数量，用 hook 管住失败现场。**\n\n---\n\n## 0. 先定位：一个测试框架要解决的四个问题\n\n任何接口自动化项目，本质就这四件事。pytest 分别给了对应机制：\n\n| 问题 | pytest 的答案 | 没有它你会怎么写 |\n| --- | --- | --- |\n| 资源从哪来、什么时候清 | **fixture（作用域 + yield）** | 每个用例开头连 DB、结尾 close，重复且易漏 |\n| 用例数量爆炸 | **参数化（parametrize）** | 复制粘贴 200 个测试函数 |\n| 只跑一部分 | **mark 标签** | 手写 if 判断环境 |\n| 失败后怎么复盘 | **conftest 里的 hook + 日志** | 重跑一遍看能不能复现 |\n\n自查分级：\n\n| 内容 | 档位 | 说明 |\n| --- | --- | --- |\n| fixture（scope / yield / autouse / 依赖） | 熟练 | 整个框架的地基 |\n| 参数化（含间接参数化） | 熟练 | 数据驱动的核心 |\n| conftest 层级 + hook | 熟练 | 失败现场靠它 |\n| mark 标签 | 会用 | CI 分片、冒烟集 |\n| mock 的边界 | 熟练 | 用错会让用例失去意义 |\n| unittest 存量代码 | 看得懂 | 只读不写 |\n| 插件生态 | 会用 | xdist / rerun / timeout |\n\n---\n\n## 1. fixture：讲清楚\"是什么\"不如讲清楚\"管什么\"\n\n### 1.1 一句话定义 + 一个真实对照\n\n**fixture 是\"声明式地准备资源，pytest 负责按作用域创建和销毁\"。**\n\n不用 fixture 的写法（新手常见）：\n\n```python\ndef test_create_order_01():\n    db = connect_db()            # 每条用例都写一遍\n    token = login(\"qa01\", \"pwd\")  # 每条用例都登录一次，慢\n    try:\n        ...\n    finally:\n        db.close()               # 忘了写就泄漏\n```\n\n用 fixture：\n\n```python\ndef test_create_order_01(db, token):    # 声明需要什么，pytest 按需注入\n    ...\n```\n\n三个直接收益：\n\n1. **不重复**：登录、建库、起服务只写一次。\n2. **清理可靠**：`yield` 之后的 teardown 即使用例失败也会执行。\n3. **可组合**：fixture 可以依赖 fixture。\n\n### 1.2 作用域：这是 fixture 最重要的概念\n\n| scope | 生命周期 | 典型用途 | 用了会怎样 |\n| --- | --- | --- | --- |\n| `function`（默认） | 每条用例一次 | 独立测试数据、临时目录 | 最安全，但慢（每次都要准备） |\n| `class` | 每个测试类一次 | 一组相关用例共享 | 少用 |\n| `module` | 每个 .py 文件一次 | 文件内共享的测试数据 | 中 |\n| `session` | **整个 pytest 运行一次** | 登录 token、HTTP 客户端、DB 连接池、起被测服务 | 快，但**数据要能被所有用例共用** |\n\n**真实选择逻辑**：\n\n```\n登录 → session（只登一次，不然后面撞登录频率限制）\n数据库连接 → session（连接池复用），但事务 → function（每条用例独立回滚）\n测试数据 → function（每条用例自己造，避免互踩）\n浏览器 driver → function（每条用例干净，脏了会互相影响）\n被测服务/环境探活 → session\n```\n\n**scope 写错的两种典型症状**：\n\n```python\n# 症状 1：session fixture 依赖 function fixture → 直接报错\n# ScopeMismatch: You tried to access the 'function' scoped fixture 'tmp' with a 'session' scoped request object\n@pytest.fixture(scope=\"session\")\ndef conf(tmp_path):      # ❌ function 级\n    ...\n\n# 症状 2：function fixture 依赖 session fixture → 数据污染\n@pytest.fixture(scope=\"session\")\ndef user():\n    return {\"id\": 1, \"balance\": 1000}   # 所有用例共享同一个 dict，前一条用例改了余额，后一条断言就乱了\n\n@pytest.fixture\ndef order(user):      # 看着是 function 级，但拿到的 user 是共享的\n    user[\"balance\"] -= 100\n```\n\n**结论**：要共享就共享\"只读的、不经业务修改的\"东西（token、URL、连接）；凡是会被用例改的数据，一律 function 级。\n\n### 1.3 yield 与 addfinalizer：teardown 的两种写法\n\n```python\n@pytest.fixture\ndef order():\n    created = api.create_order()          # setup\n    yield created                          # 交出去\n    api.delete_order(created[\"id\"])        # teardown，用例失败也会执行\n```\n\n```python\n@pytest.fixture\ndef order(request):\n    created = api.create_order()\n    request.addfinalizer(lambda: api.delete_order(created[\"id\"]))   # 等价\n    return created\n```\n\n两者区别（面试爱问）：\n\n| | yield | addfinalizer |\n| --- | --- | --- |\n| 写法 | 简洁 | 啰嗦 |\n| 能否注册多个清理 | 用 `with`/`try-finallly` 或嵌套 | 可以多次 `addfinalizer`，逆序执行 |\n| setup 中途失败 | teardown 不执行 | 已注册的 finalizer **仍会执行**（更严谨） |\n| 适用 | 90% 场景 | 需要动态注册清理、setup 可能半途失败 |\n\n**teardown 里抛异常会污染结果**：如果 teardown 报错，pytest 会把用例标记为 error（不是 failed），很容易被误判为\"用例挂了\"。所以 teardown 里要加 try/except 并记日志：\n\n```python\n@pytest.fixture\ndef order():\n    created = api.create_order()\n    yield created\n    try:\n        api.delete_order(created[\"id\"])\n    except Exception as e:\n        logger.warning(\"清理订单失败 %s: %s\", created[\"id\"], e)   # 清理失败不该让用例变 error\n```\n\n### 1.4 autouse：什么时候该用，什么时候是灾难\n\n```python\n@pytest.fixture(autouse=True)\ndef log_case_name(request):\n    \"\"\"每条用例自动打一行日志：用例名 + 开始时间。\"\"\"\n    logger.info(\">>> START %s\", request.node.nodeid)\n    yield\n    logger.info(\"<<< END   %s\", request.node.nodeid)\n```\n\n**适合 autouse 的**：日志、计时、allure 标签、统一的 mock 开关复位、断言失败信息增强。\n**不适合的**：任何有副作用的业务准备（起服务、造数据）。因为你看不出某条用例依赖了它，排查时非常痛苦。\n\n规则：**autouse 只做\"观察\"和\"复位\"，不做\"准备\"。**\n\n### 1.5 参数化 fixture 与间接参数化\n\n两种\"参数化\"，用途不同，面试区分清楚就能加分：\n\n```python\n# ① parametrize：参数化\"用例\"，一条数据 = 一条用例\n@pytest.mark.parametrize(\"num,expected\", [(1, 0), (0, 400), (-1, 400)])\ndef test_add_cart(api, num, expected):\n    assert api.post(\"/api/cart\", json={\"num\": num}).json()[\"code\"] == expected\n\n# ② fixture 的 params：参数化\"资源\"，同一个 fixture 换不同实例\n@pytest.fixture(params=[\"alipay\", \"wechat\"], ids=[\"支付宝\", \"微信\"])\ndef pay_channel(request):\n    return request.param\n\ndef test_pay(api, pay_channel):\n    # 会跑两次，pay_channel 分别是 alipay / wechat\n    ...\n```\n\n```python\n# ③ 间接参数化：数据要经过 fixture 加工（最常见于\"用不同账号登录\"）\n@pytest.fixture\ndef client(request):\n    user = request.param                 # 从参数里拿账号\n    token = login(user)\n    return ApiClient(BASE, token)\n\n@pytest.mark.parametrize(\"client\", [\"admin\", \"guest\"], indirect=True)\ndef test_permission(client):\n    ...\n```\n\n### 1.6 一份能直接用的 conftest.py\n\n```python\n# tests/conftest.py\nimport logging\nimport time\n\nimport pytest\nimport requests\n\nBASE = \"http://127.0.0.1:5057\"      # 真实项目从配置读，见工程习惯篇\nlogger = logging.getLogger(__name__)\n\n\n@pytest.fixture(scope=\"session\")\ndef base_url():\n    \"\"\"环境地址。抽成 fixture：换环境只改一处，用例里不出现硬编码 URL。\"\"\"\n    return BASE\n\n\n@pytest.fixture(scope=\"session\")\ndef api(base_url):\n    \"\"\"全局 HTTP 客户端：整个会话复用连接和登录态。\n\n    scope=session 的理由：登录一次就够，避免撞登录频率限制；连接复用省握手。\n    \"\"\"\n    s = requests.Session()\n    s.headers.update({\"User-Agent\": \"qa-autotest/1.0\"})\n    r = s.post(f\"{base_url}/api/login\", json={\"user\": \"qa01\", \"pwd\": \"p\"}, timeout=(3, 10))\n    r.raise_for_status()\n    s.headers[\"Authorization\"] = f\"Bearer {r.json()['token']}\"\n    logger.info(\"登录成功 user=qa01\")\n    yield s\n    s.close()\n\n\n@pytest.fixture\ndef fresh_order(api, base_url):\n    \"\"\"每条用例一个独立订单，用完删掉。scope=function 保证用例之间不互踩。\"\"\"\n    r = api.post(f\"{base_url}/api/orders\", json={\"sku_id\": 1001, \"num\": 1}, timeout=(3, 10))\n    r.raise_for_status()\n    order = r.json()[\"data\"]\n    yield order\n    try:\n        api.delete(f\"{base_url}/api/orders/{order['order_id']}\", timeout=(3, 10))\n    except Exception as e:\n        logger.warning(\"清理订单失败 %s: %s\", order[\"order_id\"], e)\n\n\n@pytest.fixture(autouse=True)\ndef case_timer(request):\n    \"\"\"每条用例自动计时并打日志。只做观察，不做准备。\"\"\"\n    logger.info(\">>> START %s\", request.node.nodeid)\n    start = time.perf_counter()\n    yield\n    logger.info(\"<<< END   %s cost=%.3fs\", request.node.nodeid, time.perf_counter() - start)\n```\n\n### 1.7 fixture 在 xdist 下的坑\n\n`pytest -n 4` 时，**每个 worker 是独立进程，session 级 fixture 每个 worker 各执行一次**。后果：\n\n- 登录 4 次（不是 1 次）→ 可能触发登录限制。\n- 每个 worker 拿到的\"共享数据\"不同 → 不要用 session fixture 做\"全局唯一 ID 生成器\"。\n- 起被测服务：4 个 worker 抢同一个端口 → 必然失败。\n\n解法：用文件/外部服务做跨进程协调，或用 `pytest-xdist` 的 worker id 做隔离：\n\n```python\n@pytest.fixture(scope=\"session\")\ndef account(worker_id):\n    \"\"\"每个 worker 用自己的账号，避免登录互踢。\"\"\"\n    return f\"qa_{worker_id}\"        # worker_id 由 xdist 提供，串行时是 \"master\"\n```\n\n---\n\n## 2. 参数化：数据放哪，是工程判断不是口味\n\n### 2.1 三种参数化形态\n\n```python\nimport pytest\n\n# ① 内联：字段少、用例少、要一眼看到期望值\n@pytest.mark.parametrize(\"num, expected_code\", [\n    (1, 0),\n    (0, 400),\n    (-1, 400),\n], ids=[\"正常\", \"数量为0\", \"数量为负\"])\ndef test_add_cart(api, base_url, num, expected_code):\n    resp = api.post(f\"{base_url}/api/cart\", json={\"num\": num})\n    assert resp.json()[\"code\"] == expected_code, resp.text\n\n\n# ② 笛卡尔积：多个维度组合（注意数量爆炸）\n@pytest.mark.parametrize(\"channel\", [\"alipay\", \"wechat\"])\n@pytest.mark.parametrize(\"amount\", [0.01, 100, 99999])\ndef test_pay(api, base_url, channel, amount):\n    resp = api.post(f\"{base_url}/api/pay\", json={\"channel\": channel, \"amount\": amount})\n    assert resp.json()[\"code\"] == 0, resp.text      # 2 × 3 = 6 条用例\n\n\n# ③ 从文件读：用例多、要给人维护、要复用\nimport csv\nfrom pathlib import Path\n\nDATA_DIR = Path(__file__).parent / \"data\"\n\ndef load_cases():\n    with open(DATA_DIR / \"cart_cases.csv\", encoding=\"utf-8-sig\", newline=\"\") as f:\n        return list(csv.DictReader(f))\n\n@pytest.mark.parametrize(\"case\", load_cases(), ids=lambda c: c[\"case_name\"])\ndef test_add_cart_from_file(api, base_url, case):\n    resp = api.post(f\"{base_url}/api/cart\", json={\"num\": int(case[\"num\"])})\n    assert resp.json()[\"code\"] == int(case[\"expected_code\"]), resp.text\n```\n\n### 2.2 数据放哪：三个地方的决策表（自查 Q3 的答案）\n\n| 放哪 | 适合 | 不适合 | 代价 |\n| --- | --- | --- | --- |\n| **代码里内联** | 逻辑型用例（分支、状态流转）、参数少于 10 组、要 code review 看逻辑 | 数据型用例（几百组等价类） | 加用例要改代码 → 要走 PR → 慢 |\n| **文件里（YAML/CSV/JSON/excel）** | 数据型用例、需要非开发同学维护、同一份数据给多套脚本用 | 含复杂逻辑、需要动态计算的数据 | 文件格式要校验，写错了报错不直观 |\n| **命令行 / 环境变量传入** | 环境相关（base_url、账号、并发数）、CI 里换参数、临时调试 | 大量用例数据（命令行装不下） | 只适合少量标量 |\n| **数据库 / 接口动态拉取** | 用例数据本身在系统里（\"所有在售商品\"）、要跟线上数据同步 | 结果不可控、用例不稳定 | 需要数据源可靠，否则用例随机失败 |\n\n**我的实际做法（可以直接抄）**：\n\n```\ntests/\n├── conftest.py          # 环境、连接、通用 fixture\n├── data/\n│   ├── env.yaml         # 环境地址、账号（按环境分）\n│   └── cart_cases.csv   # 用例数据（非开发同学也能加）\n└── test_cart.py         # 放逻辑和断言\n```\n\n- **环境地址/账号** → `env.yaml` + 环境变量覆盖（配置文件只管默认值，CI 用 `-e` 或 env 覆盖）。\n- **用例数据（会不断新增的）** → CSV，给测试同学维护。\n- **有分支逻辑的用例** → 内联在代码里，因为逻辑本身就是被测对象。\n\n### 2.3 参数化的坑\n\n| 坑 | 现象 | 解法 |\n| --- | --- | --- |\n| id 是中文乱码 | 报告里显示 `\\u6b63\\u5e38` | 用 `ids=` 显式指定，或在 `pytest.ini` 里配 `disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True`（能用但有风险，更推荐显式 ids） |\n| 参数化里有可变对象 | `[{\"a\": []}]` 被多条用例共享，用例 1 改了影响用例 2 | 用 `factory` 生成，或在用例里 copy |\n| 组合爆炸 | 3 个维度各 10 个值 = 1000 条 | 用 pairwise 抽样，或精选边界值 |\n| 参数和 fixture 同名 | 冲突报错 | 改参数名，或用 `indirect` |\n| 数据文件路径 | CI 里 `open(\"data/x.csv\")` 找不到 | `Path(__file__).parent / \"data\" / ...` |\n\n---\n\n## 3. mark 标签：让 CI 分片跑\n\n```python\n# tests/test_order.py\nimport pytest\n\n@pytest.mark.smoke\ndef test_create_order(api, fresh_order):\n    ...\n\n@pytest.mark.slow\ndef test_full_payment_flow(api):\n    ...\n\n@pytest.mark.skipif(not os.getenv(\"TEST_ISOLATED_ENV\"), reason=\"需要独立环境，CI 主流程不跑\")\ndef test_chargeback(api):\n    ...\n```\n\n```bash\npytest -m smoke                      # 只跑冒烟\npytest -m \"not slow\"                 # 排除慢用例\npytest -m \"smoke and not slow\"       # 组合\npytest -m \"p0 or p1\"                 # 优先级\n```\n\n**必须注册 marker**，否则拼错会静默不生效（最容易踩的坑）：\n\n```ini\n# pytest.ini\n[pytest]\nmarkers =\n    smoke: 冒烟用例，每次提交都跑\n    slow: 超过 30s 的用例\n    p0: 最高优先级\naddopts = -ra --strict-markers\ntestpaths = tests\n```\n\n`--strict-markers` 会让未注册的 marker 直接报错 —— **这就是防\"拼错静默不生效\"的手段，建议永远开着。**\n\n`skip` / `skipif` / `xfail` / `xpass` 的区别：\n\n| 标记 | 含义 | 结果 |\n| --- | --- | --- |\n| `skip` | 无条件跳过 | skipped |\n| `skipif(条件)` | 条件成立跳过 | skipped |\n| `xfail` | 预期失败 | 失败了算 xfailed（通过），**意外通过算 xpassed（默认不算失败，容易掩盖 bug）** |\n| `xfail(strict=True)` | 预期失败 | 意外通过算 failed → **推荐用 strict** |\n\n> 用 `xfail(strict=True)`，因为\"标记为预期失败的 bug 被悄悄修复了\"这件事也需要知道。\n\n---\n\n## 4. conftest 与 hook：失败现场全靠这里\n\n### 4.1 层级\n\n```\ntests/\n├── conftest.py              # 对 tests/ 下所有用例生效\n├── api/\n│   ├── conftest.py          # 只对 api/ 生效，可覆盖上层的同名 fixture\n│   └── test_order.py\n└── ui/\n    ├── conftest.py          # 只对 ui/ 生效\n    └── test_login.py\n```\n\n规则：\n\n1. **就近优先**：子目录的 conftest 里定义同名 fixture，会覆盖父目录的。\n2. **fixture 不需要 import**，pytest 自动发现（同层及上层）。\n3. **conftest 不放业务用例**，只放 fixture 和 hook。\n\n### 4.2 三个必用的 hook\n\n```python\n# tests/conftest.py\nimport os\n\nimport pytest\n\n\n# ① 失败时自动落盘请求/响应/截图（接口自动化最有用的一段代码）\n@pytest.hookimpl(hookwrapper=True)\ndef pytest_runtest_makereport(item, call):\n    outcome = yield\n    report = outcome.get_result()\n\n    # 只在用例主体（call）失败时动作，setup/teardown 失败不重复处理\n    if report.when != \"call\" or not report.failed:\n        return\n\n    # 用例里如果有 api fixture，把最后一次响应落盘\n    api = item.funcargs.get(\"api\")\n    if api is not None and getattr(api, \"last_response\", None) is not None:\n        from framework.artifacts import dump_failure\n        # ⚠️ nodeid 形如 tests/test_order.py::test_create[正常]，含 \"::\" 和 \"/\"。\n        # Windows 文件名不允许 \":\"，不清洗会 OSError: Invalid argument ——\n        # 典型现象是\"Linux CI 正常，本地 Windows 跑一定炸\"。\n        safe = item.nodeid.replace(\"::\", \"_\").replace(\"/\", \"_\").replace(\"\\\\\", \"_\")\n        path = dump_failure(api.last_response, safe, ARTIFACT_DIR)\n        report.sections.append((\"失败现场\", f\"已保存: {path}\"))\n\n\n# ② 按标签排序：冒烟先跑，慢的最后（失败了能快速反馈）\ndef pytest_collection_modifyitems(config, items):\n    items.sort(key=lambda i: (0 if i.get_closest_marker(\"smoke\") else 1))\n\n\n# ③ 动态跳过：环境不支持就跳过，而不是让它失败。\n#    ⚠️ 注意：② 和 ③ 都用 pytest_collection_modifyitems 时只能定义一个（同名函数互相覆盖），\n#    要写进同一个函数里。而且任何 pytest_ 开头的函数都会被当成 hook 校验，\n#    名字拼错会直接 PluginValidationError: unknown hook ...，整个会话起不来 —— 这个坑很常见。\ndef pytest_collection_modifyitems(config, items):\n    # 先排序\n    items.sort(key=lambda i: (0 if i.get_closest_marker(\"smoke\") else 1))\n    # 再动态跳过\n    if not os.getenv(\"HAVE_DEVICE\"):\n        for item in items:\n            if \"device\" in item.keywords:\n                item.add_marker(pytest.mark.skip(reason=\"没有可用真机\"))\n```\n\n**`report.sections.append(...)` 这行的价值**：失败信息会出现在 HTML 报告里，不用去翻日志文件夹找。\n\n### 4.3 用例结果流转（排查\"为什么显示 error 不是 failed\"）\n\n```\nsetup 阶段失败 → error（比如 fixture 里登录挂了）\ncall 阶段失败  → failed（断言失败，正常）\nteardown 失败  → error（清理失败，容易误判）\n```\n\n`pytest_runtest_makereport` 里的 `report.when` 就是这三个值。**看到 error 先想到\"不是断言挂了，是准备或清理挂了\"**，这个判断能省很多时间。\n\n### 4.4 常用的其他 hook\n\n| hook | 用途 |\n| --- | --- |\n| `pytest_generate_tests` | 自定义参数化（从数据库/接口动态生成用例） |\n| `pytest_configure` | 启动时读配置、注册 marker |\n| `pytest_sessionfinish` | 收尾：生成汇总、上报结果 |\n| `pytest_runtest_logreport` | 实时上报（对接测试平台时用） |\n\n---\n\n## 5. 插件生态：装这五个就够\n\n```bash\npip install pytest-xdist pytest-html pytest-rerunfailures pytest-timeout pytest-mock\n```\n\n| 插件 | 作用 | 用法 | 注意 |\n| --- | --- | --- | --- |\n| `pytest-xdist` | 多进程并行 | `-n 4 --dist loadscope` | 见 1.7 的坑 |\n| `pytest-html` / `allure-pytest` | 报告 | `--html=report.html --self-contained-html` | allure 功能强但要起服务 |\n| `pytest-rerunfailures` | 失败重跑 | `--reruns 2 --reruns-delay 3` | **会掩盖真 bug**，只能用于已知的 flaky 用例 |\n| `pytest-timeout` | 单用例超时 | `--timeout=120 --timeout-method=thread` | 防\"用例挂死拖死 CI\" |\n| `pytest-mock` | `mocker` fixture | 见第 7 节 | 比裸 `unittest.mock` 好写 |\n\n**关于重跑的态度**（这是工程判断，不是配置问题）：\n\n重跑是\"止疼药\"不是\"消炎药\"。允许重跑的三类场景：\n\n1. 第三方的已知不稳定（短信、支付回调）。\n2. 环境抖动，有监控证实。\n3. 已知 flaky 且已登记缺陷。\n\n**绝不允许**：为了让流水线变绿而全局开启重跑。那样你测的是\"重跑三次能不能过\"，不是\"功能对不对\"。\n\n其他实用参数：\n\n```bash\npytest -x                      # 第一个失败就停（本地调试）\npytest --lf                    # 只跑上次失败的（复盘神器）\npytest --ff                    # 先跑上次失败的\npytest -k \"order and not cancel\"  # 按名字筛选\npytest -v --durations=10       # 列出最慢的 10 条用例\npytest --tb=short              # 简洁堆栈\n```\n\n`--lf`（last-failed）是日常最高频的参数，配合 `.pytest_cache` 用。\n\n---\n\n## 6. unittest 存量代码：看得懂就行\n\n老项目常见，读的时候认这几样：\n\n```python\nimport unittest\nfrom unittest.mock import patch\n\nclass TestOrder(unittest.TestCase):\n    @classmethod\n    def setUpClass(cls):          # 整个类一次\n        cls.db = connect()\n\n    def setUp(self):              # 每条用例一次\n        self.token = login()\n\n    def tearDown(self):\n        cleanup()\n\n    @classmethod\n    def tearDownClass(cls):\n        cls.db.close()\n\n    def test_create(self):\n        resp = request_order(self.token)\n        self.assertEqual(resp.status_code, 200)     # 注意断言是 assertXxx\n        self.assertIn(\"code\", resp.json())\n\n    def test_with_mock(self):\n        with patch(\"module.requests.post\") as mock_post:\n            mock_post.return_value.status_code = 200\n            ...\n```\n\n对照表，读旧代码时不用查：\n\n| unittest | pytest |\n| --- | --- |\n| `setUpClass / tearDownClass` | `fixture(scope=\"class\"/\"module\")` |\n| `setUp / tearDown` | `fixture`（默认 function） |\n| `self.assertEqual(a, b)` | `assert a == b` |\n| `self.assertIn(x, y)` | `assert x in y` |\n| `self.assertRaises(E)` | `with pytest.raises(E):` |\n| `self.assertRaisesRegex(E, r\"xx\")` | `with pytest.raises(E, match=\"xx\"):` |\n| `skipTest()` | `pytest.skip()` |\n| `subTest()` | `@pytest.mark.parametrize` |\n\npytest **能直接收集并运行 unittest 写的 TestCase**，所以迁移可以渐进：新用例用 pytest 风格，老的不动，共用一个 `pytest.ini`。\n\n---\n\n## 7. Mock（自查 Q4）\n\n### 7.1 先想清楚：mock 不是\"造假数据\"，是\"切断真实依赖\"\n\n**四类需要 mock 的第三方依赖**（自查 Q4 的核心答案）：\n\n| 场景 | 为什么必须 mock | 例子 |\n| --- | --- | --- |\n| **不稳定/不可控** | 真实第三方挂了、限流了，你的用例就红了，但错不在被测系统 | 短信、支付回调、地图、人脸识别 |\n| **无法造出异常场景** | 你想测\"支付超时\"\"回调重复\"\"返回 500\"，真实第三方不会配合你 | 测降级、测重试、测熔断 |\n| **有成本/配额** | 真实调用要钱或有限额，跑 1000 次用例不能真扣 1000 次 | 支付、短信、实名认证 |\n| **未就绪/隔离环境** | 下游还没开发完、测试环境不让连外网 | 新接口联调、内网隔离 |\n\n**三类绝对不要 mock 的东西**：\n\n1. **被测服务本身**：mock 掉它，你就只是在测自己的假数据。\n2. **你要验证的集成点**：如果需求就是\"和支付网关对接正确\"，那不能 mock，要用沙箱环境。\n3. **断言要用的真实响应**：mock 返回的数据是你自己编的，断言它等于自证。\n\n一句话原则：**mock 边界，不 mock 逻辑。**\n\n### 7.2 三种实现，按场景选\n\n```python\n# ① 单元测试用：unittest.mock.patch（进程内替换）\nfrom unittest.mock import patch\n\ndef pay(order):\n    return requests.post(\"https://pay.third.com/api/pay\", json={\"order\": order}, timeout=10)\n\ndef test_pay_timeout():\n    with patch(\"requests.post\", side_effect=requests.exceptions.Timeout):\n        with pytest.raises(requests.exceptions.Timeout):\n            pay(\"20261028001\")\n```\n\n```python\n# ② pytest 内置的 monkeypatch：改环境变量、改属性、改函数\ndef test_env(monkeypatch):\n    monkeypatch.setenv(\"ENV\", \"test\")\n    monkeypatch.setattr(\"framework.config.BASE_URL\", \"http://127.0.0.1:5057\")\n    assert os.getenv(\"ENV\") == \"test\"\n```\n\n```python\n# ③ pytest-mock 的 mocker fixture：自动清理，写法更短（需 pip install pytest-mock）\ndef test_pay_error(mocker):\n    mocker.patch(\"requests.post\").return_value.status_code = 500\n    ...\n```\n\n**patch 路径这个坑一定要讲清**：\n\n```python\n# 你的模块 myapp/order.py 里这样导入\nfrom requests import post\ndef pay():\n    return post(url)\n\n# ✅ 正确：patch 你的模块里的那个名字（\"使用处\"）\nmocker.patch(\"myapp.order.post\")\n\n# ❌ 错误：patch 源头的 requests.post（你的模块已经 import 了引用，改源头没用）\nmocker.patch(\"requests.post\")\n```\n\n规则：**patch 的是\"被测代码看到的那份引用\"**，即 `patch(\"被测模块.import的名字\")`。\n\n### 7.3 接口自动化里 mock 第三方：用 mock server，不要用 patch\n\n这是本节的**核心工程判断**，很多人的写法是错的：\n\n| 目标 | 用什么 | 原因 |\n| --- | --- | --- |\n| 测**你写的函数**里的逻辑 | `mock.patch` 进程内替换 | 快、隔离 |\n| 测**被测服务的 HTTP 行为**（超时/重试/降级） | **独立 mock server** | 你的测试进程和被测服务是两个进程，patch 不到对方 |\n| 第三方返回固定数据联调 | mock server 或沙箱环境 | 可控、可记录 |\n\n为什么\"用 patch mock 第三方\"在接口自动化里行不通：你的 pytest 进程里 patch 的是自己的 `requests` 调用，而被测服务（Java/Python 服务）是另一个进程，它调第三方的时候你根本管不到。**这时候必须起一个假的第三方服务，然后把被测服务的配置指向它。**\n\n```python\n# tests/conftest.py\nimport threading\nimport time\n\nimport pytest\nfrom flask import Flask, jsonify, request\n\n\ndef make_mock_pay_server():\n    \"\"\"一个假的支付网关。可以通过 /admin/mode 动态切换行为。\"\"\"\n    app = Flask(\"mock_pay\")\n    state = {\"mode\": \"success\", \"hits\": []}\n\n    @app.post(\"/api/pay\")\n    def pay():\n        state[\"hits\"].append(request.json)\n        mode = state[\"mode\"]\n        if mode == \"timeout\":\n            time.sleep(35)                       # 模拟超时\n            return jsonify({\"code\": 0})\n        if mode == \"error\":\n            return jsonify({\"code\": 500, \"msg\": \"内部错误\"}), 500\n        if mode == \"duplicate\":\n            return jsonify({\"code\": 0, \"trade_no\": \"T-DUP\"})\n        return jsonify({\"code\": 0, \"trade_no\": \"T-20261028001\"})\n\n    @app.post(\"/admin/mode\")\n    def set_mode():\n        state[\"mode\"] = request.json[\"mode\"]\n        return {\"ok\": True, \"mode\": state[\"mode\"]}\n\n    @app.get(\"/admin/hits\")\n    def hits():\n        return {\"count\": len(state[\"hits\"]), \"data\": state[\"hits\"]}\n\n    return app, state\n\n\n@pytest.fixture(scope=\"session\")\ndef mock_pay():\n    app, state = make_mock_pay_server()\n    t = threading.Thread(target=app.run, kwargs={\"port\": 5058, \"debug\": False, \"use_reloader\": False},\n                         daemon=True)\n    t.start()\n    time.sleep(1.5)                    # 等端口起来（生产代码用重试探活，别 sleep 硬等）\n    yield state\n    state[\"mode\"] = \"success\"          # 复位，防止污染下一个用例\n```\n\n用法：\n\n```python\ndef test_pay_timeout_and_retry(mock_pay, api):\n    mock_pay[\"mode\"] = \"timeout\"                  # 让第三方超时\n    r = api.post(\"/api/order/pay\", json={\"order_id\": \"20261028001\"})\n    assert r.json()[\"code\"] != 0                   # 业务应返回明确失败\n    assert r.elapsed.total_seconds() < 15          # 不应等满 35s，说明超时生效\n```\n\n**这套夹具的价值**：能测\"超时/重试/熔断/降级\"这些**只能靠注入故障才能验证**的行为，而这些恰恰是线上事故的高发区。\n\n### 7.4 mock 的三个反模式\n\n```python\n# ❌ 反模式 1：mock 掉被测对象 → 你测了个寂寞\nmocker.patch(\"myapp.order.create_order\")\ntest_create_order()      # 断言的是 mock，不是真实逻辑\n\n# ❌ 反模式 2：mock 返回的数据和真实结构不一致 → 用例绿，联调挂\nmocker.patch(\"requests.post\").return_value.json.return_value = {\"ok\": True}\n# 真实接口返回 {\"code\":0,\"data\":{\"id\":1}}，你的断言却在检查 \"ok\"\n\n# ❌ 反模式 3：mock 泄漏到其他用例 → 随机失败\n# 用 with 或 mocker（自动清理），别手工 patch_start 之后忘了 stop\n```\n\n---\n\n## 8. 自查清单逐条作答（Q2–Q4）\n\n### Q2. pytest 的 fixture 是干什么的？setup/teardown 场景你会怎么用？\n\n**fixture 是资源管理机制**：声明\"这条用例需要什么\"，pytest 按 `scope` 决定创建几次、什么时候销毁。它替代了 unittest 的 `setUp/tearDown`，但更强：可以跨模块共享（conftest）、可以互相依赖、可以参数化、可以按需注入（用不到就不创建）。\n\n**setup/teardown 场景怎么用，按生命周期分**：\n\n| 场景 | 用什么 |\n| --- | --- |\n| 全局只做一次（登录、起服务、连接池、环境探活） | `scope=\"session\"` + yield |\n| 每个测试文件一次（加载该文件的测试数据） | `scope=\"module\"` |\n| **每条用例独立准备和清理（造订单、开浏览器、开事务）** | `scope=\"function\"`（默认）+ yield |\n| 每条用例都要做、且与业务无关（计时、日志、mock 复位） | `autouse=True` + 只做观察/复位 |\n| 清理必须执行且 setup 可能失败 | `request.addfinalizer` |\n\n一个具体例子（这是我在项目里的真实分层）：\n\n```python\n@pytest.fixture(scope=\"session\")\ndef api():            # 一次登录，全局复用\n    ...\n\n@pytest.fixture\ndef fresh_order(api):  # 每条用例一个独立订单，用完删除\n    order = create()\n    yield order\n    delete(order)\n```\n\n**要说出\"为什么这样分\"**，这比背 API 重要：session 是为了快（登录只一次），function 是为了隔离（数据不互踩）。**共享的是\"不会变的资源\"，隔离的是\"会被改的数据\"。**\n\n### Q3. 参数化数据放在哪里？文件里、代码里还是命令行传入？各自的适用场景？\n\n见 §2.2 决策表。**30 秒口头版**：\n\n> 分三类放。\n> **环境相关的东西（地址、账号、并发数）** → 配置文件 + 环境变量/命令行覆盖，因为同一份代码要跑多环境。\n> **用例数据（几百组等价类）** → CSV/YAML 文件，因为要能持续新增，而且希望非开发同学也能维护。\n> **有逻辑的用例（状态流转、分支）** → 内联在代码里，因为逻辑本身是被测对象，必须能 code review。\n> 判断标准一句话：**数据会增长就外置，逻辑在变化就内联，环境会切换就走配置。**\n\n### Q4. Mock 是什么？什么情况下接口自动化需要 mock 第三方依赖？\n\n**Mock 是用可控的假实现替换真实依赖**，目的是让测试聚焦在被测逻辑上，并获得\"能造任意响应\"的能力。\n\n**接口自动化需要 mock 第三方的四种情况**（见 §7.1 表格）：不稳定、造不出异常场景、有成本/配额、未就绪或网络隔离。\n\n**但要说清两个边界**，这是区分水平的地方：\n\n1. **mock 的是边界，不是被测逻辑**。mock 支付网关是合理的；mock 自己的下单服务就没意义了。\n2. **接口自动化里 mock 第三方要用独立 mock server，不能用进程内 patch**。因为被测服务和测试进程是两个进程，patch 不到对方。能测超时/重试/熔断/降级，靠的就是这个 mock server 能注入故障。\n\n---\n\n## 9. 复习动作清单\n\n- [ ] 把你们项目里的 `conftest.py` 按 §1.6 的结构重写一遍：session 级客户端 + function 级数据 + autouse 日志。\n- [ ] 加一条 `pytest_runtest_makereport` hook，让失败用例自动落盘请求/响应（代码在 §4.2）。\n- [ ] 在 `pytest.ini` 里加 `--strict-markers`，跑一次，看有没有拼错的 marker 暴露出来。\n- [ ] 把一组重复的中文 id 加进参数化，确认报告里显示正常。\n- [ ] 用 §7.3 的 mock server 写一条\"第三方超时\"的用例，验证你们系统的超时和降级。\n- [ ] 跑 `pytest --durations=10`，找出最慢的 10 条用例，看是不是 fixture 太重。\n","chars":7748,"codes":31,"tables":13},{"id":"practice","title":"工程习惯篇","desc":"日志/配置分离/防假绿/lint/自建靶子服务","file":"测试开发-工程习惯篇.md","content":"# 测试开发-工程习惯篇\n\n> 对应清单：工程习惯【必须掌握】全部 + 能读懂和写小型服务【了解即可】\n> 对应自查：Q5（失败后不重跑怎么知道现场）、Q6（起一个能练接口测试的小服务）\n> 立场：清单里那句\"脚本人和工程师的分界线\"说得非常准。**分界线不在会不会用 pytest，在于你的脚本失败了，别人（包括明天的你）能不能在 5 分钟内搞清发生了什么。**\n\n---\n\n## 0. 先定位：这四件事决定你的脚本能活多久\n\n| 习惯 | 缺了会怎样 | 具体表现 |\n| --- | --- | --- |\n| 日志 | 失败后只能重跑赌复现 | \"昨天挂了，今天跑了三次都过\" |\n| 配置分离 | 换环境要改代码、改完忘了改回来 | 测试脚本指向了生产地址（真实事故） |\n| 给测试代码写测试 | 断言写错了没人知道，一直是绿的 | 功能上线后才发现\"自动化从没真正校验过\" |\n| 规范与版本管理 | 脚本越写越乱，离职后没人敢动 | 一个 800 行的 test_all.py |\n\n自查分级：\n\n| 内容 | 档位 | 说明 |\n| --- | --- | --- |\n| 日志（要素、级别、脱敏、落盘） | 熟练 | 本篇最值钱的一节 |\n| 配置与代码分离 | 熟练 | 多环境的地基 |\n| 给自己代码写测试 | 会用 | 防假绿 |\n| lint / 提交规范 | 会用 | 团队协作 |\n| 自建小服务 | 会用 | 造被测系统 |\n\n---\n\n## 1. 日志：失败后不重跑就能复盘（自查 Q5 的答案）\n\n### 1.1 先明确\"日志要回答哪四个问题\"\n\n用例失败，看日志必须能回答：\n\n1. **在哪一步挂的**？→ 每个关键步骤有一行日志\n2. **发了什么请求**？→ method / url / header（脱敏）/ body\n3. **收到什么响应**？→ status / 耗时 / body（截断）\n4. **和什么数据有关**？→ 用户 id、订单号、traceId\n\n**只要这四条齐了，90% 的失败不用重跑。** 缺任何一条，你都得去猜。\n\n### 1.2 反面 vs 正面\n\n```python\n# ❌ 失败后：只看到 assert 200 == 500，不知道请求长什么样、和哪条数据有关\ndef test_pay(api):\n    resp = api.post(\"/api/pay\", json={\"order_id\": order_id})\n    assert resp.status_code == 200\n```\n\n```python\n# ✅ 失败后：日志里直接有现场\nlogger.info(\"支付请求 order_id=%s amount=%s user=%s\", order_id, amount, user_id)\nresp = api.post(\"/api/pay\", json={\"order_id\": order_id})\nlogger.info(\"支付响应 status=%s cost=%.3fs body=%s\",\n            resp.status_code, resp.elapsed.total_seconds(), resp.text[:500])\nassert resp.status_code == 200, f\"支付失败 order_id={order_id} resp={resp.text[:500]}\"\n```\n\n注意第二行：**断言失败信息里带上关键数据**。`assert x == 200, f\"order_id={oid} resp={resp.text}\"` 这个习惯，能让报告本身就成为现场记录，连日志都不用翻。\n\n### 1.3 一份能直接用的日志配置\n\n```python\n# framework/logger.py\nimport logging\nimport sys\nfrom logging.handlers import TimedRotatingFileHandler\nfrom pathlib import Path\n\nLOG_DIR = Path(__file__).resolve().parent.parent / \"logs\"\n\n\ndef setup_logger(level: str = \"INFO\", filename: str = \"autotest.log\") -> logging.Logger:\n    \"\"\"测试工程统一日志：\n    - 控制台：人看，简洁\n    - 文件：按天切，保留 14 天，机器可解析\n    - 统一格式：时间 级别 线程 模块 - 消息\n    \"\"\"\n    LOG_DIR.mkdir(parents=True, exist_ok=True)\n    logger = logging.getLogger(\"autotest\")\n    if logger.handlers:                 # 避免重复加 handler（被多次 import 时）\n        return logger\n    logger.setLevel(level)\n\n    fmt = logging.Formatter(\n        \"%(asctime)s %(levelname)-5s [%(threadName)s] %(name)s:%(lineno)d - %(message)s\",\n        datefmt=\"%Y-%m-%d %H:%M:%S\",\n    )\n\n    console = logging.StreamHandler(sys.stdout)\n    console.setFormatter(fmt)\n    logger.addHandler(console)\n\n    file_h = TimedRotatingFileHandler(LOG_DIR / filename, when=\"midnight\",\n                                      backupCount=14, encoding=\"utf-8\")\n    file_h.setFormatter(fmt)\n    logger.addHandler(file_h)\n    return logger\n```\n\n为什么按天切：一次全量回归跑 40 分钟，日志轻松几十 MB，不切割早晚把磁盘写满（操作系统篇讲过 `df -h` 和 inode 的坑）。\n\n### 1.4 三级日志怎么分层\n\n| 级别 | 打什么 | 不该打 |\n| --- | --- | --- |\n| DEBUG | 完整报文、中间变量 | 别默认开，量太大 |\n| INFO | 用例开始/结束、关键业务步骤、请求响应摘要 | 循环里每个元素都打 |\n| WARNING | 可恢复的异常（重试成功、清理失败、跳过） | 正常流程 |\n| ERROR | 导致用例失败的异常 | 业务预期内的 4xx（那不是错误） |\n\n**一个常见的错**：把所有非 200 都打成 ERROR。但\"测密码错误返回 401\"是你的预期结果，打成 ERROR 会污染告警。**日志级别要跟\"是否预期\"挂钩，不是跟\"状态码\"挂钩。**\n\n### 1.5 脱敏：日志里不能有这些东西\n\n```python\n# framework/mask.py\nimport re\n\n_PATTERNS = [\n    (re.compile(r\"(\\\"?(?:password|pwd|passwd|token|secret)\\\"?\\s*[:=]\\s*\\\"?)([^\\\",}\\s]+)\", re.I), r\"\\1***\"),\n    (re.compile(r\"(1[3-9]\\d{9})\"), lambda m: m.group(1)[:3] + \"****\" + m.group(1)[-4:]),   # 手机号\n    (re.compile(r\"(\\d{6})(\\d{8})(\\d{3}[\\dXx])\"), r\"\\1********\\3\"),                      # 身份证\n    (re.compile(r\"(Bearer\\s+)[\\w\\-\\.]+\", re.I), r\"\\1***\"),\n]\n\n\ndef mask(text: str) -> str:\n    for pattern, repl in _PATTERNS:\n        text = pattern.sub(repl, text)\n    return text\n```\n\n打日志时 `logger.info(\"请求体 %s\", mask(body))`。**这不是洁癖**：测试日志常常被贴到缺陷单、群聊、甚至外部文档里，一次真实泄露就够难受了。\n\n### 1.6 把日志和失败现场串起来\n\n```python\n# 用例级别的最小闭环\ndef test_create_order(api, logger):\n    payload = {\"sku_id\": 1001, \"num\": 2, \"request_id\": gen_request_id()}\n    logger.info(\"STEP1 创建订单 payload=%s\", mask(str(payload)))\n    resp = api.post(\"/api/orders\", json=payload)\n    logger.info(\"STEP2 响应 status=%s cost=%.3fs body=%s\",\n                resp.status_code, resp.elapsed.total_seconds(), mask(resp.text)[:800])\n    assert resp.status_code == 200, f\"body={resp.text[:500]}\"\n    order_id = resp.json()[\"data\"][\"order_id\"]\n    logger.info(\"STEP3 订单已创建 order_id=%s\", order_id)\n```\n\n配合 pytest 篇的 `pytest_runtest_makereport` hook（失败时把请求/响应落盘），就形成了完整闭环：**日志给流程，附件给报文，报告给结论。**\n\n### 1.7 Q5 的标准答案\n\n> 不重新执行就知道失败在哪一步，靠三样东西：\n> **① 步骤日志**：每个关键动作一行，含本步的关键数据（订单号、用户 id），从最后一行就能看出死在哪。\n> **② 请求/响应日志**：method、url、headers（脱敏）、body、status、耗时；body 截断但要足够判断。\n> **③ 失败落盘**：pytest 的 `pytest_runtest_makereport` hook 在用例失败时，把完整请求和响应写成 JSON 附件挂到报告里。\n> 另外断言失败信息里直接带关键数据（`assert x, f\"order_id={oid}\"`），这样报告本身就是现场。\n> 这三样做到，90% 的问题不用重跑。\n\n---\n\n## 2. 配置与代码分离\n\n### 2.1 目标：一套代码跑多环境，且改环境不改代码\n\n```\nconfig/\n├── env.yaml          # 各环境的地址、账号（不含密码）\n└── ...\nframework/\n└── config.py         # 加载 + 覆盖逻辑\n```\n\n```yaml\n# config/env.yaml\ndefault:\n  env: test\n  timeout: [3, 10]\n  log_level: INFO\ntest:\n  base_url: http://127.0.0.1:5057\n  user: qa01\ndev:\n  base_url: http://dev.test.example.com\n  user: qa_dev\nprod_readonly:\n  base_url: https://api.example.com\n  user: qa_readonly\n```\n\n```python\n# framework/config.py\nimport os\nfrom dataclasses import dataclass\nfrom pathlib import Path\n\nimport yaml\n\nCONFIG_FILE = Path(__file__).resolve().parent.parent / \"config\" / \"env.yaml\"\n\n\n@dataclass(frozen=True)\nclass Config:\n    env: str\n    base_url: str\n    user: str\n    pwd: str                 # 只从环境变量来，不进代码库\n    timeout: tuple[int, int]\n    log_level: str = \"INFO\"\n\n\ndef load_config(env: str | None = None) -> Config:\n    \"\"\"优先级：命令行 --env / 环境变量 > env.yaml 的对应环境 > default。\n\n    密码只从环境变量（或密钥管理）读，永不写进仓库 —— 这是硬规矩。\n    \"\"\"\n    env = env or os.getenv(\"AUTOTEST_ENV\") or \"test\"\n    raw = yaml.safe_load(CONFIG_FILE.read_text(encoding=\"utf-8\")) or {}\n    base = dict(raw.get(\"default\") or {})\n    override = dict(raw.get(env) or {})\n    merged = {**base, **override}\n\n    pwd = os.getenv(\"AUTOTEST_PWD\")\n    if not pwd:\n        raise RuntimeError(\"缺少环境变量 AUTOTEST_PWD（密码不落仓库，请通过环境变量/密钥注入）\")\n\n    return Config(\n        env=env,\n        base_url=os.getenv(\"AUTOTEST_BASE_URL\", merged[\"base_url\"]),\n        user=os.getenv(\"AUTOTEST_USER\", merged[\"user\"]),\n        pwd=pwd,\n        timeout=tuple(merged.get(\"timeout\", (3, 10))),\n        log_level=merged.get(\"log_level\", \"INFO\"),\n    )\n```\n\n### 2.2 优先级顺序（记住这条链）\n\n```\n命令行参数  >  环境变量  >  配置文件(按环境)  >  配置文件(default)  >  代码默认值\n```\n\n理由：**越\"临时\"的覆盖越靠前**。CI 里换环境用环境变量；本地临时调试用命令行；配置文件是团队共享的默认值。\n\n### 2.3 与 pytest 集成：用 `--env` 而不是改代码\n\n```python\n# tests/conftest.py\nimport pytest\nfrom framework.config import load_config\n\n\ndef pytest_addoption(parser):\n    parser.addoption(\"--env\", action=\"store\", default=None, help=\"运行环境：test/dev/prod_readonly\")\n\n\n@pytest.fixture(scope=\"session\")\ndef conf(pytestconfig):\n    return load_config(pytestconfig.getoption(\"--env\"))\n```\n\n```bash\npytest --env=dev                      # 本地切环境\nAUTOTEST_ENV=dev pytest               # CI 里用环境变量（不用改命令）\npytest --env=prod_readonly            # 生产只读环境跑冒烟\n```\n\n**这个设计的价值**：一套用例、一条命令、五个环境。评审时你说\"这个用例在 dev 和 test 都跑过\"，靠的就是它。\n\n### 2.4 必须做的一件事：防止误连生产\n\n```python\n# 危险操作保护：这些动作在只读环境直接拒绝\nREADONLY_ENVS = {\"prod_readonly\"}\n\ndef guard_write(conf):\n    if conf.env in READONLY_ENVS:\n        raise RuntimeError(f\"环境 {conf.env} 是只读的，禁止执行写操作\")\n```\n\n**真实事故形态**：测试脚本里有 `delete_all_test_data()`，改配置时环境指到了生产。加一行环境判断，成本 1 分钟，避免的是一整年最严重的事故。\n\n### 2.5 不要硬编码的清单\n\n| 不该硬编码 | 应该放哪 |\n| --- | --- |\n| 环境域名 / IP | 配置文件 + 环境变量覆盖 |\n| 账号密码 / token | 环境变量或密钥管理（Vault/KMS） |\n| 测试用的固定 ID / 手机号 | 配置文件，标注归属人 |\n| 超时、并发数 | 配置文件 |\n| 开关（是否跑慢用例、是否发通知） | 配置文件或 CLI |\n| 文件路径 | `Path(__file__)` 相对定位 |\n\n`.gitignore` 里至少要有：`config/*.local.yaml`、`.env`、`logs/`、`artifacts/`、`.pytest_cache/`。\n\n---\n\n## 3. 给测试代码写测试：防假绿\n\n### 3.1 为什么测试代码也要测\n\n因为**测试代码的 bug 不会报错，只会静默地让你以为一切正常**。这是它比业务代码 bug 更危险的地方。\n\n**三种假绿形态**（都真实见过）：\n\n```python\n# 形态 1：异常被吞\ntry:\n    assert resp.json()[\"code\"] == 0\nexcept Exception:\n    pass                     # 永远不会失败\n\n# 形态 2：断言太松，等于没断言\nassert resp.status_code in (200, 400, 401, 403, 500)    # 什么都放过\n\n# 形态 3：断言了错误的对象\nmocker.patch(\"myapp.pay\")\nassert myapp.pay.called is True      # 断言的是 mock，不是业务结果\n```\n\n还有一种最隐蔽的：**断言了错误的数据**。比如字段名拼错，`resp.json().get(\"ordr_id\")` 永远返回 None，`assert None is None` 通过，但业务其实错了。\n\n### 3.2 该测什么\n\n| 对象 | 为什么测 | 例子 |\n| --- | --- | --- |\n| 工具函数 | 被几百条用例调用，错一次全错 | `fetch_field`、`mask`、`diff_json`、`load_cases` |\n| 断言封装 | 断言写错 = 假绿 | `assert_success(resp)`、`assert_field_equal` |\n| 数据构造器 | 造错数据会误导排查 | `make_order()`、`gen_phone()` |\n| 解析/转换逻辑 | 静默错误 | JSON 路径解析、CSV 类型转换 |\n\n**不该花时间的**：pytest 本身、requests 本身。你测的是自己的逻辑。\n\n### 3.3 一个具体的例子\n\n```python\n# framework/assertions.py\ndef assert_success(resp, expected_code: int = 0):\n    \"\"\"统一的\"业务成功\"断言。抽出来的价值：所有用例用同一个判定，不会有的查 code 有的查 status。\"\"\"\n    assert resp.status_code == 200, f\"HTTP 状态异常: {resp.status_code} {resp.text[:300]}\"\n    body = resp.json()\n    assert body.get(\"code\") == expected_code, f\"业务码不符: {body}\"\n    return body\n```\n\n```python\n# tests/unit/test_assertions.py —— 给断言本身写测试\nimport pytest\n\n\nclass FakeResp:\n    def __init__(self, status, body):\n        self.status_code = status\n        self._body = body\n        self.text = str(body)\n\n    def json(self):\n        return self._body\n\n\ndef test_assert_success_ok():\n    assert_success(FakeResp(200, {\"code\": 0}))\n\n\ndef test_assert_success_http_error():\n    with pytest.raises(AssertionError, match=\"HTTP 状态异常\"):\n        assert_success(FakeResp(500, {\"code\": 0}))\n\n\ndef test_assert_success_business_error():\n    with pytest.raises(AssertionError, match=\"业务码不符\"):\n        assert_success(FakeResp(200, {\"code\": 1001}))\n```\n\n**测试自己的断言，听起来像套娃，但这几行代码证明\"我的断言真的会失败\"** —— 这是防假绿最直接的手段。\n\n### 3.4 还有一个更实用的动作：变异测试思路\n\n手工做一次就够：**故意把接口实现或断言改错，看用例会不会红。**\n\n```\n改 1：把断言里的期望值改错 → 用例必须失败，说明断言生效\n改 2：把测试数据的 id 改成一个不存在的 → 用例必须失败，说明依赖真实数据\n改 3：把请求参数删掉一个必填项 → 用例必须失败，说明参数确实被校验\n```\n\n如果改了之后用例还是绿的，你的用例就是假的。这个动作叫\"给自动化做体检\"，每个季度做一次。\n\n---\n\n## 4. 代码规范与版本管理\n\n### 4.1 ruff：一个工具干 lint + format\n\n```toml\n# pyproject.toml\n[tool.ruff]\nline-length = 100\ntarget-version = \"py310\"\n\n[tool.ruff.lint]\nselect = [\"E\", \"F\", \"W\", \"I\", \"B\", \"UP\"]     # 语法错误、未使用变量、导入排序、常见 bug\nignore = [\"E501\"]                             # 行太长不阻塞（由 formatter 处理）\n\n[tool.ruff.format]\nquote-style = \"double\"\n```\n\n```bash\nruff check . --fix      # 检查并自动修\nruff format .           # 格式化\n```\n\n为什么选 ruff：快（比 flake8 快几十倍）、一个工具覆盖 lint + format + import 排序，**比配 flake8 + black + isort 三件套省事**。\n\n`B` 规则特别值得开：它能抓到\"可变默认参数\"\"except 里 raise 但没保留栈\"这类真 bug。\n\n### 4.2 pre-commit：让规范自动执行\n\n```yaml\n# .pre-commit-config.yaml\nrepos:\n  - repo: https://github.com/astral-sh/ruff-pre-commit\n    rev: v0.6.0\n    hooks:\n      - id: ruff\n        args: [--fix]\n      - id: ruff-format\n  - repo: https://github.com/pre-commit/pre-commit-hooks\n    rev: v4.6.0\n    hooks:\n      - id: trailing-whitespace\n      - id: end-of-file-fixer\n      - id: check-yaml\n      - id: detect-private-key        # 防密码/私钥进库\n```\n\n```bash\npip install pre-commit\npre-commit install        # 装到 git hook，提交前自动跑\n```\n\n### 4.3 提交信息：让别人看懂你改了什么\n\n```\n<类型>(<范围>): <描述>\n\n类型：feat / fix / refactor / test / docs / chore\n例：\ntest(order): 补充下单接口的幂等并发用例\nfix(api): 修正登录 token 过期后的刷新逻辑\nchore(deps): 锁定 pytest 到 7.4.0，避免 8.x 破坏 hook\n```\n\n**好的提交信息长这样**，因为它回答了\"为什么改\"：\n\n```\nfix(order): 修复用例之间互相污染数据的问题\n\n原来所有用例共用固定账号 qa01，并行执行时余额互相影响，\n导致 test_pay 随机失败。改为每条用例通过 fixture 创建独立账号。\n\n影响：全量回归时间 +8%，flaky 用例从 7 个降到 0。\n```\n\n### 4.4 测试代码 review 该抓什么\n\n这是测开自己的专业壁垒，五条：\n\n1. **断言是否为真**：有没有 `assert True`、`try/except pass`、过期过宽的断言。\n2. **是否有硬编码**：环境地址、账号、固定 ID。\n3. **是否可重复执行**：跑两遍结果一致吗（幂等性）。\n4. **清理是否完整**：造的数据删了吗，失败的路径也会清理吗。\n5. **失败信息是否可读**：失败时能不能一眼看出问题。\n\n---\n\n## 5. 自建被测服务：给自己造一个练手/造数/mock 的靶子\n\n### 5.1 为什么需要它\n\n清单里说得很清楚：**\"目的不是做开发，是给自己造一个被测系统。\"** 三个真实用途：\n\n1. **练接口测试**：公司接口不能随便压、不能随便造异常，自己的服务想怎么测怎么测。\n2. **造数据 / mock 第三方**：当被测服务依赖的下游，可控地返回超时、500、重复回调。\n3. **验证工具链**：写好的测试框架、报告、CI 流程，先在它上面跑通。\n\n### 5.2 Flask 版：一个能直接跑的完整服务\n\n```python\n# mock_server/app.py\n\"\"\"一个用于练接口测试的靶子服务。\n\n覆盖到的测试场景：\n- 登录鉴权（401）\n- CRUD（201/200/404）\n- 参数校验（400）\n- 幂等（同 request_id 返回同一订单）\n- 慢接口（超时/性能测试）\n- 故意 500（测重试/熔断/降级）\n\"\"\"\nimport time\nimport uuid\n\nfrom flask import Flask, jsonify, request\n\napp = Flask(__name__)\n\n# 内存存储，重启即清空。练测试够用，别当数据库。\nORDERS: dict[str, dict] = {}\nREQUEST_IDS: dict[str, str] = {}\nTOKEN = \"test-token-123\"\n\n\ndef require_auth():\n    auth = request.headers.get(\"Authorization\", \"\")\n    if auth != f\"Bearer {TOKEN}\":\n        return False\n    return True\n\n\n@app.post(\"/api/login\")\ndef login():\n    body = request.get_json(silent=True) or {}\n    if body.get(\"user\") == \"qa\" and body.get(\"pwd\") == \"pwd\":\n        return jsonify({\"code\": 0, \"data\": {\"token\": TOKEN, \"expires_in\": 3600}})\n    return jsonify({\"code\": 401, \"msg\": \"账号或密码错误\"}), 401\n\n\n@app.post(\"/api/orders\")\ndef create_order():\n    if not require_auth():\n        return jsonify({\"code\": 401, \"msg\": \"未登录\"}), 401\n    body = request.get_json(silent=True) or {}\n    sku_id, num = body.get(\"sku_id\"), body.get(\"num\")\n\n    if not isinstance(num, int) or num <= 0:\n        return jsonify({\"code\": 400, \"msg\": \"num 必须是正整数\"}), 400\n    if sku_id is None:\n        return jsonify({\"code\": 400, \"msg\": \"sku_id 必填\"}), 400\n\n    # 幂等：同一个 request_id 只创建一次\n    rid = body.get(\"request_id\")\n    if rid and rid in REQUEST_IDS:\n        return jsonify({\"code\": 0, \"data\": ORDERS[REQUEST_IDS[rid]]})\n\n    order = {\n        \"order_id\": f\"O-{uuid.uuid4().hex[:12]}\",\n        \"sku_id\": sku_id,\n        \"num\": num,\n        \"status\": \"CREATED\",\n        \"created_at\": time.strftime(\"%Y-%m-%d %H:%M:%S\"),\n    }\n    ORDERS[order[\"order_id\"]] = order\n    if rid:\n        REQUEST_IDS[rid] = order[\"order_id\"]\n    return jsonify({\"code\": 0, \"data\": order}), 201\n\n\n@app.get(\"/api/orders/<order_id>\")\ndef get_order(order_id):\n    if not require_auth():\n        return jsonify({\"code\": 401, \"msg\": \"未登录\"}), 401\n    order = ORDERS.get(order_id)\n    if not order:\n        return jsonify({\"code\": 404, \"msg\": \"订单不存在\"}), 404\n    return jsonify({\"code\": 0, \"data\": order})\n\n\n@app.delete(\"/api/orders/<order_id>\")\ndef delete_order(order_id):\n    if not require_auth():\n        return jsonify({\"code\": 401, \"msg\": \"未登录\"}), 401\n    if ORDERS.pop(order_id, None) is None:\n        return jsonify({\"code\": 404, \"msg\": \"订单不存在\"}), 404\n    return jsonify({\"code\": 0, \"data\": {\"deleted\": order_id}})\n\n\n@app.get(\"/api/slow\")\ndef slow():\n    \"\"\"慢接口：练超时、性能测试。\"\"\"\n    time.sleep(float(request.args.get(\"seconds\", 3)))\n    return jsonify({\"code\": 0, \"data\": {\"slept\": request.args.get(\"seconds\", 3)}})\n\n\n@app.get(\"/api/error\")\ndef error():\n    \"\"\"故意 500：练重试、熔断、降级。\"\"\"\n    return jsonify({\"code\": 500, \"msg\": \"内部错误（故意）\"}), 500\n\n\nif __name__ == \"__main__\":\n    app.run(host=\"127.0.0.1\", port=5057, debug=True)\n```\n\n启动：\n\n```bash\npython mock_server/app.py\n# 或者\nflask --app mock_server/app.py run --port 5057\n```\n\n### 5.3 用它练什么（这才是关键）\n\n```python\n# tests/test_mock_server.py\nimport uuid\n\nimport pytest\nimport requests\n\n\ndef test_login_success(api, base_url):\n    r = api.post(f\"{base_url}/api/login\", json={\"user\": \"qa\", \"pwd\": \"pwd\"})\n    assert r.status_code == 200\n    assert r.json()[\"data\"][\"token\"]\n\n\ndef test_login_wrong_pwd(api, base_url):\n    r = api.post(f\"{base_url}/api/login\", json={\"user\": \"qa\", \"pwd\": \"bad\"})\n    assert r.status_code == 401          # 注意：断言 HTTP 码，不是只看 body\n\n\ndef test_create_order_unauthorized(base_url):\n    # 故意不用带 token 的 api fixture，裸发请求测 401\n    r = requests.post(f\"{base_url}/api/orders\", json={\"sku_id\": 1, \"num\": 1}, timeout=(3, 10))\n    assert r.status_code == 401\n\n\n@pytest.mark.parametrize(\"num, expected\", [(1, 201), (0, 400), (-1, 400), (\"1\", 400)])\ndef test_create_order_validation(api, base_url, num, expected):\n    r = api.post(f\"{base_url}/api/orders\", json={\"sku_id\": 1, \"num\": num})\n    assert r.status_code == expected, r.text\n\n\ndef test_create_order_idempotent(api, base_url):\n    rid = uuid.uuid4().hex\n    payload = {\"sku_id\": 1, \"num\": 2, \"request_id\": rid}\n    o1 = api.post(f\"{base_url}/api/orders\", json=payload).json()[\"data\"]\n    o2 = api.post(f\"{base_url}/api/orders\", json=payload).json()[\"data\"]\n    assert o1[\"order_id\"] == o2[\"order_id\"], \"同一 request_id 应返回同一订单\"\n\n\ndef test_order_lifecycle(api, base_url):\n    order_id = api.post(f\"{base_url}/api/orders\", json={\"sku_id\": 1, \"num\": 1}).json()[\"data\"][\"order_id\"]\n    assert api.get(f\"{base_url}/api/orders/{order_id}\").status_code == 200\n    assert api.delete(f\"{base_url}/api/orders/{order_id}\").status_code == 200\n    assert api.get(f\"{base_url}/api/orders/{order_id}\").status_code == 404\n\n\ndef test_slow_api_timeout(api, base_url):\n    \"\"\"练超时：服务端 sleep 3s，客户端 read 超时 1s。\"\"\"\n    with pytest.raises(requests.exceptions.Timeout):\n        api.get(f\"{base_url}/api/slow?seconds=3\", timeout=(1, 1))\n\n\ndef test_error_api_retry(api, base_url):\n    \"\"\"练重试/熔断：接口稳定返回 500。\"\"\"\n    codes = [api.get(f\"{base_url}/api/error\").status_code for _ in range(3)]\n    assert codes == [500, 500, 500]\n```\n\n**这 8 条用例把接口测试的核心能力全练到了**：鉴权、参数校验、状态码、幂等、生命周期、超时、错误注入。换成公司的真实接口，思路一模一样。\n\n### 5.4 FastAPI 版（如果团队用 FastAPI）\n\n同样的能力，代码更短，自带 OpenAPI 文档（`/docs` 能直接试接口，很适合做联调）：\n\n```python\n# mock_server/app_fastapi.py\nimport time\nimport uuid\nfrom typing import Optional\n\nfrom fastapi import FastAPI, Header, HTTPException\nfrom pydantic import BaseModel\n\napp = FastAPI(title=\"测试靶子服务\")\nTOKEN = \"test-token-123\"\nORDERS: dict[str, dict] = {}\nREQUEST_IDS: dict[str, str] = {}\n\n\nclass OrderIn(BaseModel):\n    sku_id: int\n    num: int\n    request_id: Optional[str] = None\n\n\ndef check(token: Optional[str] = Header(default=None)):\n    if token != f\"Bearer {TOKEN}\":\n        raise HTTPException(status_code=401, detail=\"未登录\")\n\n\n@app.post(\"/api/login\")\ndef login(body: dict):\n    if body.get(\"user\") == \"qa\" and body.get(\"pwd\") == \"pwd\":\n        return {\"code\": 0, \"data\": {\"token\": TOKEN}}\n    raise HTTPException(status_code=401, detail=\"账号或密码错误\")\n\n\n@app.post(\"/api/orders\", status_code=201)\ndef create_order(payload: OrderIn, authorization: str = Header(default=\"\")):\n    if authorization != f\"Bearer {TOKEN}\":\n        raise HTTPException(status_code=401, detail=\"未登录\")\n    if payload.num <= 0:\n        raise HTTPException(status_code=400, detail=\"num 必须是正整数\")\n    if payload.request_id and payload.request_id in REQUEST_IDS:\n        return {\"code\": 0, \"data\": ORDERS[REQUEST_IDS[payload.request_id]]}\n    order = {\"order_id\": f\"O-{uuid.uuid4().hex[:12]}\", **payload.model_dump()}\n    ORDERS[order[\"order_id\"]] = order\n    if payload.request_id:\n        REQUEST_IDS[payload.request_id] = order[\"order_id\"]\n    return {\"code\": 0, \"data\": order}\n\n\n@app.get(\"/api/orders/{order_id}\")\ndef get_order(order_id: str, authorization: str = Header(default=\"\")):\n    if authorization != f\"Bearer {TOKEN}\":\n        raise HTTPException(status_code=401, detail=\"未登录\")\n    if order_id not in ORDERS:\n        raise HTTPException(status_code=404, detail=\"订单不存在\")\n    return {\"code\": 0, \"data\": ORDERS[order_id]}\n\n\n@app.get(\"/api/slow\")\ndef slow(seconds: float = 3):\n    time.sleep(seconds)\n    return {\"code\": 0, \"data\": {\"slept\": seconds}}\n```\n\n```bash\npip install fastapi uvicorn\nuvicorn mock_server.app_fastapi:app --port 5057 --reload\n```\n\n### 5.5 Q6 标准答案\n\n> 我会用 Flask（或 FastAPI）起一个本地靶子服务，至少这几个接口：登录返回 token、下单（带参数校验和幂等）、查询、删除、一个 sleep 的慢接口、一个固定 500 的接口。\n> 用途有三：**练接口自动化的完整链路**（鉴权 → 参数校验 → 状态码 → 幂等 → 生命周期）、**造数据不用碰真实环境**、**当被测服务的下游 mock**（把它的 500/超时注入给被测服务，测重试和降级）。\n> 关键不在接口有几个，在于它得有\"能造异常\"的接口 —— 慢接口和错误接口，是练超时、重试、熔断、降级的唯一手段，真实第三方永远不会配合你。\n\n---\n\n## 6. 自查清单逐条作答（Q5–Q6）\n\n### Q5. 脚本失败了，不重新执行怎么知道失败在哪一步、请求是什么、响应是什么？\n\n见 §1.7。核心三件套：**步骤日志 + 请求/响应日志 + 失败落盘附件**。补一句加分的话：\n\n> 我会把这三样做成框架默认能力，而不是靠每条用例自己写。日志由 autouse fixture 统一打，落盘由 `pytest_runtest_makereport` hook 统一做，断言失败信息由封装好的 `assert_success` 自动带上响应体。**这样新写的用例天然具备可排查性，不需要人记得写。**\n\n### Q6. 用 Flask / FastAPI / Spring Boot 起一个有两个接口的小服务，能用它练接口测试\n\n见 §5.2/§5.4。回答时主动说出\"两个接口不够用\"的理由：\n\n> 两个接口（比如一个 GET 一个 POST）只能练连通性和基本断言。要做接口测试练习，至少要 6 个：登录（401）、创建（201/400）、查询（404）、删除、慢接口（超时）、错误接口（重试/熔断）。\n> 因为接口测试真正难的不是正向，是**鉴权、参数校验、幂等、超时、错误处理**这五类，而它们都需要服务端配合造场景 —— 这就是自建服务的价值。\n\n---\n\n## 7. 复习动作清单\n\n- [ ] 给现有脚本加上 `setup_logger`，跑一条用例，确认日志文件里能回答 Q5 的四个问题。\n- [ ] 把一处硬编码的地址/账号改成配置读取，加上 `AUTOTEST_ENV` 环境变量。\n- [ ] 给你们的 `assert_success` 之类的断言封装写 3 条单测（成功、HTTP 错误、业务错误各一条）。\n- [ ] 给接口加 `--request 1` 起一次 FastAPI/Flask 靶子服务，用 Postman 或 requests 走通\"登录→下单→查询→删除\"。\n- [ ] 把靶子服务的 `/api/slow` 和 `/api/error` 接到被测服务的下游配置里，测一次超时和降级。\n- [ ] 手工做一次\"给自动化做体检\"：故意改错三个地方，确认用例都会红。\n","chars":4862,"codes":27,"tables":5}]},{"name":"三、数据、中间件与工程运维","articles":[{"id":"mysql","title":"MySQL篇","desc":"SQL/JOIN/事务隔离级别/SQL 断言/EXPLAIN","file":"测试开发-MySQL篇.md","content":"# 测试开发-MySQL篇\n\n> 对应清单：MySQL【必须掌握】全部 +【了解即可】全部\n> 对应自查：Q1（两表 JOIN 查最近 7 天待支付订单）、Q2（隔离级别 + 重复提交与什么机制有关）\n> 立场：测开写 SQL 只有三个目的 —— **造数据、校验数据、排查数据**。不是拿它当开发用，是拿它当\"真相来源\"。\n\n---\n\n## 0. 先定位：SQL 在测开工作里出现在哪\n\n| 场景 | 用什么 | 为什么必须会 |\n| --- | --- | --- |\n| 造测试数据 | INSERT / UPDATE / 批量造数 | 接口造数据慢且受业务规则限制，直接写库最快 |\n| 校验接口正确性 | SELECT 查表比对 | 接口返回 200 不代表数据对，**库里的状态才是真相** |\n| 排查\"接口查不到\" | SELECT + 主从/缓存分析 | 判断是没落库、落错库、还是被缓存挡住了 |\n| 定位性能问题 | EXPLAIN / 慢查询日志 | 接口慢时先看是不是 SQL 慢 |\n| 清理脏数据 | DELETE / UPDATE 带条件 | 测试环境数据污染是常态 |\n\n自查分级：\n\n| 内容 | 档位 | 说明 |\n| --- | --- | --- |\n| SELECT 过滤/排序/分页/聚合/JOIN | 熟练 | 每天写 |\n| 索引与唯一约束在测试中的意义 | 熟练 | 幂等、防重的最后防线 |\n| 事务与隔离级别 | 会用能讲清 | 并发用例必踩 |\n| 用 SQL 做数据断言 | 熟练 | 本篇核心 |\n| EX
